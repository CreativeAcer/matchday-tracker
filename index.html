  function renderHistoryScreen() {
    var el = document.getElementById("historyScreen");

    var season = {};
    var seasonNames = {};
    var played = 0, wins = 0, draws = 0, losses = 0;
    function seasonEntry(pid, m) {
      if (!season[pid]) season[pid] = { goals: 0, assists: 0, minutes: 0 };
      // Remember the name as it was in the most recent match this player appeared in.
      if (!seasonNames[pid]) seasonNames[pid] = nameInRecord(m, pid);
      return season[pid];
    }
    T().history.forEach(function (m) {
      played++;
      if (m.scoreUs > m.scoreThem) wins++;
      else if (m.scoreUs < m.scoreThem) losses++;
      else draws++;
      Object.keys(m.scorers || {}).forEach(function (pid) {
        seasonEntry(pid, m).goals += m.scorers[pid];
      });
      Object.keys(m.assists || {}).forEach(function (pid) {
        seasonEntry(pid, m).assists += m.assists[pid];
      });
      Object.keys(m.playingTimeMinutes || {}).forEach(function (pid) {
        seasonEntry(pid, m).minutes += m.playingTimeMinutes[pid];
      });
    });
    var seasonRows = Object.keys(season).map(function (pid) {
      return { name: seasonNames[pid] || "Unknown", goals: season[pid].goals || 0, assists: season[pid].assists || 0, minutes: season[pid].minutes || 0 };
    }).sort(function (a, b) { return b.goals - a.goals; });

    var seasonHtml = seasonRows.length
      ? seasonRows.map(function (r) {
          var extra = "";
          if (T().settings.trackAssists) extra += " · " + r.assists + (r.assists === 1 ? " assist" : " assists");
          if (T().settings.trackPlayingTime) extra += " · " + r.minutes + " min";
          return '<div class="stat-row"><span class="sr-name">' + esc(r.name) + '</span><span class="sr-val">' + r.goals + (r.goals === 1 ? " goal" : " goals") + esc(extra) + "</span></div>";
        }).join("")
      : '<div class="empty-state">No matches recorded yet.</div>';

    var listHtml = T().history.map(function (m) {
      var result = m.scoreUs > m.scoreThem ? "win" : (m.scoreUs < m.scoreThem ? "loss" : "draw");
      var resultLabel = result === "win" ? "W" : (result === "loss" ? "L" : "D");
      var scorerNames = Object.keys(m.scorers || {}).map(function (pid) {
        var n = nameInRecord(m, pid);
        return m.scorers[pid] > 1 ? n + " (" + m.scorers[pid] + ")" : n;
      }).join(", ");
      var d = new Date(m.date);
      var dateStr = isNaN(d) ? "" : d.toLocaleDateString();
      var homeAwayLabel = m.isHome !== false ? "Home" : "Away";
      return (
        '<div class="history-item">' +
          '<div class="hi-top">' +
            '<div><span class="hi-score">' + m.scoreUs + " – " + m.scoreThem + "</span> <span class=\"result-pill " + result + "\">" + resultLabel + "</span></div>" +
            '<div class="hi-actions">' +
              '<button class="hi-copy" data-card="' + m.id + '">Card</button>' +
              '<button class="hi-copy" data-copy="' + m.id + '">' + (canShareText() ? "Share" : "Copy") + "</button>" +
              '<button class="hi-edit" data-fix="' + m.id + '">Fix</button>' +
              '<button class="hi-remove" data-del="' + m.id + '">Delete</button>' +
            "</div>" +
          "</div>" +
          '<div class="hi-meta">vs ' + esc(m.opponentName) + " · " + homeAwayLabel + (dateStr ? " · " + dateStr : "") + "</div>" +
          (scorerNames ? '<div class="hi-scorers">' + esc(scorerNames) + "</div>" : "") +
        "</div>"
      );
    }).join("");

    el.innerHTML =
      noticeHtml() +
      '<h1 class="screen-title">History</h1>' +
      '<div class="card">' +
        '<div class="stat-row"><span class="sr-name">Record</span><span class="sr-val">' + played + " played · " + wins + "W " + draws + "D " + losses + "L</span></div>" +
      "</div>" +
      '<h2 class="section-title">Season top scorers</h2>' +
      '<div class="card"><div class="stat-list">' + seasonHtml + "</div></div>" +
      '<h2 class="section-title">Matches</h2>' +
      '<div class="card">' + (listHtml || '<div class="empty-state">No matches yet.</div>') + "</div>" +
      '<div class="btn-row">' +
        '<button class="btn btn-primary" id="exportBtn2">Export team data</button>' +
        '<button class="btn btn-ghost" id="importBtn2">Import team data</button>' +
      "</div>" +
      '<button class="btn btn-danger" id="clearAllBtn" style="margin-top:12px;">Clear all teams on this device</button>';

    document.getElementById("exportBtn2").onclick = showExportSheet;
    document.getElementById("importBtn2").onclick = function () {
      document.getElementById("importFileInput").click();
    };
    document.getElementById("clearAllBtn").onclick = function () {
      var n = state.teams.length;
      showConfirm(
        "This deletes " + (n > 1 ? "all " + n + " teams" : "this team") +
          " — rosters, settings and every recorded match on this device. This can't be undone.",
        "Clear everything",
        function () { state = defaultState(); persist(); view = "team"; render(); },
        true
      );
    };
    el.querySelectorAll("[data-del]").forEach(function (btn) {
      btn.onclick = function () {
        var id = btn.getAttribute("data-del");
        showConfirm("Delete this match from history?", "Delete", function () {
          T().history = T().history.filter(function (m) { return m.id !== id; });
          persist();
          render();
        }, true);
      };
    });
    el.querySelectorAll("[data-fix]").forEach(function (btn) {
      btn.onclick = function () { showEditMatch(btn.getAttribute("data-fix")); };
    });
    el.querySelectorAll("[data-card]").forEach(function (btn) {
      btn.onclick = function () {
        var m = T().history.filter(function (h) { return h.id === btn.getAttribute("data-card"); })[0];
        if (m) showMatchCard(m);
      };
    });
    el.querySelectorAll("[data-copy]").forEach(function (btn) {
      btn.onclick = function () {
        var id = btn.getAttribute("data-copy");
        var m = T().history.filter(function (h) { return h.id === id; })[0];
        if (m) shareOrCopy(buildShareText(m));
      };
    });
  }

  // ---------- global controls ----------

  document.querySelectorAll("[data-nav]").forEach(function (btn) {
    btn.onclick = function () {
      var next = btn.getAttribute("data-nav");
      var moved = view !== next;
      view = next;
      render();
      // A different screen starts at its top. Carrying the old scroll position
      // over opened Team halfway down after a look at the bottom of the match.
      if (moved) window.scrollTo(0, 0);
    };
  });
  document.getElementById("helpBtn").onclick = showHelp;
  document.getElementById("clockBtn").onclick = toggleClock;
  document.getElementById("themScoreLabel").onclick = function () {
    var match = T().activeMatch;
    if (!match) return;
    showTextPrompt("Opponent name", "e.g. FC Riverside", match.opponentName, "Save", function (name) {
      T().activeMatch.opponentName = name;
      persist();
      render();
      showToast("Opponent renamed to " + name + ".");
    });
  };
  document.getElementById("importFileInput").onchange = function (e) {
    var file = e.target.files && e.target.files[0];
    if (file) importDataFromFile(file);
    e.target.value = "";
  };

  // A phone lock or backgrounded tab must keep counting real match time, so the
  // clock is wall-clock based. Only an implausibly long run means it was forgotten.
  var CLOCK_STALE_LIMIT_MS = 3 * 60 * 60 * 1000;

  function lastEventElapsedMs(match) {
    var maxMin = 0;
    match.events.forEach(function (e) {
      if (typeof e.minuteAtEvent === "number" && e.minuteAtEvent > maxMin) maxMin = e.minuteAtEvent;
    });
    return maxMin * 60000;
  }

  function formatDuration(ms) {
    var totalMin = Math.floor(ms / 60000);
    var h = Math.floor(totalMin / 60);
    var m = totalMin % 60;
    if (h && m) return h + "h " + m + "m";
    if (h) return h + "h";
    return m + "m";
  }

  function checkStaleClock() {
    var match = T().activeMatch;
    if (!match || !match.clock.running) return;
    var elapsed = clockElapsedMs(match);
    if (elapsed <= CLOCK_STALE_LIMIT_MS) return;
    // The clock was clearly left running rather than played. The match itself is
    // never discarded — only the clock is rewound to something plausible, since
    // it exists to timestamp events, not to be authoritative.
    // Rewound to just after the last thing that really happened. That used to
    // mean the last logged event only, which ignored substitutions and breaks:
    // a player benched at 30' then showed more minutes than the whole match,
    // and whoever came on at 30' ended with none. Banked minutes, the moment
    // anyone came on, and the start of the period are all real activity.
    var act = match.events.length ? lastEventElapsedMs(match) : 0;
    Object.keys(match.playingTime || {}).forEach(function (pid) {
      var pt = match.playingTime[pid];
      if (!pt) return;
      if (typeof pt.onSince === "number" && pt.onSince > act) act = pt.onSince;
      if (typeof pt.accumMs === "number" && pt.accumMs > act) act = pt.accumMs;
    });
    if (typeof match.periodStartMs === "number" && match.periodStartMs > act) act = match.periodStartMs;
    var recovered = act > 0 ? act + 60000 : 0;
    match.clock.elapsedMs = recovered;
    // Rewinding can leave the period mark after the clock — which would block
    // the next break until the lost time had been played again. When that
    // happens the period timing is simply unknown, so drop the mark and let
    // the clock fall back to plain match time until the next break.
    if (typeof match.periodStartMs === "number" && match.periodStartMs > recovered) {
      delete match.periodStartMs;
    }
    // Anyone brought on after the last logged event was marked on the pitch at
    // a time that now lies AFTER the rewound clock, and their minutes would be
    // worked out as a negative number and saved that way for the season.
    Object.keys(match.playingTime || {}).forEach(function (pid) {
      var pt = match.playingTime[pid];
      if (pt && pt.onSince != null && pt.onSince > recovered) pt.onSince = recovered;
    });
    match.clock.running = false;
    match.clock.runningSince = null;
    persist();
    render();
    showToast(
      "Clock had been running " + formatDuration(elapsed) + " — paused and reset to " +
      formatClock(recovered) + ". Your match is safe.",
      "warning"
    );
  }

  setInterval(function () {
    if (T().activeMatch && T().activeMatch.clock.running) {
      checkStaleClock();
      if (T().activeMatch && T().activeMatch.clock.running) checkPeriodEnd(T().activeMatch);
      if (view === "match" && T().activeMatch && T().activeMatch.clock.running) {
        paintClock(T().activeMatch);
        updateLiveMinutes();
        syncChrome();
      }
    }
  }, 1000);

  window.addEventListener("beforeinstallprompt", function (e) {
    e.preventDefault();
    deferredInstall = e;
    // The browser only offers this when the app is NOT on the home screen. So
    // if we had noted it as installed, it has since been removed.
    clearInstalledMark();
    render();
  });
  window.addEventListener("appinstalled", function () {
    deferredInstall = null;
    markInstalled();
    render();
  });

  // Running from the home screen is the more reliable signal than catching the
  // appinstalled event, and it also upgrades the older plain "1" that earlier
  // versions wrote on install, which could never be cleared again.
  if (isStandalone()) markInstalled();

  // Two copies of the app can easily be open at once — the installed one on the
  // home screen and the link opened again from a message. Both write the whole
  // state, so without this the second copy's save wiped the goals the first had
  // just logged. Picking up the other copy's save means the next write builds
  // on it instead of erasing it.
  window.addEventListener("storage", function (e) {
    if (e.key !== STORAGE_KEY || !e.newValue) return;
    var incoming;
    try { incoming = migrate(JSON.parse(e.newValue)); } catch (err) { return; }
    state = incoming;
    pendingAssistEventId = null;
    // An open sheet holds references into the state that was just replaced.
    // Acting on it would write the old state back — a break sheet "applied"
    // a line-up that was never saved. Closing it is the honest option.
    document.querySelectorAll(".overlay").forEach(function (o) { o.remove(); });
    render();
    showToast("Updated \u2014 this match is also open somewhere else.", "warning");
  });

  document.addEventListener("visibilitychange", function () {
    // Timers are throttled while hidden, so redraw on return to snap the clock
    // and the live minutes back to the real elapsed time.
    if (document.visibilityState === "visible") render();
  });
  window.addEventListener("resize", function () { syncChrome(); });
  window.addEventListener("orientationchange", function () { setTimeout(syncChrome, 250); });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { syncChrome(); });

  /* ---------- Android app shell ------------------------------------------
     The same file also runs inside a thin native Android shell (Capacitor).
     There a WebView cannot download a file or open the share sheet by itself,
     the hardware back button would close the app in the middle of a match, and
     the phone can buzz where a browser cannot. Everything below stays dormant
     unless Capacitor reports a native platform, so the website and the
     installed web app behave exactly as before. The plugins are called through
     Capacitor's own low-level bridge, which needs no bundler. */
  function nativeBridge() {
    try {
      var c = window.Capacitor;
      if (c && typeof c.isNativePlatform === "function" && c.isNativePlatform() &&
          typeof c.nativePromise === "function") return c;
    } catch (e) {}
    return null;
  }

  function nativeCall(plugin, method, options) {
    var c = nativeBridge();
    if (!c) return Promise.reject(new Error("Not running in the app."));
    try { return Promise.resolve(c.nativePromise(plugin, method, options || {})); }
    catch (e) { return Promise.reject(e); }
  }

  // Backing out of the share sheet comes back as a rejection, not as a result.
  function nativeCancelled(e) {
    return !!e && /cancel/i.test(String(e.message || e));
  }

  // The share sheet can only hand over a file that exists, so write it to the
  // app's cache first. Text is stored as is; a picture arrives as base64.
  function nativeShareFile(filename, data, isText, title) {
    var opts = { path: filename, data: data, directory: "CACHE" };
    if (isText) opts.encoding = "utf8";
    return nativeCall("Filesystem", "writeFile", opts).then(function (w) {
      if (!w || !w.uri) throw new Error("No file was written.");
      return nativeCall("Share", "share", { title: title, url: w.uri, dialogTitle: title });
    });
  }

  function canShareText() {
    return !!navigator.share || !!nativeBridge();
  }

  // A short buzz that says "that tap registered". Failing to buzz is never an error.
  function nativeTick() {
    if (!nativeBridge()) return;
    nativeCall("Haptics", "impact", { style: "LIGHT" }).catch(function () {});
  }

  /* ---------- Screen on, and the end of a period -------------------------
     A coach watches the children, not the phone. Two things follow from that:
     the screen must not go dark while the clock runs (every wake-up means a
     PIN), and the end of a period has to reach him without looking. The clock
     already turns gold at the period's length; this adds a short buzz and a
     message at that moment, once per period. */
  var webWakeLock = null;        // the browser's hold on the screen, while it has one
  var webWakeLockPending = false;
  var screenOnAsked = false;     // what the native shell was last told

  function wantScreenOn() {
    var m = T().activeMatch;
    return !!(m && m.clock && m.clock.running);
  }
  function holdWebWakeLock() {
    try {
      if (!navigator.wakeLock || typeof navigator.wakeLock.request !== "function") return;
      if (webWakeLock || webWakeLockPending || document.visibilityState === "hidden") return;
      webWakeLockPending = true;
      navigator.wakeLock.request("screen").then(function (sentinel) {
        webWakeLockPending = false;
        webWakeLock = sentinel;
        sentinel.addEventListener("release", function () { if (webWakeLock === sentinel) webWakeLock = null; });
        if (!wantScreenOn()) releaseWebWakeLock();   // the clock stopped while we were asking
      }).catch(function () { webWakeLockPending = false; });
    } catch (e) { webWakeLockPending = false; }
  }
  function releaseWebWakeLock() {
    var sentinel = webWakeLock;
    webWakeLock = null;
    try { if (sentinel) sentinel.release().catch(function () {}); } catch (e) {}
  }
  // Called after every redraw and when the page becomes visible again (a
  // browser drops its hold whenever the page is hidden, so it is asked again).
  function syncScreenOn() {
    var want = wantScreenOn();
    if (nativeBridge()) {
      if (want !== screenOnAsked) {
        screenOnAsked = want;
        nativeCall("KeepAwake", want ? "keepAwake" : "allowSleep").catch(function () {
          if (want) holdWebWakeLock();   // a shell built without the plugin falls back to the web API
        });
        if (!want) releaseWebWakeLock();
      }
      return;
    }
    if (want) holdWebWakeLock(); else releaseWebWakeLock();
  }

  function buzz() {
    var viaWeb = function () { try { if (navigator.vibrate) navigator.vibrate([250, 120, 250]); } catch (e) {} };
    if (nativeBridge()) nativeCall("Haptics", "vibrate", { duration: 400 }).catch(viaWeb);
    else viaWeb();
  }

  var periodAlert = { key: "", over: false };
  function checkPeriodEnd(match) {
    if (!match || !match.clock || !match.clock.running || !match.periodMinutes || !periodStartKnown(match)) return;
    var key = match.id + ":" + (match.period || 1);
    var over = periodElapsedMs(match) >= match.periodMinutes * 60000;
    // The first look at a period only records where it stands: a match
    // reopened after its period ended must not buzz as if it had just ended.
    if (periodAlert.key !== key) { periodAlert.key = key; periodAlert.over = over; return; }
    if (over && !periodAlert.over) {
      periodAlert.over = true;
      var p = match.period || 1;
      var fmt = (match.plan && match.plan.periods) || match.periodFormat;
      var name = fmt === 2 && p === 1 ? "First half" : fmt === 2 && p === 2 ? "Second half"
        : fmt === 4 ? "Quarter " + p : "Period " + p;
      showToast(name + " is up \u2014 " + formatClock(match.periodMinutes * 60000) + " played.", "warning");
      buzz();
    } else if (!over) {
      periodAlert.over = false;
    }
  }

  // The back button closes what is open on top, then returns to the match
  // screen. On the match screen of a running match it does nothing at all: one
  // swipe from the screen edge while tapping a tile must not leave the match.
  function closeTopOverlay() {
    var all = document.querySelectorAll(".overlay");
    if (!all.length) return false;
    var top = all[all.length - 1];
    var btns = top.querySelectorAll("button");
    for (var i = 0; i < btns.length; i++) {
      if (/(Close|Cancel|Dismiss)(Btn)?$|^breakKeep$/.test(btns[i].id || "")) {
        btns[i].click();
        return true;
      }
    }
    top.click();    // a tap on the dimmed backdrop, which most sheets honour
    return true;    // either way this press has been used up
  }

  function onNativeBack() {
    try {
      if (closeTopOverlay()) return;
      if (view !== "match") { view = "match"; render(); return; }
      if (T().activeMatch) return;
      nativeCall("App", "minimizeApp").catch(function () {});
    } catch (e) {}
  }

  function installNativeBridge() {
    var c = nativeBridge();
    if (!c || typeof c.addListener !== "function") return;
    try { c.addListener("App", "backButton", onNativeBack); } catch (e) {}
  }

  /* ---------- Tap feedback -------------------------------------------------
     Most taps redraw the screen in the same instant, so on the sideline there
     was no telling "it registered" from "it missed". During a live match every
     tap on a button now leaves a wash of colour over exactly that button that
     drains away over two seconds (a phone web app cannot do haptics, so the
     eyes have to do it). Other screens need none: there the screen itself
     changes, which is feedback enough.
     It is a separate, click-through layer on purpose: the redraw that follows a
     tap would take any class on the button with it. It never touches the tap
     itself or the saved data, and any failure in here is swallowed. */
  var FLASH_MS = 2000;         // how long the colour takes to drain out of the button
  var FLASH_SHORT_MS = 450;    // ...once the button is gone or covered: the screen moved on
  var FLASH_MAX = 8;
  var flashes = [];

  // Only while a match is being played: the match screen with its sheets and
  // dialogs. The kick-off form, the summary, Team and History stay without, and
  // so do the bottom tabs: they switch screens, and a wash left on a tab would
  // hang over the screen it just opened. Read before the tap's own handler
  // runs, so "the screen" is the one the button was on.
  function inLiveMatch() {
    return view === "match" && !!T().activeMatch;
  }

  function pressTargetOf(node) {
    var el = node && node.closest ? node.closest("button, [data-goal]") : null;
    if (!el || el.disabled || el.getAttribute("aria-disabled") === "true") return null;
    if (el.closest(".bottom-nav") || !inLiveMatch()) return null;
    return el;
  }

  // The colour the button actually sits on: its own background, or the first
  // solid one above it (outlined and text-only buttons are transparent).
  function surfaceColour(el) {
    for (var n = el; n && n.nodeType === 1; n = n.parentElement) {
      var m = /rgba?\(([^)]+)\)/.exec(window.getComputedStyle(n).backgroundColor || "");
      if (!m) continue;
      var p = m[1].split(",").map(parseFloat);
      if (p.length < 4 || p[3] >= 0.6) return p;
    }
    return [255, 255, 255];
  }

  // A gold wash would vanish on a gold or yellow button, so those get the dark green.
  function isGoldish(c) {
    return Math.abs(c[0] - 226) < 50 && Math.abs(c[1] - 163) < 50 && c[2] < 130;
  }

  function sameSpot(a, b) {
    return Math.abs(a.left - b.left) < 10 && Math.abs(a.top - b.top) < 10 &&
           Math.abs(a.width - b.width) < 10 && Math.abs(a.height - b.height) < 10;
  }

  // What makes a rebuilt button "the same button": its id, else its first
  // data-attribute. Plain buttons have neither, so they are never merged.
  function pressKey(el) {
    if (el.id) return el.tagName + "#" + el.id;
    for (var i = 0; i < el.attributes.length; i++) {
      var a = el.attributes[i];
      if (a.name.indexOf("data-") === 0) return el.tagName + "|" + a.name + "=" + a.value;
    }
    return "";
  }

  // The redraw replaces a pressed button with an identical new one. Find it.
  function twinOf(el) {
    if (el.id) { var byId = document.getElementById(el.id); if (byId) return byId; }
    for (var i = 0; i < el.attributes.length; i++) {
      var a = el.attributes[i];
      if (a.name.indexOf("data-") !== 0) continue;
      var all = document.querySelectorAll("[" + a.name + "]");
      for (var j = 0; j < all.length; j++) {
        if (all[j].tagName === el.tagName && all[j].getAttribute(a.name) === a.value) return all[j];
      }
    }
    return null;
  }

  function dropFlash(f) {
    clearInterval(f._timer);
    if (f.parentNode) f.parentNode.removeChild(f);
    var i = flashes.indexOf(f);
    if (i !== -1) flashes.splice(i, 1);
  }

  // A sheet that opened over the button, a screen that replaced it, a list that
  // scrolled: the wash would be hanging over something it does not belong to.
  function checkFlash(f, instant) {
    if (!f.parentNode || (f._short && !instant)) return;
    var el = f._for, now = el.isConnected ? el : twinOf(el);
    var gone = !now || !sameSpot(f._rect, now.getBoundingClientRect());
    if (!gone) {
      var top = document.elementFromPoint(f._rect.left + f._rect.width / 2, f._rect.top + f._rect.height / 2);
      gone = !!top && !now.contains(top);
    }
    if (!gone) return;
    if (instant) { dropFlash(f); return; }
    f._short = true;
    f.style.animationDuration = FLASH_SHORT_MS + "ms";
  }

  function makeFlash(info) {
    nativeTick();
    var r = info.rect;
    var f = document.createElement("div");
    f.className = "press-flash" + (info.deep ? " press-flash-deep" : "");
    f.setAttribute("aria-hidden", "true");
    f.style.left = r.left + "px"; f.style.top = r.top + "px";
    f.style.width = r.width + "px"; f.style.height = r.height + "px";
    f.style.borderRadius = info.radius;
    f.style.animationDuration = FLASH_MS + "ms";
    // Whole player tiles are big: a quieter wash keeps the names readable.
    f.style.setProperty("--flash-peak", r.width * r.height > 9000 ? "0.5" : "0.72");
    f._for = info.el; f._rect = r; f._short = false; f._at = Date.now(); f._key = info.key;
    f.addEventListener("animationend", function () { dropFlash(f); });
    flashes.push(f);
    while (flashes.length > FLASH_MAX) dropFlash(flashes[0]);
    document.body.appendChild(f);
    setTimeout(function () { checkFlash(f); }, 50);        // after the tap's own redraw
    f._timer = setInterval(function () { checkFlash(f); }, 250);  // sheets that open a moment later
    setTimeout(function () { dropFlash(f); }, FLASH_MS + 300);   // in case no animation event comes
  }

  function showPressFlash(el) {
    var r = el.getBoundingClientRect();
    if (r.width < 6 || r.height < 6) return;
    var tappedAt = Date.now(), key = pressKey(el);
    var info = {
      el: el, rect: r, key: key,
      deep: isGoldish(surfaceColour(el)),
      radius: window.getComputedStyle(el).borderRadius
    };
    // One wash per button, never two stacked. The button is usually a rebuilt
    // twin, so "the same button" is the same id / data-attribute in the same
    // place; a different button that merely sits where the last one was (a
    // "Next" after a "Next") is a new tap.
    var same = null;
    flashes.forEach(function (o) {
      if (o._for === el || (key && o._key === key && sameSpot(o._rect, r))) same = o;
    });
    if (!same) { makeFlash(info); return; }
    if (tappedAt - same._at >= 800) { dropFlash(same); makeFlash(info); return; }
    // A second tap soon after the first. If the app itself ignores it (the
    // double-tap guard on goals and cards) the wash must not restart, or it
    // would suggest a second goal was counted. Whether it was ignored is only
    // known once the button's own handler has run, so decide just after it.
    setTimeout(function () {
      if (lastIgnoredTapAt >= tappedAt) return;
      if (same.parentNode) dropFlash(same);
      makeFlash(info);
    }, 0);
  }

  // Capture phase: runs before the button's own handler, so the button is still
  // the one that was pressed when it is measured.
  document.addEventListener("click", function (e) {
    try { var el = pressTargetOf(e.target); if (el) showPressFlash(el); } catch (err) {}
  }, true);
  window.addEventListener("scroll", function () {
    flashes.slice().forEach(function (f) { try { checkFlash(f, true); } catch (err) { dropFlash(f); } });
  }, true);
  window.addEventListener("resize", function () {
    flashes.slice().forEach(function (f) { dropFlash(f); });
  });

  installNativeBridge();
  render();
  checkStaleClock();
})();

// Offline support. Guarded so opening the file directly (file://) still works.
if ("serviceWorker" in navigator && location.protocol.indexOf("http") === 0 &&
    !(window.Capacitor && typeof window.Capacitor.isNativePlatform === "function" && window.Capacitor.isNativePlatform())) {
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("./sw.js").catch(function (err) {
      console.log("Service worker not registered:", err);
    });
  });
}
</script>
</body>
</html>
