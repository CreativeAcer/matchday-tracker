  function isOnField(match, playerId) {
    var pt = match.playingTime[playerId];
    return pt ? !!pt.onField : true;
  }

  function cardCounts(match, playerId) {
    var yellows = 0, reds = 0;
    match.events.forEach(function (e) {
      if (e.type === "card" && e.playerId === playerId) {
        if (e.cardType === "yellow") yellows++;
        else if (e.cardType === "red") reds++;
      }
    });
    return { yellows: yellows, reds: reds };
  }

  function hasRedCard(match, playerId) {
    return cardCounts(match, playerId).reds > 0;
  }

  function setOnField(match, playerId, onField) {
    if (!match.playingTime) return; // finished matches carry no pitch state
    if (!match.playingTime[playerId]) match.playingTime[playerId] = { onField: true, accumMs: 0, onSince: clockElapsedMs(match) };
    var pt = match.playingTime[playerId];
    if (pt.onField === onField) return;
    var nowMs = clockElapsedMs(match);
    if (pt.onField && !onField) {
      pt.accumMs += (nowMs - pt.onSince);
      pt.onField = false;
      pt.onSince = null;
    } else if (!pt.onField && onField) {
      pt.onField = true;
      pt.onSince = nowMs;
    }
  }

  // ---------- match lifecycle ----------

  function startNewMatch(opponentName, isHome, plan, unavailable, periodMinutes, periodFormat) {
    // Reuse the lineup from last time so the bench doesn't have to be rebuilt
    // before every match. Players added since then start on the pitch.
    var last = Array.isArray(T().lastLineup) ? T().lastLineup : null;
    var known = {};
    (T().roster || []).forEach(function (p) { known[p.id] = true; });
    var reusable = last && last.some(function (id) { return known[id]; });
    var usePlan = T().settings.planLineups ? planForRoster(normalisePlan(plan), T().roster) : null;
    var firstRow = usePlan ? planLineup(usePlan, 1) : null;
    if (firstRow && !firstRow.length) firstRow = null; // an empty first period means "no plan yet"
    var pt = {};
    var away = Array.isArray(unavailable) ? unavailable : [];
    T().roster.forEach(function (p) {
      var on = firstRow ? firstRow.indexOf(p.id) !== -1 : (reusable ? last.indexOf(p.id) !== -1 : true);
      if (away.indexOf(p.id) !== -1) on = false; // not at the pitch today
      pt[p.id] = { onField: on, accumMs: 0, onSince: on ? 0 : null };
    });
    T().activeMatch = {
      id: uid(),
      opponentName: opponentName || "Opponent",
      isHome: isHome !== false,
      startedAt: new Date().toISOString(),
      clock: { elapsedMs: 0, running: false, runningSince: null },
      period: 1,
      events: [],
      plan: usePlan,
      unavailable: away.slice(),
      periodMinutes: cleanPeriodMinutes(periodMinutes),
      periodFormat: PLAN_FORMATS.indexOf(periodFormat) !== -1 ? periodFormat : null,
      periodStartMs: 0,
      playingTime: pt
    };
    persist();
    render();
  }

  function endMatch() {
    var match = T().activeMatch;
    if (!match) return;
    var stats = computeStats(match);
    var minutes = playingTimeMinutes(match);
    var record = {
      id: match.id,
      date: match.startedAt,
      opponentName: match.opponentName,
      teamName: T().teamName,
      isHome: match.isHome !== false,
      rosterSnapshot: T().roster.map(function (p) {
        return { id: p.id, name: p.name, number: p.number };
      }),
      scoreUs: stats.scoreUs,
      scoreThem: stats.scoreThem,
      ownGoalsFor: stats.ownGoalsFor,
      ownGoalsAgainst: stats.ownGoalsAgainst,
      scorers: stats.scorers,
      assists: stats.assists,
      cards: stats.cards,
      playingTimeMinutes: minutes,
      durationMinutes: currentMinute(match),
      events: match.events
    };
    if (Array.isArray(match.startingLineup) && match.startingLineup.length) {
      T().lastLineup = match.startingLineup;
    }
    if (match.plan) T().lastPlan = normalisePlan(match.plan);
    if (match.periodMinutes) T().lastPeriodMinutes = match.periodMinutes;
    T().history.unshift(record);
    T().activeMatch = null;
    persist();
    view = "summary";
    render();
  }

  function toggleClock() {
    var match = T().activeMatch;
    if (!match) return;
    if (match.clock.running) {
      match.clock.elapsedMs = clockElapsedMs(match);
      match.clock.running = false;
      match.clock.runningSince = null;
    } else {
      // The first time the clock runs is when the coach has finished setting
      // the bench, so that is the lineup worth remembering.
      if (!match.lineupCaptured) {
        match.lineupCaptured = true;
        match.startingLineup = Object.keys(match.playingTime).filter(function (pid) {
          return match.playingTime[pid].onField;
        });
      }
      match.clock.running = true;
      match.clock.runningSince = Date.now();
    }
    persist();
    render();
  }

  var lastEventTapAt = {};

  function guardDoubleTap(key) {
    var now = Date.now();
    if (lastEventTapAt[key] && (now - lastEventTapAt[key]) < 800) return false;
    lastEventTapAt[key] = now;
    return true;
  }

  function requireClockRunning(match) {
    if (!match.clock.running) {
      showToast("Start the clock first — tap the timer at the top.", "warning");
      return false;
    }
    return true;
  }

  function logGoal(playerId) {
    var match = T().activeMatch;
    if (!match) return;
    if (!isOnField(match, playerId)) {
      var benched = rosterById(playerId);
      showToast((benched ? benched.name : "This player") + " is on the bench — bring them on first.", "warning");
      return;
    }
    if (!requireClockRunning(match)) return;
    if (!guardDoubleTap("goal:" + playerId)) return;
    var ev = { id: uid(), type: "goal", playerId: playerId, assistId: null, minuteAtEvent: currentMinute(match), period: match.period || 1, ts: Date.now() };
    match.events.push(ev);
    persist();
    if (T().settings.trackAssists) {
      pendingAssistEventId = ev.id;
      clearTimeout(assistBarTimer);
      assistBarTimer = setTimeout(function () { pendingAssistEventId = null; render(); }, 6000);
    }
    render();
    var tile = document.querySelector('[data-tile="' + playerId + '"]');
    if (tile) {
      tile.classList.add("just-scored");
      setTimeout(function () { tile.classList.remove("just-scored"); }, 500);
    }
  }

  function setAssist(assistPlayerId) {
    var match = T().activeMatch;
    if (!match || !pendingAssistEventId) return;
    var ev = null;
    for (var i = 0; i < match.events.length; i++) {
      if (match.events[i].id === pendingAssistEventId) { ev = match.events[i]; break; }
    }
    if (ev) ev.assistId = assistPlayerId;
    pendingAssistEventId = null;
    clearTimeout(assistBarTimer);
    persist();
    render();
  }

  function logOpponentGoal() {
    var match = T().activeMatch;
    if (!match) return;
    if (!requireClockRunning(match)) return;
    if (!guardDoubleTap("opponent-goal")) return;
    match.events.push({ id: uid(), type: "opponent_goal", playerId: null, minuteAtEvent: currentMinute(match), period: match.period || 1, ts: Date.now() });
    persist();
    render();
  }

  // by: "us"   = our team put it in our own net  -> the point goes to the opponent
  // by: "them" = they put it in their own net    -> the point goes to us
  function logOwnGoal(by) {
    var match = T().activeMatch;
    if (!match) return;
    if (!requireClockRunning(match)) return;
    if (!guardDoubleTap("own-goal:" + by)) return;
    match.events.push({ id: uid(), type: "own_goal", by: by, playerId: null, minuteAtEvent: currentMinute(match), period: match.period || 1, ts: Date.now() });
    persist();
    render();
    showToast(
      by === "us"
        ? "Own goal — point to " + match.opponentName + "."
        : "Own goal by " + match.opponentName + " — point to " + T().teamName + ".",
      "warning"
    );
  }

  function showOwnGoalPicker() {
    var match = T().activeMatch;
    if (!match) return;
    if (!requireClockRunning(match)) return;
    var old = document.getElementById("ownGoalOverlay");
    if (old) old.remove();
    var overlay = document.createElement("div");
    overlay.className = "overlay";
    overlay.id = "ownGoalOverlay";
    overlay.innerHTML =
      '<div class="sheet">' +
        '<div class="confirm-msg"><strong>Own goal</strong><br>Which team put it in their own net?</div>' +
        '<div class="btn-row" style="margin-top:16px;">' +
          '<button class="btn btn-primary" id="ogUsBtn">' + esc(T().teamName) + "</button>" +
          '<button class="btn btn-primary" id="ogThemBtn">' + esc(match.opponentName) + "</button>" +
        "</div>" +
        '<button class="btn btn-ghost" id="ogCancelBtn" style="margin-top:10px;">Cancel</button>' +
      "</div>";
    document.body.appendChild(overlay);
    function cleanup() { overlay.remove(); }
    overlay.onclick = function (e) { if (e.target === overlay) cleanup(); };
    document.getElementById("ogCancelBtn").onclick = cleanup;
    document.getElementById("ogUsBtn").onclick = function () { cleanup(); logOwnGoal("us"); };
    document.getElementById("ogThemBtn").onclick = function () { cleanup(); logOwnGoal("them"); };
  }

  function toggleCard(playerId, cardType) {
    var match = T().activeMatch;
    if (!match) return;
    var player = rosterById(playerId);
    if (hasRedCard(match, playerId)) {
      showToast((player ? player.name : "This player") + " is already sent off.", "warning");
      return;
    }
    if (!requireClockRunning(match)) return;
    if (!guardDoubleTap("card:" + playerId + ":" + cardType)) return;
    match.events.push({ id: uid(), type: "card", playerId: playerId, cardType: cardType, minuteAtEvent: currentMinute(match), period: match.period || 1, ts: Date.now() });

    // One place decides what a card implies (auto-red, benching), so logging,
    // editing and undoing can never drift apart.
    reconcileCardConsequences(match, [playerId]);
    if (hasRedCard(match, playerId)) {
      showToast((player ? player.name : "Player") + " is sent off" +
        (cardType === "yellow" ? " — second yellow" : "") + ".", "warning");
    }
    persist();
    render();
  }

  function toggleField(playerId) {
    var match = T().activeMatch;
    if (!match) return;
    if (hasRedCard(match, playerId)) {
      var player = rosterById(playerId);
      showToast((player ? player.name : "This player") + " is sent off and can't return to the pitch.", "warning");
      return;
    }
    setOnField(match, playerId, !isOnField(match, playerId));
    persist();
    render();
  }

  // Minutes are refreshed in place every second; re-rendering the whole grid
  // would fight with taps and rebuild the DOM under the coach's finger.
  function updateLiveMinutes() {
    var match = T().activeMatch;
    var nodes = document.querySelectorAll("[data-mins]");
    if (!match || !nodes.length) return;
    var mins = playingTimeMinutes(match);
    var lowest = Infinity;
    T().roster.forEach(function (p) {
      var m = mins[p.id] || 0;
      if (m < lowest) lowest = m;
    });
    // Before the match has really got going everyone is level, so flagging the
    // "least played" player would just be noise.
    var meaningful = clockElapsedMs(match) >= 5 * 60000;
    nodes.forEach(function (el) {
      var pid = el.getAttribute("data-mins");
      var m = mins[pid] || 0;
      el.textContent = m + " min";
      var tile = document.querySelector('.tile[data-tile="' + pid + '"]');
      if (tile) tile.classList.toggle("least-played", meaningful && m === lowest);
    });
  }

  function startNextPeriod() {
    var match = T().activeMatch;
    if (!match) return;
    // Same rule as scoring: nothing happens on a clock that never ran. Without
    // this you can tap your way to period 6 on a match still showing 00:00,
    // and every tap eats a period out of the line-up plan.
    if (!periodHasRun(match)) {
      showToast("The clock hasn\u2019t run this period yet — start it first.", "warning");
      return;
    }
    if (match.plan && match.plan.periods && (match.period || 1) >= match.plan.periods) {
      showConfirm("That was the last of the " + match.plan.periods +
        " planned periods. Start another one?", "Start another", function () {
          advancePeriod(match);
        }, false);
      return;
    }
    advancePeriod(match);
  }

  function advancePeriod(match) {
    if (match.clock.running) {
      match.clock.elapsedMs = clockElapsedMs(match);
      match.clock.running = false;
      match.clock.runningSince = null;
    }
    var over = periodOverrunMs(match);
    match.period = (match.period || 1) + 1;
    match.periodStartMs = clockElapsedMs(match);
    persist();
    render();
    var overNote = over > 1000 ? "That period ran " + formatClock(over) + " over. " : "";
    if (T().settings.planLineups && match.plan && proposePlanAtBreak(match, overNote)) return;
    showToast(overNote + "Break — period " + match.period +
      " starts when you start the clock.", "warning");
  }

  function describeEvent(ev) {
    if (ev.type === "goal") {
      var p = rosterById(ev.playerId);
      return "goal by " + (p ? p.name : "player");
    }
    if (ev.type === "opponent_goal") return "opponent goal";
    if (ev.type === "own_goal") {
      var match = editTarget();
      var oppName = match && match.opponentName ? match.opponentName : "the opponent";
      return "own goal by " + (ev.by === "us" ? T().teamName : oppName);
    }
    if (ev.type === "card") {
      var c = rosterById(ev.playerId);
      return (ev.cardType === "red" ? "red card" : "yellow card") + (c ? " — " + c.name : "");
    }
    return "last action";
  }

  function undoLast() {
    var match = T().activeMatch;
    if (!match || match.events.length === 0) return;
    var removed = match.events.pop();
    // An auto-red is a consequence, not an action: also remove the yellow that triggered it.
    if (removed.type === "card" && removed.cardType === "red" && removed.auto) {
      for (var i = match.events.length - 1; i >= 0; i--) {
        var e = match.events[i];
        if (e.type === "card" && e.playerId === removed.playerId && e.cardType === "yellow") {
          match.events.splice(i, 1);
          break;
        }
      }
    }
    pendingAssistEventId = null;
    lastEventTapAt = {};
    reconcileCardConsequences(match, [removed.playerId]);
    persist();
    render();
    showToast("Removed: " + describeEvent(removed));
  }

  function deleteEvent(eventId) {
    var match = editTarget();
    if (!match) return;
    var idx = -1;
    for (var i = 0; i < match.events.length; i++) {
      if (match.events[i].id === eventId) { idx = i; break; }
    }
    if (idx === -1) return;
    var removed = match.events.splice(idx, 1)[0];
    if (pendingAssistEventId === eventId) pendingAssistEventId = null;
    lastEventTapAt = {};
    reconcileCardConsequences(match, [removed.playerId]);
    afterEdit(match);
    showToast("Removed: " + describeEvent(removed));
  }

  function reconcileCardConsequences(match, playerIds) {
    var seen = {};
    playerIds.forEach(function (pid) {
      if (!pid || seen[pid]) return;
      seen[pid] = true;
      var counts = cardCounts(match, pid);
      if (counts.yellows >= 2 && counts.reds === 0) {
        var yellows = match.events.filter(function (e) {
          return e.type === "card" && e.playerId === pid && e.cardType === "yellow";
        });
        var trigger = yellows[yellows.length - 1] || {};
        match.events.push({ id: uid(), type: "card", playerId: pid, cardType: "red", auto: true,
          minuteAtEvent: trigger.minuteAtEvent != null ? trigger.minuteAtEvent : currentMinute(match),
          period: trigger.period || match.period || 1, ts: Date.now() });
        counts = cardCounts(match, pid);
      } else if (counts.yellows < 2 && counts.reds > 0) {
        // Drop auto-reds that no longer have two yellows behind them (manual reds are left alone).
        for (var i = match.events.length - 1; i >= 0; i--) {
          var e = match.events[i];
          if (e.type === "card" && e.playerId === pid && e.cardType === "red" && e.auto) {
            match.events.splice(i, 1);
          }
        }
        counts = cardCounts(match, pid);
      }
      // Benching is a consequence of the red card, so undoing the card has to
      // undo the benching too — but only when the card put them there, never a
      // substitution the coach made by hand.
      var pt = match.playingTime && match.playingTime[pid];
      if (counts.reds > 0) {
        setOnField(match, pid, false);
        if (pt) pt.sentOff = true;
      } else if (pt && pt.sentOff) {
        pt.sentOff = false;
        setOnField(match, pid, true);
      }
    });
  }

  // null = the match being played; otherwise the id of a match in history.
  var editMatchId = null;
  var matchEditRedraw = null;

  function editTarget() {
    if (!editMatchId) return T().activeMatch;
    return T().history.filter(function (m) { return m.id === editMatchId; })[0] || null;
  }

  // A finished match stores its totals alongside its events, so after an edit
  // they have to be derived again or the score and the log disagree.
  function recomputeRecord(rec) {
    var stats = computeStats(rec);
    rec.scoreUs = stats.scoreUs;
    rec.scoreThem = stats.scoreThem;
    rec.scorers = stats.scorers;
    rec.assists = stats.assists;
    rec.cards = stats.cards;
    rec.ownGoalsFor = stats.ownGoalsFor;
    rec.ownGoalsAgainst = stats.ownGoalsAgainst;
  }

  function afterEdit(container) {
    if (editMatchId && container) recomputeRecord(container);
    persist();
    render();
    if (matchEditRedraw) matchEditRedraw();
  }

  function findEvent(match, eventId) {
    for (var i = 0; i < match.events.length; i++) {
      if (match.events[i].id === eventId) return match.events[i];
    }
    return null;
  }

  function applyGoalEdit(eventId, newPlayerId, newAssistId) {
    var match = editTarget();
    if (!match) return;
    var ev = findEvent(match, eventId);
    if (!ev) return;
    ev.playerId = newPlayerId;
    ev.assistId = newAssistId || null;
    afterEdit(match);
    showToast("Updated: " + describeEvent(ev));
  }

  function applyCardEdit(eventId, newPlayerId, newCardType) {
    var match = editTarget();
    if (!match) return;
    var ev = findEvent(match, eventId);
    if (!ev) return;
    var oldPlayerId = ev.playerId;
    ev.playerId = newPlayerId;
    ev.cardType = newCardType;
    reconcileCardConsequences(match, [oldPlayerId, newPlayerId]);
    afterEdit(match);
    showToast("Updated: " + describeEvent(ev));
  }

  function applyOwnGoalEdit(eventId, newBy) {
    var match = editTarget();
    if (!match) return;
    var ev = findEvent(match, eventId);
    if (!ev) return;
    ev.by = newBy;
    afterEdit(match);
    showToast("Updated: " + describeEvent(ev));
  }

  function showEditMatch(matchId) {
    editMatchId = matchId;
    var old = document.getElementById("matchEditOverlay");
    if (old) old.remove();
    var overlay = document.createElement("div");
    overlay.className = "overlay";
    overlay.id = "matchEditOverlay";
    document.body.appendChild(overlay);

    function close() {
      overlay.remove();
      editMatchId = null;
      matchEditRedraw = null;
      render();
    }

    function draw() {
      var rec = editTarget();
      if (!rec) { close(); return; }
      var rows = rec.events.map(function (ev) {
        var desc = "";
        if (ev.type === "goal") {
          desc = "⚽ " + esc(nameInRecord(rec, ev.playerId));
          if (ev.assistId) desc += " (assist: " + esc(nameInRecord(rec, ev.assistId)) + ")";
        } else if (ev.type === "opponent_goal") {
          desc = "⚽ " + esc(rec.opponentName);
        } else if (ev.type === "own_goal") {
          desc = "⚽ " + esc(ev.by === "us" ? rec.opponentName : rec.teamName) + " (own goal)";
        } else if (ev.type === "card") {
          desc = (ev.cardType === "red" ? "🟥 " : "🟨 ") + esc(nameInRecord(rec, ev.playerId));
        }
        var editable = ev.type === "goal" || ev.type === "card" || ev.type === "own_goal";
        return '<div class="event-row"><span class="event-minute">' + (ev.minuteAtEvent || 0) +
          "'</span><span class=\"event-desc\">" + desc + '</span><div class="event-actions">' +
          (editable ? '<button class="event-edit" data-edit-event="' + ev.id + '" aria-label="Edit">✎</button>' : "") +
          '<button class="event-delete" data-del-event="' + ev.id + '" aria-label="Delete">✕</button>' +
          "</div></div>";
      }).join("");

      overlay.innerHTML =
        '<div class="sheet help-sheet">' +
          '<div class="help-header"><h2 class="section-title">Correct this match</h2>' +
            '<button class="icon-btn" id="matchEditCloseBtn" aria-label="Close">✕</button></div>' +
          '<div class="help-body">' +
            '<div class="summary-score" style="padding-top:0;">' +
              '<div class="ss-num">' + rec.scoreUs + " – " + rec.scoreThem + "</div>" +
              '<div class="ss-teams">' + esc(rec.teamName) + " vs " + esc(rec.opponentName) + "</div>" +
            "</div>" +
            '<p class="hint">The score and season totals update as you change entries.</p>' +
            '<div class="event-log">' +
              (rows || '<div class="empty-state">Nothing was logged in this match.</div>') +
            "</div>" +
          "</div>" +
        "</div>";

      document.getElementById("matchEditCloseBtn").onclick = close;
      overlay.querySelectorAll("[data-edit-event]").forEach(function (btn) {
        btn.onclick = function () { showEditEvent(btn.getAttribute("data-edit-event")); };
      });
      overlay.querySelectorAll("[data-del-event]").forEach(function (btn) {
        btn.onclick = function () {
          var id = btn.getAttribute("data-del-event");
          showConfirm("Delete this entry from the match?", "Delete", function () { deleteEvent(id); }, true);
        };
      });
    }

    matchEditRedraw = draw;
    overlay.onclick = function (e) { if (e.target === overlay) close(); };
    draw();
  }

  function showEditEvent(eventId) {
    var match = editTarget();
    if (!match) return;
    var ev = findEvent(match, eventId);
    if (!ev || (ev.type !== "goal" && ev.type !== "card" && ev.type !== "own_goal")) return;

    var old = document.getElementById("editOverlay");
    if (old) old.remove();
    var overlay = document.createElement("div");
    overlay.className = "overlay";
    overlay.id = "editOverlay";
    document.body.appendChild(overlay);
    function close() { overlay.remove(); }
    overlay.onclick = function (e) { if (e.target === overlay) close(); };

    if (ev.type === "own_goal") {
      var selBy = ev.by === "us" ? "us" : "them";
      var drawOwn = function () {
        overlay.innerHTML =
          '<div class="sheet">' +
            '<div class="confirm-msg"><strong>Edit own goal</strong><br>Which team put it in their own net?</div>' +
            '<div class="btn-row" style="margin-top:14px;">' +
              '<button class="btn toggle-seg' + (selBy === "us" ? " on" : "") + '" id="ogEditUsBtn">' + esc(T().teamName) + "</button>" +
              '<button class="btn toggle-seg' + (selBy === "them" ? " on" : "") + '" id="ogEditThemBtn">' + esc(match.opponentName) + "</button>" +
            "</div>" +
            '<div class="btn-row" style="margin-top:16px;">' +
              '<button class="btn btn-ghost" id="editCancelBtn">Cancel</button>' +
              '<button class="btn btn-primary" id="editSaveBtn">Save</button>' +
            "</div>" +
          "</div>";
        document.getElementById("ogEditUsBtn").onclick = function () { selBy = "us"; drawOwn(); };
        document.getElementById("ogEditThemBtn").onclick = function () { selBy = "them"; drawOwn(); };
        document.getElementById("editCancelBtn").onclick = close;
        document.getElementById("editSaveBtn").onclick = function () {
          close();
          applyOwnGoalEdit(eventId, selBy);
        };
      };
      drawOwn();
    } else if (ev.type === "goal") {
      var selScorer = ev.playerId;
      var selAssist = ev.assistId || null;
      var draw = function () {
        var scorerChips = sortedRoster().map(function (p) {
          return '<button class="assist-chip' + (p.id === selScorer ? " chip-selected" : "") + '" data-pick-scorer="' + p.id + '">' + esc(p.name) + "</button>";
        }).join("");
        var assistSection = "";
        if (T().settings.trackAssists) {
          var assistChips =
            sortedRoster().filter(function (p) { return p.id !== selScorer; }).map(function (p) {
              return '<button class="assist-chip' + (p.id === selAssist ? " chip-selected" : "") + '" data-pick-assist="' + p.id + '">' + esc(p.name) + "</button>";
            }).join("") +
            '<button class="assist-chip' + (!selAssist ? " chip-selected" : "") + '" data-pick-assist="none">No assist</button>';
          assistSection = '<label class="field-label" style="margin-top:14px;">Assist</label><div class="assist-chip-row">' + assistChips + "</div>";
        }
        overlay.innerHTML =
          '<div class="sheet">' +
            '<div class="confirm-msg"><strong>Edit goal</strong></div>' +
            '<label class="field-label" style="margin-top:10px;">Scorer</label>' +
            '<div class="assist-chip-row">' + scorerChips + "</div>" +
            assistSection +
            '<div class="btn-row" style="margin-top:16px;">' +
              '<button class="btn btn-ghost" id="editCancelBtn">Cancel</button>' +
              '<button class="btn btn-primary" id="editSaveBtn">Save</button>' +
            "</div>" +
          "</div>";
        overlay.querySelectorAll("[data-pick-scorer]").forEach(function (btn) {
          btn.onclick = function () {
            selScorer = btn.getAttribute("data-pick-scorer");
            if (selAssist === selScorer) selAssist = null;
            draw();
          };
        });
        overlay.querySelectorAll("[data-pick-assist]").forEach(function (btn) {
          btn.onclick = function () {
            var v = btn.getAttribute("data-pick-assist");
            selAssist = v === "none" ? null : v;
            draw();
          };
        });
        document.getElementById("editCancelBtn").onclick = close;
        document.getElementById("editSaveBtn").onclick = function () {
          close();
          applyGoalEdit(eventId, selScorer, selAssist);
        };
      };
      draw();
    } else {
      var selPlayer = ev.playerId;
      var selType = ev.cardType;
      var drawCard = function () {
        var playerChips = sortedRoster().map(function (p) {
          return '<button class="assist-chip' + (p.id === selPlayer ? " chip-selected" : "") + '" data-pick-player="' + p.id + '">' + esc(p.name) + "</button>";
        }).join("");
        overlay.innerHTML =
          '<div class="sheet">' +
            '<div class="confirm-msg"><strong>Edit card</strong></div>' +
            '<label class="field-label" style="margin-top:10px;">Player</label>' +
            '<div class="assist-chip-row">' + playerChips + "</div>" +
            '<label class="field-label" style="margin-top:14px;">Card</label>' +
            '<div class="btn-row" style="margin-bottom:4px;">' +
              '<button class="btn toggle-seg' + (selType === "yellow" ? " on" : "") + '" id="pickYellowBtn">Yellow</button>' +
              '<button class="btn toggle-seg' + (selType === "red" ? " on" : "") + '" id="pickRedBtn">Red</button>' +
            "</div>" +
            '<div class="btn-row" style="margin-top:16px;">' +
              '<button class="btn btn-ghost" id="editCancelBtn">Cancel</button>' +
              '<button class="btn btn-primary" id="editSaveBtn">Save</button>' +
            "</div>" +
          "</div>";
        overlay.querySelectorAll("[data-pick-player]").forEach(function (btn) {
          btn.onclick = function () { selPlayer = btn.getAttribute("data-pick-player"); drawCard(); };
        });
        document.getElementById("pickYellowBtn").onclick = function () { selType = "yellow"; drawCard(); };
        document.getElementById("pickRedBtn").onclick = function () { selType = "red"; drawCard(); };
        document.getElementById("editCancelBtn").onclick = close;
        document.getElementById("editSaveBtn").onclick = function () {
          close();
          applyCardEdit(eventId, selPlayer, selType);
        };
      };
      drawCard();
    }
  }

  // ---------- roster ----------

  function addPlayer(name, number) {
    name = (name || "").trim();
    number = (number || "").trim();
    if (!name) {
      showToast("Enter a name first.", "warning");
      var nameEl = document.getElementById("newName");
      if (nameEl) nameEl.focus();
      return;
    }
    var clash = number && T().roster.filter(function (p) { return p.number === number; })[0];
    T().roster.push({ id: uid(), name: name, number: number });
    persist();
    render();
    if (clash) showToast("Heads up: number " + number + " is also " + clash.name + ".", "warning");
  }

  function removePlayer(id) {
    T().roster = T().roster.filter(function (p) { return p.id !== id; });
    persist();
    render();
  }

  // ---------- export / import ----------

  function slug(str) {
    return (str || "team").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/(^-|-$)/g, "") || "team";
  }

  // Readable season totals bundled into the export. Derived from history, so it
  // is ignored on import — history stays the single source of truth.
  function buildSeasonStats() {
    var players = {};
    var order = [];
    var team = { matchesPlayed: 0, won: 0, drawn: 0, lost: 0, goalsFor: 0, goalsAgainst: 0, ownGoalsFor: 0, ownGoalsAgainst: 0 };

    function entry(pid, record) {
      if (!players[pid]) {
        players[pid] = {
          id: pid, name: nameInRecord(record, pid), number: "",
          matchesPlayed: 0, goals: 0, assists: 0, minutes: 0, yellowCards: 0, redCards: 0
        };
        order.push(pid);
      }
      return players[pid];
    }

    T().history.forEach(function (m) {
      team.matchesPlayed++;
      if (m.scoreUs > m.scoreThem) team.won++;
      else if (m.scoreUs < m.scoreThem) team.lost++;
      else team.drawn++;
      team.goalsFor += m.scoreUs || 0;
      team.goalsAgainst += m.scoreThem || 0;
      team.ownGoalsFor += m.ownGoalsFor || 0;
      team.ownGoalsAgainst += m.ownGoalsAgainst || 0;

      var appeared = {};
      function sawPlayer(pid) {
        if (appeared[pid]) return;
        appeared[pid] = true;
        entry(pid, m).matchesPlayed++;
      }
      (m.rosterSnapshot || []).forEach(function (p) { sawPlayer(p.id); });

      Object.keys(m.scorers || {}).forEach(function (pid) {
        sawPlayer(pid);
        entry(pid, m).goals += m.scorers[pid];
      });
      Object.keys(m.assists || {}).forEach(function (pid) {
        sawPlayer(pid);
        entry(pid, m).assists += m.assists[pid];
      });
      Object.keys(m.playingTimeMinutes || {}).forEach(function (pid) {
        sawPlayer(pid);
        entry(pid, m).minutes += m.playingTimeMinutes[pid];
      });
      Object.keys(m.cards || {}).forEach(function (pid) {
        sawPlayer(pid);
        var e = entry(pid, m);
        (m.cards[pid] || []).forEach(function (c) {
          if (c === "red") e.redCards++; else e.yellowCards++;
        });
      });
    });

    // Prefer current shirt numbers and names where the player is still on the roster.
    T().roster.forEach(function (p) {
      if (players[p.id]) {
        players[p.id].name = p.name;
        players[p.id].number = p.number || "";
      }
    });

    var rows = order.map(function (pid) { return players[pid]; })
      .sort(function (a, b) { return b.goals - a.goals || a.name.localeCompare(b.name); });

    return { note: "Derived from history for easy reading; ignored on import.", team: team, players: rows };
  }

  // Per-match breakdown with player names and goal counts, so each match in the
  // export is readable on its own instead of only as player IDs in history.
  function buildMatchStats() {
    function playerRows(scorers, assists, minutes, cards, nameOf) {
      var ids = {};
      [scorers, assists, minutes, cards].forEach(function (src) {
        Object.keys(src || {}).forEach(function (pid) { ids[pid] = true; });
      });
      return Object.keys(ids).map(function (pid) {
        var c = (cards || {})[pid] || [];
        return {
          id: pid,
          name: nameOf(pid),
          goals: (scorers || {})[pid] || 0,
          assists: (assists || {})[pid] || 0,
          minutes: (minutes || {})[pid] || 0,
          yellowCards: c.filter(function (x) { return x !== "red"; }).length,
          redCards: c.filter(function (x) { return x === "red"; }).length
        };
      }).filter(function (r) {
        return r.goals || r.assists || r.minutes || r.yellowCards || r.redCards;
      }).sort(function (a, b) { return b.goals - a.goals || a.name.localeCompare(b.name); });
    }

    var rows = T().history.map(function (m) {
      return {
        date: m.date,
        opponent: m.opponentName,
        homeOrAway: m.isHome !== false ? "Home" : "Away",
        scoreUs: m.scoreUs, scoreThem: m.scoreThem,
        ownGoalsFor: m.ownGoalsFor || 0,
        ownGoalsAgainst: m.ownGoalsAgainst || 0,
        players: playerRows(m.scorers, m.assists, m.playingTimeMinutes, m.cards,
          function (pid) { return nameInRecord(m, pid); })
      };
    });

    // A match still being played is included too, flagged, so you can export
    // mid-match without ending it first.
    var live = T().activeMatch;
    if (live) {
      var s = computeStats(live);
      rows.unshift({
        inProgress: true,
        date: live.startedAt,
        opponent: live.opponentName,
        homeOrAway: live.isHome !== false ? "Home" : "Away",
        scoreUs: s.scoreUs, scoreThem: s.scoreThem,
        ownGoalsFor: s.ownGoalsFor, ownGoalsAgainst: s.ownGoalsAgainst,
        players: playerRows(s.scorers, s.assists, playingTimeMinutes(live), s.cards,
          function (pid) { var p = rosterById(pid); return p ? p.name : "Unknown"; })
      });
    }
    return rows;
  }

  async function exportData() {
    var payload = {
      exportedFrom: "Matchday Tracker",
      exportedAt: new Date().toISOString(),
      teamName: T().teamName,
      roster: T().roster,
      settings: T().settings,
      lastPlan: T().lastPlan,
      lastPeriodMinutes: T().lastPeriodMinutes,
      upcoming: T().upcoming,
      seasonStats: buildSeasonStats(),
      matchStats: buildMatchStats(),
      history: T().history
    };
    var json = JSON.stringify(payload, null, 2);
    var filename = slug(T().teamName) + "-team-data.json";

    // Inside a published Claude artifact, use its native save prompt.
    if (window.claude && typeof window.claude.use === "function") {
      try {
        var downloads = await window.claude.use("downloads");
        if (downloads) {
          var result = await downloads.save({ filename: filename, data: json });
          showToast(result.status === "saved" ? "Saved " + filename : "Sent");
          markExported();
          return;
        }
      } catch (err) {
        if (err && err.code === "declined") return;
        // Fall through to a plain browser download below.
      }
    }

    // Standard browser download — works on any ordinary web server.
    try {
      var blob = new Blob([json], { type: "application/json" });
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
      showToast("Saved " + filename);
      markExported();
    } catch (err) {
      console.error(err);
      showToast("Couldn't export right now.", "error");
    }
  }

  function teamFromImport(data, id) {
    return {
      id: id || uid(),
      teamName: data.teamName || "My Team",
      roster: data.roster.map(function (p) {
        return { id: p.id || uid(), name: p.name || "", number: p.number || "" };
      }),
      settings: Object.assign(defaultSettings(), data.settings || {}),
      activeMatch: null,
      history: Array.isArray(data.history) ? data.history : [],
      lastLineup: null,
      lastPlan: normalisePlan(data.lastPlan),
      lastPeriodMinutes: cleanPeriodMinutes(data.lastPeriodMinutes),
      upcoming: Array.isArray(data.upcoming)
        ? data.upcoming.map(normaliseUpcoming).filter(Boolean) : [],
      lastExportCount: Array.isArray(data.history) ? data.history.length : 0
    };
  }

  function finishImport(team, replacedId) {
    if (replacedId) {
      state.teams = state.teams.map(function (t) { return t.id === replacedId ? team : t; });
    } else {
      state.teams.push(team);
    }
    state.activeTeamId = team.id;
    pendingAssistEventId = null;
    lastEventTapAt = {};
    persist();
    view = "team";
    render();
    showToast("Imported " + team.teamName + " — " + team.roster.length + " players.");
  }

  function importDataFromFile(file) {
    var reader = new FileReader();
    reader.onload = function () {
      try {
        var data = JSON.parse(reader.result);
        if (!data || !Array.isArray(data.roster)) throw new Error("bad shape");
        var name = data.teamName || "My Team";

        // A team already on this device with the same name is the one the file
        // is probably an update of — but replacing it throws away its matches,
        // so that is never assumed.
        var existing = null;
        for (var i = 0; i < state.teams.length; i++) {
          if (state.teams[i].teamName === name) { existing = state.teams[i]; break; }
        }

        if (!existing) {
          finishImport(teamFromImport(data), null);
          return;
        }

        var lost = existing.history.length
          ? "Replacing it deletes its " + existing.history.length +
            (existing.history.length === 1 ? " recorded match." : " recorded matches.")
          : "It has no recorded matches yet.";
        showChoice(
          '"' + name + '" already exists on this device. ' + lost,
          [
            { label: "Replace it", danger: true, onPick: function () { finishImport(teamFromImport(data, existing.id), existing.id); } },
            { label: "Add as a second team", onPick: function () {
                var t = teamFromImport(data);
                t.teamName = name + " (imported)";
                finishImport(t, null);
              } }
          ]
        );
      } catch (e) {
        showToast("That file doesn't look like a Matchday Tracker export.", "error");
      }
    };
    reader.readAsText(file);
  }

  // ---------- rendering ----------

  function render() {
    document.getElementById("matchScreen").classList.toggle("hidden", view !== "match" && view !== "summary");
    document.getElementById("teamScreen").classList.toggle("hidden", view !== "team");
    document.getElementById("historyScreen").classList.toggle("hidden", view !== "history");

    var activeTab = view === "summary" ? "match" : view;
    document.getElementById("tabMatch").classList.toggle("active", activeTab === "match");
    document.getElementById("tabTeam").classList.toggle("active", activeTab === "team");
    document.getElementById("tabHistory").classList.toggle("active", activeTab === "history");

    var match = T().activeMatch;
    document.getElementById("scoreboardBar").classList.toggle("hidden", !match && view !== "summary");
    document.getElementById("undoBtn").disabled = !match || match.events.length === 0;
    document.getElementById("clockBtn").style.visibility = match ? "visible" : "hidden";

    if (match) {
      var stats = computeStats(match);
      document.getElementById("usScoreNum").textContent = stats.scoreUs;
      document.getElementById("themScoreNum").textContent = stats.scoreThem;
      document.getElementById("usScoreLabel").textContent = T().teamName + (match.isHome !== false ? " (H)" : " (A)");
      document.getElementById("themScoreLabel").innerHTML =
        '<span class="lbl">' + esc(match.opponentName + (match.isHome !== false ? " (A)" : " (H)")) +
        '</span><span class="pen" aria-hidden="true">✎</span>';
      paintClock(match);
      document.getElementById("clockState").textContent = match.clock.running ? "Running — tap to pause" : "Paused — tap to start";
      document.getElementById("clockState").classList.toggle("running", match.clock.running);
    } else {
      paintClock(null);
      document.getElementById("clockState").textContent = "No match yet";
      document.getElementById("clockState").classList.remove("running");
    }

    if (view === "match") renderMatchScreen();
    if (view === "summary") renderSummaryScreen();
    if (view === "team") renderTeamScreen();
    if (view === "history") renderHistoryScreen();
    if (view === "match") updateLiveMinutes();
    wireNotices();
  }

  // The live match log, shown in its own sheet. Built here so the match
  // screen stays a fixed height however long the match gets.
  function liveLogHtml(match) {
    return match.events.slice().reverse().map(function (ev) {
      var desc = "";
      if (ev.type === "goal") {
        var scorer = rosterById(ev.playerId);
        desc = "⚽ " + esc(scorer ? scorer.name : "Goal");
        if (ev.assistId) {
          var assister = rosterById(ev.assistId);
          if (assister) desc += " (assist: " + esc(assister.name) + ")";
        }
      } else if (ev.type === "opponent_goal") {
        desc = "⚽ " + esc(match.opponentName);
      } else if (ev.type === "own_goal") {
        // Shown under the team it counts for, same convention as the timeline.
        desc = "⚽ " + esc(ev.by === "us" ? match.opponentName : T().teamName) + " (own goal)";
      } else if (ev.type === "card") {
        var cp = rosterById(ev.playerId);
        desc = (ev.cardType === "red" ? "🟥 " : "🟨 ") + esc(cp ? cp.name : "");
      }
      var editable = ev.type === "goal" || ev.type === "card" || ev.type === "own_goal";
      var actions = editable
        ? '<button class="event-edit" data-edit-event="' + ev.id + '" aria-label="Edit this entry">✎</button><button class="event-delete" data-del-event="' + ev.id + '" aria-label="Delete this entry">✕</button>'
        : '<button class="event-delete" data-del-event="' + ev.id + '" aria-label="Delete this entry">✕</button>';
      return '<div class="event-row"><span class="event-minute">' + ev.minuteAtEvent + "'</span><span class=\"event-desc\">" + desc + '</span><div class="event-actions">' + actions + "</div></div>";
    }).join("");
  }

  function showMatchLogSheet() {
    var match = T().activeMatch;
    if (!match) return;
    var old = document.getElementById("logOverlay");
    if (old) old.remove();
    var overlay = document.createElement("div");
    overlay.className = "overlay";
    overlay.id = "logOverlay";
    document.body.appendChild(overlay);

    function draw() {
      var m = T().activeMatch;
      if (!m) { overlay.remove(); return; }
      var rows = liveLogHtml(m);
      overlay.innerHTML =
        '<div class="card-sheet">' +
          '<div class="plan-title">Match log' +
            (m.events.length ? " \u00b7 " + m.events.length : "") + "</div>" +
          '<div class="card-scroll log-scroll">' +
            (rows || '<div class="empty-state">No events logged yet \u2014 tap a player to add a goal.</div>') +
          "</div>" +
          '<button class="btn btn-ghost" id="logCloseBtn">Close</button>' +
        "</div>";

      overlay.querySelectorAll("[data-del-event]").forEach(function (btn) {
        btn.onclick = function () {
          var id = btn.getAttribute("data-del-event");
          editMatchId = null;
          showConfirm("Delete this entry from the log?", "Delete", function () {
            deleteEvent(id);
            draw();   // stay in the log so a second correction needs no reopening
          }, true);
        };
      });
      overlay.querySelectorAll("[data-edit-event]").forEach(function (btn) {
        btn.onclick = function () {
          editMatchId = null;
          overlay.remove();   // the editor is a sheet of its own
          showEditEvent(btn.getAttribute("data-edit-event"));
        };
      });
      document.getElementById("logCloseBtn").onclick = function () { overlay.remove(); };
    }

    overlay.onclick = function (e) { if (e.target === overlay) overlay.remove(); };
    draw();
  }

  function renderSummaryScreen() {
    var el = document.getElementById("matchScreen");
    var record = T().history[0];
    if (!record) { view = "match"; render(); return; }

    var scorerRows = Object.keys(record.scorers).map(function (pid) {
      return { name: nameInRecord(record, pid), goals: record.scorers[pid], assists: record.assists[pid] || 0 };
    }).sort(function (a, b) { return b.goals - a.goals; });

    var scorerHtml = scorerRows.length
      ? scorerRows.map(function (r) {
          var extra = T().settings.trackAssists && r.assists ? " · " + r.assists + (r.assists === 1 ? " assist" : " assists") : "";
          return '<div class="stat-row"><span class="sr-name">' + esc(r.name) + '</span><span class="sr-val">' + r.goals + (r.goals === 1 ? " goal" : " goals") + esc(extra) + "</span></div>";
        }).join("")
      : '<div class="empty-state">No goals scored by your team.</div>';

    var minuteRows = Object.keys(record.playingTimeMinutes || {})
      .map(function (pid) {
        return { name: nameInRecord(record, pid), minutes: record.playingTimeMinutes[pid] };
      })
      .filter(function (r) { return r.minutes > 0; })
      .sort(function (a, b) { return b.minutes - a.minutes; });
    var minutesHtml = minuteRows.map(function (r) {
      return '<div class="stat-row"><span class="sr-name">' + esc(r.name) + '</span><span class="sr-val">' + r.minutes + " min</span></div>";
    }).join("");

    var isHome = record.isHome !== false;
    var d = new Date(record.date);
    var dateStr = isNaN(d) ? "" : d.toLocaleDateString(undefined, { weekday: "short", day: "numeric", month: "short", year: "numeric" });
    var timeline = goalTimeline(record.events, record.opponentName, record);
    var shareText = buildShareText(record);

    el.innerHTML =
      noticeHtml() +
      '<h1 class="screen-title">Match summary</h1>' +
      '<div class="summary-score">' +
        '<div class="ss-num">' + record.scoreUs + " – " + record.scoreThem + "</div>" +
        '<div class="ss-teams">' + esc(record.teamName) + (isHome ? " (Home)" : " (Away)") + " vs " + esc(record.opponentName) + (isHome ? " (Away)" : " (Home)") + "</div>" +
        (dateStr ? '<div class="ss-teams">' + esc(dateStr) + "</div>" : "") +
      "</div>" +
      '<h2 class="section-title">Scorers</h2>' +
      '<div class="stat-list">' + scorerHtml + "</div>" +
      '<h2 class="section-title">Goal timeline</h2>' +
      '<div class="event-log">' + timelineHtml(timeline) + "</div>" +
      (T().settings.trackPlayingTime && minuteRows.length ? '<h2 class="section-title">Playing time</h2><div class="stat-list">' + minutesHtml + "</div>" : "") +
      '<button class="btn btn-gold" id="matchCardBtn" style="margin-top:18px;">Share match card</button>' +
      '<button class="btn btn-ghost" id="copySummaryBtn" style="margin-top:10px;">' +
        (navigator.share ? "Share as text" : "Copy as text") + "</button>" +
      '<div class="btn-row" style="margin-top:10px;">' +
        '<button class="btn btn-primary" id="newMatchBtn">Start next match</button>' +
        '<button class="btn btn-ghost" id="doneBtn">Done</button>' +
      "</div>";

    document.getElementById("matchCardBtn").onclick = function () { showMatchCard(record); };
    document.getElementById("copySummaryBtn").onclick = function () { shareOrCopy(shareText); };
    document.getElementById("newMatchBtn").onclick = function () { view = "match"; render(); };
    document.getElementById("doneBtn").onclick = function () { view = "match"; render(); };
  }

  function renderTeamScreen() {
    var el = document.getElementById("teamScreen");
    var rosterHtml = sortedRoster().map(function (p) {
      return (
        '<div class="roster-item">' +
          '<div class="roster-num">' + esc(p.number || "–") + "</div>" +
          '<div class="roster-name">' + esc(p.name) + "</div>" +
          '<button class="roster-remove" data-remove="' + p.id + '">Remove</button>' +
        "</div>"
      );
    }).join("");

    function toggleRow(key, title, desc) {
      var on = !!T().settings[key];
      return (
        // The whole row is the button, so the small switch is never the only target.
        '<button class="toggle-row" data-toggle="' + key + '" aria-pressed="' + on + '">' +
          '<span class="toggle-copy"><span class="t-title">' + title + '</span><span class="t-desc">' + desc + "</span></span>" +
          '<span class="switch' + (on ? " on" : "") + '"></span>' +
        "</button>"
      );
    }

    el.innerHTML =
      noticeHtml() +
      '<h1 class="screen-title">Team &amp; settings</h1>' +
      '<div class="card">' +
        '<div class="team-card">' +
          "<div>" +
            '<div class="tc-name">' + esc(T().teamName) + "</div>" +
            '<div class="tc-meta">' + esc(teamSummaryLine(T())) +
              (state.teams.length > 1 ? " · " + state.teams.length + " teams on this device" : "") + "</div>" +
          "</div>" +
          '<button class="btn btn-ghost" id="switchTeamBtn">' +
            (state.teams.length > 1 ? "Switch" : "Teams") + "</button>" +
        "</div>" +
        '<label class="field-label" for="teamNameInput" style="margin-top:14px;">Team name</label>' +
        '<input class="text-input" id="teamNameInput" value="' + esc(T().teamName) + '" style="margin-bottom:0;">' +
      "</div>" +
      '<h2 class="section-title">Players</h2>' +
      '<div class="card">' +
        '<div class="roster-list">' + (rosterHtml || '<div class="empty-state">No players yet — add your first one below.</div>') + "</div>" +
        '<div class="add-player-row">' +
          '<div class="num-input"><label class="field-label" for="newNum">No.</label><input class="text-input" id="newNum" inputmode="numeric" maxlength="3"></div>' +
          '<div class="name-input"><label class="field-label" for="newName">Name</label><input class="text-input" id="newName"></div>' +
          '<button class="btn btn-primary" id="addPlayerBtn">Add</button>' +
        "</div>" +
      "</div>" +
      (T().roster.length && !T().activeMatch
        ? '<button class="btn btn-primary" id="goToMatchBtn" style="margin-bottom:6px;">Start a match</button>'
        : "") +
      '<h2 class="section-title">Match options</h2>' +
      '<p class="hint">Off by default — turn on only what you actually want to track.</p>' +
      '<div class="card">' +
        toggleRow("trackAssists", "Assists", "Ask who assisted after each goal") +
        toggleRow("trackPlayingTime", "Playing time", "Show total minutes played in match summaries. Who's on the pitch is always tracked, so benched players can't be tapped by mistake.") +
        toggleRow("trackCards", "Cards", "Log yellow and red cards") +
        toggleRow("planLineups", "Line-up plan", "Set who plays each quarter or half before kick-off. The app proposes it at every break, so a change of line-up is one tap instead of six.") +
      "</div>" +
      '<h2 class="section-title">Share this team</h2>' +
      '<p class="hint">Export your roster and settings so another parent or coach can import them instead of typing everything in again.</p>' +
      '<div class="btn-row">' +
        '<button class="btn btn-primary" id="exportBtn">Export team data</button>' +
        '<button class="btn btn-ghost" id="importBtn">Import team data</button>' +
      "</div>";

    document.getElementById("switchTeamBtn").onclick = showTeamPicker;
    var goMatch = document.getElementById("goToMatchBtn");
    if (goMatch) goMatch.onclick = function () { view = "match"; render(); };
    document.getElementById("teamNameInput").onchange = function (e) {
      T().teamName = e.target.value.trim() || "My Team";
      persist();
      render();
    };
    document.getElementById("addPlayerBtn").onclick = function () {
      var num = document.getElementById("newNum").value;
      var name = document.getElementById("newName").value;
      addPlayer(name, num);
    };
    el.querySelectorAll("[data-remove]").forEach(function (btn) {
      btn.onclick = function () {
        var id = btn.getAttribute("data-remove");
        showConfirm("Remove this player from the roster?", "Remove", function () { removePlayer(id); }, true);
      };
    });
    el.querySelectorAll("[data-toggle]").forEach(function (btn) {
      btn.onclick = function () {
        var key = btn.getAttribute("data-toggle");
        T().settings[key] = !T().settings[key];
        persist();
        render();
      };
    });
    document.getElementById("exportBtn").onclick = exportData;
    document.getElementById("importBtn").onclick = function () {
      document.getElementById("importFileInput").click();
    };
  }

  function renderHistoryScreen() {
    var el = document.getElementById("historyScreen");

    var season = {};
    var seasonNames = {};
    var played = 0, wins = 0, draws = 0, losses = 0;
    function seasonEntry(pid, m) {
      if (!season[pid]) season[pid] = { goals: 0, assists: 0, minutes: 0 };
      // Remember the name as it was in the most recent match this player appeared in.
      if (!seasonNames[pid]) seasonNames[pid] = nameInRecord(m, pid);
      return season[pid];
    }
    T().history.forEach(function (m) {
      played++;
      if (m.scoreUs > m.scoreThem) wins++;
      else if (m.scoreUs < m.scoreThem) losses++;
      else draws++;
      Object.keys(m.scorers || {}).forEach(function (pid) {
        seasonEntry(pid, m).goals += m.scorers[pid];
      });
      Object.keys(m.assists || {}).forEach(function (pid) {
        seasonEntry(pid, m).assists += m.assists[pid];
      });
      Object.keys(m.playingTimeMinutes || {}).forEach(function (pid) {
        seasonEntry(pid, m).minutes += m.playingTimeMinutes[pid];
      });
    });
    var seasonRows = Object.keys(season).map(function (pid) {
      return { name: seasonNames[pid] || "Unknown", goals: season[pid].goals || 0, assists: season[pid].assists || 0, minutes: season[pid].minutes || 0 };
    }).sort(function (a, b) { return b.goals - a.goals; });

    var seasonHtml = seasonRows.length
      ? seasonRows.map(function (r) {
          var extra = "";
          if (T().settings.trackAssists) extra += " · " + r.assists + (r.assists === 1 ? " assist" : " assists");
          if (T().settings.trackPlayingTime) extra += " · " + r.minutes + " min";
          return '<div class="stat-row"><span class="sr-name">' + esc(r.name) + '</span><span class="sr-val">' + r.goals + (r.goals === 1 ? " goal" : " goals") + esc(extra) + "</span></div>";
        }).join("")
      : '<div class="empty-state">No matches recorded yet.</div>';

    var listHtml = T().history.map(function (m) {
      var result = m.scoreUs > m.scoreThem ? "win" : (m.scoreUs < m.scoreThem ? "loss" : "draw");
      var resultLabel = result === "win" ? "W" : (result === "loss" ? "L" : "D");
      var scorerNames = Object.keys(m.scorers || {}).map(function (pid) {
        var n = nameInRecord(m, pid);
        return m.scorers[pid] > 1 ? n + " (" + m.scorers[pid] + ")" : n;
      }).join(", ");
      var d = new Date(m.date);
      var dateStr = isNaN(d) ? "" : d.toLocaleDateString();
      var homeAwayLabel = m.isHome !== false ? "Home" : "Away";
      return (
        '<div class="history-item">' +
          '<div class="hi-top">' +
            '<div><span class="hi-score">' + m.scoreUs + " – " + m.scoreThem + "</span> <span class=\"result-pill " + result + "\">" + resultLabel + "</span></div>" +
            '<div class="hi-actions">' +
              '<button class="hi-copy" data-card="' + m.id + '">Card</button>' +
              '<button class="hi-copy" data-copy="' + m.id + '">' + (navigator.share ? "Share" : "Copy") + "</button>" +
              '<button class="hi-edit" data-fix="' + m.id + '">Fix</button>' +
              '<button class="hi-remove" data-del="' + m.id + '">Delete</button>' +
            "</div>" +
          "</div>" +
          '<div class="hi-meta">vs ' + esc(m.opponentName) + " · " + homeAwayLabel + (dateStr ? " · " + dateStr : "") + "</div>" +
          (scorerNames ? '<div class="hi-scorers">' + esc(scorerNames) + "</div>" : "") +
        "</div>"
      );
    }).join("");

    el.innerHTML =
      noticeHtml() +
      '<h1 class="screen-title">History</h1>' +
      '<div class="card">' +
        '<div class="stat-row"><span class="sr-name">Record</span><span class="sr-val">' + played + " played · " + wins + "W " + draws + "D " + losses + "L</span></div>" +
      "</div>" +
      '<h2 class="section-title">Season top scorers</h2>' +
      '<div class="card"><div class="stat-list">' + seasonHtml + "</div></div>" +
      '<h2 class="section-title">Matches</h2>' +
      '<div class="card">' + (listHtml || '<div class="empty-state">No matches yet.</div>') + "</div>" +
      '<div class="btn-row">' +
        '<button class="btn btn-primary" id="exportBtn2">Export team data</button>' +
        '<button class="btn btn-ghost" id="importBtn2">Import team data</button>' +
      "</div>" +
      '<button class="btn btn-danger" id="clearAllBtn" style="margin-top:12px;">Clear all teams on this device</button>';

    document.getElementById("exportBtn2").onclick = exportData;
    document.getElementById("importBtn2").onclick = function () {
      document.getElementById("importFileInput").click();
    };
    document.getElementById("clearAllBtn").onclick = function () {
      var n = state.teams.length;
      showConfirm(
        "This deletes " + (n > 1 ? "all " + n + " teams" : "this team") +
          " — rosters, settings and every recorded match on this device. This can't be undone.",
        "Clear everything",
        function () { state = defaultState(); persist(); view = "team"; render(); },
        true
      );
    };
    el.querySelectorAll("[data-del]").forEach(function (btn) {
      btn.onclick = function () {
        var id = btn.getAttribute("data-del");
        showConfirm("Delete this match from history?", "Delete", function () {
          T().history = T().history.filter(function (m) { return m.id !== id; });
          persist();
          render();
        }, true);
      };
    });
    el.querySelectorAll("[data-fix]").forEach(function (btn) {
      btn.onclick = function () { showEditMatch(btn.getAttribute("data-fix")); };
    });
    el.querySelectorAll("[data-card]").forEach(function (btn) {
      btn.onclick = function () {
        var m = T().history.filter(function (h) { return h.id === btn.getAttribute("data-card"); })[0];
        if (m) showMatchCard(m);
      };
    });
    el.querySelectorAll("[data-copy]").forEach(function (btn) {
      btn.onclick = function () {
        var id = btn.getAttribute("data-copy");
        var m = T().history.filter(function (h) { return h.id === id; })[0];
        if (m) shareOrCopy(buildShareText(m));
      };
    });
  }

  // ---------- global controls ----------

  document.querySelectorAll("[data-nav]").forEach(function (btn) {
    btn.onclick = function () {
      view = btn.getAttribute("data-nav");
      render();
    };
  });
  document.getElementById("helpBtn").onclick = showHelp;
  document.getElementById("clockBtn").onclick = toggleClock;
  document.getElementById("themScoreLabel").onclick = function () {
    var match = T().activeMatch;
    if (!match) return;
    showTextPrompt("Opponent name", "e.g. FC Riverside", match.opponentName, "Save", function (name) {
      T().activeMatch.opponentName = name;
      persist();
      render();
      showToast("Opponent renamed to " + name + ".");
    });
  };
  document.getElementById("undoBtn").onclick = undoLast;
  document.getElementById("importFileInput").onchange = function (e) {
    var file = e.target.files && e.target.files[0];
    if (file) importDataFromFile(file);
    e.target.value = "";
  };

  // A phone lock or backgrounded tab must keep counting real match time, so the
  // clock is wall-clock based. Only an implausibly long run means it was forgotten.
  var CLOCK_STALE_LIMIT_MS = 3 * 60 * 60 * 1000;

  function lastEventElapsedMs(match) {
    var maxMin = 0;
    match.events.forEach(function (e) {
      if (typeof e.minuteAtEvent === "number" && e.minuteAtEvent > maxMin) maxMin = e.minuteAtEvent;
    });
    return maxMin * 60000;
  }

  function formatDuration(ms) {
    var totalMin = Math.floor(ms / 60000);
    var h = Math.floor(totalMin / 60);
    var m = totalMin % 60;
    if (h && m) return h + "h " + m + "m";
    if (h) return h + "h";
    return m + "m";
  }

  function checkStaleClock() {
    var match = T().activeMatch;
    if (!match || !match.clock.running) return;
    var elapsed = clockElapsedMs(match);
    if (elapsed <= CLOCK_STALE_LIMIT_MS) return;
    // The clock was clearly left running rather than played. The match itself is
    // never discarded — only the clock is rewound to something plausible, since
    // it exists to timestamp events, not to be authoritative.
    var recovered = match.events.length ? lastEventElapsedMs(match) + 60000 : 0;
    match.clock.elapsedMs = recovered;
    // Rewinding can leave the period mark after the clock — which would block
    // the next break until the lost time had been played again. When that
    // happens the period timing is simply unknown, so drop the mark and let
    // the clock fall back to plain match time until the next break.
    if (typeof match.periodStartMs === "number" && match.periodStartMs > recovered) {
      delete match.periodStartMs;
    }
    match.clock.running = false;
    match.clock.runningSince = null;
    persist();
    render();
    showToast(
      "Clock had been running " + formatDuration(elapsed) + " — paused and reset to " +
      formatClock(recovered) + ". Your match is safe.",
      "warning"
    );
  }

  setInterval(function () {
    if (T().activeMatch && T().activeMatch.clock.running) {
      checkStaleClock();
      if (view === "match" && T().activeMatch && T().activeMatch.clock.running) {
        paintClock(T().activeMatch);
        updateLiveMinutes();
      }
    }
  }, 1000);

  window.addEventListener("beforeinstallprompt", function (e) {
    e.preventDefault();
    deferredInstall = e;
    render();
  });
  window.addEventListener("appinstalled", function () {
    deferredInstall = null;
    try { localStorage.setItem(INSTALL_KEY, "1"); } catch (err) {}
    render();
  });

  document.addEventListener("visibilitychange", function () {
    // Timers are throttled while hidden, so redraw on return to snap the clock
    // and the live minutes back to the real elapsed time.
    if (document.visibilityState === "visible") render();
  });

  render();
  checkStaleClock();
})();

// Offline support. Guarded so opening the file directly (file://) still works.
if ("serviceWorker" in navigator && location.protocol.indexOf("http") === 0) {
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("./sw.js").catch(function (err) {
      console.log("Service worker not registered:", err);
    });
  });
}
</script>
