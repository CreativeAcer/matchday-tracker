  function wireUpcoming(el) {
    el.querySelectorAll("[data-prep-start]").forEach(function (b) {
      b.onclick = function () { startPreparedMatch(b.getAttribute("data-prep-start")); };
    });
    el.querySelectorAll("[data-prep-edit]").forEach(function (b) {
      b.onclick = function () {
        var id = b.getAttribute("data-prep-edit");
        showMatchPrep((T().upcoming || []).filter(function (u) { return u.id === id; })[0]);
      };
    });
    el.querySelectorAll("[data-prep-del]").forEach(function (b) {
      b.onclick = function () {
        var id = b.getAttribute("data-prep-del");
        var u = (T().upcoming || []).filter(function (x) { return x.id === id; })[0];
        showConfirm("Delete the prepared match against " + ((u && u.opponentName) || "Opponent") + "?",
          "Delete", function () { deleteUpcoming(id); render(); showToast("Prepared match deleted.", "warning"); }, true);
      };
    });
  }

  function buildShareText(record) {
    var isHome = record.isHome !== false;
    var homeName = isHome ? record.teamName : record.opponentName;
    var awayName = isHome ? record.opponentName : record.teamName;
    var homeScore = isHome ? record.scoreUs : record.scoreThem;
    var awayScore = isHome ? record.scoreThem : record.scoreUs;
    var d = new Date(record.date);
    var dateStr = isNaN(d) ? "" : d.toLocaleDateString(undefined, { weekday: "short", day: "numeric", month: "short", year: "numeric" });
    var timeline = goalTimeline(record.events, record.opponentName, record);

    var lines = [];
    if (dateStr) lines.push(dateStr);
    lines.push(homeName + " (Home) " + homeScore + " – " + awayScore + " " + awayName + " (Away)");

    // Goals per player for THIS match, so the shared report carries the tally
    // and not just the minute-by-minute list.
    var tally = Object.keys(record.scorers || {}).map(function (pid) {
      return {
        name: nameInRecord(record, pid),
        goals: record.scorers[pid],
        assists: (record.assists || {})[pid] || 0
      };
    }).sort(function (a, b) { return b.goals - a.goals || a.name.localeCompare(b.name); });

    if (tally.length) {
      lines.push("");
      lines.push("Goals per player:");
      tally.forEach(function (r) {
        lines.push(r.name + ": " + r.goals +
          (r.assists ? " (" + r.assists + " assist" + (r.assists === 1 ? "" : "s") + ")" : ""));
      });
    }
    if (record.ownGoalsFor) lines.push("Own goals in our favour: " + record.ownGoalsFor);
    if (record.ownGoalsAgainst) lines.push("Own goals against us: " + record.ownGoalsAgainst);

    if (timeline.length) {
      lines.push("");
      lines.push("Goals:");
      var multi = timeline.some(function (t) { return (t.period || 1) > 1; });
      var seen = {};
      timeline.forEach(function (t) {
        var per = t.period || 1;
        if (multi && !seen[per]) { seen[per] = true; lines.push("— Period " + per + " —"); }
        lines.push(t.minute + "' " + t.name +
          (t.ownGoal ? " (own goal)" : "") +
          (t.assistName ? " (assist: " + t.assistName + ")" : ""));
      });
    }
    return lines.join("\n");
  }

  // The system share sheet lands straight in WhatsApp; copying is the fallback
  // where it isn't available or the user backs out.
  async function shareOrCopy(text) {
    if (nativeBridge()) {
      try { await nativeCall("Share", "share", { text: text, dialogTitle: "Share the result" }); return; }
      catch (e) { if (nativeCancelled(e)) return; }
    } else if (navigator.share) {
      try { await navigator.share({ text: text }); return; }
      catch (e) { if (e && e.name === "AbortError") return; }
    }
    copyShareText(text);
  }

  async function copyShareText(text) {
    try {
      if (!navigator.clipboard || !navigator.clipboard.writeText) throw new Error("no clipboard api");
      await navigator.clipboard.writeText(text);
      showToast("Copied — paste it into your group chat.");
    } catch (e) {
      showCopyFallback(text);
    }
  }

  function showCopyFallback(text) {
    var old = document.getElementById("copyOverlay");
    if (old) old.remove();
    var overlay = document.createElement("div");
    overlay.className = "overlay";
    overlay.id = "copyOverlay";
    overlay.innerHTML =
      '<div class="sheet">' +
        '<div class="confirm-msg">Couldn\u2019t copy automatically. Tap the text below, select all, then copy.</div>' +
        '<textarea class="share-textarea" id="shareTextarea" readonly></textarea>' +
        '<div class="btn-row" style="margin-top:12px;">' +
          '<button class="btn btn-ghost" id="copyFallbackClose">Close</button>' +
          '<button class="btn btn-primary" id="copyFallbackTry">Try copy again</button>' +
        "</div>" +
      "</div>";
    document.body.appendChild(overlay);
    var ta = document.getElementById("shareTextarea");
    ta.value = text;
    ta.focus();
    ta.select();
    function cleanup() { overlay.remove(); }
    document.getElementById("copyFallbackClose").onclick = cleanup;
    overlay.onclick = function (e) { if (e.target === overlay) cleanup(); };
    document.getElementById("copyFallbackTry").onclick = function () {
      ta.focus();
      ta.select();
      var ok = false;
      try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
      if (ok) {
        showToast("Copied — paste it into your group chat.");
        cleanup();
      } else {
        showToast("Still couldn't copy automatically — select the text and copy manually.", "error");
      }
    };
  }

  function showToast(msg, type) {
    var existing = document.getElementById("toastEl");
    if (existing) existing.remove();
    var t = document.createElement("div");
    t.className = "toast toast-" + (type || "success");
    t.id = "toastEl";
    t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(function () { t.remove(); }, 3200);
  }

  function esc(str) {
    var d = document.createElement("div");
    d.textContent = str == null ? "" : String(str);
    return d.innerHTML;
  }

  function showConfirm(message, confirmLabel, onConfirm, danger) {
    var old = document.getElementById("confirmOverlay");
    if (old) old.remove();
    var overlay = document.createElement("div");
    overlay.className = "overlay";
    overlay.id = "confirmOverlay";
    overlay.innerHTML =
      '<div class="sheet">' +
        '<div class="confirm-msg">' + esc(message) + "</div>" +
        '<div class="btn-row" style="margin-top:16px;">' +
          '<button class="btn btn-ghost" id="confirmCancelBtn">Cancel</button>' +
          '<button class="btn ' + (danger ? "btn-danger" : "btn-primary") + '" id="confirmOkBtn">' + esc(confirmLabel || "Confirm") + "</button>" +
        "</div>" +
      "</div>";
    document.body.appendChild(overlay);
    function cleanup() { overlay.remove(); }
    document.getElementById("confirmCancelBtn").onclick = cleanup;
    document.getElementById("confirmOkBtn").onclick = function () { cleanup(); onConfirm(); };
    overlay.onclick = function (e) { if (e.target === overlay) cleanup(); };
  }

  // A confirm with more than two outcomes, stacked so long labels stay readable.
  function showChoice(message, options) {
    var old = document.getElementById("choiceOverlay");
    if (old) old.remove();
    var overlay = document.createElement("div");
    overlay.className = "overlay";
    overlay.id = "choiceOverlay";
    var buttons = options.map(function (o, i) {
      return '<button class="btn ' + (o.danger ? "btn-danger" : "btn-primary") +
        '" data-choice="' + i + '" style="margin-top:10px;">' + esc(o.label) + "</button>";
    }).join("");
    overlay.innerHTML =
      '<div class="sheet">' +
        '<div class="confirm-msg">' + esc(message) + "</div>" +
        buttons +
        '<button class="btn btn-ghost" id="choiceCancelBtn" style="margin-top:10px;">Cancel</button>' +
      "</div>";
    document.body.appendChild(overlay);
    function cleanup() { overlay.remove(); }
    overlay.onclick = function (e) { if (e.target === overlay) cleanup(); };
    document.getElementById("choiceCancelBtn").onclick = cleanup;
    overlay.querySelectorAll("[data-choice]").forEach(function (btn) {
      btn.onclick = function () {
        cleanup();
        options[parseInt(btn.getAttribute("data-choice"), 10)].onPick();
      };
    });
  }

  // ---------- teams ----------

  // --- adding the app to the home screen ---------------------------------
  // No site may install itself; the most a page can do is ask. Android and
  // desktop Chrome hand us a real prompt via beforeinstallprompt. iOS offers no
  // such API at all, so there the best possible is clear instructions.
  var deferredInstall = null;
  var INSTALL_KEY = "matchdayInstallHidden";

  function isStandalone() {
    if (nativeBridge()) return true;     // the Android app is the installed app
    return (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches) ||
           navigator.standalone === true;
  }

  function isIOS() {
    return /iphone|ipad|ipod/i.test(navigator.userAgent) ||
           (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  }

  // The key holds one of two things, and the difference matters. "1" is a
  // deliberate "Not now" from the coach and stays forever. "installed" is our
  // own note that the app sits on the home screen, and that note is dropped the
  // moment the phone tells us otherwise, so a coach who removes the app and
  // comes back to the site is offered the install once more.
  function installHidden() {
    try {
      var v = localStorage.getItem(INSTALL_KEY);
      return v === "1" || v === "installed";
    } catch (e) { return false; }
  }

  function hideInstallHint() {
    try { localStorage.setItem(INSTALL_KEY, "1"); } catch (e) {}
    render();
  }

  // Only noted where it can be taken back: beforeinstallprompt is what later
  // proves the app is gone, and iOS has no such event. So on iOS nothing is
  // stored and the hint keeps behaving exactly as it did before.
  function markInstalled() {
    if (isIOS()) return;
    try { localStorage.setItem(INSTALL_KEY, "installed"); } catch (e) {}
  }

  // A deliberate "Not now" is left alone; only our own note is cleared.
  function clearInstalledMark() {
    try {
      if (localStorage.getItem(INSTALL_KEY) === "installed") localStorage.removeItem(INSTALL_KEY);
    } catch (e) {}
  }

  function installNoticeHtml() {
    if (isStandalone() || installHidden()) return "";
    if (deferredInstall) {
      return '<div class="notice notice-install">' +
        "<div><strong>Add to your home screen</strong> so it opens fullscreen and works without signal.</div>" +
        '<div class="btn-row" style="margin-top:10px;">' +
          '<button class="btn btn-primary" id="installBtn">Install</button>' +
          '<button class="btn btn-ghost" id="installDismissBtn">Not now</button>' +
        "</div></div>";
    }
    if (isIOS()) {
      return '<div class="notice notice-install">' +
        "<div><strong>Add to your home screen</strong> so it opens fullscreen and works without signal: " +
        "tap the share button in Safari, then <strong>Add to Home Screen</strong>.</div>" +
        '<button class="btn btn-ghost" id="installDismissBtn" style="margin-top:10px;">Got it</button>' +
      "</div>";
    }
    return "";
  }

  // The notices are drawn into every screen, and a screen that isn't showing
  // keeps its old copy. Looking a button up by id found the hidden Match
  // screen's copy first, so on Team and History "Got it", "Install" and
  // "Not now" did nothing. Every copy is wired instead.
  function wireNotices() {
    var all = function (id) { return document.querySelectorAll('[id="' + id + '"]'); };
    all("installBtn").forEach(function (install) {
      install.onclick = function () {
        if (!deferredInstall) return;
        deferredInstall.prompt();
        var choice = deferredInstall.userChoice;
        deferredInstall = null;
        if (choice && choice.then) choice.then(function () { render(); });
        else render();
      };
    });
    all("backupDismissBtn").forEach(function (b) { b.onclick = dismissBackupNudge; });
    all("installDismissBtn").forEach(function (b) { b.onclick = hideInstallHint; });
  }

  function unexportedCount() {
    return Math.max(0, T().history.length - (T().lastExportCount || 0));
  }

  // Squeezes a fingerprint down to a short token, so a whole season's worth of
  // detail can be compared and stored without keeping a copy of it.
  function fingerprint(str) {
    var h1 = 0x811c9dc5, h2 = 0x01000193;
    for (var i = 0; i < str.length; i++) {
      var c = str.charCodeAt(i);
      h1 = (h1 ^ c) >>> 0; h1 = (h1 * 16777619) >>> 0;
      h2 = (h2 + c * (i + 1)) >>> 0;
    }
    return h1.toString(36) + "-" + h2.toString(36) + "-" + str.length;
  }

  // A fingerprint of the prepared matches, so the backup reminder notices work
  // that was PLANNED and not yet played. Counting matches alone missed it: a
  // coach who has set up five matches and played none was never nudged.
  // It records WHICH players, not how many: swapping the whole of Q1 for seven
  // other names used to leave the fingerprint untouched.
  function prepSignature(list) {
    return PREP_SIG_TAG + (list || []).map(function (u) {
      var plan = u.plan ? u.plan.periods + "x" + u.plan.lineups.map(function (r) {
        return (r || []).slice().sort().join(".");
      }).join(",") : "-";
      return [u.id, u.opponentName || "", u.kickoffAt || "", u.isHome !== false ? "H" : "A",
              (u.unavailable || []).slice().sort().join("."), u.periodMinutes || "", plan].join(":");
    }).join("|");
  }

  // The pre-2 shape, kept only so migrate() can recognise a stored value from
  // the previous release and decide whether anything has changed since.
  function prepSignatureLegacy(list) {
    return (list || []).map(function (u) {
      var plan = u.plan ? u.plan.periods + "x" + u.plan.lineups.map(function (r) {
        return (r || []).length;
      }).join(",") : "-";
      return [u.id, u.opponentName || "", u.kickoffAt || "", u.isHome !== false ? "H" : "A",
              (u.unavailable || []).length, u.periodMinutes || "", plan].join(":");
    }).join("|");
  }

  // Did the prepared matches change since the last backup? Separate from the
  // count below, because deleting every prepared match is a change that leaves
  // nothing to count.
  // Bringing a stored signature from the previous release across. If it still
  // matches what those prepared matches look like in the OLD shape, nothing has
  // changed since that backup and the new-shape signature can safely be adopted.
  // If it doesn't match, something did change, and leaving it alone lets the
  // reminder fire — correctly — as it would have before.
  function carryPrepSignature(stored, upcoming) {
    if (typeof stored !== "string" || !stored) return "";
    if (stored.slice(0, PREP_SIG_TAG.length) === PREP_SIG_TAG) return stored;
    return stored === prepSignatureLegacy(upcoming) ? prepSignature(upcoming) : stored;
  }

  function prepChanged() {
    var stored = T().lastExportPrep || "";
    var list = T().upcoming || [];
    // An empty stored value means nothing has ever been exported, not that the
    // last export contained nothing. So it only counts as a change if there is
    // something there now — otherwise a brand-new team, which has nothing to
    // lose, would be nagged to back up from the very first screen.
    if (!stored) return list.length > 0;
    return prepSignature(list) !== stored;
  }
  function prepUnsaved() {
    return prepChanged() ? (T().upcoming || []).length : 0;
  }

  // The same idea for matches already played. The count alone could not see a
  // corrected scorer or a deleted match, both of which leave the backup wrong
  // while the app insisted it was current.
  function historySignature(list) {
    return fingerprint((list || []).map(function (r) {
      var ev = (r.events || []).map(function (e) {
        return [e.id || "", e.type || "", e.playerId || "", e.assistId || "",
                e.cardType || "", e.by || "", e.own ? 1 : 0,
                e.minuteAtEvent == null ? "" : e.minuteAtEvent].join(",");
      }).join(";");
      return [r.id, r.opponentName || "", r.isHome !== false ? "H" : "A",
              r.date || "", r.scoreUs, r.scoreThem, ev].join(":");
    }).join("|"));
  }

  // Only ever true when we have something to compare against. A team upgrading
  // from an older version has no stored fingerprint yet, and must not be told
  // its backup is stale on the strength of a comparison we cannot make.
  function historyEdited() {
    var known = T().lastExportHistory;
    if (!known) return false;
    // Compare only the matches that were in the backup. New ones are added at
    // the front, so the backed-up set is the tail. Without this the comparison
    // was drowned by every new match, and a corrected scorer followed by one
    // more game produced no warning at all.
    var h = T().history || [];
    var backedUp = T().lastExportCount || 0;
    var tail = h.length > backedUp ? h.slice(h.length - backedUp) : h;
    return historySignature(tail) !== known;
  }

  function noticeHtml() {
    var out = installNoticeHtml();
    if (loadRescued) {
      out += '<div class="notice notice-error"><strong>Your saved data couldn\u2019t be read.</strong> ' +
             'The app has started empty, but nothing was deleted \u2014 the unreadable copy is still on this ' +
             'device. Import your last backup file to carry on, and don\u2019t clear this browser\u2019s storage.</div>';
    }
    if (!storageOk) {
      out += '<div class="notice notice-error">This device isn\u2019t saving right now. ' +
             'Your matches only exist in this open app \u2014 export your data before closing it.</div>';
    }
    var n = unexportedCount();
    var prep = prepUnsaved();
    // A correction to a match already backed up changes nothing about the
    // counts, so it gets its own signal. New matches still wait until three, so
    // the coach isn't nudged after every single game.
    var edited = historyEdited();
    var prepMoved = prepChanged();
    if (storageOk && (n >= 3 || prepMoved || edited) && backupNudgeState() !== T().backupNudgeSeen) {
      var what = [];
      if (n >= 3) what.push(n + " matches recorded");
      if (edited) what.push("a match you changed");
      if (prepMoved) {
        what.push(prep
          ? prep + (prep === 1 ? " prepared match" : " prepared matches")
          : "prepared matches you deleted");
      }
      out += '<div class="notice notice-warn">' +
             '<div>' + esc(what.join(" and ")) +
             ' not in your last backup. Use <strong>Export team data</strong> to keep a copy \u2014 ' +
             'it holds your prepared matches and line-up plans too.</div>' +
             '<button class="btn btn-ghost" id="backupDismissBtn" style="margin-top:10px;">Got it</button>' +
             "</div>";
    }
    return out;
  }

  // What the reminder is currently about. Dismissing stores this, and the
  // reminder stays away until the answer changes — so "got it" means gone for
  // what you have now, not gone forever while the season piles up unsaved.
  function backupNudgeState() {
    return unexportedCount() + "|" + (historyEdited() ? "1" : "0") + "|" +
           prepSignature(T().upcoming || []);
  }

  function dismissBackupNudge() {
    T().backupNudgeSeen = backupNudgeState();
    persist();
    render();
  }

  function markExported(parts) {
    parts = parts || defaultExportParts();
    if (parts.history) {
      T().lastExportCount = T().history.length;
      T().lastExportHistory = historySignature(T().history);
    }
    if (parts.prep) T().lastExportPrep = prepSignature(T().upcoming);
    persist();
    render();
  }

  function teamSummaryLine(t) {
    var bits = [t.roster.length + (t.roster.length === 1 ? " player" : " players")];
    if (t.history.length) bits.push(t.history.length + (t.history.length === 1 ? " match" : " matches"));
    if (t.activeMatch) bits.push("match in progress");
    return bits.join(" · ");
  }

  function switchTeam(id) {
    if (!teamById(id) || id === state.activeTeamId) return;
    state.activeTeamId = id;
    pendingAssistEventId = null;
    lastEventTapAt = {};
    persist();
    view = T().roster.length === 0 ? "team" : "match";
    render();
    showToast("Switched to " + T().teamName + ".");
    // The 1s timer only watches the active team, so a clock left running on the
    // team we just came back to is checked right now.
    checkStaleClock();
  }

  function showTextPrompt(title, placeholder, initial, confirmLabel, onSubmit) {
    var old = document.getElementById("promptOverlay");
    if (old) old.remove();
    var overlay = document.createElement("div");
    overlay.className = "overlay";
    overlay.id = "promptOverlay";
    overlay.innerHTML =
      '<div class="sheet">' +
        '<div class="confirm-msg"><strong>' + esc(title) + "</strong></div>" +
        '<input class="text-input" id="promptInput" style="margin-top:12px;margin-bottom:0;" placeholder="' + esc(placeholder) + '">' +
        '<div class="btn-row" style="margin-top:16px;">' +
          '<button class="btn btn-ghost" id="promptCancelBtn">Cancel</button>' +
          '<button class="btn btn-primary" id="promptOkBtn">' + esc(confirmLabel) + "</button>" +
        "</div>" +
      "</div>";
    document.body.appendChild(overlay);
    var input = document.getElementById("promptInput");
    input.value = initial || "";
    input.focus();
    function cleanup() { overlay.remove(); }
    overlay.onclick = function (e) { if (e.target === overlay) cleanup(); };
    document.getElementById("promptCancelBtn").onclick = cleanup;
    function submit() {
      var v = input.value.trim();
      if (!v) { input.focus(); return; }
      cleanup();
      onSubmit(v);
    }
    document.getElementById("promptOkBtn").onclick = submit;
    input.onkeydown = function (e) { if (e.key === "Enter") submit(); };
  }

  function addTeam() {
    showTextPrompt("New team", "e.g. Excelsior Mariaburg - Blauw", "", "Create", function (name) {
      var t = newTeam(name);
      state.teams.push(t);
      state.activeTeamId = t.id;
      persist();
      view = "team";
      render();
      showToast("Created " + name + ".");
    });
  }

  function deleteTeam(id) {
    var t = teamById(id);
    if (!t) return;
    if (state.teams.length === 1) {
      showToast("This is your only team — clear its data instead.", "warning");
      return;
    }
    var detail = t.history.length
      ? " Its " + t.history.length + (t.history.length === 1 ? " match" : " matches") + " of history will be deleted too."
      : "";
    showConfirm('Delete "' + t.teamName + '"?' + detail + " This can't be undone.", "Delete", function () {
      state.teams = state.teams.filter(function (x) { return x.id !== id; });
      if (state.activeTeamId === id) state.activeTeamId = state.teams[0].id;
      persist();
      view = "team";
      render();
      showToast("Deleted " + t.teamName + ".", "warning");
    }, true);
  }

  function showTeamPicker() {
    var old = document.getElementById("teamOverlay");
    if (old) old.remove();
    var overlay = document.createElement("div");
    overlay.className = "overlay";
    overlay.id = "teamOverlay";
    var rows = state.teams.map(function (t) {
      var current = t.id === state.activeTeamId;
      return (
        '<div class="team-row' + (current ? " current" : "") + '">' +
          '<button class="team-pick" data-pick-team="' + t.id + '">' +
            '<span class="team-pick-name">' + esc(t.teamName) + (current ? " ✓" : "") + "</span>" +
            '<span class="team-pick-meta">' + esc(teamSummaryLine(t)) + "</span>" +
          "</button>" +
          '<button class="team-del" data-del-team="' + t.id + '" aria-label="Delete team">✕</button>' +
        "</div>"
      );
    }).join("");
    overlay.innerHTML =
      '<div class="sheet team-sheet">' +
        '<div class="help-header"><h2 class="section-title">Teams</h2><button class="icon-btn" id="teamCloseBtn" aria-label="Close">✕</button></div>' +
        '<div class="team-list">' + rows + "</div>" +
        '<div style="padding:0 8px;">' +
          '<button class="btn btn-primary" id="addTeamBtn" style="margin-top:12px;">Add a team</button>' +
        "</div>" +
      "</div>";
    document.body.appendChild(overlay);
    function cleanup() { overlay.remove(); }
    overlay.onclick = function (e) { if (e.target === overlay) cleanup(); };
    document.getElementById("teamCloseBtn").onclick = cleanup;
    document.getElementById("addTeamBtn").onclick = function () { cleanup(); addTeam(); };
    overlay.querySelectorAll("[data-pick-team]").forEach(function (btn) {
      btn.onclick = function () { cleanup(); switchTeam(btn.getAttribute("data-pick-team")); };
    });
    overlay.querySelectorAll("[data-del-team]").forEach(function (btn) {
      btn.onclick = function () { cleanup(); deleteTeam(btn.getAttribute("data-del-team")); };
    });
  }

  function showHelp() {
    var old = document.getElementById("helpOverlay");
    if (old) old.remove();
    var overlay = document.createElement("div");
    overlay.className = "overlay";
    overlay.id = "helpOverlay";
    var sections = [
      ["Put it on your home screen", "Opened in a browser, the app offers to add itself — on Android and desktop Chrome with an <strong>Install</strong> button, on iPhone with the steps to follow, because Apple gives websites no way to do it for you. Installed, it opens fullscreen and works without signal."],
      ["Set up your team", "Go to <strong>Team</strong> and add each player's name and shirt number. This only needs doing once — it's saved on this device for every future match."],
      ["Several teams", "Tap <strong>Switch</strong> at the top of the Team screen to keep more than one team on the same device. Each team has its own roster, settings, match history and even its own match in progress, so switching never mixes them up."],
      ["Match options", "Still on the Team screen: turn on Assists, Playing time, or Cards only if you want to track them. All three are off by default to keep things simple."],
      ["Start a match", "On the <strong>Match</strong> tab, enter the opponent (optional), pick Home or Away, then tap <strong>Kick off</strong>."],
      ["The clock", "Tap the timer at the top to start it. You can't log goals or cards until it is running, which is what keeps every minute accurate. It is a <strong>match</strong> clock, so it keeps counting across the breaks the way a real one does \u2014 the second half starts at 45', not at 0 \u2014 and that is the minute your goals are stamped with. From the second period on, the big number shows the time in <strong>that</strong> period (<strong>Q2 \u00b7 01:20</strong>) with the match total underneath. Give the match a period length at kick-off and the number turns gold once the referee plays past it, so you can see how much is being added on, and at that moment the phone buzzes once and says so. The screen stays on while the clock runs. Half minutes work too: with 8 periods in a 60-minute match, type <strong>7,5</strong>."],
      ["Score a goal", "Tap a player's tile. If Assists is on, you'll be asked who assisted right after. Use the dashed <strong>+ opponent scored</strong> button at the bottom of the screen for the opponent's goals; it stays in view while you scroll the tiles."],
      ["Own goals", "Tap <strong>Own goal</strong>, under the player tiles, then pick which team put it in their own net. The point goes to the other team automatically, and an own goal is never counted as a goal for any player."],
      ["On pitch / Bench", "Each tile shows who's on the pitch. Tap the badge to bench or bring on a player — benched players can't be tapped to score by mistake. Before the clock has run, a line above the tiles says how many are on the pitch and how many on the bench. Whoever was on the pitch when you started the clock becomes the lineup the next match begins with, so you only set the bench once; a player you add later starts on the pitch."],
      ["Fair playing time", "With <strong>Playing time</strong> on, each tile shows the minutes played so far, updating as the clock runs. After the first five minutes the player with the fewest minutes is outlined, so you can see at a glance who is due to come on."],
      ["Prepare a match in advance", "On the Match screen, <strong>Prepare a match for later</strong> saves a match you will play another day: the opponent, home or away, the kick-off date and time, who can\u2019t make it, the match format and the line-up plan. Prepared matches appear under <strong>Ready to play</strong>, earliest first, and <strong>Start this match</strong> begins it with everything already filled in. Players you marked away start on the bench, and the planner leaves them out so the line-up is spread over the players who are actually there. A match whose kick-off has passed stays in the list, marked <em>past</em>, until you start or delete it."],
      ["Line-up plan", "With <strong>Line-up plan</strong> on, you set before kick-off who plays each period \u2014 2 halves, 4 quarters or 8 short periods. <strong>Spread evenly</strong> fills the grid so everyone gets nearly the same number of periods, and the column at the right of each name shows their share. The first period is on the pitch the moment you kick off, With 8 periods the names stay pinned on the left and the periods scroll sideways, so every box keeps its full size. At every break the app asks whether to apply the next line-up \u2014 it lists who comes on and who goes off, and changes nothing until you tap Apply. A player sent off with a red card stays off, whatever the plan says."],
      ["Half time and breaks", "Tap <strong>Half time</strong> \u2014 it reads <strong>Next quarter</strong> or <strong>Next period</strong> when you play quarters or eight periods, and <strong>Next period</strong> again in the second half \u2014 to pause the clock and start a new period. It stays in view at the bottom of the screen, next to the opponent button and Undo, however long the squad is. It does nothing until the clock has actually run in the current period, so a stray tap can't skip you through a match that hasn't been played. If the period ran past its length you're told by how much. Goals are stamped with the period they were scored in, and the match report groups them. Never tap it and nothing changes — reports stay a single list."],
      ["Cards", "Tap the small yellow or red square on a tile. A second yellow automatically becomes a red. A red card automatically benches the player for the rest of the match, and they can't be brought back on."],
      ["Fix a mistake", "<strong>Match log</strong> opens the list of everything logged so far \u2014 it lives behind a button rather than on the Match screen itself, so a long match never pushes the buttons out of reach. The number on the button is how many entries there are. Every entry has ✎ (edit) and ✕ (delete). Edit lets you change who scored, who assisted, or who received a card. <strong>Undo</strong> (↺, bottom left, next to the opponent button) removes the most recent entry without opening the log at all, and also takes a break back. Deleting from inside the log keeps it open, so you can correct two things in a row."],
      ["End the match", "Tap <strong>End match</strong>, just under the player tiles. You'll get a summary with a minute-by-minute report."],
      ["Share the match card", "<strong>Share match card</strong> turns the result into a picture \u2014 score, scorers and every goal's minute \u2014 ready for the team chat. Press and hold the picture to save or send it; on phones that allow it a <strong>Share picture</strong> button appears too. <strong>Share as text</strong> is still there if you'd rather paste the report."],
      ["History", "The <strong>History</strong> tab keeps every past match, season top scorers, and a button on each match for its <strong>Card</strong> or its written report."],
      ["Fix a finished match", "Spotted a mistake in the car? Tap <strong>Fix</strong> on a match in History to edit or delete any entry. The score, the scorers and the season totals are all recalculated."],
      ["Keep a backup", "Everything lives on this device only. <strong>Export team data</strong> with all three choices left on writes one file with the lot: your players, your settings, every match you have played, and every match you have <em>prepared</em> — their line-ups, period lengths and who couldn't make it. Clearing your browser data would otherwise take all of that with it, so keep the file somewhere safe. The app reminds you when matches have been played, or preparation has been done, since your last backup. <strong>Import team data</strong> puts it all back."],
      ["Share your team", "<strong>Export team data</strong> asks what to put in the file: <strong>Players &amp; settings</strong>, <strong>Matches played</strong>, <strong>Prepared matches</strong> \u2014 all three by default, which is your backup. Turn some off to share: just the squad for a new coach, or just the prepared matches to hand someone next week's line-up. A prepared match is only a list of players, so when you export those on their own the names and numbers travel with them; on the other coach's phone the app matches them to her own squad by name and number, and tells her plainly if someone is missing. Another parent or coach loads it with <strong>Import team data</strong> — no retyping the roster. Importing adds it as an extra team and never touches the teams already on the device, unless you choose to replace one with the same name."]
    ];

    var built = new Date(APP_BUILT);

    overlay.innerHTML =
      '<div class="sheet help-sheet">' +
        '<div class="help-header"><h2 class="section-title">How to use this app</h2><button class="icon-btn" id="helpCloseBtn" aria-label="Close">✕</button></div>' +
        '<div class="help-body">' + body +
          '<div class="app-version">Matchday Tracker · version ' + esc(APP_VERSION) +
            " · " + esc(builtStr) + "</div>" +
        "</div>" +
      "</div>";
    document.body.appendChild(overlay);
    function cleanup() { overlay.remove(); }
    document.getElementById("helpCloseBtn").onclick = cleanup;
    overlay.onclick = function (e) { if (e.target === overlay) cleanup(); };
  }

  function isOnField(match, playerId) {
    var pt = match.playingTime[playerId];
    return pt ? !!pt.onField : true;
  }

  function cardCounts(match, playerId) {
    var yellows = 0, reds = 0;
    match.events.forEach(function (e) {
      if (e.type === "card" && e.playerId === playerId) {
        if (e.cardType === "yellow") yellows++;
        else if (e.cardType === "red") reds++;
      }
    });
    return { yellows: yellows, reds: reds };
  }

  function hasRedCard(match, playerId) {
    return cardCounts(match, playerId).reds > 0;
  }

  function setOnField(match, playerId, onField) {
    if (!match.playingTime) return; // finished matches carry no pitch state
    if (!match.playingTime[playerId]) match.playingTime[playerId] = { onField: true, accumMs: 0, onSince: clockElapsedMs(match) };
    var pt = match.playingTime[playerId];
    if (pt.onField === onField) return;
    var nowMs = clockElapsedMs(match);
    if (pt.onField && !onField) {
      pt.accumMs += (nowMs - pt.onSince);
      pt.onField = false;
      pt.onSince = null;
    } else if (!pt.onField && onField) {
      pt.onField = true;
      pt.onSince = nowMs;
    }
  }

  // ---------- match lifecycle ----------

  function startNewMatch(opponentName, isHome, plan, unavailable, periodMinutes, periodFormat) {
    // Reuse the lineup from last time so the bench doesn't have to be rebuilt
    // before every match. Players added since then start on the pitch.
    var last = Array.isArray(T().lastLineup) ? T().lastLineup : null;
    var known = {};
    (T().roster || []).forEach(function (p) { known[p.id] = true; });
    var reusable = last && last.some(function (id) { return known[id]; });
    // Who was in the squad when the last match finished. Anyone who is not on
    // that list joined since, and a new player starts on the pitch, not on a
    // bench nobody has put them on. Without this a team that was set up with one
    // player and filled in afterwards started its next match with that single
    // player on the pitch and everyone else on the bench.
    var lastSquad = null;
    var newest = null;
    (T().history || []).forEach(function (h) {
      if (h && Array.isArray(h.rosterSnapshot) && (!newest || String(h.date || "") > String(newest.date || ""))) newest = h;
    });
    if (newest) {
      lastSquad = {};
      newest.rosterSnapshot.forEach(function (r) { if (r && r.id) lastSquad[r.id] = true; });
    }
    var usePlan = T().settings.planLineups ? planForRoster(normalisePlan(plan), T().roster) : null;
    var firstRow = usePlan ? planLineup(usePlan, 1) : null;
    if (firstRow && !firstRow.length) firstRow = null; // an empty first period means "no plan yet"
    var pt = {};
    var away = Array.isArray(unavailable) ? unavailable : [];
    T().roster.forEach(function (p) {
      var joinedSince = !!lastSquad && !lastSquad[p.id];
      var on = firstRow ? firstRow.indexOf(p.id) !== -1 : (reusable ? (last.indexOf(p.id) !== -1 || joinedSince) : true);
      if (away.indexOf(p.id) !== -1) on = false; // not at the pitch today
      pt[p.id] = { onField: on, accumMs: 0, onSince: on ? 0 : null };
    });
    T().activeMatch = {
      id: uid(),
      opponentName: opponentName || "Opponent",
      isHome: isHome !== false,
      startedAt: new Date().toISOString(),
      clock: { elapsedMs: 0, running: false, runningSince: null },
      period: 1,
      events: [],
      plan: usePlan,
      unavailable: away.slice(),
      periodMinutes: cleanPeriodMinutes(periodMinutes),
      periodFormat: PLAN_FORMATS.indexOf(periodFormat) !== -1 ? periodFormat : null,
      periodStartMs: 0,
      playingTime: pt
    };
    persist();
    render();
  }

  function endMatch() {
    var match = T().activeMatch;
    if (!match) return;
    var stats = computeStats(match);
    var minutes = playingTimeMinutes(match);
    var record = {
      id: match.id,
      date: match.startedAt,
      opponentName: match.opponentName,
      teamName: T().teamName,
      isHome: match.isHome !== false,
      rosterSnapshot: T().roster.map(function (p) {
        return { id: p.id, name: p.name, number: p.number };
      }),
      scoreUs: stats.scoreUs,
      scoreThem: stats.scoreThem,
      ownGoalsFor: stats.ownGoalsFor,
      ownGoalsAgainst: stats.ownGoalsAgainst,
      scorers: stats.scorers,
      assists: stats.assists,
      cards: stats.cards,
      playingTimeMinutes: minutes,
      durationMinutes: currentMinute(match),
      events: match.events
    };
    if (Array.isArray(match.startingLineup) && match.startingLineup.length) {
      T().lastLineup = match.startingLineup;
    }
    if (match.plan) T().lastPlan = normalisePlan(match.plan);
    if (match.periodMinutes) T().lastPeriodMinutes = match.periodMinutes;
    T().history.unshift(record);
    T().activeMatch = null;
    persist();
    view = "summary";
    render();
  }

  function toggleClock() {
    var match = T().activeMatch;
    if (!match) return;
    if (match.clock.running) {
      match.clock.elapsedMs = clockElapsedMs(match);
      match.clock.running = false;
      match.clock.runningSince = null;
    } else {
      // The first time the clock runs is when the coach has finished setting
      // the bench, so that is the lineup worth remembering.
      if (!match.lineupCaptured) {
        match.lineupCaptured = true;
        match.startingLineup = Object.keys(match.playingTime).filter(function (pid) {
          return match.playingTime[pid].onField;
        });
      }
      match.clock.running = true;
      match.clock.runningSince = Date.now();
    }
    persist();
    render();
  }

  var lastEventTapAt = {};
  var lastIgnoredTapAt = 0;   // when the guard last swallowed a tap (read by the tap feedback)

  function guardDoubleTap(key) {
    var now = Date.now();
    if (lastEventTapAt[key] && (now - lastEventTapAt[key]) < 800) { lastIgnoredTapAt = now; return false; }
    lastEventTapAt[key] = now;
    return true;
  }

  function requireClockRunning(match) {
    if (!match.clock.running) {
      showToast("Start the clock first — tap the timer at the top.", "warning");
      return false;
    }
    return true;
  }

  function logGoal(playerId) {
    var match = T().activeMatch;
    if (!match) return;
    if (!isOnField(match, playerId)) {
      var benched = rosterById(playerId);
      showToast((benched ? benched.name : "This player") + " is on the bench — bring them on first.", "warning");
      return;
    }
    if (!requireClockRunning(match)) return;
    if (!guardDoubleTap("goal:" + playerId)) return;
    var ev = { id: uid(), type: "goal", playerId: playerId, assistId: null, minuteAtEvent: currentMinute(match), period: match.period || 1, ts: Date.now() };
    match.events.push(ev);
    persist();
    if (T().settings.trackAssists) {
      pendingAssistEventId = ev.id;
      clearTimeout(assistBarTimer);
      assistBarTimer = setTimeout(function () { pendingAssistEventId = null; render(); }, 6000);
    }
    render();
    var tile = document.querySelector('[data-tile="' + playerId + '"]');
    if (tile) {
      tile.classList.add("just-scored");
      setTimeout(function () { tile.classList.remove("just-scored"); }, 500);
    }
  }

  function setAssist(assistPlayerId) {
    var match = T().activeMatch;
    if (!match || !pendingAssistEventId) return;
    var ev = null;
    for (var i = 0; i < match.events.length; i++) {
      if (match.events[i].id === pendingAssistEventId) { ev = match.events[i]; break; }
    }
    if (ev) ev.assistId = assistPlayerId;
    pendingAssistEventId = null;
    clearTimeout(assistBarTimer);
    persist();
    render();
  }

  function logOpponentGoal() {
    var match = T().activeMatch;
    if (!match) return;
    if (!requireClockRunning(match)) return;
    if (!guardDoubleTap("opponent-goal")) return;
    match.events.push({ id: uid(), type: "opponent_goal", playerId: null, minuteAtEvent: currentMinute(match), period: match.period || 1, ts: Date.now() });
    persist();
    render();
  }

  // by: "us"   = our team put it in our own net  -> the point goes to the opponent
  // by: "them" = they put it in their own net    -> the point goes to us
  function logOwnGoal(by) {
    var match = T().activeMatch;
    if (!match) return;
    if (!requireClockRunning(match)) return;
    if (!guardDoubleTap("own-goal:" + by)) return;
    match.events.push({ id: uid(), type: "own_goal", by: by, playerId: null, minuteAtEvent: currentMinute(match), period: match.period || 1, ts: Date.now() });
    persist();
    render();
    showToast(
      by === "us"
        ? "Own goal — point to " + match.opponentName + "."
        : "Own goal by " + match.opponentName + " — point to " + T().teamName + ".",
      "warning"
    );
  }

  function showOwnGoalPicker() {
    var match = T().activeMatch;
    if (!match) return;
    if (!requireClockRunning(match)) return;
    var old = document.getElementById("ownGoalOverlay");
    if (old) old.remove();
    var overlay = document.createElement("div");
    overlay.className = "overlay";
    overlay.id = "ownGoalOverlay";
    overlay.innerHTML =
      '<div class="sheet">' +
        '<div class="confirm-msg"><strong>Own goal</strong><br>Which team put it in their own net?</div>' +
        '<div class="btn-row" style="margin-top:16px;">' +
          '<button class="btn btn-primary" id="ogUsBtn">' + esc(T().teamName) + "</button>" +
          '<button class="btn btn-primary" id="ogThemBtn">' + esc(match.opponentName) + "</button>" +
        "</div>" +
        '<button class="btn btn-ghost" id="ogCancelBtn" style="margin-top:10px;">Cancel</button>' +
      "</div>";
    document.body.appendChild(overlay);
    function cleanup() { overlay.remove(); }
    overlay.onclick = function (e) { if (e.target === overlay) cleanup(); };
    document.getElementById("ogCancelBtn").onclick = cleanup;
    document.getElementById("ogUsBtn").onclick = function () { cleanup(); logOwnGoal("us"); };
    document.getElementById("ogThemBtn").onclick = function () { cleanup(); logOwnGoal("them"); };
  }

  function toggleCard(playerId, cardType) {
    var match = T().activeMatch;
    if (!match) return;
    var player = rosterById(playerId);
    if (hasRedCard(match, playerId)) {
      showToast((player ? player.name : "This player") + " is already sent off.", "warning");
      return;
    }
    if (!requireClockRunning(match)) return;
    if (!guardDoubleTap("card:" + playerId + ":" + cardType)) return;
    match.events.push({ id: uid(), type: "card", playerId: playerId, cardType: cardType, minuteAtEvent: currentMinute(match), period: match.period || 1, ts: Date.now() });

    // One place decides what a card implies (auto-red, benching), so logging,
    // editing and undoing can never drift apart.
    reconcileCardConsequences(match, [playerId]);
    if (hasRedCard(match, playerId)) {
      showToast((player ? player.name : "Player") + " is sent off" +
        (cardType === "yellow" ? " — second yellow" : "") + ".", "warning");
    }
    persist();
    render();
  }

  function toggleField(playerId) {
    var match = T().activeMatch;
    if (!match) return;
    if (hasRedCard(match, playerId)) {
      var player = rosterById(playerId);
      showToast((player ? player.name : "This player") + " is sent off and can't return to the pitch.", "warning");
      return;
    }
    setOnField(match, playerId, !isOnField(match, playerId));
    persist();
    render();
  }

  // Minutes are refreshed in place every second; re-rendering the whole grid
  // would fight with taps and rebuild the DOM under the coach's finger.
  function updateLiveMinutes() {
    var match = T().activeMatch;
    var nodes = document.querySelectorAll("[data-mins]");
    if (!match || !nodes.length) return;
    var mins = playingTimeMinutes(match);
    // The gold outline exists to tell the coach who to bring on next, so it may
    // only ever land on someone who CAN come on. A player who isn't at the
    // pitch today, or who has been sent off, sits on nought minutes forever and
    // would otherwise hold the marker for the whole match.
    var eligible = T().roster.filter(function (p) {
      var pt = match.playingTime && match.playingTime[p.id];
      return !isAbsent(match, p.id) && !(pt && pt.sentOff);
    });
    var lowest = Infinity;
    eligible.forEach(function (p) {
      var m = mins[p.id] || 0;
      if (m < lowest) lowest = m;
    });
    var canBeLeast = {};
    eligible.forEach(function (p) { canBeLeast[p.id] = true; });
    // Before the match has really got going everyone is level, so flagging the
    // "least played" player would just be noise.
    var meaningful = clockElapsedMs(match) >= 5 * 60000 && eligible.length > 1;
    nodes.forEach(function (el) {
      var pid = el.getAttribute("data-mins");
      var m = mins[pid] || 0;
      el.textContent = m + " min";
      var tile = document.querySelector('.tile[data-tile="' + pid + '"]');
      // The !! matters: classList.toggle ignores an undefined second argument
      // and flips the class instead of setting it, which made every tile blink
      // gold once an ineligible player was in the lookup.
      if (tile) tile.classList.toggle("least-played", !!(meaningful && canBeLeast[pid] && m === lowest));
    });
  }

  function startNextPeriod() {
    var match = T().activeMatch;
    if (!match) return;
    // Same rule as scoring: nothing happens on a clock that never ran. Without
    // this you can tap your way to period 6 on a match still showing 00:00,
    // and every tap eats a period out of the line-up plan.
    if (!periodHasRun(match)) {
      showToast("The clock hasn\u2019t run this period yet — start it first.", "warning");
      return;
    }
    if (match.plan && match.plan.periods && (match.period || 1) >= match.plan.periods) {
      showConfirm("That was the last of the " + match.plan.periods +
        " planned periods. Start another one?", "Start another", function () {
          advancePeriod(match);
        }, false);
      return;
    }
    advancePeriod(match);
  }

  function advancePeriod(match) {
    if (match.clock.running) {
      match.clock.elapsedMs = clockElapsedMs(match);
      match.clock.running = false;
      match.clock.runningSince = null;
    }
    var over = periodOverrunMs(match);
    // Remembered so that Undo, pressed before anything else is logged, takes
    // the break back. Without it Undo reached past the break and deleted the
    // last real goal, and the wrong period could never be left.
    match.lastAdvance = {
      fromPeriod: match.period || 1,
      periodStartMs: typeof match.periodStartMs === "number" ? match.periodStartMs : null,
      eventsLen: match.events.length
    };
    match.period = (match.period || 1) + 1;
    match.periodStartMs = clockElapsedMs(match);
    persist();
    render();
    var overNote = over > 1000 ? "That period ran " + formatClock(over) + " over. " : "";
    if (T().settings.planLineups && match.plan && proposePlanAtBreak(match, overNote)) return;
    showToast(overNote + "Break — period " + match.period +
      " starts when you start the clock.", "warning");
  }

  function describeEvent(ev) {
    if (ev.type === "goal") {
      var p = rosterById(ev.playerId);
      return "goal by " + (p ? p.name : "player");
    }
    if (ev.type === "opponent_goal") return "opponent goal";
    if (ev.type === "own_goal") {
      var match = editTarget();
      var oppName = match && match.opponentName ? match.opponentName : "the opponent";
      return "own goal by " + (ev.by === "us" ? T().teamName : oppName);
    }
    if (ev.type === "card") {
      var c = rosterById(ev.playerId);
      return (ev.cardType === "red" ? "red card" : "yellow card") + (c ? " — " + c.name : "");
    }
    return "last action";
  }

  function breakIsLast(match) {
    var adv = match && match.lastAdvance;
    return !!(adv && match.events.length === adv.eventsLen);
  }

  function undoLast() {
    var match = T().activeMatch;
    if (!match) return;
    if (breakIsLast(match)) {
      var adv = match.lastAdvance;
      match.period = adv.fromPeriod;
      if (typeof adv.periodStartMs === "number") match.periodStartMs = adv.periodStartMs;
      else delete match.periodStartMs;
      delete match.lastAdvance;
      pendingAssistEventId = null;
      lastEventTapAt = {};
      persist();
      render();
      // The clock is only paused if nothing restarted it since the break; when
      // it is already running, telling the coach to start it would be wrong.
      showToast("Break undone \u2014 back to " + periodTag(match) + "." +
        (match.clock && match.clock.running ? "" : " Start the clock to carry on."));
      return;
    }
    if (match.events.length === 0) return;
    var removed = match.events.pop();
    // An auto-red is a consequence, not an action: also remove the yellow that triggered it.
    if (removed.type === "card" && removed.cardType === "red" && removed.auto) {
      for (var i = match.events.length - 1; i >= 0; i--) {
        var e = match.events[i];
        if (e.type === "card" && e.playerId === removed.playerId && e.cardType === "yellow") {
          match.events.splice(i, 1);
          break;
        }
      }
    }
    pendingAssistEventId = null;
    lastEventTapAt = {};
    reconcileCardConsequences(match, [removed.playerId]);
    persist();
    render();
    showToast("Removed: " + describeEvent(removed));
  }

  function deleteEvent(eventId) {
    var match = editTarget();
    if (!match) return;
    var idx = -1;
    for (var i = 0; i < match.events.length; i++) {
      if (match.events[i].id === eventId) { idx = i; break; }
    }
    if (idx === -1) return;
    // An automatic red follows from two yellows; removing it on its own just
    // brings it straight back while the toast said "Removed".
    if (autoRedRefused(match.events[idx])) return;
    var removed = match.events.splice(idx, 1)[0];
    if (pendingAssistEventId === eventId) pendingAssistEventId = null;
    lastEventTapAt = {};
    reconcileCardConsequences(match, [removed.playerId]);
    afterEdit(match);
    showToast("Removed: " + describeEvent(removed));
  }

  function autoRedRefused(ev) {
    if (!(ev && ev.type === "card" && ev.cardType === "red" && ev.auto)) return false;
    showToast("This red card comes from two yellows \u2014 change or remove one of the yellows instead.", "warning");
    return true;
  }

  function reconcileCardConsequences(match, playerIds) {
    var seen = {};
    playerIds.forEach(function (pid) {
      if (!pid || seen[pid]) return;
      seen[pid] = true;
      var counts = cardCounts(match, pid);
      if (counts.yellows >= 2 && counts.reds === 0) {
        var yellows = match.events.filter(function (e) {
          return e.type === "card" && e.playerId === pid && e.cardType === "yellow";
        });
        var trigger = yellows[yellows.length - 1] || {};
        match.events.push({ id: uid(), type: "card", playerId: pid, cardType: "red", auto: true,
          minuteAtEvent: trigger.minuteAtEvent != null ? trigger.minuteAtEvent : currentMinute(match),
          period: trigger.period || match.period || 1, ts: Date.now() });
        counts = cardCounts(match, pid);
      } else if (counts.yellows < 2 && counts.reds > 0) {
        // Drop auto-reds that no longer have two yellows behind them (manual reds are left alone).
        for (var i = match.events.length - 1; i >= 0; i--) {
          var e = match.events[i];
          if (e.type === "card" && e.playerId === pid && e.cardType === "red" && e.auto) {
            match.events.splice(i, 1);
          }
        }
        counts = cardCounts(match, pid);
      }
      // Benching is a consequence of the red card, so undoing the card has to
      // undo the benching too — but only when the card put them there, never a
      // substitution the coach made by hand.
      var pt = match.playingTime && match.playingTime[pid];
      if (counts.reds > 0) {
        // Remember where they were before the card, once. A player can already
        // be on the bench when the red comes, and undoing the card should put
        // them back on the bench, not hand them a substitution they never got.
        if (pt && !pt.sentOff) pt.wasOnFieldBeforeSendOff = !!pt.onField;
        setOnField(match, pid, false);
        if (pt) pt.sentOff = true;
      } else if (pt && pt.sentOff) {
        pt.sentOff = false;
        // Matches that were already in progress before this was tracked have no
        // note, and for those the old behaviour — back onto the pitch — stands.
        setOnField(match, pid, pt.wasOnFieldBeforeSendOff !== false);
        delete pt.wasOnFieldBeforeSendOff;
      }
    });
  }

  // null = the match being played; otherwise the id of a match in history.
  var editMatchId = null;
  var matchEditRedraw = null;

  function editTarget() {
    if (!editMatchId) return T().activeMatch;
    return T().history.filter(function (m) { return m.id === editMatchId; })[0] || null;
  }

  // A finished match stores its totals alongside its events, so after an edit
  // they have to be derived again or the score and the log disagree.
  function recomputeRecord(rec) {
    var stats = computeStats(rec);
    rec.scoreUs = stats.scoreUs;
    rec.scoreThem = stats.scoreThem;
    rec.scorers = stats.scorers;
    rec.assists = stats.assists;
    rec.cards = stats.cards;
    rec.ownGoalsFor = stats.ownGoalsFor;
    rec.ownGoalsAgainst = stats.ownGoalsAgainst;
  }

  // A finished match keeps its own copy of the squad, so names survive later
  // changes. A player picked during an edit who wasn't in that copy — someone
  // added since — has to go into it, or removing them later turns their goal
  // into "Unknown".
  function keepNamesInRecord(rec) {
    rec.rosterSnapshot = rec.rosterSnapshot || [];
    var have = {};
    rec.rosterSnapshot.forEach(function (p) { have[p.id] = true; });
    (rec.events || []).forEach(function (e) {
      [e.playerId, e.assistId].forEach(function (pid) {
        if (!pid || have[pid]) return;
        var p = rosterById(pid);
        if (!p) return;
        rec.rosterSnapshot.push({ id: p.id, name: p.name, number: p.number });
        have[pid] = true;
      });
    });
  }

  function afterEdit(container) {
    if (editMatchId && container) {
      keepNamesInRecord(container);
      recomputeRecord(container);
    }
    persist();
    render();
    if (matchEditRedraw) matchEditRedraw();
  }

  function findEvent(match, eventId) {
    for (var i = 0; i < match.events.length; i++) {
      if (match.events[i].id === eventId) return match.events[i];
    }
    return null;
  }

  function applyGoalEdit(eventId, newPlayerId, newAssistId) {
    var match = editTarget();
    if (!match) return;
    var ev = findEvent(match, eventId);
    if (!ev) return;
    ev.playerId = newPlayerId;
    ev.assistId = newAssistId || null;
    afterEdit(match);
    showToast("Updated: " + describeEvent(ev));
  }

  function applyCardEdit(eventId, newPlayerId, newCardType) {
    var match = editTarget();
    if (!match) return;
    var ev = findEvent(match, eventId);
    if (!ev) return;
    var oldPlayerId = ev.playerId;
    ev.playerId = newPlayerId;
    ev.cardType = newCardType;
    reconcileCardConsequences(match, [oldPlayerId, newPlayerId]);
    afterEdit(match);
    showToast("Updated: " + describeEvent(ev));
  }

  function applyOwnGoalEdit(eventId, newBy) {
    var match = editTarget();
    if (!match) return;
    var ev = findEvent(match, eventId);
    if (!ev) return;
    ev.by = newBy;
    afterEdit(match);
    showToast("Updated: " + describeEvent(ev));
  }

  function showEditMatch(matchId) {
    editMatchId = matchId;
    var old = document.getElementById("matchEditOverlay");
    if (old) old.remove();
    var overlay = document.createElement("div");
    overlay.className = "overlay";
    overlay.id = "matchEditOverlay";
    document.body.appendChild(overlay);

    function close() {
      overlay.remove();
      editMatchId = null;
      matchEditRedraw = null;
      render();
    }

    function draw() {
      var rec = editTarget();
      if (!rec) { close(); return; }
      var rows = rec.events.map(function (ev) {
        var desc = "";
        if (ev.type === "goal") {
          desc = "⚽ " + esc(nameInRecord(rec, ev.playerId));
          if (ev.assistId) desc += " (assist: " + esc(nameInRecord(rec, ev.assistId)) + ")";
        } else if (ev.type === "opponent_goal") {
          desc = "⚽ " + esc(rec.opponentName);
        } else if (ev.type === "own_goal") {
          desc = "⚽ " + esc(ev.by === "us" ? rec.opponentName : rec.teamName) + " (own goal)";
        } else if (ev.type === "card") {
          desc = (ev.cardType === "red" ? "🟥 " : "🟨 ") + esc(nameInRecord(rec, ev.playerId));
        }
        var editable = ev.type === "goal" || ev.type === "card" || ev.type === "own_goal";
        return '<div class="event-row"><span class="event-minute">' + (ev.minuteAtEvent || 0) +
          "'</span><span class=\"event-desc\">" + desc + '</span><div class="event-actions">' +
          (editable ? '<button class="event-edit" data-edit-event="' + ev.id + '" aria-label="Edit">✎</button>' : "") +
          '<button class="event-delete" data-del-event="' + ev.id + '" aria-label="Delete">✕</button>' +
          "</div></div>";
      }).join("");

      overlay.innerHTML =
        '<div class="sheet help-sheet">' +
          '<div class="help-header"><h2 class="section-title">Correct this match</h2>' +
            '<button class="icon-btn" id="matchEditCloseBtn" aria-label="Close">✕</button></div>' +
          '<div class="help-body">' +
            '<div class="summary-score" style="padding-top:0;">' +
              '<div class="ss-num">' + rec.scoreUs + " – " + rec.scoreThem + "</div>" +
              '<div class="ss-teams">' + esc(rec.teamName) + " vs " + esc(rec.opponentName) + "</div>" +
            "</div>" +
            '<p class="hint">The score and season totals update as you change entries.</p>' +
            '<div class="event-log">' +
              (rows || '<div class="empty-state">Nothing was logged in this match.</div>') +
            "</div>" +
          "</div>" +
        "</div>";

      document.getElementById("matchEditCloseBtn").onclick = close;
      overlay.querySelectorAll("[data-edit-event]").forEach(function (btn) {
        btn.onclick = function () { showEditEvent(btn.getAttribute("data-edit-event")); };
      });
      overlay.querySelectorAll("[data-del-event]").forEach(function (btn) {
        btn.onclick = function () {
          var id = btn.getAttribute("data-del-event");
          showConfirm("Delete this entry from the match?", "Delete", function () { deleteEvent(id); }, true);
        };
      });
    }

    matchEditRedraw = draw;
    overlay.onclick = function (e) { if (e.target === overlay) close(); };
    draw();
  }

  function showEditEvent(eventId) {
    var match = editTarget();
    if (!match) return;
    var ev = findEvent(match, eventId);
    if (!ev || (ev.type !== "goal" && ev.type !== "card" && ev.type !== "own_goal")) return;
    if (autoRedRefused(ev)) return;

    var old = document.getElementById("editOverlay");
    if (old) old.remove();
    var overlay = document.createElement("div");
    overlay.className = "overlay";
    overlay.id = "editOverlay";
    document.body.appendChild(overlay);
    function close() { overlay.remove(); }
    overlay.onclick = function (e) { if (e.target === overlay) close(); };

    if (ev.type === "own_goal") {
      var selBy = ev.by === "us" ? "us" : "them";
      var drawOwn = function () {
        overlay.innerHTML =
          '<div class="sheet">' +
            '<div class="confirm-msg"><strong>Edit own goal</strong><br>Which team put it in their own net?</div>' +
            '<div class="btn-row" style="margin-top:14px;">' +
              '<button class="btn toggle-seg' + (selBy === "us" ? " on" : "") + '" id="ogEditUsBtn">' + esc(T().teamName) + "</button>" +
              '<button class="btn toggle-seg' + (selBy === "them" ? " on" : "") + '" id="ogEditThemBtn">' + esc(match.opponentName) + "</button>" +
            "</div>" +
            '<div class="btn-row" style="margin-top:16px;">' +
              '<button class="btn btn-ghost" id="editCancelBtn">Cancel</button>' +
              '<button class="btn btn-primary" id="editSaveBtn">Save</button>' +
            "</div>" +
          "</div>";
        document.getElementById("ogEditUsBtn").onclick = function () { selBy = "us"; drawOwn(); };
        document.getElementById("ogEditThemBtn").onclick = function () { selBy = "them"; drawOwn(); };
        document.getElementById("editCancelBtn").onclick = close;
        document.getElementById("editSaveBtn").onclick = function () {
          close();
          applyOwnGoalEdit(eventId, selBy);
        };
      };
      drawOwn();
    } else if (ev.type === "goal") {
      var selScorer = ev.playerId;
      var selAssist = ev.assistId || null;
      var draw = function () {
        var scorerChips = sortedRoster().map(function (p) {
          return '<button class="assist-chip' + (p.id === selScorer ? " chip-selected" : "") + '" data-pick-scorer="' + p.id + '">' + esc(p.name) + "</button>";
        }).join("");
        var assistSection = "";
        if (T().settings.trackAssists) {
          var assistChips =
            sortedRoster().filter(function (p) { return p.id !== selScorer; }).map(function (p) {
              return '<button class="assist-chip' + (p.id === selAssist ? " chip-selected" : "") + '" data-pick-assist="' + p.id + '">' + esc(p.name) + "</button>";
            }).join("") +
            '<button class="assist-chip' + (!selAssist ? " chip-selected" : "") + '" data-pick-assist="none">No assist</button>';
          assistSection = '<label class="field-label" style="margin-top:14px;">Assist</label><div class="assist-chip-row">' + assistChips + "</div>";
        }
        overlay.innerHTML =
          '<div class="sheet">' +
            '<div class="confirm-msg"><strong>Edit goal</strong></div>' +
            '<label class="field-label" style="margin-top:10px;">Scorer</label>' +
            '<div class="assist-chip-row">' + scorerChips + "</div>" +
            assistSection +
            '<div class="btn-row" style="margin-top:16px;">' +
              '<button class="btn btn-ghost" id="editCancelBtn">Cancel</button>' +
              '<button class="btn btn-primary" id="editSaveBtn">Save</button>' +
            "</div>" +
          "</div>";
        overlay.querySelectorAll("[data-pick-scorer]").forEach(function (btn) {
          btn.onclick = function () {
            selScorer = btn.getAttribute("data-pick-scorer");
            if (selAssist === selScorer) selAssist = null;
            draw();
          };
        });
        overlay.querySelectorAll("[data-pick-assist]").forEach(function (btn) {
          btn.onclick = function () {
            var v = btn.getAttribute("data-pick-assist");
            selAssist = v === "none" ? null : v;
            draw();
          };
        });
        document.getElementById("editCancelBtn").onclick = close;
        document.getElementById("editSaveBtn").onclick = function () {
          close();
          applyGoalEdit(eventId, selScorer, selAssist);
        };
      };
      draw();
    } else {
      var selPlayer = ev.playerId;
      var selType = ev.cardType;
      var drawCard = function () {
        var playerChips = sortedRoster().map(function (p) {
          return '<button class="assist-chip' + (p.id === selPlayer ? " chip-selected" : "") + '" data-pick-player="' + p.id + '">' + esc(p.name) + "</button>";
        }).join("");
        overlay.innerHTML =
          '<div class="sheet">' +
            '<div class="confirm-msg"><strong>Edit card</strong></div>' +
            '<label class="field-label" style="margin-top:10px;">Player</label>' +
            '<div class="assist-chip-row">' + playerChips + "</div>" +
            '<label class="field-label" style="margin-top:14px;">Card</label>' +
            '<div class="btn-row" style="margin-bottom:4px;">' +
              '<button class="btn toggle-seg' + (selType === "yellow" ? " on" : "") + '" id="pickYellowBtn">Yellow</button>' +
              '<button class="btn toggle-seg' + (selType === "red" ? " on" : "") + '" id="pickRedBtn">Red</button>' +
            "</div>" +
            '<div class="btn-row" style="margin-top:16px;">' +
              '<button class="btn btn-ghost" id="editCancelBtn">Cancel</button>' +
              '<button class="btn btn-primary" id="editSaveBtn">Save</button>' +
            "</div>" +
          "</div>";
        overlay.querySelectorAll("[data-pick-player]").forEach(function (btn) {
          btn.onclick = function () { selPlayer = btn.getAttribute("data-pick-player"); drawCard(); };
        });
        document.getElementById("pickYellowBtn").onclick = function () { selType = "yellow"; drawCard(); };
        document.getElementById("pickRedBtn").onclick = function () { selType = "red"; drawCard(); };
        document.getElementById("editCancelBtn").onclick = close;
        document.getElementById("editSaveBtn").onclick = function () {
          close();
          applyCardEdit(eventId, selPlayer, selType);
        };
      };
      drawCard();
    }
  }

  // ---------- roster ----------

  function addPlayer(name, number) {
    name = (name || "").trim();
    number = (number || "").trim();
    if (!name) {
      showToast("Enter a name first.", "warning");
      var nameEl = document.getElementById("newName");
      if (nameEl) nameEl.focus();
      return;
    }
    var clash = number && T().roster.filter(function (p) { return p.number === number; })[0];
    var player = { id: uid(), name: name, number: number };
    T().roster.push(player);
    // A latecomer added mid-match needs a playing-time record straight away.
    // Without one isOnField() falls back to "on the pitch", so they would show
    // as playing, be tappable for goals, and still build up no minutes. They
    // start on the bench, because they were not in the line-up that kicked off.
    var live = T().activeMatch;
    if (live) {
      live.playingTime = live.playingTime || {};
      live.playingTime[player.id] = { onField: false, accumMs: 0, onSince: null };
    }
    persist();
    render();
    if (clash) showToast("Heads up: number " + number + " is also " + clash.name + ".", "warning");
    else if (live) showToast(name + " is on the bench — tap Bench to bring them on.");
  }

  function removePlayer(id) {
    // Goals and cards already logged point at this player. Removing them now
    // would leave the match referring to somebody who no longer exists, and the
    // summary would credit the goal to "Unknown". Benching is the right move
    // mid-match; removing can wait until the final whistle.
    if (T().activeMatch) {
      showToast("Not while a match is on. Put them on the bench instead, and remove them after the match.", "warning");
      return;
    }
    T().roster = T().roster.filter(function (p) { return p.id !== id; });
    persist();
    render();
  }

  // ---------- export / import ----------

  function slug(str) {
    return (str || "team").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/(^-|-$)/g, "") || "team";
  }

  // Readable season totals bundled into the export. Derived from history, so it
  // is ignored on import — history stays the single source of truth.
  function buildSeasonStats() {
    var players = {};
    var order = [];
    var team = { matchesPlayed: 0, won: 0, drawn: 0, lost: 0, goalsFor: 0, goalsAgainst: 0, ownGoalsFor: 0, ownGoalsAgainst: 0 };

    function entry(pid, record) {
      if (!players[pid]) {
        players[pid] = {
          id: pid, name: nameInRecord(record, pid), number: "",
          matchesPlayed: 0, goals: 0, assists: 0, minutes: 0, yellowCards: 0, redCards: 0
        };
        order.push(pid);
      }
      return players[pid];
    }

    T().history.forEach(function (m) {
      team.matchesPlayed++;
      if (m.scoreUs > m.scoreThem) team.won++;
      else if (m.scoreUs < m.scoreThem) team.lost++;
      else team.drawn++;
      team.goalsFor += m.scoreUs || 0;
      team.goalsAgainst += m.scoreThem || 0;
      team.ownGoalsFor += m.ownGoalsFor || 0;
      team.ownGoalsAgainst += m.ownGoalsAgainst || 0;

      var appeared = {};
      function sawPlayer(pid) {
        if (appeared[pid]) return;
        appeared[pid] = true;
        entry(pid, m).matchesPlayed++;
      }
      (m.rosterSnapshot || []).forEach(function (p) { sawPlayer(p.id); });

      Object.keys(m.scorers || {}).forEach(function (pid) {
        sawPlayer(pid);
        entry(pid, m).goals += m.scorers[pid];
      });
      Object.keys(m.assists || {}).forEach(function (pid) {
        sawPlayer(pid);
        entry(pid, m).assists += m.assists[pid];
      });
      Object.keys(m.playingTimeMinutes || {}).forEach(function (pid) {
        sawPlayer(pid);
        entry(pid, m).minutes += m.playingTimeMinutes[pid];
      });
      Object.keys(m.cards || {}).forEach(function (pid) {
        sawPlayer(pid);
        var e = entry(pid, m);
        (m.cards[pid] || []).forEach(function (c) {
          if (c === "red") e.redCards++; else e.yellowCards++;
        });
      });
    });

    // Prefer current shirt numbers and names where the player is still on the roster.
    T().roster.forEach(function (p) {
      if (players[p.id]) {
        players[p.id].name = p.name;
        players[p.id].number = p.number || "";
      }
    });

    var rows = order.map(function (pid) { return players[pid]; })
      .sort(function (a, b) { return b.goals - a.goals || a.name.localeCompare(b.name); });

    return { note: "Derived from history for easy reading; ignored on import.", team: team, players: rows };
  }

  // Per-match breakdown with player names and goal counts, so each match in the
  // export is readable on its own instead of only as player IDs in history.
  function buildMatchStats() {
    function playerRows(scorers, assists, minutes, cards, nameOf) {
      var ids = {};
      [scorers, assists, minutes, cards].forEach(function (src) {
        Object.keys(src || {}).forEach(function (pid) { ids[pid] = true; });
      });
      return Object.keys(ids).map(function (pid) {
        var c = (cards || {})[pid] || [];
        return {
          id: pid,
          name: nameOf(pid),
          goals: (scorers || {})[pid] || 0,
          assists: (assists || {})[pid] || 0,
          minutes: (minutes || {})[pid] || 0,
          yellowCards: c.filter(function (x) { return x !== "red"; }).length,
          redCards: c.filter(function (x) { return x === "red"; }).length
        };
      }).filter(function (r) {
        return r.goals || r.assists || r.minutes || r.yellowCards || r.redCards;
      }).sort(function (a, b) { return b.goals - a.goals || a.name.localeCompare(b.name); });
    }

    var rows = T().history.map(function (m) {
      return {
        date: m.date,
        opponent: m.opponentName,
        homeOrAway: m.isHome !== false ? "Home" : "Away",
        scoreUs: m.scoreUs, scoreThem: m.scoreThem,
        ownGoalsFor: m.ownGoalsFor || 0,
        ownGoalsAgainst: m.ownGoalsAgainst || 0,
        players: playerRows(m.scorers, m.assists, m.playingTimeMinutes, m.cards,
          function (pid) { return nameInRecord(m, pid); })
      };
    });

    // A match still being played is included too, flagged, so you can export
    // mid-match without ending it first.
    var live = T().activeMatch;
    if (live) {
      var s = computeStats(live);
      rows.unshift({
        inProgress: true,
        date: live.startedAt,
        opponent: live.opponentName,
        homeOrAway: live.isHome !== false ? "Home" : "Away",
        scoreUs: s.scoreUs, scoreThem: s.scoreThem,
        ownGoalsFor: s.ownGoalsFor, ownGoalsAgainst: s.ownGoalsAgainst,
        players: playerRows(s.scorers, s.assists, playingTimeMinutes(live), s.cards,
          function (pid) { var p = rosterById(pid); return p ? p.name : "Unknown"; })
      });
    }
    return rows;
  }

  // What an export can contain. Everything is on by default, so the obvious
  // action is still a complete backup; turning parts off is for sharing.
  function defaultExportParts() {
    return { players: true, history: true, prep: true };
  }

  function buildExportPayload(parts) {
    var payload = {
      exportedFrom: "Matchday Tracker",
      exportedAt: new Date().toISOString(),
      teamName: T().teamName,
      exportParts: { players: !!parts.players, history: !!parts.history, prep: !!parts.prep }
    };
    if (parts.players) {
      payload.roster = T().roster;
      payload.settings = T().settings;
      payload.lastPlan = T().lastPlan;
      payload.lastPeriodMinutes = T().lastPeriodMinutes;
      // The bench the coach set last time. Without it a restored team looks
      // complete but quietly starts the next match with everyone on the pitch,
      // which is exactly what "the lineup is reused next match" promises not to
      // do. It travels with the players, so the ids still mean something.
      payload.lastLineup = T().lastLineup;
    }
    if (parts.history) {
      payload.history = T().history;
      payload.seasonStats = buildSeasonStats();
      payload.matchStats = buildMatchStats();
      // A match in progress is the one thing a coach cannot afford to lose, so
      // it travels too. Its clock is frozen at the moment of export: restoring
      // it hours later must not pretend the ball kept rolling in between.
      if (T().activeMatch) {
        payload.activeMatch = Object.assign({}, T().activeMatch, {
          clock: { running: false, elapsedMs: clockElapsedMs(T().activeMatch), runningSince: null }
        });
      }
    }
    if (parts.prep) {
      payload.upcoming = T().upcoming;
      // A prepared match is only a list of player ids, which are made up on the
      // device that typed the roster. Without these, a prep-only file lands on
      // another coach's phone referring to nobody, so the names travel with it
      // and the import can match on name and number instead.
    }
    // Whenever the squad itself is left out, the names still travel, so a file
    // holding matches or prepared matches can be read back instead of being a
    // list of ids referring to nobody. Without this, a history-only export was
    // rejected by this very app with "that file doesn't look like an export".
    if (!parts.players && (parts.prep || parts.history)) {
      payload.playerRefs = (T().roster || []).map(function (pl) {
        return { id: pl.id, name: pl.name, number: pl.number };
      });
    }
    return payload;
  }

  function exportFileName(parts) {
    var base = slug(T().teamName);
    if (parts.players && parts.history && parts.prep) return base + "-backup.json";
    if (parts.prep && !parts.players && !parts.history) return base + "-prepared-matches.json";
    if (parts.players && !parts.history && !parts.prep) return base + "-team.json";
    // Every remaining combination gets its own name, so two different partial
    // files can't quietly overwrite each other in a downloads folder.
    var bits = [];
    if (parts.players) bits.push("team");
    if (parts.history) bits.push("matches");
    if (parts.prep) bits.push("prepared");
    return base + "-" + (bits.join("-") || "export") + ".json";
  }

  function showExportSheet() {
    var parts = defaultExportParts();
    var old = document.getElementById("exportOverlay");
    if (old) old.remove();
    var overlay = document.createElement("div");
    overlay.className = "overlay";
    overlay.id = "exportOverlay";
    document.body.appendChild(overlay);

    function row(key, title, desc) {
      return '<button class="toggle-row" data-part="' + key + '" aria-pressed="' + !!parts[key] + '">' +
        '<span class="toggle-copy"><span class="t-title">' + title + '</span>' +
        '<span class="t-desc">' + desc + "</span></span>" +
        '<span class="switch' + (parts[key] ? " on" : "") + '"></span></button>';
    }

    function draw() {
      var any = parts.players || parts.history || parts.prep;
      var bits = [];
      if (parts.players) bits.push(T().roster.length + (T().roster.length === 1 ? " player" : " players"));
      if (parts.history) bits.push(T().history.length + (T().history.length === 1 ? " match played" : " matches played"));
      if (parts.history && T().activeMatch) bits.push("the match in progress");
      if (parts.prep) bits.push((T().upcoming || []).length + " prepared");
      var full = parts.players && parts.history && parts.prep;

      overlay.innerHTML =
        '<div class="card-sheet">' +
          '<div class="plan-title">Export</div>' +
          '<div class="card-scroll export-scroll">' +
            row("players", "Players &amp; settings",
                "The squad, the match options and the line-up you last used.") +
            row("history", "Matches played",
                "Every finished match, with its scorers and season totals." +
                (T().activeMatch ? " The match you're playing now is in here too, with its clock stopped." : "")) +
