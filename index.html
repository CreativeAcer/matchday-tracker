<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Matchday Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --pitch-dark: #16362A;
    --pitch: #1F5C40;
    --turf: #2E7D52;
    --chalk: #FAF8F2;
    --chalk-dim: #EFEBDF;
    --panel: #FFFFFF;
    --ink: #16211A;
    --ink-soft: #56645A;
    --gold: #E2A33D;
    --gold-deep: #B97F22;
    --red: #C1443B;
    --yellow-card: #E8C93D;
    --line: rgba(22,33,26,0.13);
    --font-display: 'Oswald', 'Arial Narrow', sans-serif;
    --font-body: 'Work Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --chalk: #10201A;
      --chalk-dim: #0C1913;
      --panel: #17281F;
      --ink: #F1EEE3;
      --ink-soft: #AEBBAF;
      --line: rgba(241,238,227,0.14);
    }
  }
  :root[data-theme="dark"] {
    --chalk: #10201A;
    --chalk-dim: #0C1913;
    --panel: #17281F;
    --ink: #F1EEE3;
    --ink-soft: #AEBBAF;
    --line: rgba(241,238,227,0.14);
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); height: 100%; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100%;
    background: var(--chalk);
    color: var(--ink);
    font-family: var(--font-body);
    -webkit-tap-highlight-color: transparent;
  }
  button { font-family: inherit; }
  input, select { font-family: inherit; }

  #app { display: flex; flex-direction: column; min-height: 100%; }

  header.topbar {
    position: sticky;
    top: env(safe-area-inset-top, 0px);
    z-index: 20;
    background: var(--pitch-dark);
    color: var(--chalk);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 10px;
    gap: 8px;
  }
  .icon-btn {
    background: transparent;
    border: none;
    color: var(--chalk);
    font-size: 20px;
    width: 42px;
    height: 42px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .icon-btn:active { background: rgba(255,255,255,0.12); }
  .icon-btn:disabled { opacity: 0.35; }

  .clock-btn {
    flex: 1;
    background: rgba(255,255,255,0.07);
    border: 1px solid rgba(255,255,255,0.16);
    border-radius: 12px;
    color: var(--chalk);
    padding: 6px 12px;
    display: flex;
    flex-direction: column;
    align-items: center;
    line-height: 1.15;
  }
  .clock-btn:active { background: rgba(255,255,255,0.14); }
  .clock-time {
    font-family: var(--font-display);
    font-size: 24px;
    font-weight: 600;
    letter-spacing: 0.5px;
  }
  .clock-state { font-size: 11px; color: var(--gold); }
  .clock-state.running { color: #8FD9AE; }

  .scoreboard {
    background: var(--pitch);
    color: var(--chalk);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    padding: 8px 14px 16px;
    position: sticky;
    top: calc(env(safe-area-inset-top, 0px) + 62px);
    z-index: 19;
  }
  .score-side { text-align: center; min-width: 0; flex: 1; }
  .score-num {
    font-family: var(--font-display);
    font-size: 40px;
    font-weight: 700;
    display: block;
    line-height: 1;
  }
  .score-side.them .score-num { color: var(--gold); }
  .score-label {
    display: block;
    font-size: 12px;
    margin-top: 3px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .score-sep { font-family: var(--font-display); font-size: 22px; opacity: 0.5; margin-top: -6px; }

  main.screen { flex: 1; padding: 16px 14px 100px; max-width: 640px; width: 100%; margin: 0 auto; }
  .hidden { display: none !important; }

  h1.screen-title {
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 22px;
    margin: 4px 0 14px;
  }
  h2.section-title {
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 17px;
    margin: 22px 0 10px;
    color: var(--ink);
  }
  p.hint { color: var(--ink-soft); font-size: 13.5px; line-height: 1.5; margin: 4px 0 14px; }

  .card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 16px;
    margin-bottom: 14px;
  }

  .btn {
    font-family: var(--font-body);
    font-weight: 600;
    font-size: 15px;
    border-radius: 12px;
    padding: 13px 16px;
    border: 1px solid var(--line);
    background: var(--panel);
    color: var(--ink);
    width: 100%;
    display: block;
    text-align: center;
  }
  .btn:active { transform: scale(0.98); }
  .btn-primary { background: var(--pitch); color: var(--chalk); border-color: var(--pitch); }
  .btn-gold { background: var(--gold); color: var(--pitch-dark); border-color: var(--gold-deep); }
  .btn-danger { background: transparent; color: var(--red); border-color: var(--red); }
  .btn-ghost { background: transparent; }
  .btn-row { display: flex; gap: 10px; }
  .btn-row .btn { width: auto; flex: 1; }
  .toggle-seg { background: var(--chalk-dim); border-color: var(--line); color: var(--ink-soft); }
  .toggle-seg.on { background: var(--pitch); color: var(--chalk); border-color: var(--pitch); }

  label.field-label { display: block; font-size: 12.5px; font-weight: 600; color: var(--ink-soft); margin-bottom: 5px; }
  input.text-input {
    width: 100%;
    padding: 11px 12px;
    border-radius: 10px;
    border: 1px solid var(--line);
    background: var(--chalk-dim);
    color: var(--ink);
    font-size: 15px;
    margin-bottom: 12px;
  }
  input.text-input:focus, .btn:focus-visible, .icon-btn:focus-visible, .clock-btn:focus-visible, .tile:focus-visible {
    outline: 2px solid var(--gold-deep);
    outline-offset: 2px;
  }

  .toggle-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 2px;
    border-bottom: 1px solid var(--line);
    gap: 12px;
  }
  .toggle-row:last-child { border-bottom: none; }
  .toggle-row .toggle-copy { flex: 1; }
  .toggle-row .toggle-copy .t-title { font-weight: 600; font-size: 14.5px; }
  .toggle-row .toggle-copy .t-desc { font-size: 12.5px; color: var(--ink-soft); margin-top: 2px; }
  .switch {
    width: 46px; height: 27px; border-radius: 20px;
    background: var(--line); border: none; position: relative; flex-shrink: 0;
  }
  .switch::after {
    content: ''; position: absolute; top: 3px; left: 3px;
    width: 21px; height: 21px; border-radius: 50%;
    background: var(--panel); box-shadow: 0 1px 2px rgba(0,0,0,0.25);
    transition: left 0.15s ease;
  }
  .switch.on { background: var(--turf); }
  .switch.on::after { left: 22px; background: #fff; }

  .roster-list { margin-top: 4px; }
  .roster-item {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 2px; border-bottom: 1px solid var(--line);
  }
  .roster-item:last-child { border-bottom: none; }
  .roster-num {
    font-family: var(--font-display); font-weight: 600; font-size: 16px;
    background: var(--pitch); color: var(--chalk);
    width: 34px; height: 34px; border-radius: 8px;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .roster-name { flex: 1; font-size: 15px; }
  .roster-remove { background: none; border: none; color: var(--red); font-size: 13px; padding: 8px; }

  .add-player-row { display: flex; gap: 8px; align-items: flex-end; margin-top: 6px; }
  .add-player-row .num-input { width: 68px; }
  .add-player-row .name-input { flex: 1; }
  .add-player-row .text-input { margin-bottom: 0; }
  .add-player-row .btn { width: auto; padding: 11px 16px; flex-shrink: 0; }

  .player-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
    gap: 10px;
    margin-bottom: 16px;
  }
  .tile {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 10px 8px 8px;
    text-align: center;
    position: relative;
    overflow: hidden;
    -webkit-user-select: none;
    user-select: none;
  }
  .tile.benched { opacity: 0.5; }
  .tile.benched .tile-num, .tile.benched .tile-name { color: var(--ink-soft); }
  .field-badge {
    display: block;
    width: calc(100% + 16px);
    margin: -10px -8px 8px;
    padding: 8px 0;
    border: none;
    font-family: var(--font-body);
    font-size: 11px;
    font-weight: 700;
    background: var(--turf);
    color: #fff;
  }
  .field-badge.off { background: var(--chalk-dim); color: var(--ink-soft); }
  .field-badge.sent-off-badge { background: var(--red); color: #fff; }
  .field-badge:disabled { opacity: 0.85; }
  .tile:active { background: var(--chalk-dim); }
  .tile.just-scored { animation: pulse-gold 0.5s ease; }
  @media (prefers-reduced-motion: reduce) { .tile.just-scored { animation: none; } }
  @keyframes pulse-gold {
    0% { box-shadow: 0 0 0 0 rgba(226,163,61,0.55); }
    100% { box-shadow: 0 0 0 10px rgba(226,163,61,0); }
  }
  .tile-num {
    font-family: var(--font-display); font-weight: 700; font-size: 26px;
    color: var(--pitch); line-height: 1;
  }
  :root[data-theme="dark"] .tile-num, :root:not([data-theme="light"]) .tile-num { }
  .tile-name {
    font-size: 12.5px; font-weight: 600; margin-top: 3px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .tile-goals { font-size: 11px; color: var(--ink-soft); margin-top: 1px; min-height: 14px; }
  .tile-controls { display: flex; justify-content: center; gap: 6px; margin-top: 6px; }
  .mini-card { width: 18px; height: 22px; border-radius: 3px; border: 1px solid var(--line); }
  .mini-card.yellow-btn { background: rgba(232,201,61,0.4); border-color: rgba(185,127,34,0.55); }
  .mini-card.yellow-btn.card-yellow { background: var(--yellow-card); border-color: var(--gold-deep); }
  .mini-card.red-btn { background: rgba(193,68,59,0.4); border-color: rgba(122,38,32,0.55); }
  .mini-card.red-btn.card-red { background: var(--red); border-color: #7a2620; }
  .mini-card:disabled { opacity: 0.4; }
  .tile.sent-off { opacity: 0.6; }
  .tile.sent-off .tile-num, .tile.sent-off .tile-name { color: var(--red); }
  .confirm-msg { font-size: 15px; line-height: 1.5; padding: 8px 4px 0; }

  .opp-goal-btn {
    width: 100%;
    background: var(--chalk-dim);
    border: 1px dashed var(--ink-soft);
    border-radius: 14px;
    padding: 16px;
    font-weight: 700;
    font-size: 15px;
    color: var(--ink);
    margin-bottom: 18px;
  }
  .opp-goal-btn:active { background: var(--line); }

  .assist-bar {
    position: sticky;
    top: calc(env(safe-area-inset-top, 0px) + 62px + 78px);
    z-index: 18;
    background: var(--gold);
    color: var(--pitch-dark);
    border-radius: 12px;
    padding: 10px 12px;
    margin-bottom: 14px;
  }
  .assist-bar .a-title { font-weight: 700; font-size: 13.5px; margin-bottom: 8px; }
  .assist-chip-row { display: flex; flex-wrap: wrap; gap: 6px; }
  .assist-chip {
    background: rgba(22,33,26,0.12);
    border: none; border-radius: 8px; padding: 7px 10px; font-size: 13px; font-weight: 600;
    color: var(--pitch-dark);
  }
  .assist-chip:active { background: rgba(22,33,26,0.22); }
  .assist-chip.chip-selected { background: var(--pitch); color: var(--chalk); }

  .event-log { margin-top: 4px; }
  .event-row {
    display: flex; align-items: center; gap: 8px;
    padding: 7px 2px; border-bottom: 1px solid var(--line); font-size: 13.5px;
  }
  .event-row:last-child { border-bottom: none; }
  .event-minute { font-family: var(--font-display); color: var(--ink-soft); width: 34px; flex-shrink: 0; }
  .event-desc { flex: 1; }
  .event-actions { display: flex; align-items: center; gap: 2px; flex-shrink: 0; }
  .event-edit, .event-delete {
    background: none; border: none; color: var(--ink-soft);
    font-size: 13px; padding: 6px; flex-shrink: 0;
  }
  .event-edit:active { color: var(--pitch); }
  .event-delete:active { color: var(--red); }
  .empty-state { color: var(--ink-soft); font-size: 13.5px; padding: 10px 2px; }

  .end-match-btn { margin-top: 22px; }

  .summary-score {
    text-align: center; padding: 18px 0 6px;
  }
  .summary-score .ss-num {
    font-family: var(--font-display); font-weight: 700; font-size: 46px;
  }
  .summary-score .ss-teams { font-size: 13.5px; color: var(--ink-soft); margin-top: 4px; }

  .stat-list { margin-top: 4px; }
  .stat-row {
    display: flex; justify-content: space-between; padding: 8px 2px; border-bottom: 1px solid var(--line);
    font-size: 14px;
  }
  .stat-row:last-child { border-bottom: none; }
  .stat-row .sr-name { font-weight: 600; }
  .stat-row .sr-val { color: var(--ink-soft); font-variant-numeric: tabular-nums; }

  .history-item { padding: 12px 2px; border-bottom: 1px solid var(--line); }
  .history-item:last-child { border-bottom: none; }
  .hi-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .hi-score { font-family: var(--font-display); font-weight: 700; font-size: 17px; }
  .hi-meta { font-size: 12px; color: var(--ink-soft); margin-top: 2px; }
  .hi-scorers { font-size: 12.5px; color: var(--ink-soft); margin-top: 4px; }
  .result-pill { font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 20px; }
  .result-pill.win { background: rgba(46,125,82,0.16); color: var(--turf); }
  .result-pill.loss { background: rgba(193,68,59,0.14); color: var(--red); }
  .result-pill.draw { background: var(--chalk-dim); color: var(--ink-soft); }
  .hi-remove { background: none; border: none; color: var(--ink-soft); font-size: 12px; padding: 6px; }
  .hi-copy { background: none; border: none; color: var(--turf); font-size: 12px; font-weight: 700; padding: 6px; }
  .hi-actions { display: flex; align-items: center; gap: 2px; flex-shrink: 0; }
  .share-textarea {
    width: 100%; min-height: 150px; margin-top: 10px;
    padding: 10px; border-radius: 10px; border: 1px solid var(--line);
    background: var(--chalk-dim); color: var(--ink); font-family: var(--font-body);
    font-size: 13.5px; line-height: 1.5; resize: vertical;
  }

  .overlay {
    position: fixed; inset: 0; background: rgba(16,26,20,0.5); z-index: 30;
    display: flex; align-items: flex-end;
  }
  .sheet {
    background: var(--panel); width: 100%; border-radius: 18px 18px 0 0;
    padding: 10px 8px calc(14px + env(safe-area-inset-bottom, 0px));
  }
  .help-sheet {
    max-height: 82vh;
    display: flex;
    flex-direction: column;
    padding-left: 0; padding-right: 0;
  }
  .help-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 4px 16px 10px; border-bottom: 1px solid var(--line); flex-shrink: 0;
  }
  .help-header h2 { margin: 0; }
  .help-body {
    overflow-y: auto;
    padding: 14px 16px calc(20px + env(safe-area-inset-bottom, 0px));
  }
  .help-section { margin-bottom: 18px; }
  .help-section:last-child { margin-bottom: 0; }
  .help-section h3 {
    font-family: var(--font-display); font-weight: 600; font-size: 15px;
    margin: 0 0 6px; color: var(--pitch);
  }
  .help-section p { margin: 0 0 6px; font-size: 13.5px; line-height: 1.55; color: var(--ink); }
  .help-section p:last-child { margin-bottom: 0; }

  .bottom-nav {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 25;
    display: flex;
    background: var(--panel);
    border-top: 1px solid var(--line);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  .tab-btn {
    flex: 1;
    background: none;
    border: none;
    padding: 8px 4px 6px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    color: var(--ink-soft);
  }
  .tab-btn .tab-icon { font-size: 20px; line-height: 1; }
  .tab-btn .tab-label { font-size: 11px; font-weight: 600; }
  .tab-btn.active { color: var(--pitch); }
  .tab-btn:active { background: var(--chalk-dim); }

  .file-input-hidden { display: none; }

  .toast {
    position: fixed;
    left: 16px; right: 16px;
    bottom: calc(86px + env(safe-area-inset-bottom, 0px));
    margin: 0 auto;
    max-width: 420px;
    text-align: center;
    padding: 16px 20px;
    border-radius: 16px;
    font-size: 15.5px;
    font-weight: 700;
    line-height: 1.4;
    z-index: 50;
    box-shadow: 0 12px 32px rgba(0,0,0,0.4);
    animation: toast-in 0.22s ease-out;
  }
  @keyframes toast-in {
    0% { opacity: 0; transform: translateY(14px) scale(0.97); }
    100% { opacity: 1; transform: translateY(0) scale(1); }
  }
  @media (prefers-reduced-motion: reduce) { .toast { animation: none; } }
  .toast-success { background: var(--turf); color: #fff; }
  .toast-warning { background: var(--gold); color: var(--pitch-dark); box-shadow: 0 12px 32px rgba(0,0,0,0.4), 0 0 0 3px var(--gold-deep) inset; }
  .toast-error { background: var(--red); color: #fff; }

  ::-webkit-scrollbar { display: none; }
</style>
</head>
<body>
<div id="app">
  <header class="topbar">
    <button class="icon-btn" id="helpBtn" aria-label="How to use this app">❓</button>
    <button class="clock-btn" id="clockBtn">
      <span class="clock-time" id="clockTime">00:00</span>
      <span class="clock-state" id="clockState">No match yet</span>
    </button>
    <button class="icon-btn" id="undoBtn" aria-label="Undo last event">↺</button>
  </header>

  <div class="scoreboard" id="scoreboardBar">
    <div class="score-side us">
      <span class="score-num" id="usScoreNum">0</span>
      <span class="score-label" id="usScoreLabel">Your Team</span>
    </div>
    <span class="score-sep">–</span>
    <div class="score-side them">
      <span class="score-num" id="themScoreNum">0</span>
      <span class="score-label" id="themScoreLabel">Opponent</span>
    </div>
  </div>

  <main class="screen" id="matchScreen"></main>
  <main class="screen hidden" id="teamScreen"></main>
  <main class="screen hidden" id="historyScreen"></main>

  <nav class="bottom-nav">
    <button class="tab-btn" data-nav="match" id="tabMatch">
      <span class="tab-icon">⚽</span><span class="tab-label">Match</span>
    </button>
    <button class="tab-btn" data-nav="team" id="tabTeam">
      <span class="tab-icon">👥</span><span class="tab-label">Team</span>
    </button>
    <button class="tab-btn" data-nav="history" id="tabHistory">
      <span class="tab-icon">📋</span><span class="tab-label">History</span>
    </button>
  </nav>
</div>

<input type="file" accept="application/json,.json" class="file-input-hidden" id="importFileInput">

<script>
(function () {
  "use strict";

  var STORAGE_KEY = "matchdayTrackerData_v1";

  function uid() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  }

  function defaultState() {
    return {
      version: 1,
      teamName: "My Team",
      roster: [],
      settings: { trackAssists: false, trackPlayingTime: false, trackCards: false },
      activeMatch: null,
      history: []
    };
  }

  function load() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return defaultState();
      var parsed = JSON.parse(raw);
      var base = defaultState();
      return Object.assign(base, parsed, {
        settings: Object.assign(base.settings, parsed.settings || {})
      });
    } catch (e) {
      console.error("Load failed", e);
      return defaultState();
    }
  }

  function persist() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    } catch (e) {
      console.error("Save failed", e);
      showToast("Couldn't save — storage may be full or unavailable.", "error");
    }
  }

  var state = load();
  var view = state.roster.length === 0 ? "team" : "match";
  var pendingAssistEventId = null;
  var assistBarTimer = null;

  // ---------- utilities ----------

  function rosterById(id) {
    for (var i = 0; i < state.roster.length; i++) {
      if (state.roster[i].id === id) return state.roster[i];
    }
    return null;
  }

  function formatClock(ms) {
    var totalSec = Math.max(0, Math.floor(ms / 1000));
    var m = Math.floor(totalSec / 60);
    var s = totalSec % 60;
    return (m < 10 ? "0" + m : m) + ":" + (s < 10 ? "0" + s : s);
  }

  function clockElapsedMs(match) {
    if (!match) return 0;
    var extra = match.clock.running ? (Date.now() - match.clock.runningSince) : 0;
    return match.clock.elapsedMs + extra;
  }

  function currentMinute(match) {
    return Math.floor(clockElapsedMs(match) / 60000);
  }

  function computeStats(match) {
    var scoreUs = 0, scoreThem = 0;
    var scorers = {}, assists = {}, cards = {};
    match.events.forEach(function (ev) {
      if (ev.type === "goal") {
        scoreUs++;
        scorers[ev.playerId] = (scorers[ev.playerId] || 0) + 1;
        if (ev.assistId) assists[ev.assistId] = (assists[ev.assistId] || 0) + 1;
      } else if (ev.type === "opponent_goal") {
        scoreThem++;
      } else if (ev.type === "card") {
        if (!cards[ev.playerId]) cards[ev.playerId] = [];
        cards[ev.playerId].push(ev.cardType);
      }
    });
    return { scoreUs: scoreUs, scoreThem: scoreThem, scorers: scorers, assists: assists, cards: cards };
  }

  function playingTimeMinutes(match) {
    var out = {};
    if (!match.playingTime) return out;
    var endMs = clockElapsedMs(match);
    Object.keys(match.playingTime).forEach(function (pid) {
      var pt = match.playingTime[pid];
      var total = pt.accumMs;
      if (pt.onField && pt.onSince != null) total += (endMs - pt.onSince);
      out[pid] = Math.round(total / 60000);
    });
    return out;
  }

  function goalTimeline(events, opponentName) {
    return (events || [])
      .filter(function (e) { return e.type === "goal" || e.type === "opponent_goal"; })
      .map(function (e) {
        if (e.type === "goal") {
          var scorer = rosterById(e.playerId);
          var assister = e.assistId ? rosterById(e.assistId) : null;
          return { minute: e.minuteAtEvent, forUs: true, name: scorer ? scorer.name : "Unknown", assistName: assister ? assister.name : null };
        }
        return { minute: e.minuteAtEvent, forUs: false, name: opponentName, assistName: null };
      });
  }

  function timelineHtml(timeline) {
    if (!timeline.length) return '<div class="empty-state">No goals scored.</div>';
    return timeline.map(function (t) {
      var desc = "⚽ " + esc(t.name) + (t.assistName ? " (assist: " + esc(t.assistName) + ")" : "");
      return '<div class="event-row"><span class="event-minute">' + t.minute + "'</span><span class=\"event-desc\">" + desc + "</span></div>";
    }).join("");
  }

  function buildShareText(record) {
    var isHome = record.isHome !== false;
    var homeName = isHome ? record.teamName : record.opponentName;
    var awayName = isHome ? record.opponentName : record.teamName;
    var homeScore = isHome ? record.scoreUs : record.scoreThem;
    var awayScore = isHome ? record.scoreThem : record.scoreUs;
    var d = new Date(record.date);
    var dateStr = isNaN(d) ? "" : d.toLocaleDateString(undefined, { weekday: "short", day: "numeric", month: "short", year: "numeric" });
    var timeline = goalTimeline(record.events, record.opponentName);

    var lines = [];
    if (dateStr) lines.push(dateStr);
    lines.push(homeName + " (Home) " + homeScore + " – " + awayScore + " " + awayName + " (Away)");
    if (timeline.length) {
      lines.push("");
      lines.push("Goals:");
      timeline.forEach(function (t) {
        lines.push(t.minute + "' " + t.name + (t.assistName ? " (assist: " + t.assistName + ")" : ""));
      });
    }
    return lines.join("\n");
  }

  async function copyShareText(text) {
    try {
      if (!navigator.clipboard || !navigator.clipboard.writeText) throw new Error("no clipboard api");
      await navigator.clipboard.writeText(text);
      showToast("Copied — paste it into your group chat.");
    } catch (e) {
      showCopyFallback(text);
    }
  }

  function showCopyFallback(text) {
    var old = document.getElementById("copyOverlay");
    if (old) old.remove();
    var overlay = document.createElement("div");
    overlay.className = "overlay";
    overlay.id = "copyOverlay";
    overlay.innerHTML =
      '<div class="sheet">' +
        '<div class="confirm-msg">Couldn\u2019t copy automatically. Tap the text below, select all, then copy.</div>' +
        '<textarea class="share-textarea" id="shareTextarea" readonly></textarea>' +
        '<div class="btn-row" style="margin-top:12px;">' +
          '<button class="btn btn-ghost" id="copyFallbackClose">Close</button>' +
          '<button class="btn btn-primary" id="copyFallbackTry">Try copy again</button>' +
        "</div>" +
      "</div>";
    document.body.appendChild(overlay);
    var ta = document.getElementById("shareTextarea");
    ta.value = text;
    ta.focus();
    ta.select();
    function cleanup() { overlay.remove(); }
    document.getElementById("copyFallbackClose").onclick = cleanup;
    overlay.onclick = function (e) { if (e.target === overlay) cleanup(); };
    document.getElementById("copyFallbackTry").onclick = function () {
      ta.focus();
      ta.select();
      var ok = false;
      try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
      if (ok) {
        showToast("Copied — paste it into your group chat.");
        cleanup();
      } else {
        showToast("Still couldn't copy automatically — select the text and copy manually.", "error");
      }
    };
  }

  function showToast(msg, type) {
    var existing = document.getElementById("toastEl");
    if (existing) existing.remove();
    var t = document.createElement("div");
    t.className = "toast toast-" + (type || "success");
    t.id = "toastEl";
    t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(function () { t.remove(); }, 3200);
  }

  function esc(str) {
    var d = document.createElement("div");
    d.textContent = str == null ? "" : String(str);
    return d.innerHTML;
  }

  function showConfirm(message, confirmLabel, onConfirm, danger) {
    var old = document.getElementById("confirmOverlay");
    if (old) old.remove();
    var overlay = document.createElement("div");
    overlay.className = "overlay";
    overlay.id = "confirmOverlay";
    overlay.innerHTML =
      '<div class="sheet">' +
        '<div class="confirm-msg">' + esc(message) + "</div>" +
        '<div class="btn-row" style="margin-top:16px;">' +
          '<button class="btn btn-ghost" id="confirmCancelBtn">Cancel</button>' +
          '<button class="btn ' + (danger ? "btn-danger" : "btn-primary") + '" id="confirmOkBtn">' + esc(confirmLabel || "Confirm") + "</button>" +
        "</div>" +
      "</div>";
    document.body.appendChild(overlay);
    function cleanup() { overlay.remove(); }
    document.getElementById("confirmCancelBtn").onclick = cleanup;
    document.getElementById("confirmOkBtn").onclick = function () { cleanup(); onConfirm(); };
    overlay.onclick = function (e) { if (e.target === overlay) cleanup(); };
  }

  function showHelp() {
    var old = document.getElementById("helpOverlay");
    if (old) old.remove();
    var overlay = document.createElement("div");
    overlay.className = "overlay";
    overlay.id = "helpOverlay";
    var sections = [
      ["Set up your team", "Go to <strong>Team</strong> and add each player's name and shirt number. This only needs doing once — it's saved on this device for every future match."],
      ["Match options", "Still on the Team screen: turn on Assists, Playing time, or Cards only if you want to track them. All three are off by default to keep things simple."],
      ["Start a match", "On the <strong>Match</strong> tab, enter the opponent (optional), pick Home or Away, then tap <strong>Kick off</strong>."],
      ["Start the clock", "Tap the timer at the top to start it. You can't log goals or cards until the clock is running — this keeps every event's minute accurate."],
      ["Score a goal", "Tap a player's tile. If Assists is on, you'll be asked who assisted right after. Use the dashed button below the grid for the opponent's goals."],
      ["On pitch / Bench", "Each tile shows who's on the pitch. Tap the badge to bench or bring on a player — benched players can't be tapped to score by mistake."],
      ["Cards", "Tap the small yellow or red square on a tile. A second yellow automatically becomes a red. A red card automatically benches the player for the rest of the match, and they can't be brought back on."],
      ["Fix a mistake", "Every entry in the Match log has ✎ (edit) and ✕ (delete). Edit lets you change who scored, who assisted, or who received a card. ↺ Undo at the top removes the most recent entry."],

      ["History", "The <strong>History</strong> tab keeps every past match, season top scorers, and a Copy button on each match to re-share its report."],
      ["Share your team", "In Team or History, use <strong>Export team data</strong> to save a file another parent or coach can load with <strong>Import team data</strong> — no retyping the roster."]
    ];
    var body = sections.map(function (s) {
      return '<div class="help-section"><h3>' + esc(s[0]) + "</h3><p>" + s[1] + "</p></div>";
    }).join("");
    overlay.innerHTML =
      '<div class="sheet help-sheet">' +
        '<div class="help-header"><h2 class="section-title">How to use this app</h2><button class="icon-btn" id="helpCloseBtn" aria-label="Close">✕</button></div>' +
        '<div class="help-body">' + body + "</div>" +
      "</div>";
    document.body.appendChild(overlay);
    function cleanup() { overlay.remove(); }
    document.getElementById("helpCloseBtn").onclick = cleanup;
    overlay.onclick = function (e) { if (e.target === overlay) cleanup(); };
  }

  function isOnField(match, playerId) {
    var pt = match.playingTime[playerId];
    return pt ? !!pt.onField : true;
  }

  function cardCounts(match, playerId) {
    var yellows = 0, reds = 0;
    match.events.forEach(function (e) {
      if (e.type === "card" && e.playerId === playerId) {
        if (e.cardType === "yellow") yellows++;
        else if (e.cardType === "red") reds++;
      }
    });
    return { yellows: yellows, reds: reds };
  }

  function hasRedCard(match, playerId) {
    return cardCounts(match, playerId).reds > 0;
  }

  function setOnField(match, playerId, onField) {
    if (!match.playingTime[playerId]) match.playingTime[playerId] = { onField: true, accumMs: 0, onSince: clockElapsedMs(match) };
    var pt = match.playingTime[playerId];
    if (pt.onField === onField) return;
    var nowMs = clockElapsedMs(match);
    if (pt.onField && !onField) {
      pt.accumMs += (nowMs - pt.onSince);
      pt.onField = false;
      pt.onSince = null;
    } else if (!pt.onField && onField) {
      pt.onField = true;
      pt.onSince = nowMs;
    }
  }

  // ---------- match lifecycle ----------

  function startNewMatch(opponentName, isHome) {
    var pt = {};
    state.roster.forEach(function (p) {
      pt[p.id] = { onField: true, accumMs: 0, onSince: 0 };
    });
    state.activeMatch = {
      id: uid(),
      opponentName: opponentName || "Opponent",
      isHome: isHome !== false,
      startedAt: new Date().toISOString(),
      clock: { elapsedMs: 0, running: false, runningSince: null },
      events: [],
      playingTime: pt
    };
    persist();
    render();
  }

  function endMatch() {
    var match = state.activeMatch;
    if (!match) return;
    var stats = computeStats(match);
    var minutes = playingTimeMinutes(match);
    var record = {
      id: match.id,
      date: match.startedAt,
      opponentName: match.opponentName,
      teamName: state.teamName,
      isHome: match.isHome !== false,
      scoreUs: stats.scoreUs,
      scoreThem: stats.scoreThem,
      scorers: stats.scorers,
      assists: stats.assists,
      cards: stats.cards,
      playingTimeMinutes: minutes,
      durationMinutes: currentMinute(match),
      events: match.events
    };
    state.history.unshift(record);
    state.activeMatch = null;
    persist();
    view = "summary";
    render();
  }

  function toggleClock() {
    var match = state.activeMatch;
    if (!match) return;
    if (match.clock.running) {
      match.clock.elapsedMs = clockElapsedMs(match);
      match.clock.running = false;
      match.clock.runningSince = null;
    } else {
      match.clock.running = true;
      match.clock.runningSince = Date.now();
    }
    persist();
    render();
  }

  var lastEventTapAt = {};

  function guardDoubleTap(key) {
    var now = Date.now();
    if (lastEventTapAt[key] && (now - lastEventTapAt[key]) < 800) return false;
    lastEventTapAt[key] = now;
    return true;
  }

  function requireClockRunning(match) {
    if (!match.clock.running) {
      showToast("Start the clock first — tap the timer at the top.", "warning");
      return false;
    }
    return true;
  }

  function logGoal(playerId) {
    var match = state.activeMatch;
    if (!match) return;
    if (!isOnField(match, playerId)) {
      var benched = rosterById(playerId);
      showToast((benched ? benched.name : "This player") + " is on the bench — bring them on first.", "warning");
      return;
    }
    if (!requireClockRunning(match)) return;
    if (!guardDoubleTap("goal:" + playerId)) return;
    var ev = { id: uid(), type: "goal", playerId: playerId, assistId: null, minuteAtEvent: currentMinute(match), ts: Date.now() };
    match.events.push(ev);
    persist();
    if (state.settings.trackAssists) {
      pendingAssistEventId = ev.id;
      clearTimeout(assistBarTimer);
      assistBarTimer = setTimeout(function () { pendingAssistEventId = null; render(); }, 6000);
    }
    render();
    var tile = document.querySelector('[data-tile="' + playerId + '"]');
    if (tile) {
      tile.classList.add("just-scored");
      setTimeout(function () { tile.classList.remove("just-scored"); }, 500);
    }
  }

  function setAssist(assistPlayerId) {
    var match = state.activeMatch;
    if (!match || !pendingAssistEventId) return;
    var ev = null;
    for (var i = 0; i < match.events.length; i++) {
      if (match.events[i].id === pendingAssistEventId) { ev = match.events[i]; break; }
    }
    if (ev) ev.assistId = assistPlayerId;
    pendingAssistEventId = null;
    clearTimeout(assistBarTimer);
    persist();
    render();
  }

  function logOpponentGoal() {
    var match = state.activeMatch;
    if (!match) return;
    if (!requireClockRunning(match)) return;
    if (!guardDoubleTap("opponent-goal")) return;
    match.events.push({ id: uid(), type: "opponent_goal", playerId: null, minuteAtEvent: currentMinute(match), ts: Date.now() });
    persist();
    render();
  }

  function toggleCard(playerId, cardType) {
    var match = state.activeMatch;
    if (!match) return;
    var player = rosterById(playerId);
    if (hasRedCard(match, playerId)) {
      showToast((player ? player.name : "This player") + " is already sent off.", "warning");
      return;
    }
    if (!requireClockRunning(match)) return;
    if (!guardDoubleTap("card:" + playerId + ":" + cardType)) return;
    match.events.push({ id: uid(), type: "card", playerId: playerId, cardType: cardType, minuteAtEvent: currentMinute(match), ts: Date.now() });

    var counts = cardCounts(match, playerId);
    var sentOff = cardType === "red";
    if (cardType === "yellow" && counts.yellows >= 2) {
      match.events.push({ id: uid(), type: "card", playerId: playerId, cardType: "red", minuteAtEvent: currentMinute(match), ts: Date.now() });
      sentOff = true;
    }
    if (sentOff) {
      setOnField(match, playerId, false);
      showToast((player ? player.name : "Player") + " is sent off" + (cardType === "yellow" ? " — second yellow" : "") + ".", "warning");
    }
    persist();
    render();
  }

  function toggleField(playerId) {
    var match = state.activeMatch;
    if (!match) return;
    if (hasRedCard(match, playerId)) {
      var player = rosterById(playerId);
      showToast((player ? player.name : "This player") + " is sent off and can't return to the pitch.", "warning");
      return;
    }
    setOnField(match, playerId, !isOnField(match, playerId));
    persist();
    render();
  }

  function describeEvent(ev) {
    if (ev.type === "goal") {
      var p = rosterById(ev.playerId);
      return "goal by " + (p ? p.name : "player");
    }
    if (ev.type === "opponent_goal") return "opponent goal";
    if (ev.type === "card") {
      var c = rosterById(ev.playerId);
      return (ev.cardType === "red" ? "red card" : "yellow card") + (c ? " — " + c.name : "");
    }
    return "last action";
  }

  function undoLast() {
    var match = state.activeMatch;
    if (!match || match.events.length === 0) return;
    var removed = match.events.pop();
    pendingAssistEventId = null;
    lastEventTapAt = {};
    persist();
    render();
    showToast("Removed: " + describeEvent(removed));
  }

  function deleteEvent(eventId) {
    var match = state.activeMatch;
    if (!match) return;
    var idx = -1;
    for (var i = 0; i < match.events.length; i++) {
      if (match.events[i].id === eventId) { idx = i; break; }
    }
    if (idx === -1) return;
    var removed = match.events.splice(idx, 1)[0];
    if (pendingAssistEventId === eventId) pendingAssistEventId = null;
    lastEventTapAt = {};
    persist();
    render();
    showToast("Removed: " + describeEvent(removed));
  }

  function reconcileCardConsequences(match, playerIds) {
    var seen = {};
    playerIds.forEach(function (pid) {
      if (!pid || seen[pid]) return;
      seen[pid] = true;
      var counts = cardCounts(match, pid);
      if (counts.yellows >= 2 && counts.reds === 0) {
        match.events.push({ id: uid(), type: "card", playerId: pid, cardType: "red", minuteAtEvent: currentMinute(match), ts: Date.now() });
        counts.reds = 1;
      }
      if (counts.reds > 0) setOnField(match, pid, false);
    });
  }

  function findEvent(match, eventId) {
    for (var i = 0; i < match.events.length; i++) {
      if (match.events[i].id === eventId) return match.events[i];
    }
    return null;
  }

  function applyGoalEdit(eventId, newPlayerId, newAssistId) {
    var match = state.activeMatch;
    if (!match) return;
    var ev = findEvent(match, eventId);
    if (!ev) return;
    ev.playerId = newPlayerId;
    ev.assistId = newAssistId || null;
    persist();
    render();
    showToast("Updated: " + describeEvent(ev));
  }

  function applyCardEdit(eventId, newPlayerId, newCardType) {
    var match = state.activeMatch;
    if (!match) return;
    var ev = findEvent(match, eventId);
    if (!ev) return;
    var oldPlayerId = ev.playerId;
    ev.playerId = newPlayerId;
    ev.cardType = newCardType;
    reconcileCardConsequences(match, [oldPlayerId, newPlayerId]);
    persist();
    render();
    showToast("Updated: " + describeEvent(ev));
  }

  function showEditEvent(eventId) {
    var match = state.activeMatch;
    if (!match) return;
    var ev = findEvent(match, eventId);
    if (!ev || (ev.type !== "goal" && ev.type !== "card")) return;

    var old = document.getElementById("editOverlay");
    if (old) old.remove();
    var overlay = document.createElement("div");
    overlay.className = "overlay";
    overlay.id = "editOverlay";
    document.body.appendChild(overlay);
    function close() { overlay.remove(); }
    overlay.onclick = function (e) { if (e.target === overlay) close(); };

    if (ev.type === "goal") {
      var selScorer = ev.playerId;
      var selAssist = ev.assistId || null;
      var draw = function () {
        var scorerChips = state.roster.map(function (p) {
          return '<button class="assist-chip' + (p.id === selScorer ? " chip-selected" : "") + '" data-pick-scorer="' + p.id + '">' + esc(p.name) + "</button>";
        }).join("");
        var assistSection = "";
        if (state.settings.trackAssists) {
          var assistChips =
            state.roster.filter(function (p) { return p.id !== selScorer; }).map(function (p) {
              return '<button class="assist-chip' + (p.id === selAssist ? " chip-selected" : "") + '" data-pick-assist="' + p.id + '">' + esc(p.name) + "</button>";
            }).join("") +
            '<button class="assist-chip' + (!selAssist ? " chip-selected" : "") + '" data-pick-assist="none">No assist</button>';
          assistSection = '<label class="field-label" style="margin-top:14px;">Assist</label><div class="assist-chip-row">' + assistChips + "</div>";
        }
        overlay.innerHTML =
          '<div class="sheet">' +
            '<div class="confirm-msg"><strong>Edit goal</strong></div>' +
            '<label class="field-label" style="margin-top:10px;">Scorer</label>' +
            '<div class="assist-chip-row">' + scorerChips + "</div>" +
            assistSection +
            '<div class="btn-row" style="margin-top:16px;">' +
              '<button class="btn btn-ghost" id="editCancelBtn">Cancel</button>' +
              '<button class="btn btn-primary" id="editSaveBtn">Save</button>' +
            "</div>" +
          "</div>";
        overlay.querySelectorAll("[data-pick-scorer]").forEach(function (btn) {
          btn.onclick = function () {
            selScorer = btn.getAttribute("data-pick-scorer");
            if (selAssist === selScorer) selAssist = null;
            draw();
          };
        });
        overlay.querySelectorAll("[data-pick-assist]").forEach(function (btn) {
          btn.onclick = function () {
            var v = btn.getAttribute("data-pick-assist");
            selAssist = v === "none" ? null : v;
            draw();
          };
        });
        document.getElementById("editCancelBtn").onclick = close;
        document.getElementById("editSaveBtn").onclick = function () {
          close();
          applyGoalEdit(eventId, selScorer, selAssist);
        };
      };
      draw();
    } else {
      var selPlayer = ev.playerId;
      var selType = ev.cardType;
      var drawCard = function () {
        var playerChips = state.roster.map(function (p) {
          return '<button class="assist-chip' + (p.id === selPlayer ? " chip-selected" : "") + '" data-pick-player="' + p.id + '">' + esc(p.name) + "</button>";
        }).join("");
        overlay.innerHTML =
          '<div class="sheet">' +
            '<div class="confirm-msg"><strong>Edit card</strong></div>' +
            '<label class="field-label" style="margin-top:10px;">Player</label>' +
            '<div class="assist-chip-row">' + playerChips + "</div>" +
            '<label class="field-label" style="margin-top:14px;">Card</label>' +
            '<div class="btn-row" style="margin-bottom:4px;">' +
              '<button class="btn toggle-seg' + (selType === "yellow" ? " on" : "") + '" id="pickYellowBtn">Yellow</button>' +
              '<button class="btn toggle-seg' + (selType === "red" ? " on" : "") + '" id="pickRedBtn">Red</button>' +
            "</div>" +
            '<div class="btn-row" style="margin-top:16px;">' +
              '<button class="btn btn-ghost" id="editCancelBtn">Cancel</button>' +
              '<button class="btn btn-primary" id="editSaveBtn">Save</button>' +
            "</div>" +
          "</div>";
        overlay.querySelectorAll("[data-pick-player]").forEach(function (btn) {
          btn.onclick = function () { selPlayer = btn.getAttribute("data-pick-player"); drawCard(); };
        });
        document.getElementById("pickYellowBtn").onclick = function () { selType = "yellow"; drawCard(); };
        document.getElementById("pickRedBtn").onclick = function () { selType = "red"; drawCard(); };
        document.getElementById("editCancelBtn").onclick = close;
        document.getElementById("editSaveBtn").onclick = function () {
          close();
          applyCardEdit(eventId, selPlayer, selType);
        };
      };
      drawCard();
    }
  }

  // ---------- roster ----------

  function addPlayer(name, number) {
    name = (name || "").trim();
    if (!name) return;
    state.roster.push({ id: uid(), name: name, number: (number || "").trim() });
    persist();
    render();
  }

  function removePlayer(id) {
    state.roster = state.roster.filter(function (p) { return p.id !== id; });
    persist();
    render();
  }

  // ---------- export / import ----------

  function slug(str) {
    return (str || "team").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/(^-|-$)/g, "") || "team";
  }

  async function exportData() {
    var payload = {
      exportedFrom: "Matchday Tracker",
      exportedAt: new Date().toISOString(),
      teamName: state.teamName,
      roster: state.roster,
      settings: state.settings,
      history: state.history
    };
    var json = JSON.stringify(payload, null, 2);
    var filename = slug(state.teamName) + "-team-data.json";

    // Inside a published Claude artifact, use its native save prompt.
    if (window.claude && typeof window.claude.use === "function") {
      try {
        var downloads = await window.claude.use("downloads");
        if (downloads) {
          var result = await downloads.save({ filename: filename, data: json });
          showToast(result.status === "saved" ? "Saved " + filename : "Sent");
          return;
        }
      } catch (err) {
        if (err && err.code === "declined") return;
        // Fall through to a plain browser download below.
      }
    }

    // Standard browser download — works on any ordinary web server.
    try {
      var blob = new Blob([json], { type: "application/json" });
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
      showToast("Saved " + filename);
    } catch (err) {
      console.error(err);
      showToast("Couldn't export right now.", "error");
    }
  }

  function importDataFromFile(file) {
    var reader = new FileReader();
    reader.onload = function () {
      try {
        var data = JSON.parse(reader.result);
        if (!data || !Array.isArray(data.roster)) throw new Error("bad shape");
        showConfirm(
          "Import \"" + (data.teamName || "this team") + "\"? This replaces the roster, settings and history currently stored on this device.",
          "Import",
          function () {
            state.teamName = data.teamName || "My Team";
            state.roster = data.roster.map(function (p) {
              return { id: p.id || uid(), name: p.name || "", number: p.number || "" };
            });
            state.settings = Object.assign({ trackAssists: false, trackPlayingTime: false, trackCards: false }, data.settings || {});
            state.history = Array.isArray(data.history) ? data.history : [];
            persist();
            view = "team";
            render();
            showToast("Imported " + state.roster.length + " players.");
          },
          true
        );
      } catch (e) {
        showToast("That file doesn't look like a Matchday Tracker export.", "error");
      }
    };
    reader.readAsText(file);
  }

  // ---------- rendering ----------

  function render() {
    document.getElementById("matchScreen").classList.toggle("hidden", view !== "match" && view !== "summary");
    document.getElementById("teamScreen").classList.toggle("hidden", view !== "team");
    document.getElementById("historyScreen").classList.toggle("hidden", view !== "history");

    var activeTab = view === "summary" ? "match" : view;
    document.getElementById("tabMatch").classList.toggle("active", activeTab === "match");
    document.getElementById("tabTeam").classList.toggle("active", activeTab === "team");
    document.getElementById("tabHistory").classList.toggle("active", activeTab === "history");

    var match = state.activeMatch;
    document.getElementById("scoreboardBar").classList.toggle("hidden", !match && view !== "summary");
    document.getElementById("undoBtn").disabled = !match || match.events.length === 0;
    document.getElementById("clockBtn").style.visibility = match ? "visible" : "hidden";

    if (match) {
      var stats = computeStats(match);
      document.getElementById("usScoreNum").textContent = stats.scoreUs;
      document.getElementById("themScoreNum").textContent = stats.scoreThem;
      document.getElementById("usScoreLabel").textContent = state.teamName + (match.isHome !== false ? " (H)" : " (A)");
      document.getElementById("themScoreLabel").textContent = match.opponentName + (match.isHome !== false ? " (A)" : " (H)");
      document.getElementById("clockTime").textContent = formatClock(clockElapsedMs(match));
      document.getElementById("clockState").textContent = match.clock.running ? "Running — tap to pause" : "Paused — tap to start";
      document.getElementById("clockState").classList.toggle("running", match.clock.running);
    } else {
      document.getElementById("clockTime").textContent = "00:00";
      document.getElementById("clockState").textContent = "No match yet";
      document.getElementById("clockState").classList.remove("running");
    }

    if (view === "match") renderMatchScreen();
    if (view === "summary") renderSummaryScreen();
    if (view === "team") renderTeamScreen();
    if (view === "history") renderHistoryScreen();
  }

  function renderMatchScreen() {
    var el = document.getElementById("matchScreen");
    var match = state.activeMatch;

    if (!match) {
      el.innerHTML =
        '<h1 class="screen-title">Start a match</h1>' +
        (state.roster.length === 0
          ? '<p class="hint">Add your players first, from the Team &amp; settings menu.</p>' +
            '<button class="btn btn-primary" id="goToTeamBtn">Go to Team &amp; settings</button>'
          : '<div class="card">' +
              '<label class="field-label" for="opponentInput">Opponent (optional)</label>' +
              '<input class="text-input" id="opponentInput" placeholder="e.g. FC Riverside">' +
              '<label class="field-label">Home or away?</label>' +
              '<div class="btn-row" style="margin-bottom:14px;">' +
                '<button class="btn toggle-seg on" id="homeBtn">Home</button>' +
                '<button class="btn toggle-seg" id="awayBtn">Away</button>' +
              '</div>' +
              '<button class="btn btn-primary" id="kickoffBtn">Kick off</button>' +
            '</div>');
      if (state.roster.length === 0) {
        document.getElementById("goToTeamBtn").onclick = function () { view = "team"; render(); };
      } else {
        var selectedIsHome = true;
        document.getElementById("homeBtn").onclick = function () {
          selectedIsHome = true;
          document.getElementById("homeBtn").classList.add("on");
          document.getElementById("awayBtn").classList.remove("on");
        };
        document.getElementById("awayBtn").onclick = function () {
          selectedIsHome = false;
          document.getElementById("awayBtn").classList.add("on");
          document.getElementById("homeBtn").classList.remove("on");
        };
        document.getElementById("kickoffBtn").onclick = function () {
          startNewMatch(document.getElementById("opponentInput").value, selectedIsHome);
        };
      }
      return;
    }

    var stats = computeStats(match);

    var assistBarHtml = "";
    if (pendingAssistEventId) {
      var scorerEv = match.events.filter(function (e) { return e.id === pendingAssistEventId; })[0];
      var scorer = scorerEv ? rosterById(scorerEv.playerId) : null;
      var chips = state.roster
        .filter(function (p) { return (!scorer || p.id !== scorer.id) && isOnField(match, p.id); })
        .map(function (p) { return '<button class="assist-chip" data-assist="' + p.id + '">' + esc(p.name) + "</button>"; })
        .join("");
      assistBarHtml =
        '<div class="assist-bar" id="assistBar">' +
          '<div class="a-title">Goal' + (scorer ? " by " + esc(scorer.name) : "") + "! Assist by:</div>" +
          '<div class="assist-chip-row">' + chips + '<button class="assist-chip" data-assist="none">No assist</button></div>' +
        "</div>";
    }

    var tilesHtml = state.roster.map(function (p) {
      var goals = stats.scorers[p.id] || 0;
      var assistCount = stats.assists[p.id] || 0;
      var bits = [];
      if (goals) bits.push(goals + (goals === 1 ? " goal" : " goals"));
      if (state.settings.trackAssists && assistCount) bits.push(assistCount + " ast");
      var onField = isOnField(match, p.id);
      var sentOff = state.settings.trackCards && hasRedCard(match, p.id);
      var fieldBadge = '<button class="field-badge ' + (sentOff ? "sent-off-badge" : (onField ? "on" : "off")) + '" data-field="' + p.id + '"' + (sentOff ? " disabled" : "") + '>' + (sentOff ? "Sent off" : (onField ? "On pitch" : "Bench")) + "</button>";
      var controls = "";
      if (state.settings.trackCards) {
        var pcards = stats.cards[p.id] || [];
        var yellows = pcards.filter(function (c) { return c === "yellow"; }).length;
        var reds = pcards.filter(function (c) { return c === "red"; }).length;
        if (yellows) bits.push(yellows + (yellows === 1 ? " yellow" : " yellows"));
        if (reds) bits.push("red");
        controls +=
          '<button class="mini-card yellow-btn' + (yellows ? " card-yellow" : "") + '" data-card-yellow="' + p.id + '" aria-label="Give yellow card"' + (sentOff ? " disabled" : "") + "></button>" +
          '<button class="mini-card red-btn' + (reds ? " card-red" : "") + '" data-card-red="' + p.id + '" aria-label="Give red card"' + (sentOff ? " disabled" : "") + "></button>";
      }
      return (
        '<div class="tile' + (onField ? "" : " benched") + (sentOff ? " sent-off" : "") + '" data-tile="' + p.id + '" data-goal="' + p.id + '">' +
          fieldBadge +
          '<div class="tile-num">' + esc(p.number || "") + "</div>" +
          '<div class="tile-name">' + esc(p.name) + "</div>" +
          '<div class="tile-goals">' + esc(bits.join(" · ")) + "</div>" +
          (controls ? '<div class="tile-controls">' + controls + "</div>" : "") +
        "</div>"
      );
    }).join("");

    var eventsHtml = match.events.slice().reverse().map(function (ev) {
      var desc = "";
      if (ev.type === "goal") {
        var scorer = rosterById(ev.playerId);
        desc = "⚽ " + esc(scorer ? scorer.name : "Goal");
        if (ev.assistId) {
          var assister = rosterById(ev.assistId);
          if (assister) desc += " (assist: " + esc(assister.name) + ")";
        }
      } else if (ev.type === "opponent_goal") {
        desc = "⚽ " + esc(match.opponentName);
      } else if (ev.type === "card") {
        var cp = rosterById(ev.playerId);
        desc = (ev.cardType === "red" ? "🟥 " : "🟨 ") + esc(cp ? cp.name : "");
      }
      var editable = ev.type === "goal" || ev.type === "card";
      var actions = editable
        ? '<button class="event-edit" data-edit-event="' + ev.id + '" aria-label="Edit this entry">✎</button><button class="event-delete" data-del-event="' + ev.id + '" aria-label="Delete this entry">✕</button>'
        : '<button class="event-delete" data-del-event="' + ev.id + '" aria-label="Delete this entry">✕</button>';
      return '<div class="event-row"><span class="event-minute">' + ev.minuteAtEvent + "'</span><span class=\"event-desc\">" + desc + '</span><div class="event-actions">' + actions + "</div></div>";
    }).join("");

    el.innerHTML =
      (state.settings.trackAssists ? assistBarHtml : "") +
      '<div class="player-grid">' + tilesHtml + "</div>" +
      '<button class="opp-goal-btn" id="oppGoalBtn">+ ' + esc(match.opponentName) + " scored</button>" +
      '<h2 class="section-title">Match log</h2>' +
      '<div class="event-log">' + (eventsHtml || '<div class="empty-state">No events logged yet — tap a player to add a goal.</div>') + "</div>" +
      '<button class="btn btn-danger end-match-btn" id="endMatchBtn">End match</button>';

    document.getElementById("oppGoalBtn").onclick = logOpponentGoal;
    document.getElementById("endMatchBtn").onclick = function () {
      showConfirm("End the match? This saves the result to history.", "End match", endMatch, true);
    };
    var ab = document.getElementById("assistBar");
    if (ab) {
      ab.querySelectorAll("[data-assist]").forEach(function (btn) {
        btn.onclick = function () {
          var v = btn.getAttribute("data-assist");
          setAssist(v === "none" ? null : v);
        };
      });
    }
    el.querySelectorAll("[data-goal]").forEach(function (n) {
      n.onclick = function () { logGoal(n.getAttribute("data-goal")); };
    });
    el.querySelectorAll("[data-field]").forEach(function (btn) {
      btn.onclick = function (e) { e.stopPropagation(); toggleField(btn.getAttribute("data-field")); };
    });
    el.querySelectorAll("[data-card-yellow]").forEach(function (btn) {
      btn.onclick = function (e) { e.stopPropagation(); toggleCard(btn.getAttribute("data-card-yellow"), "yellow"); };
    });
    el.querySelectorAll("[data-card-red]").forEach(function (btn) {
      btn.onclick = function (e) { e.stopPropagation(); toggleCard(btn.getAttribute("data-card-red"), "red"); };
    });
    el.querySelectorAll("[data-del-event]").forEach(function (btn) {
      btn.onclick = function () {
        var id = btn.getAttribute("data-del-event");
        showConfirm("Delete this entry from the log?", "Delete", function () { deleteEvent(id); }, true);
      };
    });
    el.querySelectorAll("[data-edit-event]").forEach(function (btn) {
      btn.onclick = function () { showEditEvent(btn.getAttribute("data-edit-event")); };
    });
  }

  function renderSummaryScreen() {
    var el = document.getElementById("matchScreen");
    var record = state.history[0];
    if (!record) { view = "match"; render(); return; }

    var scorerRows = Object.keys(record.scorers).map(function (pid) {
      var p = rosterById(pid);
      return { name: p ? p.name : "Unknown", goals: record.scorers[pid], assists: record.assists[pid] || 0 };
    }).sort(function (a, b) { return b.goals - a.goals; });

    var scorerHtml = scorerRows.length
      ? scorerRows.map(function (r) {
          var extra = state.settings.trackAssists && r.assists ? " · " + r.assists + " ast" : "";
          return '<div class="stat-row"><span class="sr-name">' + esc(r.name) + '</span><span class="sr-val">' + r.goals + (r.goals === 1 ? " goal" : " goals") + esc(extra) + "</span></div>";
        }).join("")
      : '<div class="empty-state">No goals scored by your team.</div>';

    var minuteRows = Object.keys(record.playingTimeMinutes || {})
      .map(function (pid) {
        var p = rosterById(pid);
        return { name: p ? p.name : "Unknown", minutes: record.playingTimeMinutes[pid] };
      })
      .filter(function (r) { return r.minutes > 0; })
      .sort(function (a, b) { return b.minutes - a.minutes; });
    var minutesHtml = minuteRows.map(function (r) {
      return '<div class="stat-row"><span class="sr-name">' + esc(r.name) + '</span><span class="sr-val">' + r.minutes + " min</span></div>";
    }).join("");

    var isHome = record.isHome !== false;
    var d = new Date(record.date);
    var dateStr = isNaN(d) ? "" : d.toLocaleDateString(undefined, { weekday: "short", day: "numeric", month: "short", year: "numeric" });
    var timeline = goalTimeline(record.events, record.opponentName);
    var shareText = buildShareText(record);

    el.innerHTML =
      '<h1 class="screen-title">Match summary</h1>' +
      '<div class="summary-score">' +
        '<div class="ss-num">' + record.scoreUs + " – " + record.scoreThem + "</div>" +
        '<div class="ss-teams">' + esc(record.teamName) + (isHome ? " (Home)" : " (Away)") + " vs " + esc(record.opponentName) + (isHome ? " (Away)" : " (Home)") + "</div>" +
        (dateStr ? '<div class="ss-teams">' + esc(dateStr) + "</div>" : "") +
      "</div>" +
      '<h2 class="section-title">Scorers</h2>' +
      '<div class="stat-list">' + scorerHtml + "</div>" +
      '<h2 class="section-title">Goal timeline</h2>' +
      '<div class="event-log">' + timelineHtml(timeline) + "</div>" +
      (state.settings.trackPlayingTime && minuteRows.length ? '<h2 class="section-title">Playing time</h2><div class="stat-list">' + minutesHtml + "</div>" : "") +
      '<button class="btn btn-gold" id="copySummaryBtn" style="margin-top:18px;">Copy summary to share</button>' +
      '<div class="btn-row" style="margin-top:10px;">' +
        '<button class="btn btn-primary" id="newMatchBtn">Start next match</button>' +
        '<button class="btn btn-ghost" id="doneBtn">Done</button>' +
      "</div>";

    document.getElementById("copySummaryBtn").onclick = function () { copyShareText(shareText); };
    document.getElementById("newMatchBtn").onclick = function () { view = "match"; render(); };
    document.getElementById("doneBtn").onclick = function () { view = "match"; render(); };
  }

  function renderTeamScreen() {
    var el = document.getElementById("teamScreen");
    var rosterHtml = state.roster.map(function (p) {
      return (
        '<div class="roster-item">' +
          '<div class="roster-num">' + esc(p.number || "–") + "</div>" +
          '<div class="roster-name">' + esc(p.name) + "</div>" +
          '<button class="roster-remove" data-remove="' + p.id + '">Remove</button>' +
        "</div>"
      );
    }).join("");

    function toggleRow(key, title, desc) {
      var on = !!state.settings[key];
      return (
        '<div class="toggle-row">' +
          '<div class="toggle-copy"><div class="t-title">' + title + '</div><div class="t-desc">' + desc + "</div></div>" +
          '<button class="switch' + (on ? " on" : "") + '" data-toggle="' + key + '" aria-pressed="' + on + '"></button>' +
        "</div>"
      );
    }

    el.innerHTML =
      '<h1 class="screen-title">Team &amp; settings</h1>' +
      '<div class="card">' +
        '<label class="field-label" for="teamNameInput">Team name</label>' +
        '<input class="text-input" id="teamNameInput" value="' + esc(state.teamName) + '" style="margin-bottom:0;">' +
      "</div>" +
      '<h2 class="section-title">Players</h2>' +
      '<div class="card">' +
        '<div class="roster-list">' + (rosterHtml || '<div class="empty-state">No players yet — add your first one below.</div>') + "</div>" +
        '<div class="add-player-row">' +
          '<div class="num-input"><label class="field-label" for="newNum">No.</label><input class="text-input" id="newNum" inputmode="numeric" maxlength="3"></div>' +
          '<div class="name-input"><label class="field-label" for="newName">Name</label><input class="text-input" id="newName"></div>' +
          '<button class="btn btn-primary" id="addPlayerBtn">Add</button>' +
        "</div>" +
      "</div>" +
      '<h2 class="section-title">Match options</h2>' +
      '<p class="hint">Off by default — turn on only what you actually want to track.</p>' +
      '<div class="card">' +
        toggleRow("trackAssists", "Assists", "Ask who assisted after each goal") +
        toggleRow("trackPlayingTime", "Playing time", "Show total minutes played in match summaries. Who's on the pitch is always tracked, so benched players can't be tapped by mistake.") +
        toggleRow("trackCards", "Cards", "Log yellow and red cards") +
      "</div>" +
      '<h2 class="section-title">Share this team</h2>' +
      '<p class="hint">Export your roster and settings so another parent or coach can import them instead of typing everything in again.</p>' +
      '<div class="btn-row">' +
        '<button class="btn btn-primary" id="exportBtn">Export team data</button>' +
        '<button class="btn btn-ghost" id="importBtn">Import team data</button>' +
      "</div>";

    document.getElementById("teamNameInput").onchange = function (e) {
      state.teamName = e.target.value.trim() || "My Team";
      persist();
    };
    document.getElementById("addPlayerBtn").onclick = function () {
      var num = document.getElementById("newNum").value;
      var name = document.getElementById("newName").value;
      addPlayer(name, num);
    };
    el.querySelectorAll("[data-remove]").forEach(function (btn) {
      btn.onclick = function () {
        var id = btn.getAttribute("data-remove");
        showConfirm("Remove this player from the roster?", "Remove", function () { removePlayer(id); }, true);
      };
    });
    el.querySelectorAll("[data-toggle]").forEach(function (btn) {
      btn.onclick = function () {
        var key = btn.getAttribute("data-toggle");
        state.settings[key] = !state.settings[key];
        persist();
        render();
      };
    });
    document.getElementById("exportBtn").onclick = exportData;
    document.getElementById("importBtn").onclick = function () {
      document.getElementById("importFileInput").click();
    };
  }

  function renderHistoryScreen() {
    var el = document.getElementById("historyScreen");

    var season = {};
    var played = 0, wins = 0, draws = 0, losses = 0;
    state.history.forEach(function (m) {
      played++;
      if (m.scoreUs > m.scoreThem) wins++;
      else if (m.scoreUs < m.scoreThem) losses++;
      else draws++;
      Object.keys(m.scorers || {}).forEach(function (pid) {
        if (!season[pid]) season[pid] = { goals: 0, assists: 0 };
        season[pid].goals += m.scorers[pid];
      });
      Object.keys(m.assists || {}).forEach(function (pid) {
        if (!season[pid]) season[pid] = { goals: 0, assists: 0, minutes: 0 };
        season[pid].assists += m.assists[pid];
      });
      Object.keys(m.playingTimeMinutes || {}).forEach(function (pid) {
        if (!season[pid]) season[pid] = { goals: 0, assists: 0, minutes: 0 };
        season[pid].minutes = (season[pid].minutes || 0) + m.playingTimeMinutes[pid];
      });
    });
    var seasonRows = Object.keys(season).map(function (pid) {
      var p = rosterById(pid);
      return { name: p ? p.name : "Unknown", goals: season[pid].goals || 0, assists: season[pid].assists || 0, minutes: season[pid].minutes || 0 };
    }).sort(function (a, b) { return b.goals - a.goals; });

    var seasonHtml = seasonRows.length
      ? seasonRows.map(function (r) {
          var extra = "";
          if (state.settings.trackAssists) extra += " · " + r.assists + " ast";
          if (state.settings.trackPlayingTime) extra += " · " + r.minutes + " min";
          return '<div class="stat-row"><span class="sr-name">' + esc(r.name) + '</span><span class="sr-val">' + r.goals + (r.goals === 1 ? " goal" : " goals") + esc(extra) + "</span></div>";
        }).join("")
      : '<div class="empty-state">No matches recorded yet.</div>';

    var listHtml = state.history.map(function (m) {
      var result = m.scoreUs > m.scoreThem ? "win" : (m.scoreUs < m.scoreThem ? "loss" : "draw");
      var resultLabel = result === "win" ? "W" : (result === "loss" ? "L" : "D");
      var scorerNames = Object.keys(m.scorers || {}).map(function (pid) {
        var p = rosterById(pid);
        var n = p ? p.name : "?";
        return m.scorers[pid] > 1 ? n + " (" + m.scorers[pid] + ")" : n;
      }).join(", ");
      var d = new Date(m.date);
      var dateStr = isNaN(d) ? "" : d.toLocaleDateString();
      var homeAwayLabel = m.isHome !== false ? "Home" : "Away";
      return (
        '<div class="history-item">' +
          '<div class="hi-top">' +
            '<div><span class="hi-score">' + m.scoreUs + " – " + m.scoreThem + "</span> <span class=\"result-pill " + result + "\">" + resultLabel + "</span></div>" +
            '<div class="hi-actions">' +
              '<button class="hi-copy" data-copy="' + m.id + '">Copy</button>' +
              '<button class="hi-remove" data-del="' + m.id + '">Delete</button>' +
            "</div>" +
          "</div>" +
          '<div class="hi-meta">vs ' + esc(m.opponentName) + " · " + homeAwayLabel + (dateStr ? " · " + dateStr : "") + "</div>" +
          (scorerNames ? '<div class="hi-scorers">' + esc(scorerNames) + "</div>" : "") +
        "</div>"
      );
    }).join("");

    el.innerHTML =
      '<h1 class="screen-title">History</h1>' +
      '<div class="card">' +
        '<div class="stat-row"><span class="sr-name">Record</span><span class="sr-val">' + played + " played · " + wins + "W " + draws + "D " + losses + "L</span></div>" +
      "</div>" +
      '<h2 class="section-title">Season top scorers</h2>' +
      '<div class="card"><div class="stat-list">' + seasonHtml + "</div></div>" +
      '<h2 class="section-title">Matches</h2>' +
      '<div class="card">' + (listHtml || '<div class="empty-state">No matches yet.</div>') + "</div>" +
      '<div class="btn-row">' +
        '<button class="btn btn-primary" id="exportBtn2">Export team data</button>' +
        '<button class="btn btn-ghost" id="importBtn2">Import team data</button>' +
      "</div>" +
      '<button class="btn btn-danger" id="clearAllBtn" style="margin-top:12px;">Clear all data on this device</button>';

    document.getElementById("exportBtn2").onclick = exportData;
    document.getElementById("importBtn2").onclick = function () {
      document.getElementById("importFileInput").click();
    };
    document.getElementById("clearAllBtn").onclick = function () {
      showConfirm(
        "This deletes the roster, settings and all match history on this device. This can't be undone.",
        "Clear everything",
        function () { state = defaultState(); persist(); view = "team"; render(); },
        true
      );
    };
    el.querySelectorAll("[data-del]").forEach(function (btn) {
      btn.onclick = function () {
        var id = btn.getAttribute("data-del");
        showConfirm("Delete this match from history?", "Delete", function () {
          state.history = state.history.filter(function (m) { return m.id !== id; });
          persist();
          render();
        }, true);
      };
    });
    el.querySelectorAll("[data-copy]").forEach(function (btn) {
      btn.onclick = function () {
        var id = btn.getAttribute("data-copy");
        var m = state.history.filter(function (h) { return h.id === id; })[0];
        if (m) copyShareText(buildShareText(m));
      };
    });
  }

  // ---------- global controls ----------

  document.querySelectorAll("[data-nav]").forEach(function (btn) {
    btn.onclick = function () {
      view = btn.getAttribute("data-nav");
      render();
    };
  });
  document.getElementById("helpBtn").onclick = showHelp;
  document.getElementById("clockBtn").onclick = toggleClock;
  document.getElementById("undoBtn").onclick = undoLast;
  document.getElementById("importFileInput").onchange = function (e) {
    var file = e.target.files && e.target.files[0];
    if (file) importDataFromFile(file);
    e.target.value = "";
  };

  setInterval(function () {
    if (state.activeMatch && state.activeMatch.clock.running && view === "match") {
      document.getElementById("clockTime").textContent = formatClock(clockElapsedMs(state.activeMatch));
    }
  }, 1000);

  render();
})();
</script>
</body>
</html>
