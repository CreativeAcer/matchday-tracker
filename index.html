            row("prep", "Prepared matches",
                "Matches set up for later, with their line-ups and who can\u2019t make it." +
                (parts.prep && !parts.players
                  ? " Player names travel with them, so another coach\u2019s app can match them up."
                  : "")) +
            '<div class="export-sum">' + (any ? esc(bits.join(" \u00b7 ")) : "Nothing selected.") + "</div>" +
            (any && !full
              ? '<div class="notice notice-warn export-warn">This is a partial file, not a backup. ' +
                'Keep a full export as well.</div>'
              : "") +
          "</div>" +
          '<button class="btn btn-primary" id="exportGoBtn"' + (any ? "" : " disabled") + ">Export" +
            (any ? "" : "") + "</button>" +
          '<button class="btn btn-ghost" id="exportCancelBtn">Cancel</button>' +
        "</div>";

      overlay.querySelectorAll("[data-part]").forEach(function (btn) {
        btn.onclick = function () {
          var k = btn.getAttribute("data-part");
          parts[k] = !parts[k];
          draw();
        };
      });
      document.getElementById("exportCancelBtn").onclick = function () { overlay.remove(); };
      var go = document.getElementById("exportGoBtn");
      go.onclick = function () {
        if (!(parts.players || parts.history || parts.prep)) return;
        overlay.remove();
        exportData(parts);
      };
    }

    overlay.onclick = function (e) { if (e.target === overlay) overlay.remove(); };
    draw();
  }

  async function exportData(parts) {
    parts = parts || defaultExportParts();
    var payload = buildExportPayload(parts);
    var json = JSON.stringify(payload, null, 2);
    var filename = exportFileName(parts);

    // Inside a published Claude artifact, use its native save prompt.
    if (window.claude && typeof window.claude.use === "function") {
      try {
        var downloads = await window.claude.use("downloads");
        if (downloads) {
          var result = await downloads.save({ filename: filename, data: json });
          // Only a file that really landed counts as a backup. Marking a
          // cancelled save as done removed the only warning that the season
          // was not backed up anywhere.
          if (result.status === "saved") {
            showToast("Saved " + filename);
            markExported(parts);
          } else {
            showToast("Not saved — your data still isn't backed up.", "warning");
          }
          return;
        }
      } catch (err) {
        if (err && err.code === "declined") return;
        // Fall through to a plain browser download below.
      }
    }

    // Inside the Android app a WebView cannot download a blob, so the file goes
    // through the share sheet (Drive, Files, mail, WhatsApp). The sheet cannot
    // tell us the file was kept, only that a place was chosen, so backing out
    // counts as not saved, exactly like a cancelled save elsewhere.
    if (nativeBridge()) {
      try {
        await nativeShareFile(filename, json, true, "Matchday Tracker backup");
        showToast("Shared " + filename);
        markExported(parts);
      } catch (err) {
        if (nativeCancelled(err)) {
          showToast("Not saved — your data still isn't backed up.", "warning");
        } else {
          console.error(err);
          showToast("Couldn't export right now.", "error");
        }
      }
      return;
    }

    // Standard browser download — works on any ordinary web server.
    try {
      var blob = new Blob([json], { type: "application/json" });
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
      showToast("Saved " + filename);
      markExported(parts);
    } catch (err) {
      console.error(err);
      showToast("Couldn't export right now.", "error");
    }
  }

  // Prepared matches point at player ids invented on the phone that typed the
  // roster. On another coach's phone those ids mean nothing, so fall back to
  // the names and numbers carried alongside them, and say plainly who could
  // not be matched rather than silently dropping them.
  // ---------- import ------------------------------------------------------
  // An export file is read the same way whether it is a backup being restored
  // or a squad shared between coaches — the difference is the coach's intent,
  // which the sheet asks for instead of guessing from the file's shape.

  // An import file can come from anyone. Names are escaped wherever they are
  // shown, but ids and numbers are written into the page as they are — so a
  // crafted file could put its own script into an attribute and have it run on
  // this device, and run again on every open once saved. Everything that ends
  // up in such a place is forced into a safe shape here, once, at the door.
  // Replacement ids are consistent within the file, so references between its
  // parts still line up. Entries that aren't objects at all (a null match, a
  // null event) are dropped: they used to crash the import or blank the app.
  function sanitiseImport(data) {
    if (!data || typeof data !== "object" || Array.isArray(data)) return null;
    var SAFE_ID = /^[A-Za-z0-9_-]{1,64}$/;
    var swap = {};
    function sid(v) {
      if (v === null || v === undefined || v === "") return v;
      var t = String(v);
      if (SAFE_ID.test(t)) return t;
      if (!swap[t]) swap[t] = uid();
      return swap[t];
    }
    function num(v) { var n = Number(v); return Number.isFinite(n) ? n : 0; }
    function str(v) { return typeof v === "string" ? v : (v == null ? "" : String(v)); }
    function objs(a) {
      return Array.isArray(a) ? a.filter(function (x) {
        return x && typeof x === "object" && !Array.isArray(x);
      }) : [];
    }
    function ids(a) { return Array.isArray(a) ? a.map(sid).filter(Boolean) : []; }
    function player(p) { return { id: sid(p.id) || uid(), name: str(p.name), number: str(p.number) }; }
    function tally(o, cards) {
      var out = {};
      if (!o || typeof o !== "object" || Array.isArray(o)) return out;
      Object.keys(o).forEach(function (k) {
        out[sid(k)] = cards
          ? (Array.isArray(o[k]) ? o[k] : []).filter(function (c) { return c === "yellow" || c === "red"; })
          : num(o[k]);
      });
      return out;
    }
    function event(e) {
      var out = Object.assign({}, e);
      out.id = sid(e.id) || uid();
      out.type = str(e.type);
      if ("playerId" in e) out.playerId = e.playerId == null ? null : sid(e.playerId);
      if ("assistId" in e) out.assistId = e.assistId == null ? null : sid(e.assistId);
      if (e.cardType != null) out.cardType = e.cardType === "red" ? "red" : "yellow";
      if (e.by != null) out.by = e.by === "us" ? "us" : "them";
      if (e.minuteAtEvent != null) out.minuteAtEvent = num(e.minuteAtEvent);
      if (e.period != null) out.period = num(e.period) || 1;
      if (e.ts != null) out.ts = num(e.ts);
      return out;
    }
    function plan(p) {
      if (!p || typeof p !== "object") return null;
      return { periods: num(p.periods),
               lineups: Array.isArray(p.lineups) ? p.lineups.map(ids) : [] };
    }
    function record(r) {
      var out = Object.assign({}, r);
      out.id = sid(r.id) || uid();
      out.opponentName = str(r.opponentName);
      if (r.teamName != null) out.teamName = str(r.teamName);
      out.isHome = r.isHome !== false;
      out.scoreUs = num(r.scoreUs);
      out.scoreThem = num(r.scoreThem);
      out.ownGoalsFor = num(r.ownGoalsFor);
      out.ownGoalsAgainst = num(r.ownGoalsAgainst);
      if (r.durationMinutes != null) out.durationMinutes = num(r.durationMinutes);
      if (typeof r.date !== "string" && typeof r.date !== "number") out.date = "";
      out.scorers = tally(r.scorers);
      out.assists = tally(r.assists);
      out.playingTimeMinutes = tally(r.playingTimeMinutes);
      out.cards = tally(r.cards, true);
      out.rosterSnapshot = objs(r.rosterSnapshot).map(player);
      out.events = objs(r.events).map(event);
      return out;
    }
    function upcoming(u) {
      var out = Object.assign({}, u);
      out.id = sid(u.id) || uid();
      out.opponentName = str(u.opponentName);
      out.kickoffAt = str(u.kickoffAt);
      out.unavailable = ids(u.unavailable);
      out.plan = plan(u.plan);
      if (u.updatedAt != null) out.updatedAt = num(u.updatedAt);
      return out;
    }
    function live(m) {
      if (!m || typeof m !== "object" || Array.isArray(m)) return null;
      var out = Object.assign({}, m);
      out.id = sid(m.id) || uid();
      out.opponentName = str(m.opponentName);
      out.isHome = m.isHome !== false;
      out.period = num(m.period) || 1;
      if (m.periodFormat != null) out.periodFormat = num(m.periodFormat);
      if (m.periodStartMs != null) out.periodStartMs = num(m.periodStartMs);
      out.events = objs(m.events).map(event);
      var pt = {};
      if (m.playingTime && typeof m.playingTime === "object" && !Array.isArray(m.playingTime)) {
        Object.keys(m.playingTime).forEach(function (k) {
          var v = m.playingTime[k];
          if (!v || typeof v !== "object") return;
          pt[sid(k)] = { onField: !!v.onField, accumMs: Math.max(0, num(v.accumMs)),
                         onSince: v.onSince == null ? null : num(v.onSince),
                         sentOff: !!v.sentOff,
                         wasOnFieldBeforeSendOff: v.wasOnFieldBeforeSendOff === false ? false
                           : (v.wasOnFieldBeforeSendOff === true ? true : undefined) };
        });
        out.playingTime = pt;
      } else {
        out.playingTime = null;
      }
      out.unavailable = ids(m.unavailable);
      if (m.startingLineup != null) out.startingLineup = ids(m.startingLineup);
      out.plan = plan(m.plan);
      out.clock = { running: false,
                    elapsedMs: Math.max(0, num(m.clock && m.clock.elapsedMs)),
                    runningSince: null };
      // An undo-able break belongs to the device it happened on.
      delete out.lastAdvance;
      return out;
    }
    var set = null;
    if (data.settings && typeof data.settings === "object") {
      set = {};
      Object.keys(defaultSettings()).forEach(function (k) {
        if (k in data.settings) set[k] = !!data.settings[k];
      });
    }
    return {
      exportedFrom: str(data.exportedFrom),
      teamName: str(data.teamName) || "My Team",
      roster: Array.isArray(data.roster) ? objs(data.roster).map(player) : undefined,
      playerRefs: Array.isArray(data.playerRefs) ? objs(data.playerRefs).map(player) : undefined,
      settings: set,
      history: Array.isArray(data.history) ? objs(data.history).map(record) : undefined,
      upcoming: Array.isArray(data.upcoming) ? objs(data.upcoming).map(upcoming) : undefined,
      activeMatch: live(data.activeMatch),
      lastLineup: Array.isArray(data.lastLineup) ? ids(data.lastLineup) : undefined,
      lastPlan: plan(data.lastPlan),
      lastPeriodMinutes: data.lastPeriodMinutes
    };
  }

  // What a file actually holds, whatever shape it arrived in. A file with no
  // squad of its own still carries the names behind its matches and line-ups,
  // so those stand in as the roster.
  function readImportFile(data) {
    data = sanitiseImport(data);
    if (!data) return null;
    var rawRoster = Array.isArray(data.roster) ? data.roster
      : (Array.isArray(data.playerRefs) ? data.playerRefs : []);
    var file = {
      teamName: data.teamName || "My Team",
      // Only a real roster brings settings with it; a list of names carried
      // alongside prepared matches does not make the file a squad.
      hasPlayers: Array.isArray(data.roster) && data.roster.length > 0,
      roster: rawRoster.map(function (p) {
        return { id: p.id || uid(), name: p.name || "", number: p.number || "" };
      }),
      settings: data.settings || null,
      history: Array.isArray(data.history) ? data.history : [],
      upcoming: Array.isArray(data.upcoming)
        ? data.upcoming.map(normaliseUpcoming).filter(Boolean) : [],
      raw: data
    };
    file.hasHistory = file.history.length > 0;
    file.hasPrep = file.upcoming.length > 0;
    // A backup taken mid-match carries a game in progress and no history at
    // all. Without counting that as something the file holds, the matches
    // switch never appeared and the game was quietly left behind.
    file.hasLive = !!(data.activeMatch && typeof data.activeMatch === "object" &&
                      Array.isArray(data.activeMatch.events));
    if (!file.hasPlayers && !file.hasHistory && !file.hasPrep && !file.hasLive) return null;
    return file;
  }

  // Player ids are invented on whichever device typed the squad, so the same
  // child has a different id on the laptop and on the tablet. Matching on name
  // and number is what lets two devices' records add up to one season instead
  // of listing the same player twice.
  function matchPlayers(fileRoster, myRoster) {
    var keyOf = function (nm, num) {
      return String(nm || "").trim().toLowerCase() + "#" + String(num || "").trim();
    };
    var looseOf = function (nm) { return String(nm || "").trim().toLowerCase(); };
    var mine = {}, exact = {}, byName = {}, nameCount = {}, fileNameCount = {};
    (myRoster || []).forEach(function (p) {
      mine[p.id] = true;
      exact[keyOf(p.name, p.number)] = p.id;
      var n = looseOf(p.name);
      nameCount[n] = (nameCount[n] || 0) + 1;
      if (!byName[n]) byName[n] = p.id;
    });
    (fileRoster || []).forEach(function (p) {
      var n = looseOf(p.name);
      fileNameCount[n] = (fileNameCount[n] || 0) + 1;
    });
    var map = {}, unmatched = [], matched = 0;
    (fileRoster || []).forEach(function (p) {
      // The same id is the same child, however the name is spelt: a name
      // corrected on one device must not come back as a second player.
      var hit = mine[p.id] ? p.id : exact[keyOf(p.name, p.number)];
      if (!hit) {
        // Only when the name points at exactly one child on BOTH sides. Two
        // children called Romeo must never be guessed between — not here,
        // and not in the file either.
        var n = looseOf(p.name);
        if (nameCount[n] === 1 && fileNameCount[n] === 1) hit = byName[n];
      }
      if (hit) { map[p.id] = hit; matched++; }
      else unmatched.push(p);
    });
    return { map: map, unmatched: unmatched, matched: matched };
  }

  // Tallies keyed by player id. Two of the file's players folding onto one of
  // mine have to add up rather than overwrite each other.
  function remapTally(obj, map) {
    var out = {};
    Object.keys(obj || {}).forEach(function (k) {
      var nk = map[k] || k;
      var v = obj[k];
      if (typeof v === "number") out[nk] = (out[nk] || 0) + v;
      else if (Array.isArray(v)) out[nk] = (out[nk] || []).concat(v);
      else out[nk] = v;
    });
    return out;
  }

  function remapRecord(rec, map) {
    var m = function (id) { return (id && map[id]) || id; };
    var copy = Object.assign({}, rec);
    copy.rosterSnapshot = (rec.rosterSnapshot || []).map(function (p) {
      return { id: m(p.id), name: p.name, number: p.number };
    });
    copy.scorers = remapTally(rec.scorers, map);
    copy.assists = remapTally(rec.assists, map);
    copy.cards = remapTally(rec.cards, map);
    copy.playingTimeMinutes = remapTally(rec.playingTimeMinutes, map);
    copy.events = (rec.events || []).map(function (e) {
      var ne = Object.assign({}, e);
      if (ne.playerId) ne.playerId = m(ne.playerId);
      if (ne.assistId) ne.assistId = m(ne.assistId);
      return ne;
    });
    return copy;
  }

  function remapUpcoming(u, map) {
    var m = function (id) { return (id && map[id]) || id; };
    var copy = Object.assign({}, u);
    copy.unavailable = (u.unavailable || []).map(m);
    copy.plan = u.plan ? {
      periods: u.plan.periods,
      lineups: u.plan.lineups.map(function (row) { return row.map(m); })
    } : null;
    return copy;
  }

  // A match in progress from another device points at that device's ids.
  function remapLive(m, map) {
    var f = function (id) { return (id && map[id]) || id; };
    var copy = Object.assign({}, m);
    copy.playingTime = remapTally(m.playingTime, map);
    copy.events = (m.events || []).map(function (e) {
      var ne = Object.assign({}, e);
      if (ne.playerId) ne.playerId = f(ne.playerId);
      if (ne.assistId) ne.assistId = f(ne.assistId);
      return ne;
    });
    copy.unavailable = (m.unavailable || []).map(f);
    if (m.startingLineup) copy.startingLineup = m.startingLineup.map(f);
    if (m.plan) copy.plan = { periods: m.plan.periods,
      lineups: (m.plan.lineups || []).map(function (r) { return r.map(f); }) };
    return copy;
  }

  // Dates are stored as ISO strings, which cannot simply be subtracted.
  function dateMs(v) {
    if (typeof v === "number") return v;
    var t = Date.parse(v);
    return isNaN(t) ? 0 : t;
  }

  // The one function that decides what a merge does. The preview on the sheet
  // and the button that commits it both call this, so the sentence the coach
  // reads cannot disagree with what actually happens.
  function mergeIntoTeam(target, file, parts) {
    var t = JSON.parse(JSON.stringify(target));
    var s = { playersAdded: 0, playersMatched: 0, matchesAdded: 0, matchesKept: 0,
              prepAdded: 0, prepUpdated: 0, prepSame: 0, prepKeptNewer: 0,
              planTurnedOn: false, liveRestored: false, liveSkipped: "",
              unmatchedNames: [],
              // A file with prepared matches but no names at all can only have
              // come from a version before the names travelled.
              namesMissing: !!(parts.prep && file.hasPrep && !file.roster.length) };

    var mp = matchPlayers(file.roster, t.roster);
    s.playersMatched = mp.matched;

    if (parts.players) {
      mp.unmatched.forEach(function (p) {
        var clash = t.roster.some(function (x) { return x.id === p.id; });
        var id = clash ? uid() : p.id;
        t.roster.push({ id: id, name: p.name, number: p.number });
        mp.map[p.id] = id;
        s.playersAdded++;
      });
    } else {
      // Their records still have to read correctly, so anyone who can't be
      // matched keeps the file's own id and leans on the match's own snapshot.
      mp.unmatched.forEach(function (p) { s.unmatchedNames.push(p.name || "a player"); });
    }

    if (parts.history) {
      // Someone removed from the other device's squad still appears in the
      // matches they played. Matching them too keeps one child one row in the
      // season totals; they are never added to the squad from here.
      var inFile = {}, extra = [], seenExtra = {};
      file.roster.forEach(function (p) { inFile[p.id] = true; });
      file.history.forEach(function (r) {
        (r.rosterSnapshot || []).forEach(function (p) {
          if (!inFile[p.id] && !mp.map[p.id] && !seenExtra[p.id]) { seenExtra[p.id] = true; extra.push(p); }
        });
      });
      var mpExtra = matchPlayers(extra, t.roster);
      Object.keys(mpExtra.map).forEach(function (k) { mp.map[k] = mpExtra.map[k]; });

      var seen = {};
      t.history.forEach(function (r) { seen[r.id] = true; });
      file.history.forEach(function (r) {
        if (!r || !r.id) return;
        // Same id means the same match. Whatever is already here wins: a
        // correction made on this device must not be undone by an older file.
        if (seen[r.id]) { s.matchesKept++; return; }
        t.history.push(remapRecord(r, mp.map));
        seen[r.id] = true;
        s.matchesAdded++;
      });
      t.history.sort(function (a, b) { return dateMs(b.date) - dateMs(a.date); });
    }

    var planArrived = false;
    var hasPlan = function (u) {
      return !!(u.plan && u.plan.lineups.some(function (r) { return r.length; }));
    };
    if (parts.prep) {
      t.upcoming = t.upcoming || [];
      file.upcoming.forEach(function (u) {
        var mapped = remapUpcoming(u, mp.map);
        var at = -1;
        for (var i = 0; i < t.upcoming.length; i++) {
          if (t.upcoming[i].id === mapped.id) { at = i; break; }
        }
        if (at === -1) {
          t.upcoming.push(mapped); s.prepAdded++;
          if (hasPlan(mapped)) planArrived = true;
          return;
        }
        var here = t.upcoming[at];
        // Identical is not an update — re-importing the same file changes
        // nothing and should say so.
        if (prepSignature([here]) === prepSignature([mapped])) { s.prepSame++; return; }
        // Otherwise the most recent edit wins, the same rule as for matches:
        // restoring an old backup must not undo a line-up changed since.
        // With no timestamp on either side (made before they existed) the
        // file wins, which is what re-sending an updated prep relies on.
        var fileAt = mapped.updatedAt || 0, hereAt = here.updatedAt || 0;
        if (fileAt > hereAt || (!fileAt && !hereAt)) {
          t.upcoming[at] = mapped; s.prepUpdated++;
          if (hasPlan(mapped)) planArrived = true;
        } else {
          s.prepKeptNewer++;
        }
      });
    }

    // A line-up plan is useless on a device where the option is off: it would
    // be stored and then ignored at kick-off, quietly fielding the whole squad.
    // Only a plan that actually came in from the file counts; one already here
    // is the coach's own business.
    if (parts.prep && planArrived && !t.settings.planLineups) {
      t.settings.planLineups = true;
      s.planTurnedOn = true;
    }

    // A match being played here is never displaced by one from a file. The
    // file's match points at the other device's player ids, so it goes
    // through the same mapping as everything else before it is checked.
    if (parts.history && file.raw.activeMatch) {
      if (t.activeMatch) {
        s.liveSkipped = "busy";
      } else {
        var live = restoredActiveMatch({ activeMatch: remapLive(file.raw.activeMatch, mp.map),
                                         roster: t.roster });
        if (live) { t.activeMatch = live; s.liveRestored = true; }
        else s.liveSkipped = "invalid";
      }
    }

    return { team: t, summary: s };
  }

  // Plain English for what the chosen combination will do. Built from the same
  // summary the merge produces, so it counts what will really happen.
  function describeImport(mode, file, target, parts, summary) {
    if (mode === "new") {
      var bits = [];
      if (parts.players || parts.history || parts.prep) bits.push(file.roster.length + " players");
      if (parts.history && file.hasHistory) bits.push(file.history.length +
        (file.history.length === 1 ? " match played" : " matches played"));
      if (parts.history && file.hasLive) bits.push("the match in progress");
      if (parts.prep) bits.push(file.upcoming.length + " prepared");
      if (!bits.length) return "Nothing selected.";
      return "Creates a new team with " + bits.join(", ") + ". Your other teams are untouched.";
    }
    if (mode === "replace") {
      var goes = [];
      if ((target.history || []).length) goes.push(target.history.length +
        (target.history.length === 1 ? " match" : " matches"));
      if ((target.upcoming || []).length) goes.push(target.upcoming.length +
        (target.upcoming.length === 1 ? " prepared match" : " prepared matches"));
      var txt = "“" + target.teamName + "” becomes exactly what this file holds.";
      if (target.activeMatch) txt += " The match in progress ends.";
      if (goes.length) txt += " Its own " + goes.join(" and ") + " are deleted.";
      return txt;
    }
    var adds = [];
    if (parts.players && summary.playersAdded) {
      adds.push(summary.playersAdded + (summary.playersAdded === 1
        ? " player you don’t have" : " players you don’t have"));
    }
    if (parts.history && summary.matchesAdded) {
      adds.push(summary.matchesAdded + (summary.matchesAdded === 1 ? " new match" : " new matches"));
    }
    if (parts.prep && summary.prepAdded) {
      adds.push(summary.prepAdded + (summary.prepAdded === 1
        ? " prepared match" : " prepared matches"));
    }
    // Updates are a different verb from adds; folding them into one list read
    // as "Adds updates 1 prepared match".
    var upd = (parts.prep && summary.prepUpdated)
      ? summary.prepUpdated + (summary.prepUpdated === 1 ? " prepared match" : " prepared matches")
      : "";
    var out;
    if (adds.length && upd) out = "Adds " + adds.join(", ") + " and updates " + upd + ". Nothing is removed.";
    else if (adds.length) out = "Adds " + adds.join(", ") + ". Nothing is removed.";
    else if (upd) out = "Updates " + upd + ". Nothing is removed.";
    else if (summary.liveRestored) out = "Picks up the match in progress. Nothing is removed.";
    else out = "Nothing new to add — everything selected is already here.";
    if (parts.prep && summary.prepKeptNewer) {
      out += " " + summary.prepKeptNewer + (summary.prepKeptNewer === 1
        ? " prepared match was changed more recently here and is left as it is."
        : " prepared matches were changed more recently here and are left as they are.");
    }
    if (parts.history && summary.matchesKept) {
      out += " " + summary.matchesKept + (summary.matchesKept === 1
        ? " match was already here and is left as it is."
        : " matches were already here and are left as they are.");
    }
    if (!parts.players && summary.unmatchedNames.length) {
      out += " " + summary.unmatchedNames.length + (summary.unmatchedNames.length === 1
        ? " player isn’t in your squad (" : " players aren’t in your squad (") +
        summary.unmatchedNames.slice(0, 3).join(", ") +
        (summary.unmatchedNames.length > 3 ? "…" : "") +
        "); turn on Players to bring them in.";
    }
    if (parts.prep && !file.roster.length) {
      out += " The line-ups in it can’t be filled in: that file was made by an older version " +
             "and doesn’t carry the player names. Ask for a fresh export.";
    }
    if (summary.planTurnedOn) out += " Line-up plan gets switched on, so the plan in the file is used.";
    if (summary.liveRestored && (adds.length || upd)) {
      out += " The match in progress in the file is restored, with its clock stopped.";
    }
    if (summary.liveSkipped === "busy") {
      out += " The match in progress in the file is left out: this team already has one running.";
    } else if (summary.liveSkipped === "invalid") {
      out += " The match in progress in the file couldn’t be matched to your players and is left out.";
    }
    return out;
  }

  function showImportSheet(data) {
    var file = readImportFile(data);
    if (!file) {
      showToast("That file doesn’t look like a Matchday Tracker export.", "error");
      return;
    }

    // The team the file is probably about: one with the same name if there is
    // one, otherwise whichever team is open.
    var target = null;
    for (var i = 0; i < state.teams.length; i++) {
      if (state.teams[i].teamName === file.teamName) { target = state.teams[i]; break; }
    }
    var nameMatched = !!target;
    if (!target) target = T();

    // Which choice is right depends on what the file is. A full squad under a
    // name this device doesn't know is another coach's team, and belongs beside
    // yours. Your own backup, or a share that carries no squad of its own,
    // belongs inside the team you already have.
    var mode = (file.hasPlayers && !nameMatched) ? "new" : "merge";
    var parts = { players: file.roster.length > 0,
                  history: file.hasHistory || file.hasLive, prep: file.hasPrep };

    var old = document.getElementById("importOverlay");
    if (old) old.remove();
    var overlay = document.createElement("div");
    overlay.className = "overlay";
    overlay.id = "importOverlay";
    document.body.appendChild(overlay);

    function partRow(key, title, desc) {
      return '<button class="toggle-row" data-ipart="' + key + '" aria-pressed="' + !!parts[key] + '">' +
        '<span class="toggle-copy"><span class="t-title">' + title + '</span>' +
        '<span class="t-desc">' + desc + "</span></span>" +
        '<span class="switch' + (parts[key] ? " on" : "") + '"></span></button>';
    }
    function modeRow(key, title, desc, danger) {
      return '<button class="toggle-row' + (danger ? " mode-danger" : "") + '" data-imode="' + key +
        '" aria-pressed="' + (mode === key) + '">' +
        '<span class="toggle-copy"><span class="t-title">' + title + '</span>' +
        '<span class="t-desc">' + desc + "</span></span>" +
        '<span class="radio' + (mode === key ? " on" : "") + '"></span></button>';
    }

    // A file that is broken in a way nothing above caught must not leave a
    // dimmed, empty layer over the app that neither a tap nor Escape removes.
    function draw() {
      try { drawSheet(); }
      catch (err) {
        console.error(err);
        overlay.remove();
        showToast("That file couldn\u2019t be read \u2014 nothing was changed.", "error");
      }
    }

    function drawSheet() {
      var summary = null, anyPart = parts.players || parts.history || parts.prep;
      if (mode === "merge") summary = mergeIntoTeam(target, file, parts).summary;
      var says = describeImport(mode, file, target, parts, summary);

      var holds = [];
      if (file.roster.length) holds.push(file.roster.length +
        (file.roster.length === 1 ? " player" : " players"));
      if (file.hasHistory) holds.push(file.history.length +
        (file.history.length === 1 ? " match played" : " matches played"));
      if (file.hasPrep) holds.push(file.upcoming.length + " prepared");
      if (file.raw.activeMatch) holds.push("a match in progress");

      overlay.innerHTML =
        '<div class="card-sheet">' +
          '<div class="plan-title">Import</div>' +
          '<div class="card-scroll export-scroll">' +
            '<div class="import-file"><strong>' + esc(file.teamName) + "</strong><br>" +
              esc(holds.join(" · ")) + "</div>" +
            '<div class="field-label" style="margin-top:14px;">Where does it go?</div>' +
            modeRow("merge", "Add to “" + esc(target.teamName) + "”",
              nameMatched ? "Keeps everything you already have."
                          : "The team you have open. Keeps everything you already have.") +
            modeRow("new", "As a new team", "Leaves your other teams alone.") +
            modeRow("replace", "Replace “" + esc(target.teamName) + "”",
              "For restoring a device. Deletes what that team has now.", true) +
            (mode === "replace" ? "" :
              '<div class="field-label" style="margin-top:14px;">What do you want from it?</div>' +
              (file.roster.length ? partRow("players", "Players &amp; settings",
                mode === "new" ? "The squad this file was made with."
                               : "Adds anyone who isn’t in your squad yet.") : "") +
              ((file.hasHistory || file.hasLive) ? partRow("history",
                file.hasHistory ? "Matches played" : "The match in progress",
                file.hasHistory
                  ? ("Matches you don’t already have, with their scorers." +
                     (file.hasLive ? " The match in progress comes too." : ""))
                  : "Picks up the game this file was saved during.") : "") +
              (file.hasPrep ? partRow("prep", "Prepared matches",
                "Line-ups set up in advance, matched to your players.") : "")) +
          "</div>" +
          // Outside the scrolling area on purpose: the sentence saying what
          // will happen has to stay in view next to the button that does it,
          // not sit below the fold under the switches.
          '<div class="import-says' + (mode === "replace" ? " warn" : "") + '">' + esc(says) + "</div>" +
          '<div class="btn-row">' +
            '<button class="btn ' + (mode === "replace" ? "btn-danger" : "btn-primary") +
              '" id="importGoBtn"' + ((anyPart || mode === "replace") ? "" : " disabled") + ">" +
              (mode === "replace" ? "Replace" : "Import") + "</button>" +
            '<button class="btn btn-ghost" id="importCancelBtn">Cancel</button>' +
          "</div>" +
        "</div>";

      overlay.querySelectorAll("[data-ipart]").forEach(function (btn) {
        btn.onclick = function () {
          var k = btn.getAttribute("data-ipart");
          parts[k] = !parts[k];
          draw();
        };
      });
      overlay.querySelectorAll("[data-imode]").forEach(function (btn) {
        btn.onclick = function () { mode = btn.getAttribute("data-imode"); draw(); };
      });
      document.getElementById("importCancelBtn").onclick = function () { overlay.remove(); };
      document.getElementById("importGoBtn").onclick = function () {
        overlay.remove();
        applyImport(file, target, mode, parts);
      };
    }

    draw();
    overlay.onclick = function (e) { if (e.target === overlay) overlay.remove(); };
    esc0(overlay);
  }

  // Closing an overlay with the Escape key, the same way the other sheets do.
  function esc0(overlay) {
    var onKey = function (e) {
      if (e.key === "Escape") { overlay.remove(); document.removeEventListener("keydown", onKey); }
    };
    document.addEventListener("keydown", onKey);
  }

  function applyImport(file, target, mode, parts) {
    try {
      applyImportNow(file, target, mode, parts);
    } catch (err) {
      // Whatever goes wrong, the coach hears about it; a sheet that closes and
      // does nothing reads as "it worked".
      console.error(err);
      showToast("That import couldn\u2019t be completed \u2014 nothing was changed.", "error");
    }
  }

  function applyImportNow(file, target, mode, parts) {
    // The sheet may have been open for a while, and another open copy of the
    // app can have saved in the meantime. Work on the team as it is now, not
    // as it was when the sheet opened, or that other copy's work is undone.
    var current = teamById(target.id);
    if (!current && mode !== "new") {
      showToast("That team is no longer on this device \u2014 nothing was imported.", "warning");
      return;
    }
    target = current || target;
    if (mode === "merge") {
      var res = mergeIntoTeam(target, file, parts);
      state.teams = state.teams.map(function (t) { return t.id === target.id ? res.team : t; });
      state.activeTeamId = res.team.id;
      pendingAssistEventId = null;
      lastEventTapAt = {};
      persist();
      view = res.summary.liveRestored ? "match" : "team";
      render();
      var s = res.summary;
      var done = [];
      if (s.playersAdded) done.push(s.playersAdded + (s.playersAdded === 1 ? " player" : " players"));
      if (s.matchesAdded) done.push(s.matchesAdded + (s.matchesAdded === 1 ? " match" : " matches"));
      if (s.prepAdded) done.push(s.prepAdded + (s.prepAdded === 1 ? " prepared match" : " prepared matches"));
      var msg = done.length
        ? "Added " + done.join(", ") + " to " + res.team.teamName + "."
        : (s.prepUpdated ? "" : "Nothing new to add \u2014 " + res.team.teamName + " already had it all.");
      if (s.prepUpdated) {
        msg += (msg ? " " : "") + "Updated " + s.prepUpdated +
          (s.prepUpdated === 1 ? " prepared match." : " prepared matches.");
      }
      if (s.prepKeptNewer) {
        msg += " " + s.prepKeptNewer + (s.prepKeptNewer === 1
          ? " prepared match was newer here and kept." : " prepared matches were newer here and kept.");
      }
      if (s.liveSkipped === "busy") msg += " The match in progress in the file was left out: one is already running here.";
      if (s.liveSkipped === "invalid") msg += " The match in progress in the file couldn\u2019t be matched to your players.";
      // The sheet said this would happen, but the sheet is gone now, so it is
      // worth saying again: a setting changed without being asked for.
      if (s.planTurnedOn) msg += " Line-up plan is now switched on, so the plan in that file will be used.";
      if (s.liveRestored) msg += " The match in progress is back, with its clock stopped.";
      if (s.namesMissing) {
        msg += " The line-ups stayed empty: that file was made by an older version and doesn’t " +
               "carry the player names. Ask for a fresh export.";
      }
      showToast(msg, (done.length || s.prepUpdated || s.liveRestored) ? "success" : "warning");
      return;
    }

    // Replace and new-team both hand the file to the same builder the app has
    // always used; only the slice of the file it sees changes.
    var payload = Object.assign({}, file.raw);
    if (mode === "new") {
      if (!parts.history) { delete payload.history; delete payload.activeMatch; }
      if (!parts.prep) delete payload.upcoming;
      if (!parts.players) { delete payload.settings; delete payload.lastLineup; delete payload.lastPlan; }
      // The names always travel, or the matches and line-ups mean nothing.
      payload.roster = file.roster.slice();
    }
    // A file exported without its squad carries only the names behind its
    // matches. Replace used to hand that on as-is and crash on the missing
    // roster, closing the sheet with nothing done and nothing said.
    if (!Array.isArray(payload.roster)) payload.roster = file.roster.slice();
    var built = teamFromImport(payload, mode === "replace" ? target.id : null);
    if (mode === "new" && built.teamName === target.teamName) {
      built.teamName = built.teamName + " (imported)";
    }
    // Same rule as a merge: a line-up plan that arrives on a team where the
    // option is off would be silently ignored at kick-off.
    var note = "";
    var planIn = (built.upcoming || []).some(function (u) {
      return u.plan && u.plan.lineups.some(function (r) { return r.length; });
    });
    if (planIn && !built.settings.planLineups) {
      built.settings.planLineups = true;
      note = " Line-up plan is now switched on, so the plan in that file will be used.";
    }
    finishImport(built, mode === "replace" ? target.id : null, note);
  }

  // A match in progress only comes back if the file actually carries one and it
  // still refers to real players. It always arrives stopped, whatever the file
  // says, so the coach restarts the clock themselves rather than inheriting one
  // that has been "running" since yesterday afternoon.
  var importDroppedMatch = false;

  function restoredActiveMatch(data) {
    importDroppedMatch = false;
    var m = data && data.activeMatch;
    if (!m || typeof m !== "object") return null;
    if (!Array.isArray(m.events) || !m.playingTime || typeof m.playingTime !== "object") {
      importDroppedMatch = true;
      return null;
    }
    var known = {};
    (data.roster || []).forEach(function (p) { if (p && p.id) known[p.id] = true; });

    // Every id the match leans on has to be a player this team actually has.
    // One stray id used to be enough to let the whole match through, and the
    // result was a scoreboard showing a goal scored by nobody.
    var ids = Object.keys(m.playingTime).concat(
      m.events.map(function (e) { return e && e.playerId; }),
      m.events.map(function (e) { return e && e.assistId; })
    ).filter(Boolean);
    for (var i = 0; i < ids.length; i++) {
      if (!known[ids[i]]) { importDroppedMatch = true; return null; }
    }

    var copy = Object.assign({}, m);
    copy.events = m.events.filter(function (e) { return e && typeof e === "object"; });
    delete copy.lastAdvance;
    // Give every player a record. isOnField() treats a missing one as "on the
    // pitch", so a gap here would put benched players back on and, worse, a
    // missing playingTime object blanked the match screen on every open.
    var pt = {};
    (data.roster || []).forEach(function (p) {
      var was = m.playingTime[p.id];
      pt[p.id] = (was && typeof was === "object")
        ? { onField: !!was.onField, accumMs: Math.max(0, was.accumMs || 0),
            onSince: typeof was.onSince === "number" ? was.onSince : null,
            sentOff: !!was.sentOff, wasOnFieldBeforeSendOff: was.wasOnFieldBeforeSendOff }
        : { onField: false, accumMs: 0, onSince: null };
    });
    copy.playingTime = pt;
    copy.clock = {
      running: false,
      elapsedMs: (m.clock && typeof m.clock.elapsedMs === "number") ? Math.max(0, m.clock.elapsedMs) : 0,
      runningSince: null
    };
    // A period mark beyond the frozen clock would block the next break.
    if (typeof copy.periodStartMs === "number" && copy.periodStartMs > copy.clock.elapsedMs) {
      delete copy.periodStartMs;
    }
    return copy;
  }

  function teamFromImport(data, id) {
    return {
      id: id || uid(),
      teamName: data.teamName || "My Team",
      roster: data.roster.map(function (p) {
        return { id: p.id || uid(), name: p.name || "", number: p.number || "" };
      }),
      settings: Object.assign(defaultSettings(), data.settings || {}),
      activeMatch: restoredActiveMatch(data),
      history: Array.isArray(data.history) ? data.history : [],
      // Only ids that exist in the restored roster: an older file, or one from
      // another coach, can name players this team doesn't have.
      lastLineup: Array.isArray(data.lastLineup)
        ? data.lastLineup.filter(function (pid) {
            return (data.roster || []).some(function (p) { return p.id === pid; });
          })
        : null,
      lastPlan: normalisePlan(data.lastPlan),
      lastPeriodMinutes: cleanPeriodMinutes(data.lastPeriodMinutes),
      upcoming: Array.isArray(data.upcoming)
        ? data.upcoming.map(normaliseUpcoming).filter(Boolean) : [],
      lastExportPrep: prepSignature(Array.isArray(data.upcoming)
        ? data.upcoming.map(normaliseUpcoming).filter(Boolean) : []),
      lastExportHistory: historySignature(Array.isArray(data.history) ? data.history : []),
      backupNudgeSeen: "",
      lastExportCount: Array.isArray(data.history) ? data.history.length : 0
    };
  }

  function finishImport(team, replacedId, note) {
    if (replacedId) {
      state.teams = state.teams.map(function (t) { return t.id === replacedId ? team : t; });
    } else {
      state.teams.push(team);
    }
    state.activeTeamId = team.id;
    pendingAssistEventId = null;
    lastEventTapAt = {};
    persist();
    view = "team";
    render();
    if (importDroppedMatch) {
      showToast("Imported " + team.teamName + " — " + team.roster.length +
        " players. The match in progress in that file couldn't be restored.", "warning");
    } else {
      showToast("Imported " + team.teamName + " \u2014 " + team.roster.length + " players." + (note || ""));
    }
    importDroppedMatch = false;
  }

  function importDataFromFile(file) {
    var reader = new FileReader();
    reader.onload = function () {
      try {
        showImportSheet(JSON.parse(reader.result));
      } catch (e) {
        console.error(e);
        showToast("That file doesn\u2019t look like a Matchday Tracker export.", "error");
      }
    };
    reader.onerror = function () { showToast("Couldn\u2019t read that file.", "error"); };
    reader.readAsText(file);
  }

  // ---------- rendering ----------

  function render() {
    document.getElementById("matchScreen").classList.toggle("hidden", view !== "match" && view !== "summary");
    document.getElementById("teamScreen").classList.toggle("hidden", view !== "team");
    document.getElementById("historyScreen").classList.toggle("hidden", view !== "history");

    var activeTab = view === "summary" ? "match" : view;
    document.getElementById("tabMatch").classList.toggle("active", activeTab === "match");
    document.getElementById("tabTeam").classList.toggle("active", activeTab === "team");
    document.getElementById("tabHistory").classList.toggle("active", activeTab === "history");

    var match = T().activeMatch;
    document.getElementById("scoreboardBar").classList.toggle("hidden", !match && view !== "summary");
    var showScore = !!match || view === "summary";
    document.getElementById("topMid").classList.toggle("final", !match && view === "summary");
    document.getElementById("usScoreNum").style.visibility = showScore ? "visible" : "hidden";
    document.getElementById("themScoreNum").style.visibility = showScore ? "visible" : "hidden";
    document.querySelector("header.topbar").classList.toggle("live", !!match);
    document.getElementById("clockBtn").style.visibility = match ? "visible" : "hidden";

    if (match) {
      var stats = computeStats(match);
      document.getElementById("usScoreNum").textContent = stats.scoreUs;
      document.getElementById("themScoreNum").textContent = stats.scoreThem;
      document.getElementById("usScoreLabel").innerHTML =
        '<span class="lbl"><span class="nm">' + esc(T().teamName) + '</span><span class="ha"> ' +
        (match.isHome !== false ? "(H)" : "(A)") + "</span></span>";
      document.getElementById("themScoreLabel").innerHTML =
        '<span class="lbl"><span class="nm">' + esc(match.opponentName) + '</span><span class="ha"> ' +
        (match.isHome !== false ? "(A)" : "(H)") + '</span></span><span class="pen" aria-hidden="true">✎</span>';
      paintClock(match);
      document.getElementById("clockState").textContent = match.clock.running ? "Running — tap to pause" : "Paused — tap to start";
      document.getElementById("clockState").classList.toggle("running", match.clock.running);
    } else {
      paintClock(null);
      document.getElementById("clockState").textContent = "No match yet";
      document.getElementById("clockState").classList.remove("running");
    }

    if (view === "match") renderMatchScreen();
    if (view === "summary") renderSummaryScreen();
    if (view === "team") renderTeamScreen();
    if (view === "history") renderHistoryScreen();
    if (view === "match") updateLiveMinutes();
    wireNotices();
    syncChrome();
    syncScreenOn();
  }

  // The pinned match buttons sit just above the tab bar, whose height is only
  // known once it is drawn. Messages that float above it read the same numbers.
  function syncChrome() {
    try {
      var root = document.documentElement.style;
      var nav = document.querySelector(".bottom-nav");
      if (nav) root.setProperty("--nav-h", Math.round(nav.getBoundingClientRect().height) + "px");
      // The score strip pins itself under the top bar, which is taller or
      // shorter depending on the phone, the text size and the clock face.
      var bar = document.querySelector("header.topbar");
      var board = document.getElementById("scoreboardBar");
      if (bar) {
        var barH = bar.getBoundingClientRect().height;
        root.setProperty("--topbar-h", Math.round(barH) + "px");
        root.setProperty("--head-h", Math.round(barH + (board && board.offsetParent !== null ? board.getBoundingClientRect().height : 0)) + "px");
      }
      var dock = document.getElementById("liveDock");
      var h = 0;
      if (dock && dock.offsetParent !== null && window.getComputedStyle(dock).position === "sticky") {
        h = Math.round(dock.getBoundingClientRect().height) + 6;
      }
      root.setProperty("--dock-h", h + "px");
      document.body.classList.toggle("has-dock", h > 0);
    } catch (e) {}
  }

  function renderMatchScreen() {
    var el = document.getElementById("matchScreen");
    var match = T().activeMatch;

    if (!match) {
      syncPendingFormat();
      el.innerHTML =
        noticeHtml() +
        '<h1 class="screen-title">Start a match</h1>' +
        upcomingHtml() +
        '<p class="playing-as">Playing as <strong>' + esc(T().teamName) + "</strong>" +
          (state.teams.length > 1 ? ' — <button class="link-btn" id="quickSwitchBtn">switch team</button>' : "") + "</p>" +
        (T().roster.length === 0
          ? '<p class="hint">Add your players first, from the Team &amp; settings menu.</p>' +
            '<button class="btn btn-primary" id="goToTeamBtn">Go to Team &amp; settings</button>'
          : '<div class="card">' +
              '<label class="field-label" for="opponentInput">Opponent (optional)</label>' +
              '<input class="text-input" id="opponentInput" placeholder="e.g. FC Riverside" value="' +
                esc(pendingOpponentName || "") + '">' +
              '<label class="field-label">Home or away?</label>' +
              '<div class="btn-row" style="margin-bottom:14px;">' +
                '<button class="btn toggle-seg' + (pendingIsHome ? " on" : "") + '" id="homeBtn">Home</button>' +
                '<button class="btn toggle-seg' + (pendingIsHome ? "" : " on") + '" id="awayBtn">Away</button>' +
              '</div>' +
              '<label class="field-label" for="periodMinsInput">Length of each half, quarter or period, in minutes (optional)</label>' +
              '<input class="text-input" id="periodMinsInput" inputmode="decimal" maxlength="5" placeholder="e.g. 15 or 7,5" value="' +
                esc(pendingPeriodMinutes || "") + '">' +
              (T().settings.planLineups
                ? '<label class="field-label">Match format</label>' +
                  '<div class="btn-row" style="margin-bottom:10px;">' +
                    PLAN_FORMATS.map(function (nP) {
                      return '<button class="btn toggle-seg' + (pendingPeriods === nP ? " on" : "") +
                        '" data-kick-fmt="' + nP + '">' + PLAN_FORMAT_LABELS[nP] + "</button>";
                    }).join("") +
                  "</div>" +
                  '<button class="btn btn-ghost" id="planBtn">Line-up plan</button>' +
                  '<div class="plan-summary" id="planSummary">' + planSummaryText() + "</div>"
                : '<p class="hint kick-hint">Playing quarters or 8 short periods? ' +
                  '<button class="link-btn" id="enablePlanBtn">Turn on line-up planning</button></p>') +
              '<button class="btn btn-primary" id="kickoffBtn">Kick off</button>' +
            "</div>" +
            '<button class="btn btn-ghost" id="prepBtn" style="margin-top:12px;">Prepare a match for later</button>');
      var qs = document.getElementById("quickSwitchBtn");
      if (qs) qs.onclick = showTeamPicker;
      wireUpcoming(el);
      var pb = document.getElementById("prepBtn");
      if (pb) pb.onclick = function () { showMatchPrep(null); };
      if (T().roster.length === 0) {
        document.getElementById("goToTeamBtn").onclick = function () { view = "team"; render(); };
      } else {
        // Every field is mirrored into the pending state the moment it changes,
        // not at the known redraw points. Some redraws arrive unannounced —
        // visibilitychange fires when the coach unlocks the phone — and only
        // what has already been stored survives those.
        var readKickoffFields = function () {
          var el2 = document.getElementById("periodMinsInput");
          if (el2) pendingPeriodMinutes = cleanPeriodMinutes(el2.value);
          var el3 = document.getElementById("opponentInput");
          if (el3) pendingOpponentName = el3.value;
        };
        document.getElementById("opponentInput").oninput = function (e) {
          pendingOpponentName = e.target.value;
        };
        var minsEl = document.getElementById("periodMinsInput");
        if (minsEl) minsEl.oninput = function (e) {
          pendingPeriodMinutes = cleanPeriodMinutes(e.target.value);
        };
        document.getElementById("homeBtn").onclick = function () {
          readKickoffFields();
          pendingIsHome = true;
          document.getElementById("homeBtn").classList.add("on");
          document.getElementById("awayBtn").classList.remove("on");
        };
        document.getElementById("awayBtn").onclick = function () {
          readKickoffFields();
          pendingIsHome = false;
          document.getElementById("awayBtn").classList.add("on");
          document.getElementById("homeBtn").classList.remove("on");
        };
        var enablePlan = document.getElementById("enablePlanBtn");
        if (enablePlan) enablePlan.onclick = function () {
          readKickoffFields();
          T().settings.planLineups = true;
          persist();
          render();
          showToast("Line-up plan is on \u2014 pick 2 halves, 4 quarters or 8 periods.");
        };
        if (T().settings.planLineups) {
          var setFormat = function (nPeriods) {
            readKickoffFields();
            pendingPeriods = nPeriods;
            pendingFormatSet = true;
            pendingPlan = null; // a different format needs a fresh plan
            render();
          };
          el.querySelectorAll("[data-kick-fmt]").forEach(function (btn) {
            btn.onclick = function () { setFormat(parseInt(btn.getAttribute("data-kick-fmt"), 10)); };
          });
          document.getElementById("planBtn").onclick = function () {
            readKickoffFields();
            showLineupPlanner(pendingPlan || T().lastPlan, pendingPeriods, function (plan) {
              pendingPlan = plan;
              render();
            });
          };
        }
        document.getElementById("kickoffBtn").onclick = function () {
          readKickoffFields();
          var pm = document.getElementById("periodMinsInput");
          // The same rule the summary line above the button uses: a plan made
          // for another format is no plan at all. Kicking off used to fall
          // back to last week's four quarters after "8 periods" was chosen.
          var chosenPlan = pendingPlan || T().lastPlan;
          if (T().settings.planLineups) {
            var np = normalisePlan(chosenPlan);
            if (!np || np.periods !== pendingPeriods) chosenPlan = null;
          }
          startNewMatch(pendingOpponentName, pendingIsHome,
            chosenPlan, null, pm ? pm.value : null,
            T().settings.planLineups ? pendingPeriods : null);
          pendingPlan = null;
          pendingFormatSet = false;
          pendingPeriodMinutes = null;
          pendingOpponentName = "";
          pendingIsHome = true;
        };
      }
      return;
    }

    var stats = computeStats(match);

    var assistBarHtml = "";
    if (pendingAssistEventId) {
      var scorerEv = match.events.filter(function (e) { return e.id === pendingAssistEventId; })[0];
      var scorer = scorerEv ? rosterById(scorerEv.playerId) : null;
      var chips = sortedRoster()
        .filter(function (p) { return (!scorer || p.id !== scorer.id) && isOnField(match, p.id); })
        .map(function (p) { return '<button class="assist-chip" data-assist="' + p.id + '">' + esc(p.name) + "</button>"; })
        .join("");
      assistBarHtml =
        '<div class="assist-bar" id="assistBar">' +
          '<div class="a-title">Goal' + (scorer ? " by " + esc(scorer.name) : "") + "! Assist by:</div>" +
          '<div class="assist-chip-row">' + chips + '<button class="assist-chip" data-assist="none">No assist</button></div>' +
        "</div>";
    }

    var tilesHtml = sortedRoster().map(function (p) {
      var goals = stats.scorers[p.id] || 0;
      var assistCount = stats.assists[p.id] || 0;
      var bits = [];
      if (goals) bits.push(goals + (goals === 1 ? " goal" : " goals"));
      if (T().settings.trackAssists && assistCount) bits.push(assistCount + (assistCount === 1 ? " assist" : " assists"));
      var onField = isOnField(match, p.id);
      var sentOff = T().settings.trackCards && hasRedCard(match, p.id);
      var fieldBadge = '<button class="field-badge ' + (sentOff ? "sent-off-badge" : (onField ? "on" : "off")) + '" data-field="' + p.id + '"' + (sentOff ? " disabled" : "") + '>' + (sentOff ? "Sent off" : (onField ? "On pitch" : (isAbsent(match, p.id) ? "Away" : "Bench"))) + "</button>";
      var controls = "";
      if (T().settings.trackCards) {
        var pcards = stats.cards[p.id] || [];
        var yellows = pcards.filter(function (c) { return c === "yellow"; }).length;
        var reds = pcards.filter(function (c) { return c === "red"; }).length;
        if (yellows) bits.push(yellows + (yellows === 1 ? " yellow" : " yellows"));
        if (reds) bits.push("red");
        controls +=
          '<button class="card-btn" data-card-yellow="' + p.id + '" aria-label="Give yellow card"' + (sentOff ? " disabled" : "") +
            '><span class="mini-card yellow-btn' + (yellows ? " card-yellow" : "") + '"></span></button>' +
          '<button class="card-btn" data-card-red="' + p.id + '" aria-label="Give red card"' + (sentOff ? " disabled" : "") +
            '><span class="mini-card red-btn' + (reds ? " card-red" : "") + '"></span></button>';
      }
      return (
        '<div class="tile' + (onField ? "" : " benched") + (sentOff ? " sent-off" : "") + '" data-tile="' + p.id + '" data-goal="' + p.id + '">' +
          fieldBadge +
          '<div class="tile-num">' + esc(p.number || "") + "</div>" +
          '<div class="tile-name">' + esc(p.name) + "</div>" +
          '<div class="tile-goals">' + esc(bits.join(" · ")) + "</div>" +
          (T().settings.trackPlayingTime
            ? '<div class="tile-mins" data-mins="' + p.id + '"></div>' : "") +
          (controls ? '<div class="tile-controls">' + controls + "</div>" : "") +
        "</div>"
      );
    }).join("");

    // Until the clock has run once nothing tells the coach that the bench is
    // theirs to set: a new match shows whoever the last one started with, or
    // everyone. Say who is on, and how to change it, until the clock starts.
    var preKickHtml = "";
    if (!match.lineupCaptured && !match.clock.running && !match.clock.elapsedMs && !match.events.length) {
      var nOn = 0, nBench = 0, nAway = 0;
      T().roster.forEach(function (p) {
        if (isOnField(match, p.id)) nOn++;
        else if (isAbsent(match, p.id)) nAway++;
        else nBench++;
      });
      preKickHtml = '<div class="pre-kick" id="preKick"><strong>' + nOn + " on the pitch</strong> \u00b7 " + nBench + " on the bench" +
        (nAway ? " \u00b7 " + nAway + " away" : "") +
        ". Tap On pitch / Bench on a tile to set who starts, then tap the timer.</div>";
    }

    el.innerHTML =
      (T().settings.trackAssists ? assistBarHtml : "") +
      preKickHtml +
      '<div class="player-grid">' + tilesHtml + "</div>" +
      // Pinned above the tab bar, see .live-dock. Nothing below the grid grows
      // during the match, so these stay exactly where they were at kick-off
      // however many goals are logged. The log itself is a record, not a
      // control, so it lives behind a button like the other reference screens.
      '<div class="live-dock" id="liveDock">' +
        '<button class="btn btn-ghost dock-undo" id="undoBtn" aria-label="Undo last event"' +
          (match.events.length === 0 && !breakIsLast(match) ? " disabled" : "") + '>' +
          '<span class="dock-undo-ico" aria-hidden="true">\u21ba</span><span class="dock-undo-txt">Undo</span></button>' +
        '<button class="opp-goal-btn" id="oppGoalBtn">+ ' + esc(match.opponentName) + " scored</button>" +
        '<button class="btn btn-ghost dock-period" id="halfTimeBtn"><span class="dock-period-main">' +
          esc(periodButtonLabel(match).main) + "</span>" +
          (periodButtonLabel(match).sub ? '<span class="dock-period-sub">' + esc(periodButtonLabel(match).sub) + "</span>" : "") +
        "</button>" +
      "</div>" +
      '<div class="btn-row match-actions">' +
        '<button class="opp-goal-btn own-goal-btn" id="ownGoalBtn">Own goal</button>' +
        '<button class="btn btn-danger" id="endMatchBtn">End match</button>' +
      "</div>" +
      '<div class="btn-row match-actions-2">' +
        (T().settings.planLineups && match.plan
          ? '<button class="btn btn-ghost" id="matchPlanBtn">Line-up plan</button>' : "") +
        '<button class="btn btn-ghost" id="matchLogBtn">Match log' +
          (match.events.length ? " (" + match.events.length + ")" : "") + "</button>" +
        '<button class="btn btn-ghost help-mini" id="matchHelpBtn" aria-label="How to use this app">?</button>' +
      "</div>";

    document.getElementById("matchLogBtn").onclick = showMatchLogSheet;
    document.getElementById("matchHelpBtn").onclick = showHelp;
    document.getElementById("undoBtn").onclick = undoLast;

    document.getElementById("oppGoalBtn").onclick = logOpponentGoal;
    document.getElementById("halfTimeBtn").onclick = startNextPeriod;
    var mpb = document.getElementById("matchPlanBtn");
    if (mpb) mpb.onclick = function () {
      showLineupPlanner(match.plan, match.plan.periods, function (plan) {
        match.plan = plan; persist(); render();
        showToast("Plan saved \u2014 it is proposed at the next break.");
      }, absentIds(match));
    };
    document.getElementById("ownGoalBtn").onclick = showOwnGoalPicker;
    document.getElementById("endMatchBtn").onclick = function () {
      showConfirm("End the match? This saves the result to history.", "End match", endMatch, true);
    };
    var ab = document.getElementById("assistBar");
    if (ab) {
      ab.querySelectorAll("[data-assist]").forEach(function (btn) {
        btn.onclick = function () {
          var v = btn.getAttribute("data-assist");
          setAssist(v === "none" ? null : v);
        };
      });
    }
    el.querySelectorAll("[data-goal]").forEach(function (n) {
      n.onclick = function () { logGoal(n.getAttribute("data-goal")); };
    });
    el.querySelectorAll("[data-field]").forEach(function (btn) {
      btn.onclick = function (e) { e.stopPropagation(); toggleField(btn.getAttribute("data-field")); };
    });
    el.querySelectorAll("[data-card-yellow]").forEach(function (btn) {
      btn.onclick = function (e) { e.stopPropagation(); toggleCard(btn.getAttribute("data-card-yellow"), "yellow"); };
    });
    el.querySelectorAll("[data-card-red]").forEach(function (btn) {
      btn.onclick = function (e) { e.stopPropagation(); toggleCard(btn.getAttribute("data-card-red"), "red"); };
    });
    el.querySelectorAll("[data-del-event]").forEach(function (btn) {
      btn.onclick = function () {
        var id = btn.getAttribute("data-del-event");
        editMatchId = null;
        showConfirm("Delete this entry from the log?", "Delete", function () { deleteEvent(id); }, true);
      };
    });
    el.querySelectorAll("[data-edit-event]").forEach(function (btn) {
      btn.onclick = function () { editMatchId = null; showEditEvent(btn.getAttribute("data-edit-event")); };
    });
  }

  // The live match log, shown in its own sheet. Built here so the match
  // screen stays a fixed height however long the match gets.
  function liveLogHtml(match) {
    return match.events.slice().reverse().map(function (ev) {
      var desc = "";
      if (ev.type === "goal") {
        var scorer = rosterById(ev.playerId);
        desc = "⚽ " + esc(scorer ? scorer.name : "Goal");
        if (ev.assistId) {
          var assister = rosterById(ev.assistId);
          if (assister) desc += " (assist: " + esc(assister.name) + ")";
        }
      } else if (ev.type === "opponent_goal") {
        desc = "⚽ " + esc(match.opponentName);
      } else if (ev.type === "own_goal") {
        // Shown under the team it counts for, same convention as the timeline.
        desc = "⚽ " + esc(ev.by === "us" ? match.opponentName : T().teamName) + " (own goal)";
      } else if (ev.type === "card") {
        var cp = rosterById(ev.playerId);
        desc = (ev.cardType === "red" ? "🟥 " : "🟨 ") + esc(cp ? cp.name : "");
      }
      var editable = ev.type === "goal" || ev.type === "card" || ev.type === "own_goal";
      var actions = editable
        ? '<button class="event-edit" data-edit-event="' + ev.id + '" aria-label="Edit this entry">✎</button><button class="event-delete" data-del-event="' + ev.id + '" aria-label="Delete this entry">✕</button>'
        : '<button class="event-delete" data-del-event="' + ev.id + '" aria-label="Delete this entry">✕</button>';
      return '<div class="event-row"><span class="event-minute">' + ev.minuteAtEvent + "'</span><span class=\"event-desc\">" + desc + '</span><div class="event-actions">' + actions + "</div></div>";
    }).join("");
  }

  function showMatchLogSheet() {
    var match = T().activeMatch;
    if (!match) return;
    var old = document.getElementById("logOverlay");
    if (old) old.remove();
    var overlay = document.createElement("div");
    overlay.className = "overlay";
    overlay.id = "logOverlay";
    document.body.appendChild(overlay);

    function draw() {
      var m = T().activeMatch;
      if (!m) { overlay.remove(); return; }
      var rows = liveLogHtml(m);
      overlay.innerHTML =
        '<div class="card-sheet">' +
          '<div class="plan-title">Match log' +
            (m.events.length ? " \u00b7 " + m.events.length : "") + "</div>" +
          '<div class="card-scroll log-scroll">' +
            (rows || '<div class="empty-state">No events logged yet \u2014 tap a player to add a goal.</div>') +
          "</div>" +
          '<button class="btn btn-ghost" id="logCloseBtn">Close</button>' +
        "</div>";

      overlay.querySelectorAll("[data-del-event]").forEach(function (btn) {
        btn.onclick = function () {
          var id = btn.getAttribute("data-del-event");
          editMatchId = null;
          showConfirm("Delete this entry from the log?", "Delete", function () {
            deleteEvent(id);
            draw();   // stay in the log so a second correction needs no reopening
          }, true);
        };
      });
      overlay.querySelectorAll("[data-edit-event]").forEach(function (btn) {
        btn.onclick = function () {
          editMatchId = null;
          overlay.remove();   // the editor is a sheet of its own
          showEditEvent(btn.getAttribute("data-edit-event"));
        };
      });
      document.getElementById("logCloseBtn").onclick = function () { overlay.remove(); };
    }

    overlay.onclick = function (e) { if (e.target === overlay) overlay.remove(); };
    draw();
  }

  function renderSummaryScreen() {
    var el = document.getElementById("matchScreen");
    var record = T().history[0];
    if (!record) { view = "match"; render(); return; }

    var scorerRows = Object.keys(record.scorers).map(function (pid) {
      return { name: nameInRecord(record, pid), goals: record.scorers[pid], assists: record.assists[pid] || 0 };
    }).sort(function (a, b) { return b.goals - a.goals; });

    var scorerHtml = scorerRows.length
      ? scorerRows.map(function (r) {
          var extra = T().settings.trackAssists && r.assists ? " · " + r.assists + (r.assists === 1 ? " assist" : " assists") : "";
          return '<div class="stat-row"><span class="sr-name">' + esc(r.name) + '</span><span class="sr-val">' + r.goals + (r.goals === 1 ? " goal" : " goals") + esc(extra) + "</span></div>";
        }).join("")
      : '<div class="empty-state">No goals scored by your team.</div>';

    var minuteRows = Object.keys(record.playingTimeMinutes || {})
      .map(function (pid) {
        return { name: nameInRecord(record, pid), minutes: record.playingTimeMinutes[pid] };
      })
      .filter(function (r) { return r.minutes > 0; })
      .sort(function (a, b) { return b.minutes - a.minutes; });
    var minutesHtml = minuteRows.map(function (r) {
      return '<div class="stat-row"><span class="sr-name">' + esc(r.name) + '</span><span class="sr-val">' + r.minutes + " min</span></div>";
    }).join("");

    var isHome = record.isHome !== false;
    var d = new Date(record.date);
    var dateStr = isNaN(d) ? "" : d.toLocaleDateString(undefined, { weekday: "short", day: "numeric", month: "short", year: "numeric" });
    var timeline = goalTimeline(record.events, record.opponentName, record);
    var shareText = buildShareText(record);

    el.innerHTML =
      noticeHtml() +
      '<h1 class="screen-title">Match summary</h1>' +
      '<div class="summary-score">' +
        '<div class="ss-num">' + record.scoreUs + " – " + record.scoreThem + "</div>" +
        '<div class="ss-teams">' + esc(record.teamName) + (isHome ? " (Home)" : " (Away)") + " vs " + esc(record.opponentName) + (isHome ? " (Away)" : " (Home)") + "</div>" +
        (dateStr ? '<div class="ss-teams">' + esc(dateStr) + "</div>" : "") +
      "</div>" +
      '<h2 class="section-title">Scorers</h2>' +
      '<div class="stat-list">' + scorerHtml + "</div>" +
      '<h2 class="section-title">Goal timeline</h2>' +
      '<div class="event-log">' + timelineHtml(timeline) + "</div>" +
      (T().settings.trackPlayingTime && minuteRows.length ? '<h2 class="section-title">Playing time</h2><div class="stat-list">' + minutesHtml + "</div>" : "") +
      '<button class="btn btn-gold" id="matchCardBtn" style="margin-top:18px;">Share match card</button>' +
      '<button class="btn btn-ghost" id="copySummaryBtn" style="margin-top:10px;">' +
        (canShareText() ? "Share as text" : "Copy as text") + "</button>" +
      '<div class="btn-row" style="margin-top:10px;">' +
        '<button class="btn btn-primary" id="newMatchBtn">Start next match</button>' +
        '<button class="btn btn-ghost" id="doneBtn">Done</button>' +
      "</div>";

    document.getElementById("matchCardBtn").onclick = function () { showMatchCard(record); };
    document.getElementById("copySummaryBtn").onclick = function () { shareOrCopy(shareText); };
    document.getElementById("newMatchBtn").onclick = function () { view = "match"; render(); };
    document.getElementById("doneBtn").onclick = function () { view = "match"; render(); };
  }
