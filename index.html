    line-height: 1.4;
    z-index: 50;
    box-shadow: 0 12px 32px rgba(0,0,0,0.4);
    animation: toast-in 0.22s ease-out;
    /* A toast tells you something; it must never swallow the tap meant for the
       button underneath it. Without this, every message creates a 3-second
       dead zone across the screen at exactly the moment a coach taps fastest. */
    pointer-events: none;
  }
  @keyframes toast-in {
    0% { opacity: 0; transform: translateY(14px) scale(0.97); }
    100% { opacity: 1; transform: translateY(0) scale(1); }
  }
  /* Tap feedback: a wash of colour over the pressed button that drains away.
     Click-through, above sheets and toast, and drawn by script because the
     button itself is usually rebuilt the moment it is tapped. */
  .press-flash {
    position: fixed; z-index: 60; pointer-events: none;
    background: var(--gold); box-shadow: 0 0 0 2px var(--gold);
    opacity: 0;
    animation: press-drain 2s ease-out forwards;
    -webkit-user-select: none; user-select: none;
  }
  .press-flash-deep { background: var(--pitch-dark); box-shadow: 0 0 0 2px var(--pitch-dark); }
  @keyframes press-drain {
    0%   { opacity: var(--flash-peak, 0.72); }
    20%  { opacity: calc(var(--flash-peak, 0.72) * 0.8); }
    100% { opacity: 0; }
  }
  @media (prefers-reduced-motion: reduce) { .toast { animation: none; } }
  .toast-success { background: var(--turf); color: #fff; }
  .toast-warning { background: var(--gold); color: var(--pitch-dark); box-shadow: 0 12px 32px rgba(0,0,0,0.4), 0 0 0 3px var(--gold-deep) inset; }
  .toast-error { background: var(--red); color: #fff; }

  ::-webkit-scrollbar { display: none; }

  /* Very narrow phones: the clock shares its row with two scores. */
  @media (max-width: 340px) {
    .top-mid { gap: 6px; }
    .clock-btn { padding-left: 4px; padding-right: 4px; }
  }

  /* ---- short screens ---------------------------------------------------
     The clock, scoreboard and tab bar are a flat 212px whatever the phone, so
     on a small screen they eat a third of it and push Half time out of reach.
     Measured: at this breakpoint an iPhone SE and a 640px Android both get
     Half time on screen without scrolling, while bigger phones keep the
     roomier chrome untouched. Any phone held sideways lands here too, since
     iOS ignores the manifest's portrait lock.
     Only text sizes and padding shrink. The icon buttons and the bottom tabs
     keep their full tap size: a smaller target on a windy touchline is worse
     than a smaller scoreboard. */
  @media (max-height: 700px) {
    header.topbar {
      padding: calc(6px + env(safe-area-inset-top, 0px))
               calc(14px + env(safe-area-inset-right, 0px)) 6px
               calc(14px + env(safe-area-inset-left, 0px));
    }
    .clock-btn { padding: 2px 8px; }
    .clock-time { font-size: min(1.1875rem, 7vw); }
    .clock-state { font-size: min(0.625rem, 3vw); }
    .clock-total { font-size: 0.5625rem; }
    .scoreboard {
      padding: 2px calc(14px + env(safe-area-inset-right, 0px)) 3px
                   calc(14px + env(safe-area-inset-left, 0px));
      top: var(--topbar-h, calc(env(safe-area-inset-top, 0px) + 54px));
    }
    .top-score { font-size: min(2rem, 10vw); }
    .score-label { font-size: 0.75rem; }
    main.screen { padding-top: 10px; }
    .player-grid { gap: 8px; margin-bottom: 10px; }
    .tile { padding: 6px 6px 5px; }
    .screen-title { font-size: 1.375rem; margin: 2px 0 10px; }
    .section-title { margin-top: 14px; }
  }
</style>
</head>
<body>
<div id="app">
  <header class="topbar">
    <button class="icon-btn help-icon" id="helpBtn" aria-label="How to use this app">?</button>
    <div class="top-mid" id="topMid">
      <span class="top-score us" id="usScoreNum">0</span>
      <button class="clock-btn" id="clockBtn">
        <span class="clock-time" id="clockTime">00:00</span>
        <span class="clock-total hidden" id="clockTotal"></span>
        <span class="clock-state" id="clockState">No match yet</span>
      </button>
      <span class="top-sep" aria-hidden="true">–</span>
      <span class="top-score them" id="themScoreNum">0</span>
    </div>
    <span class="top-spacer" aria-hidden="true"></span>
  </header>

  <div class="scoreboard" id="scoreboardBar">
    <div class="score-side us">
      <span class="score-label" id="usScoreLabel">Your Team</span>
    </div>
    <span class="score-sep">–</span>
    <div class="score-side them">
      <button class="score-label score-label-btn" id="themScoreLabel">Opponent</button>
    </div>
  </div>

  <main class="screen" id="matchScreen"></main>
  <main class="screen hidden" id="teamScreen"></main>
  <main class="screen hidden" id="historyScreen"></main>

  <nav class="bottom-nav">
    <button class="tab-btn" data-nav="match" id="tabMatch">
      <span class="tab-icon">⚽</span><span class="tab-label">Match</span>
    </button>
    <button class="tab-btn" data-nav="team" id="tabTeam">
      <span class="tab-icon">👥</span><span class="tab-label">Team</span>
    </button>
    <button class="tab-btn" data-nav="history" id="tabHistory">
      <span class="tab-icon">📋</span><span class="tab-label">History</span>
    </button>
  </nav>
</div>

<input type="file" accept="application/json,.json" class="file-input-hidden" id="importFileInput">

<script>
(function () {
  "use strict";

  var STORAGE_KEY = "matchdayTrackerData_v1";

  // The match card's "Goal times" switch. A preference of this device, not team
  // data, so it stays out of the saved state: it never travels in an export and
  // a failed write costs nothing. Only read when a card is opened.
  var CARD_TIMELINE_KEY = "matchdayTrackerCardTimeline_v1";

  // Same rule as the formats below, and it is not a style preference: load()
  // runs near the top of this file and reaches carryPrepSignature(), which
  // reads this. Assigned further down it would still be undefined at that
  // moment, load() would throw, the catch would hand back an empty state and
  // persist() would write that over the coach's season. A previous release
  // shipped exactly that bug.
  // The tag itself marks the signature format: earlier versions counted
  // players where this one names them, and the two must be told apart.
  var PREP_SIG_TAG = "2|";

  // 2 halves, 4 quarters, or 8 short periods — youth football uses all three.
  // Declared here, not beside the planner: load() normalises saved plans on
  // startup, so this must already hold its value by then.
  // A period length is optional; it only drives the "running over" cue.
  // Half minutes are real (8 periods in a 60-minute match is 7.5 each), and a
  // Belgian keyboard types a comma, so "7,5" and "7.5" both mean seven and a
  // half. Anything after the number is ignored ("15 min" is 15), as before.
  function cleanPeriodMinutes(v) {
    var hit = /^\s*(\d+(?:[.,]\d+)?)/.exec(String(v == null ? "" : v));
    if (!hit) return null;
    var m = Math.round(parseFloat(hit[1].replace(",", ".")) * 100) / 100;
    return (m >= 1 && m <= 60) ? m : null;
  }

  var PLAN_FORMATS = [2, 4, 8];
  var PLAN_FORMAT_LABELS = { 2: "2 halves", 4: "4 quarters", 8: "8 periods" };

  // Shown at the bottom of the help sheet so you can confirm on the phone which
  // build is actually running. Keep APP_VERSION in step with CACHE_VERSION in
  // sw.js, and set APP_BUILT to the deploy date.
  var APP_VERSION = "44";
  var APP_BUILT = "2026-09-30";

  function uid() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  }

  function defaultSettings() {
    return { trackAssists: false, trackPlayingTime: false, trackCards: false, planLineups: false };
  }

  function newTeam(name) {
    return {
      id: uid(),
      teamName: name || "My Team",
      roster: [],
      settings: defaultSettings(),
      activeMatch: null,
      history: [],
      lastLineup: null,
      lastPlan: null,
      lastPeriodMinutes: null,
      upcoming: [],
      lastExportPrep: "",
      lastExportHistory: "",
      backupNudgeSeen: "",
      lastExportCount: 0
    };
  }

  function defaultState() {
    var t = newTeam("My Team");
    return { version: 2, teams: [t], activeTeamId: t.id };
  }

  // Normalise any stored shape into the v2 multi-team shape. Version 1 stored a
  // single team at the top level, so it becomes that account's first team —
  // nothing a person already recorded may be dropped here.
  function migrate(parsed) {
    if (!parsed || typeof parsed !== "object") return defaultState();

    var teams;
    if (Array.isArray(parsed.teams) && parsed.teams.length) {
      teams = parsed.teams;
    } else {
      var t = newTeam(parsed.teamName || "My Team");
      t.roster = Array.isArray(parsed.roster) ? parsed.roster : [];
      t.settings = Object.assign(defaultSettings(), parsed.settings || {});
      t.activeMatch = parsed.activeMatch || null;
      t.history = Array.isArray(parsed.history) ? parsed.history : [];
      teams = [t];
    }

    // One bad entry must not cost the coach every other team on the device.
    teams = teams.filter(function (t) { return t && typeof t === "object"; });

    teams = teams.map(function (t) {
      // Normalised once and reused: normaliseUpcoming mints a fresh id for an
      // entry that has none, so running it twice produced two different
      // fingerprints and a backup reminder that fired straight after a backup.
      var up = Array.isArray(t.upcoming)
        ? t.upcoming.map(normaliseUpcoming).filter(Boolean) : [];
      return {
        id: t.id || uid(),
        teamName: t.teamName || "My Team",
        roster: Array.isArray(t.roster) ? t.roster : [],
        settings: Object.assign(defaultSettings(), t.settings || {}),
        activeMatch: t.activeMatch || null,
        history: Array.isArray(t.history) ? t.history : [],
        lastLineup: Array.isArray(t.lastLineup) ? t.lastLineup : null,
        lastPlan: normalisePlan(t.lastPlan),
        lastPeriodMinutes: cleanPeriodMinutes(t.lastPeriodMinutes),
        upcoming: up,
        lastExportPrep: carryPrepSignature(t.lastExportPrep, up),
        lastExportHistory: typeof t.lastExportHistory === "string" ? t.lastExportHistory : "",
        backupNudgeSeen: typeof t.backupNudgeSeen === "string" ? t.backupNudgeSeen : "",
        lastExportCount: typeof t.lastExportCount === "number" ? t.lastExportCount : 0
      };
    });

    var activeId = parsed.activeTeamId;
    if (!teams.some(function (t) { return t.id === activeId; })) activeId = teams[0].id;
    return { version: 2, teams: teams, activeTeamId: activeId };
  }

  // Set when saved data could not be read. The app carries on with an empty
  // season rather than refusing to open at the pitch, but it says so, and the
  // unreadable text is kept instead of being written over.
  var loadRescued = false;

  function load() {
    var raw = null;
    try {
      raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return defaultState();
      return migrate(JSON.parse(raw));
    } catch (e) {
      console.error("Load failed", e);
      // persist() runs moments later and would otherwise overwrite the only
      // copy of a season that might still be recoverable by hand.
      try {
        if (raw) {
          localStorage.setItem(STORAGE_KEY + "_rescue_" + Date.now(), raw);
          loadRescued = true;
        }
      } catch (err) { /* no room to keep it; nothing more we can do */ }
      return defaultState();
    }
  }

  // The currently selected team. Self-healing: never returns undefined.
  function T() {
    for (var i = 0; i < state.teams.length; i++) {
      if (state.teams[i].id === state.activeTeamId) return state.teams[i];
    }
    if (state.teams.length) {
      state.activeTeamId = state.teams[0].id;
      return state.teams[0];
    }
    var t = newTeam("My Team");
    state.teams.push(t);
    state.activeTeamId = t.id;
    return t;
  }

  // Display order is by shirt number, numerically — "10" must not sort before
  // "2". Storage order is left alone.
  function sortedRoster() {
    return T().roster.slice().sort(function (a, b) {
      var na = parseInt(a.number, 10), nb = parseInt(b.number, 10);
      var aNum = !isNaN(na), bNum = !isNaN(nb);
      if (aNum && bNum && na !== nb) return na - nb;
      if (aNum !== bNum) return aNum ? -1 : 1;
      return (a.name || "").localeCompare(b.name || "");
    });
  }

  function teamById(id) {
    for (var i = 0; i < state.teams.length; i++) {
      if (state.teams[i].id === id) return state.teams[i];
    }
    return null;
  }

  var storageOk = true;

  function persist() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      if (!storageOk) { storageOk = true; render(); }
    } catch (e) {
      console.error("Save failed", e);
      // Everything still works in memory, but it is one app-close from being
      // lost, so this warning stays on screen instead of flashing past.
      if (storageOk) {
        storageOk = false;
        showToast("Couldn't save to this device — export your data now.", "error");
      }
    }
  }

  var state = load();
  // Write the normalised (possibly migrated) shape straight back, so an upgrade
  // isn't left half-applied if the app is closed without touching anything.
  persist();
  var view = T().roster.length === 0 ? "team" : "match";
  var pendingAssistEventId = null;
  var assistBarTimer = null;

  // ---------- utilities ----------

  function rosterById(id) {
    for (var i = 0; i < T().roster.length; i++) {
      if (T().roster[i].id === id) return T().roster[i];
    }
    return null;
  }

  // Resolve a player name for a finished match: prefer the roster as it was at
  // the time, so history doesn't break when players later leave the squad.
  function nameInRecord(record, playerId) {
    if (record && record.rosterSnapshot) {
      for (var i = 0; i < record.rosterSnapshot.length; i++) {
        if (record.rosterSnapshot[i].id === playerId) return record.rosterSnapshot[i].name;
      }
    }
    var live = rosterById(playerId);
    return live ? live.name : "Unknown";
  }

  function formatClock(ms) {
    var totalSec = Math.max(0, Math.floor(ms / 1000));
    var m = Math.floor(totalSec / 60);
    var s = totalSec % 60;
    return (m < 10 ? "0" + m : m) + ":" + (s < 10 ? "0" + s : s);
  }

  function clockElapsedMs(match) {
    if (!match || !match.clock) return 0;
    var extra = match.clock.running ? (Date.now() - match.clock.runningSince) : 0;
    return match.clock.elapsedMs + extra;
  }

  // The clock is one continuous MATCH clock, so a goal in the last quarter is
  // stamped 52' rather than 7' — that is what makes the report readable, since
  // it carries no period number. periodStartMs marks where the current period
  // began on that same clock, which is all the period display needs.
  // A match that was already being played when the app updated carries no
  // periodStartMs. There is no way to know when its current period began, so
  // the app falls back to the plain match clock and says nothing about the
  // period rather than claiming the whole match belongs to it. The next break
  // sets the mark and normal behaviour resumes.
  function periodStartKnown(match) {
    return !!match && typeof match.periodStartMs === "number";
  }
  function periodElapsedMs(match) {
    if (!periodStartKnown(match)) return clockElapsedMs(match);
    return Math.max(0, clockElapsedMs(match) - match.periodStartMs);
  }
  function periodHasRun(match) {
    return periodElapsedMs(match) > 0;
  }
  function periodOverrunMs(match) {
    if (!match || !match.periodMinutes || !periodStartKnown(match)) return 0;
    return Math.max(0, periodElapsedMs(match) - match.periodMinutes * 60000);
  }
  // The break button names what it does in the match's own words: a coach
  // playing eight short periods is not at "Half time", and the small line under
  // it says which period is running, which the clock only shows from the second.
  function periodButtonLabel(match) {
    var fmt = (match.plan && match.plan.periods) || match.periodFormat;
    var p = match.period || 1;
    if (fmt === 8 || fmt === 4) {
      return {
        main: fmt === 8 ? "Next period" : "Next quarter",
        sub: periodShort(fmt, p - 1) + (p <= fmt ? " of " + fmt : "")
      };
    }
    // Halves, or no format chosen. "Half time" is only right once: in the
    // second half the same button would start a third period, so it says so.
    if (p >= 2) return { main: "Next period", sub: "P" + p };
    return { main: "Half time", sub: "" };
  }
  function periodTag(match) {
    var p = match.period || 1;
    var fmt = (match.plan && match.plan.periods) || match.periodFormat;
    if (fmt) return periodShort(fmt, p - 1);
    return "P" + p;
  }

  // The only place the clock face is written. The per-second tick used to
  // write it too, which wiped the period label and the overrun colour a second
  // after every render.
  function paintClock(match) {
    var timeEl = document.getElementById("clockTime");
    var totalEl = document.getElementById("clockTotal");
    if (!match) {
      timeEl.textContent = "00:00";
      timeEl.classList.remove("over");
      totalEl.classList.add("hidden");
      totalEl.textContent = "";
      return;
    }
    var inPeriod = (match.period || 1) > 1 && periodStartKnown(match);
    timeEl.textContent = inPeriod
      ? periodTag(match) + " \u00b7 " + formatClock(periodElapsedMs(match))
      : formatClock(clockElapsedMs(match));
    if (periodOverrunMs(match) > 0) timeEl.classList.add("over");
    else timeEl.classList.remove("over");
    if (inPeriod) totalEl.classList.remove("hidden"); else totalEl.classList.add("hidden");
    totalEl.textContent = inPeriod ? formatClock(clockElapsedMs(match)) + " total" : "";
  }

  function currentMinute(match) {
    return Math.floor(clockElapsedMs(match) / 60000);
  }

  function computeStats(match) {
    var scoreUs = 0, scoreThem = 0;
    var ownGoalsFor = 0, ownGoalsAgainst = 0;
    var scorers = {}, assists = {}, cards = {};
    match.events.forEach(function (ev) {
      if (ev.type === "goal") {
        scoreUs++;
        scorers[ev.playerId] = (scorers[ev.playerId] || 0) + 1;
        if (ev.assistId) assists[ev.assistId] = (assists[ev.assistId] || 0) + 1;
      } else if (ev.type === "opponent_goal") {
        scoreThem++;
      } else if (ev.type === "own_goal") {
        // An own goal counts for the OTHER team and is never credited to a
        // player, so it can't land in anyone's scoring stats.
        if (ev.by === "us") { scoreThem++; ownGoalsAgainst++; }
        else { scoreUs++; ownGoalsFor++; }
      } else if (ev.type === "card") {
        if (!cards[ev.playerId]) cards[ev.playerId] = [];
        cards[ev.playerId].push(ev.cardType);
      }
    });
    return {
      scoreUs: scoreUs, scoreThem: scoreThem,
      scorers: scorers, assists: assists, cards: cards,
      ownGoalsFor: ownGoalsFor, ownGoalsAgainst: ownGoalsAgainst
    };
  }

  function playingTimeMinutes(match) {
    var out = {};
    if (!match.playingTime) return out;
    var endMs = clockElapsedMs(match);
    Object.keys(match.playingTime).forEach(function (pid) {
      var pt = match.playingTime[pid];
      var total = pt.accumMs;
      if (pt.onField && pt.onSince != null) total += (endMs - pt.onSince);
      // Belt and braces: a clock that has been wound back must never turn into
      // a player who has played minus forty minutes.
      out[pid] = Math.max(0, Math.round(total / 60000));
    });
    return out;
  }

  function goalTimeline(events, opponentName, record) {
    var ourName = (record && record.teamName) || T().teamName;
    return (events || [])
      .filter(function (e) { return e.type === "goal" || e.type === "opponent_goal" || e.type === "own_goal"; })
      .map(function (e) {
        if (e.type === "goal") {
          var scorerName = record ? nameInRecord(record, e.playerId) : (rosterById(e.playerId) ? rosterById(e.playerId).name : "Unknown");
          var assistName = null;
          if (e.assistId) {
            assistName = record ? nameInRecord(record, e.assistId) : (rosterById(e.assistId) ? rosterById(e.assistId).name : null);
          }
          return { minute: e.minuteAtEvent, period: e.period || 1, forUs: true, name: scorerName, assistName: assistName, ownGoal: false };
        }
        if (e.type === "own_goal") {
          // Listed under the team it counts FOR, flagged as an own goal.
          var forUs = e.by !== "us";
          return { minute: e.minuteAtEvent, period: e.period || 1, forUs: forUs, name: forUs ? ourName : opponentName, assistName: null, ownGoal: true };
        }
        return { minute: e.minuteAtEvent, period: e.period || 1, forUs: false, name: opponentName, assistName: null, ownGoal: false };
      });
  }

  function timelineHtml(timeline) {
    if (!timeline.length) return '<div class="empty-state">No goals scored.</div>';
    var multi = timeline.some(function (t) { return (t.period || 1) > 1; });
    var shown = {};
    return timeline.map(function (t) {
      var head = "";
      if (multi && !shown[t.period || 1]) {
        shown[t.period || 1] = true;
        head = '<div class="period-head">Period ' + (t.period || 1) + "</div>";
      }
      return head + oneTimelineRow(t);
    }).join("");
  }

  function oneTimelineRow(t) {
    return (function (t) {
      var desc = "⚽ " + esc(t.name) +
        (t.ownGoal ? " (own goal)" : "") +
        (t.assistName ? " (assist: " + esc(t.assistName) + ")" : "");
      return '<div class="event-row"><span class="event-minute">' + t.minute + "'</span><span class=\"event-desc\">" + desc + "</span></div>";
    })(t);
  }

  /* ---------- Shareable match card ----------------------------------------
     The summary as a picture, so what lands in the group chat looks made
     rather than typed. Drawn on a canvas and then shown on screen as an
     <img>: long-pressing an image is an OS gesture that cannot be unsupported
     or blocked, so navigator.share() is only ever a shortcut, never the way
     out. Nothing here touches stored data — the card is read-only. */

  var CARD_W = 1080;
  var CARD_PAD = 76;
  var CARD_MAX_TIMELINE = 100;   // a canvas guard, not an editorial choice

  function cardFonts() {
    // Google Fonts may never have loaded (first run with no signal). The card
    // must still come out in something deliberate rather than the canvas default.
    var display = "'Arial Narrow', Arial, sans-serif", body = "Arial, Helvetica, sans-serif";
    try {
      if (document.fonts.check("700 100px Oswald")) display = "Oswald, 'Arial Narrow', sans-serif";
      if (document.fonts.check("400 40px 'Work Sans'")) body = "'Work Sans', Arial, sans-serif";
    } catch (e) {}
    return { display: display, body: body };
  }

  function roundRectPath(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function fitText(ctx, text, maxW) {
    text = String(text == null ? "" : text);
    if (ctx.measureText(text).width <= maxW) return text;
    var t = text;
    while (t.length > 1 && ctx.measureText(t + "…").width > maxW) t = t.slice(0, -1);
    return t.replace(/[\s–—-]+$/, "") + "…";
  }

  function matchCardData(record) {
    var numbers = {};
    (record.rosterSnapshot || []).forEach(function (p) { numbers[p.id] = p.number || ""; });
    var scorers = Object.keys(record.scorers || {}).map(function (pid) {
      return {
        name: nameInRecord(record, pid), number: numbers[pid] || "",
        goals: record.scorers[pid], assists: (record.assists || {})[pid] || 0
      };
    }).sort(function (a, b) { return b.goals - a.goals || a.name.localeCompare(b.name); });
    return { scorers: scorers, timeline: goalTimeline(record.events, record.opponentName, record) };
  }

  // opts.timeline === false leaves the minute-by-minute list off: the score, the
  // scorers and their tallies stay. A 27–11 match otherwise makes a picture
  // nobody can send, so the coach gets to choose.
  function drawMatchCard(record, opts) {
    var withTimeline = !(opts && opts.timeline === false);
    var f = cardFonts();
    var data = matchCardData(record);
    var scorers = data.scorers;
    var timeline = data.timeline;
    // With the list on, every goal gets its minute, as the card promises. Youth
    // scorelines run away sometimes, so past fourteen the rows tighten up rather
    // than the list being cut short. CARD_MAX_TIMELINE stays only as a guard
    // against a canvas no browser would draw; a real match never reaches it.
    var shown = withTimeline ? Math.min(timeline.length, CARD_MAX_TIMELINE) : 0;
    var hiddenGoals = withTimeline ? timeline.length - shown : 0;
    var compact = shown > 14;
    var ROW = compact ? 46 : 60;
    var ogLine = "";
    if (record.ownGoalsFor) ogLine = record.ownGoalsFor + " own goal" + (record.ownGoalsFor === 1 ? "" : "s") + " in our favour";
    if (record.ownGoalsAgainst) ogLine = (ogLine ? ogLine + " · " : "") +
      record.ownGoalsAgainst + " own goal" + (record.ownGoalsAgainst === 1 ? "" : "s") + " against us";

    var H = CARD_PAD + 52 + 46 + 52 + 132 * 2 + 40;
    if (scorers.length) H += 46 + 20 + scorers.length * 84 + 34;
    if (ogLine) H += 42;
    if (shown) H += 46 + 20 + shown * ROW + (hiddenGoals ? 46 : 0) + 34;
    H += 38 + 14 + 56;

    var cv = document.createElement("canvas");
    cv.width = CARD_W; cv.height = Math.round(H);
    var ctx = cv.getContext("2d");
    var W = CARD_W, L = CARD_PAD, R = W - CARD_PAD, INNER = R - L;

    var ON = "#FAF8F2", GOLD = "#E2A33D";
    var soft = function (a) { return "rgba(250,248,242," + a + ")"; };

    // Background: pitch green with depth, plus the faintest suggestion of
    // centre circle and halfway line behind the score.
    var g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, "#1C4232"); g.addColorStop(0.55, "#16362A"); g.addColorStop(1, "#0F2720");
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

    var y = CARD_PAD;

    // --- header: date on the left, result on the right -------------------
    var d = new Date(record.date);
    var dateStr = isNaN(d) ? "" : d.toLocaleDateString(undefined,
      { weekday: "short", day: "numeric", month: "short", year: "numeric" }).toUpperCase();
    ctx.font = "600 27px " + f.body;
    ctx.fillStyle = soft(0.62);
    ctx.textBaseline = "middle"; ctx.textAlign = "left";
    ctx.save(); if (ctx.letterSpacing !== undefined) ctx.letterSpacing = "3px";
    ctx.fillText(dateStr, L, y + 22);
    ctx.restore();

    var won = record.scoreUs > record.scoreThem, drew = record.scoreUs === record.scoreThem;
    var resText = won ? "WIN" : drew ? "DRAW" : "LOSS";
    ctx.font = "600 27px " + f.display;
    ctx.save(); if (ctx.letterSpacing !== undefined) ctx.letterSpacing = "3px";
    var cw = ctx.measureText(resText).width + 44, ch = 50;
    roundRectPath(ctx, R - cw, y - 2, cw, ch, ch / 2);
    if (won) { ctx.fillStyle = GOLD; ctx.fill(); ctx.fillStyle = "#16362A"; }
    else { ctx.strokeStyle = soft(0.30); ctx.lineWidth = 2; ctx.stroke(); ctx.fillStyle = soft(0.72); }
    ctx.textAlign = "center";
    ctx.fillText(resText, R - cw / 2 + 1, y + 23);
    ctx.restore();
    y += 52 + 46;

    ctx.strokeStyle = soft(0.16); ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(L, y); ctx.lineTo(R, y); ctx.stroke();
    y += 52;

    // --- scoreboard: one row per team, score right-aligned ----------------
    var isHome = record.isHome !== false;
    var bandTop = y, bandH = 264, circY = y + 132;
    ctx.save();
    ctx.beginPath(); ctx.rect(0, bandTop, W, bandH); ctx.clip();
    ctx.strokeStyle = soft(0.055); ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(W / 2, circY, 106, 0, Math.PI * 2); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(L, circY); ctx.lineTo(R, circY); ctx.stroke();
    ctx.restore();

    var rows = [
      { name: record.teamName, score: record.scoreUs, ours: true, ha: isHome ? "H" : "A" },
      { name: record.opponentName, score: record.scoreThem, ours: false, ha: isHome ? "A" : "H" }
    ];
    var nameMaxW = INNER - 300, nameSize = 36;
    [50, 45, 40, 36].some(function (sz) {
      ctx.font = "600 " + sz + "px " + f.display;
      var fits = rows.every(function (r) { return ctx.measureText(r.name).width <= nameMaxW; });
      if (fits) { nameSize = sz; return true; }
      return false;
    });
    rows.forEach(function (row) {
      var mid = y + 66;
      if (row.ours) {
        ctx.fillStyle = GOLD;
        roundRectPath(ctx, L - 26, mid - 30, 7, 60, 3.5); ctx.fill();
      }
      ctx.font = "600 30px " + f.display;
      ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.fillStyle = soft(0.40);
      ctx.strokeStyle = soft(0.22); ctx.lineWidth = 2;
      roundRectPath(ctx, R - 240, mid - 22, 44, 44, 12); ctx.stroke();
      ctx.fillText(row.ha, R - 218, mid + 1);

      ctx.font = "700 88px " + f.display;
      ctx.textAlign = "right";
      var loser = !drew && (row.ours ? !won : won);
      ctx.fillStyle = loser ? soft(0.50) : ON;
      ctx.fillText(String(row.score), R, mid + 2);

      ctx.font = "600 " + nameSize + "px " + f.display;
      ctx.textAlign = "left";
      ctx.fillStyle = row.ours ? ON : soft(0.80);
      ctx.fillText(fitText(ctx, row.name, nameMaxW), L, mid + 1);
      y += 132;
    });
    y += 40;

    function sectionLabel(text) {
      ctx.font = "600 25px " + f.body;
      ctx.textAlign = "left"; ctx.textBaseline = "middle";
      ctx.fillStyle = GOLD;
      ctx.save(); if (ctx.letterSpacing !== undefined) ctx.letterSpacing = "4px";
      ctx.fillText(text, L, y + 14);
      ctx.restore();
      y += 46 + 20;
    }

    // --- scorers ----------------------------------------------------------
    if (scorers.length) {
      sectionLabel("SCORERS");
      scorers.forEach(function (s) {
        var mid = y + 30;
        ctx.fillStyle = "rgba(250,248,242,0.09)";
        ctx.strokeStyle = soft(0.15); ctx.lineWidth = 2;
        roundRectPath(ctx, L, mid - 30, 60, 60, 16); ctx.fill(); ctx.stroke();
        ctx.font = "600 31px " + f.display;
        ctx.fillStyle = s.number ? ON : soft(0.4);
        ctx.textAlign = "center"; ctx.textBaseline = "middle";
        ctx.fillText(s.number || "–", L + 30, mid + 2);

        ctx.font = "700 46px " + f.display;
        ctx.textAlign = "right"; ctx.fillStyle = GOLD;
        var tally = String(s.goals);
        ctx.fillText(tally, R, mid + 2);
        var tallyW = ctx.measureText(tally).width;

        ctx.textAlign = "left";
        ctx.font = "500 36px " + f.body;
        ctx.fillStyle = ON;
        var nameMax = INNER - 90 - tallyW - 40;
        if (s.assists) {
          ctx.fillText(fitText(ctx, s.name, nameMax), L + 88, mid - 9);
          ctx.font = "400 25px " + f.body;
          ctx.fillStyle = soft(0.55);
          ctx.fillText(s.assists + " assist" + (s.assists === 1 ? "" : "s"), L + 88, mid + 22);
        } else {
          ctx.fillText(fitText(ctx, s.name, nameMax), L + 88, mid + 1);
        }
        y += 84;
      });
      y += 34;
    }

    if (ogLine) {
      ctx.font = "400 27px " + f.body;
      ctx.textAlign = "left"; ctx.fillStyle = soft(0.55);
      ctx.fillText(ogLine, L, y + 10);
      y += 42;
    }

    // --- timeline ---------------------------------------------------------
    if (shown) {
      sectionLabel("GOALS");
      timeline.slice(0, shown).forEach(function (t) {
        var mid = y + (compact ? 17 : 22);
        ctx.font = "600 " + (compact ? 25 : 30) + "px " + f.display;
        ctx.textAlign = "left"; ctx.textBaseline = "middle";
        ctx.fillStyle = t.forUs ? GOLD : soft(0.42);
        ctx.fillText(t.minute + "'", L, mid);
        ctx.font = (t.forUs ? "500 " : "400 ") + (compact ? 26 : 31) + "px " + f.body;
        ctx.fillStyle = t.forUs ? ON : soft(0.55);
        var label = t.name + (t.ownGoal ? " (own goal)" : "") +
          (t.assistName ? "  ·  assist " + t.assistName : "");
        ctx.fillText(fitText(ctx, label, INNER - 96), L + 96, mid);
        y += ROW;
      });
      if (hiddenGoals) {
        ctx.font = "400 27px " + f.body;
        ctx.fillStyle = soft(0.45); ctx.textAlign = "left";
        ctx.fillText("+ " + hiddenGoals + " more", L + 96, y + 18);
        y += 46;
      }
      y += 34;
    }

    // --- footer -----------------------------------------------------------
    ctx.strokeStyle = soft(0.14); ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(L, y); ctx.lineTo(R, y); ctx.stroke();
    y += 38;
    ctx.font = "600 25px " + f.body;
    ctx.textAlign = "left"; ctx.textBaseline = "middle";
    ctx.fillStyle = soft(0.42);
    ctx.save(); if (ctx.letterSpacing !== undefined) ctx.letterSpacing = "2px";
    ctx.fillText("MATCHDAY TRACKER", L, y);
    ctx.restore();

    return cv;
  }

  // On unless the coach switched it off. Storage that cannot be read or written
  // (a private window, blocked site data) just means "on" and "not remembered".
  function cardTimelinePref() {
    try { return localStorage.getItem(CARD_TIMELINE_KEY) !== "0"; } catch (e) { return true; }
  }
  function saveCardTimelinePref(on) {
    try { localStorage.setItem(CARD_TIMELINE_KEY, on ? "1" : "0"); } catch (e) {}
  }

  async function showMatchCard(record) {
    // Wait for the webfonts so the card never silently comes out in Arial.
    try { if (document.fonts && document.fonts.ready) await document.fonts.ready; } catch (e) {}
    // The switch only means something when there is a goal to list.
    var hasGoals = goalTimeline(record.events, record.opponentName, record).length > 0;
    var withTimeline = cardTimelinePref();
    var cv, url;
    try { cv = drawMatchCard(record, { timeline: withTimeline }); url = cv.toDataURL("image/png"); }
    catch (e) { showToast("Couldn\u2019t build the match card."); return; }

    var old = document.getElementById("cardOverlay");
    if (old) old.remove();

    var canShareFile = false;
    try {
      canShareFile = !!(navigator.canShare && navigator.share &&
        navigator.canShare({ files: [new File([""], "c.png", { type: "image/png" })] }));
    } catch (e) { canShareFile = false; }
    if (nativeBridge()) canShareFile = true;

    var overlay = document.createElement("div");
    overlay.className = "overlay";
    overlay.id = "cardOverlay";
    overlay.innerHTML =
      '<div class="card-sheet">' +
        '<div class="card-scroll"><img class="card-img" id="cardImg" alt="Match card"></div>' +
        (hasGoals
          ? '<button class="toggle-row card-toggle" id="cardTimelineBtn" aria-pressed="' + withTimeline + '">' +
              '<span class="toggle-copy"><span class="t-title">Goal times</span>' +
              '<span class="t-desc">Each goal with its minute. Off gives a shorter card.</span></span>' +
              '<span class="switch' + (withTimeline ? " on" : "") + '"></span>' +
            "</button>"
          : "") +
        '<p class="card-hint">Press and hold the picture to save it or send it to a chat.</p>' +
        (canShareFile ? '<button class="btn btn-gold" id="cardShareBtn">Share picture</button>' : "") +
        '<button class="btn btn-ghost" id="cardCloseBtn">Close</button>' +
      "</div>";
    document.body.appendChild(overlay);
    document.getElementById("cardImg").src = url;
    document.getElementById("cardCloseBtn").onclick = function () { overlay.remove(); };
    overlay.addEventListener("click", function (e) { if (e.target === overlay) overlay.remove(); });
    var sb = document.getElementById("cardShareBtn");
    if (sb) sb.onclick = function () { shareCardImage(cv, record); };
    var tb = document.getElementById("cardTimelineBtn");
    if (tb) tb.onclick = function () {
      var next = !withTimeline, nextCv, nextUrl;
      // Draw first, change state after: a card that cannot be built leaves the
      // picture, the switch and the share button exactly as they were.
      try { nextCv = drawMatchCard(record, { timeline: next }); nextUrl = nextCv.toDataURL("image/png"); }
      catch (e) { showToast("Couldn\u2019t build the match card."); return; }
      withTimeline = next;
      cv = nextCv;                      // "Share picture" reads this when tapped
      document.getElementById("cardImg").src = nextUrl;
      var sc = overlay.querySelector(".card-scroll");
      if (sc) sc.scrollTop = 0;
      tb.setAttribute("aria-pressed", String(withTimeline));
      tb.querySelector(".switch").classList.toggle("on", withTimeline);
      saveCardTimelinePref(withTimeline);
    };
  }

  // Best effort only. The picture is already on screen, so if this fails the
  // user has lost nothing — press and hold still works.
  function shareCardImage(cv, record) {
    var name = String(record.teamName || "match").replace(/[^A-Za-z0-9]+/g, "-").toLowerCase() + "-matchcard.png";
    if (nativeBridge()) {
      var dataUrl;
      try { dataUrl = cv.toDataURL("image/png"); }
      catch (e) { showToast("Press and hold the picture to save it."); return; }
      nativeShareFile(name, dataUrl.slice(dataUrl.indexOf(",") + 1), false, "Match card").catch(function (e) {
        if (nativeCancelled(e)) return;
        showToast("Press and hold the picture to save it.");
      });
      return;
    }
    cv.toBlob(function (blob) {
      if (!blob) { showToast("Press and hold the picture to save it."); return; }
      var file;
      try { file = new File([blob], name, { type: "image/png" }); }
      catch (e) { showToast("Press and hold the picture to save it."); return; }
      if (!(navigator.canShare && navigator.canShare({ files: [file] }))) {
        showToast("Press and hold the picture to save it."); return;
      }
      navigator.share({ files: [file] }).catch(function (e) {
        if (e && e.name === "AbortError") return;
        showToast("Press and hold the picture to save it.");
      });
    }, "image/png");
  }

  /* ---------- Line-up plan -------------------------------------------------
     A coach sets who is on the pitch for each quarter (or half) before the
     match. The plan is applied at kick-off and PROPOSED at every break, never
     applied silently, so a break costs one tap instead of six. Because most
     youth substitutions happen at the breaks, this is also what makes the
     playing-time figures trustworthy rather than a best effort. */

  var pendingPeriods = 4;      // the format chosen on the kick-off screen
  var pendingPlan = null;      // the plan being built there
  var pendingFormatSet = false; // true once the coach picks a format by hand
  var pendingPeriodMinutes = null;
  // Typed into the kick-off form. They live out here because the screen is
  // redrawn by things the coach never asked for — returning to the app after
  // locking the phone, a toast, a chosen format — and a half-filled form that
  // silently resets to "Home" against "Opponent" is how a match gets recorded
  // wrongly for good.
  var pendingOpponentName = "";
  var pendingIsHome = true;
  var pendingTeamId = null;     // which team the ones above belong to

  // Follow last week's format unless the coach has overridden it, so a saved
  // plan is never quietly dropped for being the wrong shape.
  function syncPendingFormat() {
    // Anything half-entered on the kick-off screen belongs to the team it was
    // entered for. Tying it to the team id resets it on every route that can
    // change the active team — switching, importing, deleting — instead of
    // relying on each of those remembering to.
    if (pendingTeamId !== state.activeTeamId) {
      pendingTeamId = state.activeTeamId;
      pendingPlan = null;
      pendingFormatSet = false;
      pendingPeriodMinutes = null;
      pendingOpponentName = "";
      pendingIsHome = true;
    }
    if (pendingPeriodMinutes == null) pendingPeriodMinutes = T().lastPeriodMinutes;
    if (pendingFormatSet) return;
    var lp = normalisePlan(T().lastPlan);
    if (lp) pendingPeriods = lp.periods;
  }

  function planSummaryText() {
    var plan = planForRoster(normalisePlan(pendingPlan || T().lastPlan), sortedRoster());
    if (!plan || plan.periods !== pendingPeriods || !plan.lineups.some(function (r) { return r.length; })) {
      return "No plan yet \u2014 everyone currently on the pitch starts.";
    }
    return plan.lineups.map(function (r, i) {
      return periodShort(plan.periods, i) + " " + r.length;
    }).join("  \u00b7  ") + "  on the pitch";
  }

  function normalisePlan(p) {
    if (!p || !Array.isArray(p.lineups)) return null;
    var periods = PLAN_FORMATS.indexOf(p.periods) !== -1 ? p.periods : p.lineups.length;
    if (PLAN_FORMATS.indexOf(periods) === -1) return null;
    var lineups = [];
    for (var i = 0; i < periods; i++) {
      var row = p.lineups[i];
      lineups.push(Array.isArray(row) ? row.filter(function (x) { return typeof x === "string"; }) : []);
    }
    return { periods: periods, lineups: lineups };
  }

  // A plan outlives roster changes, so drop anyone who has since left.
  function planForRoster(plan, roster) {
    if (!plan) return null;
    var known = {};
    roster.forEach(function (p) { known[p.id] = true; });
    return {
      periods: plan.periods,
      lineups: plan.lineups.map(function (ids) {
        return ids.filter(function (id) { return known[id]; });
      })
    };
  }

  function emptyPlan(periods) {
    var lineups = [];
    for (var i = 0; i < periods; i++) lineups.push([]);
    return { periods: periods, lineups: lineups };
  }

  function periodName(periods, index) {
    if (periods === 2) return index === 0 ? "1st half" : "2nd half";
    if (periods === 8) return "Period " + (index + 1);
    return "Quarter " + (index + 1);
  }
  function periodShort(periods, index) {
    if (periods === 2 && index <= 1) return index === 0 ? "1st" : "2nd";
    if (periods === 2) return "P" + (index + 1);   // past the second half
    return (periods === 8 ? "P" : "Q") + (index + 1);
  }

  // Round robin: every period takes the next block of players, wrapping round.
  // Over P periods of K players across N players this is as even as it gets.
  function spreadEvenly(ids, periods, onCount) {
    var n = ids.length, lineups = [], p, j;
    if (!n) { for (p = 0; p < periods; p++) lineups.push([]); return lineups; }
    var k = Math.max(0, Math.min(onCount, n));
    for (p = 0; p < periods; p++) {
      var start = (p * k) % n, row = [];
      for (j = 0; j < k; j++) row.push(ids[(start + j) % n]);
      lineups.push(row);
    }
    return lineups;
  }

  function planLineup(plan, period) {
    if (!plan || !Array.isArray(plan.lineups)) return null;
    var row = plan.lineups[period - 1];
    return Array.isArray(row) ? row : null;
  }

  // What applying this period would change, so it can be shown before it happens.
  // Marked as not coming, and not on the pitch at any point since. A child
  // who turns up late and is brought on is simply present from then on —
  // for the plan, for the break proposals and for the least-played marker.
  function isAbsent(match, pid) {
    if (!match || (match.unavailable || []).indexOf(pid) === -1) return false;
    var pt = match.playingTime && match.playingTime[pid];
    return !(pt && (pt.onField || pt.accumMs > 0));
  }
  function absentIds(match) {
    return (match && match.unavailable || []).filter(function (pid) { return isAbsent(match, pid); });
  }

  function planChanges(match, period) {
    var row = planLineup(match && match.plan, period);
    if (!row) return null;
    var want = {};
    row.forEach(function (id) { want[id] = true; });
    var on = [], off = [];
    (T().roster || []).forEach(function (p) {
      var pt = match.playingTime && match.playingTime[p.id];
      if (pt && pt.sentOff) return; // a red card outranks any plan
      if (isAbsent(match, p.id)) return; // not at the pitch today
      var now = isOnField(match, p.id);
      if (want[p.id] && !now) on.push(p.id);
      if (!want[p.id] && now) off.push(p.id);
    });
    return { on: on, off: off, lineup: row };
  }

  function applyPlanPeriod(match, period) {
    var ch = planChanges(match, period);
    if (!ch) return null;
    ch.on.forEach(function (id) { setOnField(match, id, true); });
    ch.off.forEach(function (id) { setOnField(match, id, false); });
    return ch;
  }

  function planNameOf(id) {
    var p = rosterById(id);
    return p ? p.name : "Unknown";
  }

  function showLineupPlanner(plan, periods, onSave, excludeIds, onCancel) {
    var away = excludeIds || [];
    var roster = sortedRoster().filter(function (p) { return away.indexOf(p.id) === -1; });
    if (!roster.length) { showToast("Nobody is available to plan with."); if (onCancel) onCancel(); return; }
    var ids = roster.map(function (p) { return p.id; });

    var work = planForRoster(normalisePlan(plan), roster);
    if (!work || work.periods !== periods) {
      var base = work ? work.lineups : [];
      work = emptyPlan(periods);
      for (var i = 0; i < periods; i++) {
        work.lineups[i] = (base[i] || base[base.length - 1] || []).slice();
      }
    }
    var onCount = work.lineups[0].length || Math.min(roster.length, 7);

    var old = document.getElementById("planOverlay");
    if (old) old.remove();
    var overlay = document.createElement("div");
    overlay.className = "overlay";
    overlay.id = "planOverlay";
    document.body.appendChild(overlay);

    function isOn(pi, q) { return work.lineups[q].indexOf(ids[pi]) !== -1; }
    function toggle(pi, q) {
      var arr = work.lineups[q], k = arr.indexOf(ids[pi]);
      if (k === -1) arr.push(ids[pi]); else arr.splice(k, 1);
      refreshCell(pi, q);
    }

    // No redraw: a rebuild resets scrollLeft, which throws the coach back to
    // the first period every time they tick a box in a later one.
    function refreshCell(pi, q) {
      var on = isOn(pi, q);
      var cell = overlay.querySelector('[data-cell="' + pi + "_" + q + '"]');
      if (cell) {
        if (on) cell.classList.add("on"); else cell.classList.remove("on");
        cell.setAttribute("aria-pressed", on ? "true" : "false");
        cell.textContent = on ? "\u2713" : "";
      }
      var share = overlay.querySelector('[data-share="' + pi + '"]');
      if (share) {
        var t = 0;
        for (var i = 0; i < periods; i++) if (isOn(pi, i)) t++;
        share.textContent = t + "/" + periods;
      }
      var tot = overlay.querySelector('[data-tot="' + q + '"]');
      if (tot) tot.textContent = work.lineups[q].length;
    }

    function draw() {
      var keep = overlay.querySelector(".plan-scroll");
      var keepX = keep ? keep.scrollLeft : 0, keepY = keep ? keep.scrollTop : 0;
      var head = '<div class="plan-r plan-head"><div class="plan-name"></div>';
      for (var q = 0; q < periods; q++) head += '<div class="plan-h">' + esc(periodShort(periods, q)) + "</div>";
      head += "</div>";

      var body = roster.map(function (p, pi) {
        var cells = "";
        for (var q = 0; q < periods; q++) {
          cells += '<button class="plan-cell' + (isOn(pi, q) ? " on" : "") +
            '" data-cell="' + pi + "_" + q + '" aria-pressed="' + isOn(pi, q) +
            '" aria-label="' + esc(p.name) + " " + esc(periodName(periods, q)) + '">' +
            (isOn(pi, q) ? "✓" : "") + "</button>";
        }
        var total = 0;
        for (var t = 0; t < periods; t++) if (isOn(pi, t)) total++;
        return '<div class="plan-r">' +
          '<div class="plan-name"><span class="plan-num">' + esc(p.number || "–") + "</span>" +
            '<span class="plan-nm">' + esc(p.name) + "</span>" +
            '<span class="plan-share" data-share="' + pi + '">' + total + "/" + periods + "</span></div>" +
          cells + "</div>";
      }).join("");

      var totals = '<div class="plan-r plan-foot"><div class="plan-name">On the pitch</div>';
      for (var c = 0; c < periods; c++) totals += '<div class="plan-tot" data-tot="' + c + '">' + work.lineups[c].length + "</div>";
      totals += "</div>";

      overlay.innerHTML =
        '<div class="card-sheet">' +
          '<div class="plan-title">Line-up plan</div>' +
          '<div class="plan-tools">' +
            '<div class="plan-step"><span class="plan-step-lbl">On the pitch</span>' +
              '<button class="plan-pm" id="planMinus" aria-label="One fewer">−</button>' +
              '<span class="plan-count" id="planCount">' + onCount + "</span>" +
              '<button class="plan-pm" id="planPlus" aria-label="One more">+</button></div>' +
            '<button class="btn btn-ghost plan-even" id="planEven">Spread evenly</button>' +
          "</div>" +
          (periods > 4 ? '<div class="plan-hint">Scroll sideways for the later periods.</div>' : "") +
          '<div class="card-scroll plan-scroll' + (periods > 4 ? " plan-wide" : "") + '">' +
            head + body + totals + "</div>" +
          '<button class="btn btn-primary" id="planSave">Save plan</button>' +
          '<button class="btn btn-ghost" id="planCancel">Cancel</button>' +
        "</div>";

      var back = overlay.querySelector(".plan-scroll");
      if (back) { back.scrollLeft = keepX; back.scrollTop = keepY; }

      overlay.querySelectorAll("[data-cell]").forEach(function (btn) {
        btn.onclick = function () {
          var parts = btn.getAttribute("data-cell").split("_");
          toggle(parseInt(parts[0], 10), parseInt(parts[1], 10));
        };
      });
      document.getElementById("planMinus").onclick = function () {
        if (onCount > 0) { onCount--; document.getElementById("planCount").textContent = onCount; }
      };
      document.getElementById("planPlus").onclick = function () {
        if (onCount < roster.length) { onCount++; document.getElementById("planCount").textContent = onCount; }
      };
      document.getElementById("planEven").onclick = function () {
        work.lineups = spreadEvenly(ids, periods, onCount);
        draw();
      };
      document.getElementById("planCancel").onclick = function () { overlay.remove(); if (onCancel) onCancel(); };
      document.getElementById("planSave").onclick = function () {
        overlay.remove();
        onSave({ periods: periods, lineups: work.lineups.map(function (r) { return r.slice(); }) });
      };
    }

    overlay.onclick = function (e) {
      if (e.target === overlay) { overlay.remove(); if (onCancel) onCancel(); }
    };
    draw();
  }

  // Shown when a new period starts. Never applies anything on its own.
  function proposePlanAtBreak(match, overNote) {
    var note = overNote || "";
    var ch = planChanges(match, match.period);
    if (!ch) return false;
    if (!ch.on.length && !ch.off.length) {
      showToast(note + "Break — " + periodName(match.plan.periods, match.period - 1) +
        " uses the same line-up.", "warning");
      return true;
    }
    var old = document.getElementById("breakOverlay");
    if (old) old.remove();
    var overlay = document.createElement("div");
    overlay.className = "overlay";
    overlay.id = "breakOverlay";
    var lines = "";
    if (ch.on.length) lines += '<div class="plan-line"><span class="pl-on">On</span> ' +
      esc(ch.on.map(planNameOf).join(", ")) + "</div>";
    if (ch.off.length) lines += '<div class="plan-line"><span class="pl-off">Off</span> ' +
      esc(ch.off.map(planNameOf).join(", ")) + "</div>";
    overlay.innerHTML =
      '<div class="sheet">' +
        (note ? '<div class="plan-line">' + esc(note.trim()) + "</div>" : "") +
        '<div class="confirm-msg">' + esc(periodName(match.plan.periods, match.period - 1)) +
          " — apply the planned line-up?</div>" +
        '<div class="plan-changes">' + lines + "</div>" +
        '<button class="btn btn-primary" id="breakApply" style="margin-top:10px;">Apply</button>' +
        '<button class="btn btn-ghost" id="breakEdit" style="margin-top:10px;">Edit the plan</button>' +
        '<button class="btn btn-ghost" id="breakKeep" style="margin-top:10px;">Keep who is on now</button>' +
      "</div>";
    document.body.appendChild(overlay);
    document.getElementById("breakApply").onclick = function () {
      overlay.remove();
      var applied = applyPlanPeriod(match, match.period);
      persist(); render();
      if (applied) showToast("Line-up applied — " + applied.on.length + " on, " + applied.off.length + " off.");
    };
    document.getElementById("breakKeep").onclick = function () { overlay.remove(); };
    document.getElementById("breakEdit").onclick = function () {
      overlay.remove();
      showLineupPlanner(match.plan, match.plan.periods, function (p) {
        match.plan = p; persist(); render();
        proposePlanAtBreak(match, note);
      }, absentIds(match));
    };
    return true;
  }

  /* ---------- Prepared matches --------------------------------------------
     A coach can set a match up days ahead — opponent, home or away, kick-off,
     who cannot make it and the line-up plan — and then start it at the pitch
     with one tap. Nothing here runs a match; a prepared match only becomes an
     active one when it is started, and it is removed from the list then. */

  function normaliseUpcoming(u) {
    if (!u || typeof u !== "object") return null;
    return {
      id: typeof u.id === "string" ? u.id : uid(),
      opponentName: typeof u.opponentName === "string" ? u.opponentName : "",
      isHome: u.isHome !== false,
      kickoffAt: typeof u.kickoffAt === "string" ? u.kickoffAt : "",
      unavailable: Array.isArray(u.unavailable)
        ? u.unavailable.filter(function (x) { return typeof x === "string"; }) : [],
      periodMinutes: cleanPeriodMinutes(u.periodMinutes),
      plan: normalisePlan(u.plan),
      // When it was last edited, so a merge can tell an old backup from a
      // newer change instead of letting whichever arrives last win.
      updatedAt: typeof u.updatedAt === "number" ? u.updatedAt : 0
    };
  }

  function upcomingList() {
    var list = (T().upcoming || []).slice();
    list.sort(function (a, b) {
      if (!a.kickoffAt && !b.kickoffAt) return 0;
      if (!a.kickoffAt) return 1;       // undated sink to the bottom
      if (!b.kickoffAt) return -1;
      return a.kickoffAt < b.kickoffAt ? -1 : a.kickoffAt > b.kickoffAt ? 1 : 0;
    });
    return list;
  }

  function kickoffLabel(u) {
    if (!u.kickoffAt) return "No date yet";
    var d = new Date(u.kickoffAt);
    if (isNaN(d)) return "No date yet";
    var day = d.toLocaleDateString(undefined, { weekday: "short", day: "numeric", month: "short" });
    var time = d.toLocaleTimeString(undefined, { hour: "2-digit", minute: "2-digit" });
    return day + " · " + time;
  }

  // Kept in the list well past kick-off: a match that was never started is
  // more likely forgotten than cancelled, and silently deleting it would be worse.
  function isOverdue(u) {
    if (!u.kickoffAt) return false;
    var d = new Date(u.kickoffAt);
    return !isNaN(d) && (Date.now() - d.getTime()) > 6 * 60 * 60 * 1000;
  }

  function prepSummary(u) {
    var bits = [];
    var absent = (u.unavailable || []).length;
    if (absent) bits.push(absent + (absent === 1 ? " player away" : " players away"));
    if (u.periodMinutes) bits.push(u.periodMinutes + " min each");
    var plan = normalisePlan(u.plan);
    if (plan && plan.lineups.some(function (r) { return r.length; })) {
      bits.push((PLAN_FORMAT_LABELS[plan.periods] || plan.periods + " periods") + " planned");
    }
    return bits.join(" · ");
  }

  function saveUpcoming(entry) {
    entry.updatedAt = Date.now();
    var list = T().upcoming || (T().upcoming = []);
    var i = -1;
    list.forEach(function (u, k) { if (u.id === entry.id) i = k; });
    if (i === -1) list.push(entry); else list[i] = entry;
    persist();
  }

  function deleteUpcoming(id) {
    T().upcoming = (T().upcoming || []).filter(function (u) { return u.id !== id; });
    persist();
  }

  function startPreparedMatch(id) {
    var u = (T().upcoming || []).filter(function (x) { return x.id === id; })[0];
    if (!u) return;
    deleteUpcoming(id);
    startNewMatch(u.opponentName, u.isHome, u.plan, u.unavailable, u.periodMinutes,
      u.plan ? u.plan.periods : null);
  }

  function showMatchPrep(existing) {
    var roster = sortedRoster();
    var entry = existing
      ? {
          id: existing.id, opponentName: existing.opponentName, isHome: existing.isHome,
          kickoffAt: existing.kickoffAt, unavailable: (existing.unavailable || []).slice(),
          periodMinutes: existing.periodMinutes || null,
          plan: normalisePlan(existing.plan)
        }
      : { id: uid(), opponentName: "", isHome: true, kickoffAt: "", unavailable: [],
          periodMinutes: T().lastPeriodMinutes, plan: null };

    var periods = (entry.plan && entry.plan.periods) ||
      (normalisePlan(T().lastPlan) || {}).periods || 4;

    var old = document.getElementById("prepOverlay");
    if (old) old.remove();
    var overlay = document.createElement("div");
    overlay.className = "overlay";
    overlay.id = "prepOverlay";
    document.body.appendChild(overlay);

    function splitDate() {
      if (!entry.kickoffAt) return ["", ""];
      var parts = entry.kickoffAt.split("T");
      return [parts[0] || "", (parts[1] || "").slice(0, 5)];
    }
    function readFields() {
      var opp = document.getElementById("prepOpp");
      if (opp) entry.opponentName = opp.value;
      var d = document.getElementById("prepDate"), t = document.getElementById("prepTime");
      var dv = d ? d.value : "", tv = t ? t.value : "";
      entry.kickoffAt = dv ? dv + "T" + (tv || "00:00") : "";
      var pm = document.getElementById("prepMins");
      if (pm) entry.periodMinutes = cleanPeriodMinutes(pm.value);
    }
    function availableIds() {
      return roster.filter(function (p) { return entry.unavailable.indexOf(p.id) === -1; })
                   .map(function (p) { return p.id; });
    }

    function draw() {
      var keep = overlay.querySelector(".prep-scroll");
      var keepY = keep ? keep.scrollTop : 0;
      var dt = splitDate();
      var absentRows = roster.map(function (p) {
        var away = entry.unavailable.indexOf(p.id) !== -1;
        return '<button class="prep-av' + (away ? " away" : "") + '" data-away="' + p.id + '" aria-pressed="' + away + '">' +
          '<span class="plan-num">' + esc(p.number || "–") + "</span>" +
          '<span class="prep-av-nm">' + esc(p.name) + "</span>" +
          '<span class="prep-av-tag">' + (away ? "Away" : "There") + "</span>" +
        "</button>";
      }).join("");

      var planBlock = "";
      if (T().settings.planLineups) {
        var plan = entry.plan;
        var planned = plan && plan.lineups.some(function (r) { return r.length; })
          ? plan.lineups.map(function (r, i) { return periodShort(plan.periods, i) + " " + r.length; }).join("  ·  ")
          : "Not planned yet";
        planBlock =
          '<label class="field-label">Match format</label>' +
          '<div class="btn-row" style="margin-bottom:10px;">' +
            PLAN_FORMATS.map(function (nP) {
              return '<button class="btn toggle-seg' + (periods === nP ? " on" : "") +
                '" data-prep-fmt="' + nP + '">' + PLAN_FORMAT_LABELS[nP] + "</button>";
            }).join("") +
          "</div>" +
          '<button class="btn btn-ghost" id="prepPlanBtn">Line-up plan</button>' +
          '<div class="plan-summary">' + esc(planned) + "</div>";
      } else {
        planBlock = '<p class="hint kick-hint">Playing quarters or 8 short periods? ' +
          '<button class="link-btn" id="prepEnablePlan">Turn on line-up planning</button></p>';
      }

      overlay.innerHTML =
        '<div class="card-sheet">' +
          '<div class="plan-title">' + (existing ? "Edit prepared match" : "Prepare a match") + "</div>" +
          '<div class="card-scroll prep-scroll">' +
            '<label class="field-label" for="prepOpp">Opponent</label>' +
            '<input class="text-input" id="prepOpp" placeholder="e.g. KFC Brasschaat" value="' + esc(entry.opponentName) + '">' +
            '<label class="field-label">Home or away?</label>' +
            '<div class="btn-row" style="margin-bottom:14px;">' +
              '<button class="btn toggle-seg' + (entry.isHome ? " on" : "") + '" id="prepHome">Home</button>' +
              '<button class="btn toggle-seg' + (entry.isHome ? "" : " on") + '" id="prepAway">Away</button>' +
            "</div>" +
            '<label class="field-label">Kick-off</label>' +
            '<div class="prep-when">' +
              '<input class="text-input" type="date" id="prepDate" value="' + esc(dt[0]) + '">' +
              '<input class="text-input" type="time" id="prepTime" value="' + esc(dt[1]) + '">' +
            "</div>" +
            '<label class="field-label" for="prepMins">Length of each half, quarter or period, in minutes (optional)</label>' +
            '<input class="text-input" id="prepMins" inputmode="decimal" maxlength="5" placeholder="e.g. 15 or 7,5" value="' +
              esc(entry.periodMinutes || "") + '">' +
            (roster.length
              ? '<label class="field-label">Who can’t make it?</label>' +
                '<div class="prep-av-list">' + absentRows + "</div>"
              : '<p class="hint">Add your players first to plan who plays.</p>') +
            planBlock +
          "</div>" +
          '<button class="btn btn-primary" id="prepSave">' + (existing ? "Save changes" : "Save match") + "</button>" +
          '<button class="btn btn-ghost" id="prepCancel">Cancel</button>' +
        "</div>";

      var back = overlay.querySelector(".prep-scroll");
      if (back) back.scrollTop = keepY;

      var prepEnable = document.getElementById("prepEnablePlan");
      if (prepEnable) prepEnable.onclick = function () {
        readFields();
        T().settings.planLineups = true;
        persist();
        draw();
      };
      document.getElementById("prepHome").onclick = function () { readFields(); entry.isHome = true; draw(); };
      document.getElementById("prepAway").onclick = function () { readFields(); entry.isHome = false; draw(); };
      overlay.querySelectorAll("[data-away]").forEach(function (btn) {
        btn.onclick = function () {
          readFields();
          var id = btn.getAttribute("data-away");
          var k = entry.unavailable.indexOf(id);
          if (k === -1) entry.unavailable.push(id); else entry.unavailable.splice(k, 1);
          // Someone who is not coming cannot hold a place in the line-up.
          if (entry.plan) {
            entry.plan.lineups = entry.plan.lineups.map(function (r) {
              return r.filter(function (x) { return entry.unavailable.indexOf(x) === -1; });
            });
          }
          draw();
        };
      });
      if (T().settings.planLineups) {
        overlay.querySelectorAll("[data-prep-fmt]").forEach(function (btn) {
          btn.onclick = function () {
            readFields();
            periods = parseInt(btn.getAttribute("data-prep-fmt"), 10);
            entry.plan = null; // a different format needs a fresh plan
            draw();
          };
        });
        document.getElementById("prepPlanBtn").onclick = function () {
          readFields();
          overlay.style.display = "none";
          showLineupPlanner(entry.plan || T().lastPlan, periods, function (plan) {
            entry.plan = plan;
            overlay.style.display = "";
            draw();
          }, entry.unavailable, function () { overlay.style.display = ""; });
        };
      }
      document.getElementById("prepCancel").onclick = function () { overlay.remove(); };
      document.getElementById("prepSave").onclick = function () {
        readFields();
        if (!entry.opponentName.trim() && !entry.kickoffAt) {
          showToast("Give it at least an opponent or a date.", "warning");
          return;
        }
        overlay.remove();
        saveUpcoming(entry);
        render();
        showToast("Match saved — start it from the Match tab.");
      };
    }

    overlay.onclick = function (e) { if (e.target === overlay) overlay.remove(); };
    draw();
  }

  function upcomingHtml() {
    var list = upcomingList();
    if (!list.length) return "";
    return '<h2 class="section-title">Ready to play</h2>' +
      '<div class="card">' + list.map(function (u) {
        var sum = prepSummary(u);
        return '<div class="prep-item' + (isOverdue(u) ? " overdue" : "") + '">' +
          '<div class="prep-top">' +
            '<div class="prep-when-lbl">' + esc(kickoffLabel(u)) + (isOverdue(u) ? ' <span class="prep-late">past</span>' : "") + "</div>" +
            '<div class="prep-actions">' +
              '<button class="hi-copy" data-prep-edit="' + u.id + '">Edit</button>' +
              '<button class="hi-remove" data-prep-del="' + u.id + '">Delete</button>' +
            "</div>" +
          "</div>" +
          '<div class="prep-opp">vs ' + esc(u.opponentName || "Opponent") + " · " + (u.isHome ? "Home" : "Away") + "</div>" +
          (sum ? '<div class="prep-sum">' + esc(sum) + "</div>" : "") +
          '<button class="btn btn-primary prep-start" data-prep-start="' + u.id + '">Start this match</button>' +

      }).join("") + "</div>";
