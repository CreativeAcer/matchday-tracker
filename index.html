<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Matchday Tracker</title>
<meta name="description" content="Simple sideline score tracking for youth soccer matches.">
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#16362A">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Matchday">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --pitch-dark: #16362A;
    --pitch: #1F5C40;
    --turf: #2E7D52;
    --chalk: #FAF8F2;
    --chalk-dim: #EFEBDF;
    --panel: #FFFFFF;
    --ink: #16211A;
    --ink-soft: #56645A;
    --gold: #E2A33D;
    --gold-deep: #B97F22;
    /* Foreground for the surfaces that stay dark green in BOTH themes (header,
       scoreboard, primary buttons). --chalk is the page background and flips to
       near-black in dark mode, so it must never be used as text on those. */
    --on-dark: #FAF8F2;
    /* Brand green / red used as TEXT on theme-adaptive panels. The solid
       --pitch and --red stay for fills; these lighten in dark mode so the text
       keeps its contrast. */
    --brand-text: #1F5C40;
    --red-text: #A8362C;
    --red: #C1443B;
    --yellow-card: #E8C93D;
    --line: rgba(22,33,26,0.13);
    --font-display: 'Oswald', 'Arial Narrow', sans-serif;
    --font-body: 'Work Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --chalk: #10201A;
      --brand-text: #74D2A0;
      --red-text: #F0897C;
      --chalk-dim: #0C1913;
      --panel: #17281F;
      --ink: #F1EEE3;
      --ink-soft: #AEBBAF;
      --line: rgba(241,238,227,0.14);
    }
  }
  :root[data-theme="dark"] {
    --chalk: #10201A;
      --brand-text: #74D2A0;
      --red-text: #F0897C;
    --chalk-dim: #0C1913;
    --panel: #17281F;
    --ink: #F1EEE3;
    --ink-soft: #AEBBAF;
    --line: rgba(241,238,227,0.14);
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); height: 100%; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100%;
    background: var(--chalk);
    color: var(--ink);
    font-family: var(--font-body);
    -webkit-tap-highlight-color: transparent;
  }
  button { font-family: inherit; }
  input, select { font-family: inherit; }

  #app { display: flex; flex-direction: column; min-height: 100%; }

  header.topbar {
    position: sticky;
    top: env(safe-area-inset-top, 0px);
    z-index: 20;
    background: var(--pitch-dark);
    color: var(--on-dark);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 10px;
    gap: 8px;
  }
  /* Both header icons read as buttons: a filled pill with a bright glyph, so
     they stay obvious against the dark green in either theme. */
  .icon-btn {
    background: rgba(255,255,255,0.14);
    border: 1px solid rgba(255,255,255,0.30);
    color: var(--on-dark);
    font-size: 19px;
    line-height: 1;
    width: 42px;
    height: 42px;
    flex-shrink: 0;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .icon-btn:active { background: rgba(255,255,255,0.30); }
  .icon-btn:disabled { opacity: 0.4; }
  .help-icon { font-weight: 700; }

  .clock-btn {
    flex: 1;
    background: rgba(255,255,255,0.07);
    border: 1px solid rgba(255,255,255,0.16);
    border-radius: 12px;
    color: var(--on-dark);
    padding: 6px 12px;
    display: flex;
    flex-direction: column;
    align-items: center;
    line-height: 1.15;
  }
  .clock-btn:active { background: rgba(255,255,255,0.14); }
  .clock-time {
    font-family: var(--font-display);
    font-size: 24px;
    font-weight: 600;
    letter-spacing: 0.5px;
  }
  .clock-state { font-size: 11px; color: var(--gold); }
  .clock-state.running { color: #8FD9AE; }

  .scoreboard {
    background: var(--pitch);
    color: var(--on-dark);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    padding: 8px 14px 16px;
    position: sticky;
    top: calc(env(safe-area-inset-top, 0px) + 62px);
    z-index: 19;
  }
  .score-side { text-align: center; min-width: 0; flex: 1; }
  .score-num {
    font-family: var(--font-display);
    font-size: 40px;
    font-weight: 700;
    display: block;
    line-height: 1;
  }
  .score-side.them .score-num { color: var(--gold); }
  .score-label {
    display: block;
    font-size: 12px;
    margin-top: 3px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .score-sep { font-family: var(--font-display); font-size: 22px; opacity: 0.5; margin-top: -6px; }

  main.screen { flex: 1; padding: 16px 14px 100px; max-width: 640px; width: 100%; margin: 0 auto; }
  .hidden { display: none !important; }

  h1.screen-title {
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 22px;
    margin: 4px 0 14px;
  }
  h2.section-title {
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 17px;
    margin: 22px 0 10px;
    color: var(--ink);
  }
  p.hint { color: var(--ink-soft); font-size: 13.5px; line-height: 1.5; margin: 4px 0 14px; }

  .card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 16px;
    margin-bottom: 14px;
  }

  .btn {
    font-family: var(--font-body);
    font-weight: 600;
    font-size: 15px;
    border-radius: 12px;
    padding: 13px 16px;
    border: 1px solid var(--line);
    background: var(--panel);
    color: var(--ink);
    width: 100%;
    display: block;
    text-align: center;
  }
  .btn:active { transform: scale(0.98); }
  .btn-primary { background: var(--pitch); color: var(--on-dark); border-color: var(--pitch); }
  .btn-gold { background: var(--gold); color: var(--pitch-dark); border-color: var(--gold-deep); }
  .btn-danger { background: transparent; color: var(--red-text); border-color: var(--red-text); }
  .btn-ghost { background: transparent; }
  .btn-row { display: flex; gap: 10px; }
  .btn-row .btn { width: auto; flex: 1; }
  .toggle-seg { background: var(--chalk-dim); border-color: var(--line); color: var(--ink-soft); }
  .toggle-seg.on { background: var(--pitch); color: var(--on-dark); border-color: var(--pitch); }

  label.field-label { display: block; font-size: 12.5px; font-weight: 600; color: var(--ink-soft); margin-bottom: 5px; }
  input.text-input {
    width: 100%;
    padding: 11px 12px;
    border-radius: 10px;
    border: 1px solid var(--line);
    background: var(--chalk-dim);
    color: var(--ink);
    /* 16px minimum: below this iOS Safari zooms the page in on focus and never
       zooms back out, which leaves the whole layout cut off on the right. */
    font-size: 16px;
    margin-bottom: 12px;
  }
  input.text-input:focus, .btn:focus-visible, .icon-btn:focus-visible, .clock-btn:focus-visible, .tile:focus-visible {
    outline: 2px solid var(--gold-deep);
    outline-offset: 2px;
  }

  .toggle-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 2px;
    border-bottom: 1px solid var(--line);
    gap: 12px;
    width: 100%;
    background: none;
    border-left: none; border-right: none; border-top: none;
    text-align: left;
    color: inherit;
    font-family: inherit;
    min-height: 44px;
  }
  .toggle-row:last-of-type { border-bottom: none; }
  .toggle-row:active { background: var(--chalk-dim); }
  .toggle-row .toggle-copy { flex: 1; min-width: 0; display: block; }
  .toggle-row .toggle-copy .t-title { display: block; font-weight: 600; font-size: 14.5px; }
  .toggle-row .toggle-copy .t-desc { display: block; font-size: 12.5px; color: var(--ink-soft); margin-top: 2px; line-height: 1.4; }
  .switch {
    display: block;
    width: 46px; height: 27px; border-radius: 20px;
    background: var(--line); border: none; position: relative; flex-shrink: 0;
  }
  .switch::after {
    content: ''; position: absolute; top: 3px; left: 3px;
    width: 21px; height: 21px; border-radius: 50%;
    background: var(--panel); box-shadow: 0 1px 2px rgba(0,0,0,0.25);
    transition: left 0.15s ease;
  }
  .switch.on { background: var(--turf); }
  .switch.on::after { left: 22px; background: #fff; }

  .roster-list { margin-top: 4px; }
  .roster-item {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 2px; border-bottom: 1px solid var(--line);
  }
  .roster-item:last-child { border-bottom: none; }
  .roster-num {
    font-family: var(--font-display); font-weight: 600; font-size: 16px;
    background: var(--pitch); color: var(--on-dark);
    width: 34px; height: 34px; border-radius: 8px;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .roster-name { flex: 1; font-size: 15px; }
  .roster-remove { background: none; border: none; color: var(--red-text); font-size: 13px; padding: 8px 10px; min-height: 44px; }

  .add-player-row { display: flex; gap: 8px; align-items: flex-end; margin-top: 6px; }
  .add-player-row .num-input { width: 68px; }
  .add-player-row .name-input { flex: 1; }
  .add-player-row .text-input { margin-bottom: 0; }
  .add-player-row .btn { width: auto; padding: 11px 16px; flex-shrink: 0; }

  .player-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
    gap: 10px;
    margin-bottom: 16px;
  }
  .tile {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 10px 8px 8px;
    text-align: center;
    position: relative;
    overflow: hidden;
    -webkit-user-select: none;
    user-select: none;
  }
  .tile.benched { opacity: 0.5; }
  .tile.benched .tile-num, .tile.benched .tile-name { color: var(--ink-soft); }
  .field-badge {
    display: block;
    width: calc(100% + 16px);
    margin: -10px -8px 6px;
    padding: 13px 0;
    border: none;
    font-family: var(--font-body);
    font-size: 11.5px;
    font-weight: 700;
    background: var(--turf);
    color: #fff;
  }
  .field-badge.off { background: var(--chalk-dim); color: var(--ink-soft); }
  .field-badge.sent-off-badge { background: var(--red); color: #fff; }
  .field-badge:disabled { opacity: 0.85; }
  .tile:active { background: var(--chalk-dim); }
  .tile.just-scored { animation: pulse-gold 0.5s ease; }
  @media (prefers-reduced-motion: reduce) { .tile.just-scored { animation: none; } }
  @keyframes pulse-gold {
    0% { box-shadow: 0 0 0 0 rgba(226,163,61,0.55); }
    100% { box-shadow: 0 0 0 10px rgba(226,163,61,0); }
  }
  .tile-num {
    font-family: var(--font-display); font-weight: 700; font-size: 26px;
    color: var(--brand-text); line-height: 1;
  }
  .tile-name {
    font-size: 12.5px; font-weight: 600; margin-top: 3px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .tile-goals { font-size: 11px; color: var(--ink-soft); margin-top: 1px; min-height: 14px; }
  .tile-controls { display: flex; justify-content: center; gap: 2px; margin-top: 2px; }
  /* The coloured rectangle stays small, but its button carries a 44px hit area
     so it can be tapped one-handed on a sideline. */
  .card-btn {
    background: none; border: none; padding: 0;
    width: 44px; height: 44px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
  }
  .card-btn:disabled { opacity: 0.4; }
  .mini-card { display: block; width: 20px; height: 26px; border-radius: 3px; border: 1px solid var(--line); }
  .mini-card.yellow-btn { background: rgba(232,201,61,0.4); border-color: rgba(185,127,34,0.55); }
  .mini-card.yellow-btn.card-yellow { background: var(--yellow-card); border-color: var(--gold-deep); }
  .mini-card.red-btn { background: rgba(193,68,59,0.4); border-color: rgba(122,38,32,0.55); }
  .mini-card.red-btn.card-red { background: var(--red); border-color: #7a2620; }
  .tile.sent-off { opacity: 0.6; }
  .tile.sent-off .tile-num, .tile.sent-off .tile-name { color: var(--red-text); }
  .confirm-msg { font-size: 15px; line-height: 1.5; padding: 8px 4px 0; }

  .goal-btn-row { display: flex; gap: 10px; margin-bottom: 18px; }
  .opp-goal-btn {
    flex: 1;
    min-width: 0;
    background: var(--chalk-dim);
    border: 1px dashed var(--ink-soft);
    border-radius: 14px;
    padding: 16px 12px;
    font-weight: 700;
    font-size: 15px;
    color: var(--ink);
  }
  .opp-goal-btn:active { background: var(--line); }
  .own-goal-btn { flex: 0 0 34%; }

  .assist-bar {
    position: sticky;
    top: calc(env(safe-area-inset-top, 0px) + 62px + 78px);
    z-index: 18;
    background: var(--gold);
    color: var(--pitch-dark);
    border-radius: 12px;
    padding: 10px 12px;
    margin-bottom: 14px;
  }
  .assist-bar .a-title { font-weight: 700; font-size: 13.5px; margin-bottom: 8px; }
  .assist-chip-row { display: flex; flex-wrap: wrap; gap: 6px; }
  .assist-chip {
    background: rgba(22,33,26,0.12);
    border: none; border-radius: 8px; padding: 7px 10px; font-size: 13px; font-weight: 600;
    color: var(--pitch-dark);
  }
  .assist-chip:active { background: rgba(22,33,26,0.22); }
  .assist-chip.chip-selected { background: var(--pitch); color: var(--on-dark); }

  .event-log { margin-top: 4px; }
  .event-row {
    display: flex; align-items: center; gap: 8px;
    padding: 7px 2px; border-bottom: 1px solid var(--line); font-size: 13.5px;
  }
  .event-row:last-child { border-bottom: none; }
  .event-minute { font-family: var(--font-display); color: var(--ink-soft); width: 32px; flex-shrink: 0; }
  .event-desc { flex: 1; }
  .event-actions { display: flex; align-items: center; gap: 0; flex-shrink: 0; }
  .event-edit, .event-delete {
    background: none; border: none; color: var(--ink-soft);
    font-size: 15px; padding: 0; flex-shrink: 0;
    min-width: 44px; min-height: 44px;
  }
  .event-edit:active { color: var(--brand-text); }
  .event-delete:active { color: var(--red-text); }
  .empty-state { color: var(--ink-soft); font-size: 13.5px; padding: 10px 2px; }

  .end-match-btn { margin-top: 22px; }

  .summary-score {
    text-align: center; padding: 18px 0 6px;
  }
  .summary-score .ss-num {
    font-family: var(--font-display); font-weight: 700; font-size: 46px;
  }
  .summary-score .ss-teams { font-size: 13.5px; color: var(--ink-soft); margin-top: 4px; }

  .stat-list { margin-top: 4px; }
  .stat-row {
    display: flex; justify-content: space-between; padding: 8px 2px; border-bottom: 1px solid var(--line);
    font-size: 14px;
  }
  .stat-row:last-child { border-bottom: none; }
  .stat-row .sr-name { font-weight: 600; }
  .stat-row .sr-val { color: var(--ink-soft); font-variant-numeric: tabular-nums; }

  .history-item { padding: 12px 2px; border-bottom: 1px solid var(--line); }
  .history-item:last-child { border-bottom: none; }
  .hi-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .hi-score { font-family: var(--font-display); font-weight: 700; font-size: 17px; }
  .hi-meta { font-size: 12px; color: var(--ink-soft); margin-top: 2px; }
  .hi-scorers { font-size: 12.5px; color: var(--ink-soft); margin-top: 4px; }
  .result-pill { font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 20px; }
  .result-pill.win { background: rgba(46,125,82,0.16); color: var(--brand-text); }
  .result-pill.loss { background: rgba(193,68,59,0.14); color: var(--red-text); }
  .result-pill.draw { background: var(--chalk-dim); color: var(--ink-soft); }
  .hi-remove { background: none; border: none; color: var(--ink-soft); font-size: 12px; padding: 8px 10px; min-height: 44px; }
  .hi-copy { background: none; border: none; color: var(--brand-text); font-size: 12px; font-weight: 700; padding: 8px 10px; min-height: 44px; }
  .hi-actions { display: flex; align-items: center; gap: 2px; flex-shrink: 0; }
  .share-textarea {
    width: 100%; min-height: 150px; margin-top: 10px;
    padding: 10px; border-radius: 10px; border: 1px solid var(--line);
    background: var(--chalk-dim); color: var(--ink); font-family: var(--font-body);
    font-size: 16px; line-height: 1.5; resize: vertical;
  }

  .overlay {
    position: fixed; inset: 0; background: rgba(16,26,20,0.5); z-index: 30;
    display: flex; align-items: flex-end;
  }
  .sheet {
    background: var(--panel); width: 100%; border-radius: 18px 18px 0 0;
    padding: 10px 8px calc(14px + env(safe-area-inset-bottom, 0px));
  }
  .help-sheet {
    max-height: 82vh;
    display: flex;
    flex-direction: column;
    padding-left: 0; padding-right: 0;
  }
  .help-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 4px 16px 10px; border-bottom: 1px solid var(--line); flex-shrink: 0;
  }
  .help-header h2 { margin: 0; }
  /* .icon-btn is styled for the dark header; inside a sheet it sits on the panel
     colour instead, so it drops the light pill and follows the sheet's text. */
  .help-header .icon-btn {
    color: var(--ink);
    background: var(--chalk-dim);
    border-color: var(--line);
  }
  .help-body {
    overflow-y: auto;
    padding: 14px 16px calc(20px + env(safe-area-inset-bottom, 0px));
  }
  .help-section { margin-bottom: 18px; }
  .help-section:last-child { margin-bottom: 0; }
  .help-section h3 {
    font-family: var(--font-display); font-weight: 600; font-size: 15px;
    margin: 0 0 6px; color: var(--brand-text);
  }
  .help-section p { margin: 0 0 6px; font-size: 13.5px; line-height: 1.55; color: var(--ink); }
  .help-section p:last-child { margin-bottom: 0; }

  .team-sheet { max-height: 82vh; display: flex; flex-direction: column; padding-left: 0; padding-right: 0; }
  .team-list { overflow-y: auto; padding: 6px 8px 0; }
  .team-row {
    display: flex; align-items: center; gap: 4px;
    border-bottom: 1px solid var(--line);
  }
  .team-row:last-child { border-bottom: none; }
  .team-row.current { background: var(--chalk-dim); border-radius: 10px; }
  .team-pick {
    flex: 1; min-width: 0; text-align: left; background: none; border: none;
    padding: 13px 10px; display: flex; flex-direction: column; gap: 2px; color: var(--ink);
  }
  .team-pick-name { font-weight: 700; font-size: 15px; }
  .team-pick-meta { font-size: 12px; color: var(--ink-soft); }
  .team-del { background: none; border: none; color: var(--ink-soft); font-size: 15px; padding: 0; flex-shrink: 0; min-width: 44px; min-height: 44px; }
  .team-del:active { color: var(--red-text); }

  .team-card {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
  }
  .team-card .tc-name { font-family: var(--font-display); font-weight: 600; font-size: 19px; }
  .team-card .tc-meta { font-size: 12.5px; color: var(--ink-soft); margin-top: 2px; }
  .team-card .btn { width: auto; flex-shrink: 0; padding: 12px 16px; font-size: 14px; min-height: 44px; }
  .playing-as { font-size: 13px; color: var(--ink-soft); margin: -6px 0 12px; }
  .playing-as strong { color: var(--ink); }
  .link-btn {
    background: none; border: none; padding: 0; font-size: 13px;
    color: var(--brand-text); font-weight: 700; text-decoration: underline;
  }

  .bottom-nav {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 25;
    display: flex;
    background: var(--panel);
    border-top: 1px solid var(--line);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  .tab-btn {
    flex: 1;
    background: none;
    border: none;
    padding: 8px 4px 6px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    color: var(--ink-soft);
  }
  .tab-btn .tab-icon { font-size: 20px; line-height: 1; }
  .tab-btn .tab-label { font-size: 11px; font-weight: 600; }
  .tab-btn.active { color: var(--brand-text); }
  .tab-btn:active { background: var(--chalk-dim); }

  .file-input-hidden { display: none; }

  .toast {
    position: fixed;
    left: 16px; right: 16px;
    bottom: calc(86px + env(safe-area-inset-bottom, 0px));
    margin: 0 auto;
    max-width: 420px;
    text-align: center;
    padding: 16px 20px;
    border-radius: 16px;
    font-size: 15.5px;
    font-weight: 700;
    line-height: 1.4;
    z-index: 50;
    box-shadow: 0 12px 32px rgba(0,0,0,0.4);
    animation: toast-in 0.22s ease-out;
  }
  @keyframes toast-in {
    0% { opacity: 0; transform: translateY(14px) scale(0.97); }
    100% { opacity: 1; transform: translateY(0) scale(1); }
  }
  @media (prefers-reduced-motion: reduce) { .toast { animation: none; } }
  .toast-success { background: var(--turf); color: #fff; }
  .toast-warning { background: var(--gold); color: var(--pitch-dark); box-shadow: 0 12px 32px rgba(0,0,0,0.4), 0 0 0 3px var(--gold-deep) inset; }
  .toast-error { background: var(--red); color: #fff; }

  ::-webkit-scrollbar { display: none; }
</style>
</head>
<body>
<div id="app">
  <header class="topbar">
    <button class="icon-btn help-icon" id="helpBtn" aria-label="How to use this app">?</button>
    <button class="clock-btn" id="clockBtn">
      <span class="clock-time" id="clockTime">00:00</span>
      <span class="clock-state" id="clockState">No match yet</span>
    </button>
    <button class="icon-btn" id="undoBtn" aria-label="Undo last event">↺</button>
  </header>

  <div class="scoreboard" id="scoreboardBar">
    <div class="score-side us">
      <span class="score-num" id="usScoreNum">0</span>
      <span class="score-label" id="usScoreLabel">Your Team</span>
    </div>
    <span class="score-sep">–</span>
    <div class="score-side them">
      <span class="score-num" id="themScoreNum">0</span>
      <span class="score-label" id="themScoreLabel">Opponent</span>
    </div>
  </div>

  <main class="screen" id="matchScreen"></main>
  <main class="screen hidden" id="teamScreen"></main>
  <main class="screen hidden" id="historyScreen"></main>

  <nav class="bottom-nav">
    <button class="tab-btn" data-nav="match" id="tabMatch">
      <span class="tab-icon">⚽</span><span class="tab-label">Match</span>
    </button>
    <button class="tab-btn" data-nav="team" id="tabTeam">
      <span class="tab-icon">👥</span><span class="tab-label">Team</span>
    </button>
    <button class="tab-btn" data-nav="history" id="tabHistory">
      <span class="tab-icon">📋</span><span class="tab-label">History</span>
    </button>
  </nav>
</div>

<input type="file" accept="application/json,.json" class="file-input-hidden" id="importFileInput">

<script>
(function () {
  "use strict";

  var STORAGE_KEY = "matchdayTrackerData_v1";

  function uid() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  }

  function defaultSettings() {
    return { trackAssists: false, trackPlayingTime: false, trackCards: false };
  }

  function newTeam(name) {
    return {
      id: uid(),
      teamName: name || "My Team",
      roster: [],
      settings: defaultSettings(),
      activeMatch: null,
      history: []
    };
  }

  function defaultState() {
    var t = newTeam("My Team");
    return { version: 2, teams: [t], activeTeamId: t.id };
  }

  // Normalise any stored shape into the v2 multi-team shape. Version 1 stored a
  // single team at the top level, so it becomes that account's first team —
  // nothing a person already recorded may be dropped here.
  function migrate(parsed) {
    if (!parsed || typeof parsed !== "object") return defaultState();

    var teams;
    if (Array.isArray(parsed.teams) && parsed.teams.length) {
      teams = parsed.teams;
    } else {
      var t = newTeam(parsed.teamName || "My Team");
      t.roster = Array.isArray(parsed.roster) ? parsed.roster : [];
      t.settings = Object.assign(defaultSettings(), parsed.settings || {});
      t.activeMatch = parsed.activeMatch || null;
      t.history = Array.isArray(parsed.history) ? parsed.history : [];
      teams = [t];
    }

    teams = teams.map(function (t) {
      return {
        id: t.id || uid(),
        teamName: t.teamName || "My Team",
        roster: Array.isArray(t.roster) ? t.roster : [],
        settings: Object.assign(defaultSettings(), t.settings || {}),
        activeMatch: t.activeMatch || null,
        history: Array.isArray(t.history) ? t.history : []
      };
    });

    var activeId = parsed.activeTeamId;
    if (!teams.some(function (t) { return t.id === activeId; })) activeId = teams[0].id;
    return { version: 2, teams: teams, activeTeamId: activeId };
  }

  function load() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return defaultState();
      return migrate(JSON.parse(raw));
    } catch (e) {
      console.error("Load failed", e);
      return defaultState();
    }
  }

  // The currently selected team. Self-healing: never returns undefined.
  function T() {
    for (var i = 0; i < state.teams.length; i++) {
      if (state.teams[i].id === state.activeTeamId) return state.teams[i];
    }
    if (state.teams.length) {
      state.activeTeamId = state.teams[0].id;
      return state.teams[0];
    }
    var t = newTeam("My Team");
    state.teams.push(t);
    state.activeTeamId = t.id;
    return t;
  }

  function teamById(id) {
    for (var i = 0; i < state.teams.length; i++) {
      if (state.teams[i].id === id) return state.teams[i];
    }
    return null;
  }

  function persist() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    } catch (e) {
      console.error("Save failed", e);
      showToast("Couldn't save — storage may be full or unavailable.", "error");
    }
  }

  var state = load();
  // Write the normalised (possibly migrated) shape straight back, so an upgrade
  // isn't left half-applied if the app is closed without touching anything.
  persist();
  var view = T().roster.length === 0 ? "team" : "match";
  var pendingAssistEventId = null;
  var assistBarTimer = null;

  // ---------- utilities ----------

  function rosterById(id) {
    for (var i = 0; i < T().roster.length; i++) {
      if (T().roster[i].id === id) return T().roster[i];
    }
    return null;
  }

  // Resolve a player name for a finished match: prefer the roster as it was at
  // the time, so history doesn't break when players later leave the squad.
  function nameInRecord(record, playerId) {
    if (record && record.rosterSnapshot) {
      for (var i = 0; i < record.rosterSnapshot.length; i++) {
        if (record.rosterSnapshot[i].id === playerId) return record.rosterSnapshot[i].name;
      }
    }
    var live = rosterById(playerId);
    return live ? live.name : "Unknown";
  }

  function formatClock(ms) {
    var totalSec = Math.max(0, Math.floor(ms / 1000));
    var m = Math.floor(totalSec / 60);
    var s = totalSec % 60;
    return (m < 10 ? "0" + m : m) + ":" + (s < 10 ? "0" + s : s);
  }

  function clockElapsedMs(match) {
    if (!match) return 0;
    var extra = match.clock.running ? (Date.now() - match.clock.runningSince) : 0;
    return match.clock.elapsedMs + extra;
  }

  function currentMinute(match) {
    return Math.floor(clockElapsedMs(match) / 60000);
  }

  function computeStats(match) {
    var scoreUs = 0, scoreThem = 0;
    var ownGoalsFor = 0, ownGoalsAgainst = 0;
    var scorers = {}, assists = {}, cards = {};
    match.events.forEach(function (ev) {
      if (ev.type === "goal") {
        scoreUs++;
        scorers[ev.playerId] = (scorers[ev.playerId] || 0) + 1;
        if (ev.assistId) assists[ev.assistId] = (assists[ev.assistId] || 0) + 1;
      } else if (ev.type === "opponent_goal") {
        scoreThem++;
      } else if (ev.type === "own_goal") {
        // An own goal counts for the OTHER team and is never credited to a
        // player, so it can't land in anyone's scoring stats.
        if (ev.by === "us") { scoreThem++; ownGoalsAgainst++; }
        else { scoreUs++; ownGoalsFor++; }
      } else if (ev.type === "card") {
        if (!cards[ev.playerId]) cards[ev.playerId] = [];
        cards[ev.playerId].push(ev.cardType);
      }
    });
    return {
      scoreUs: scoreUs, scoreThem: scoreThem,
      scorers: scorers, assists: assists, cards: cards,
      ownGoalsFor: ownGoalsFor, ownGoalsAgainst: ownGoalsAgainst
    };
  }

  function playingTimeMinutes(match) {
    var out = {};
    if (!match.playingTime) return out;
    var endMs = clockElapsedMs(match);
    Object.keys(match.playingTime).forEach(function (pid) {
      var pt = match.playingTime[pid];
      var total = pt.accumMs;
      if (pt.onField && pt.onSince != null) total += (endMs - pt.onSince);
      out[pid] = Math.round(total / 60000);
    });
    return out;
  }

  function goalTimeline(events, opponentName, record) {
    var ourName = (record && record.teamName) || T().teamName;
    return (events || [])
      .filter(function (e) { return e.type === "goal" || e.type === "opponent_goal" || e.type === "own_goal"; })
      .map(function (e) {
        if (e.type === "goal") {
          var scorerName = record ? nameInRecord(record, e.playerId) : (rosterById(e.playerId) ? rosterById(e.playerId).name : "Unknown");
          var assistName = null;
          if (e.assistId) {
            assistName = record ? nameInRecord(record, e.assistId) : (rosterById(e.assistId) ? rosterById(e.assistId).name : null);
          }
          return { minute: e.minuteAtEvent, forUs: true, name: scorerName, assistName: assistName, ownGoal: false };
        }
        if (e.type === "own_goal") {
          // Listed under the team it counts FOR, flagged as an own goal.
          var forUs = e.by !== "us";
          return { minute: e.minuteAtEvent, forUs: forUs, name: forUs ? ourName : opponentName, assistName: null, ownGoal: true };
        }
        return { minute: e.minuteAtEvent, forUs: false, name: opponentName, assistName: null, ownGoal: false };
      });
  }

  function timelineHtml(timeline) {
    if (!timeline.length) return '<div class="empty-state">No goals scored.</div>';
    return timeline.map(function (t) {
      var desc = "⚽ " + esc(t.name) +
        (t.ownGoal ? " (own goal)" : "") +
        (t.assistName ? " (assist: " + esc(t.assistName) + ")" : "");
      return '<div class="event-row"><span class="event-minute">' + t.minute + "'</span><span class=\"event-desc\">" + desc + "</span></div>";
    }).join("");
  }

  function buildShareText(record) {
    var isHome = record.isHome !== false;
    var homeName = isHome ? record.teamName : record.opponentName;
    var awayName = isHome ? record.opponentName : record.teamName;
    var homeScore = isHome ? record.scoreUs : record.scoreThem;
    var awayScore = isHome ? record.scoreThem : record.scoreUs;
    var d = new Date(record.date);
    var dateStr = isNaN(d) ? "" : d.toLocaleDateString(undefined, { weekday: "short", day: "numeric", month: "short", year: "numeric" });
    var timeline = goalTimeline(record.events, record.opponentName, record);

    var lines = [];
    if (dateStr) lines.push(dateStr);
    lines.push(homeName + " (Home) " + homeScore + " – " + awayScore + " " + awayName + " (Away)");

    // Goals per player for THIS match, so the shared report carries the tally
    // and not just the minute-by-minute list.
    var tally = Object.keys(record.scorers || {}).map(function (pid) {
      return {
        name: nameInRecord(record, pid),
        goals: record.scorers[pid],
        assists: (record.assists || {})[pid] || 0
      };
    }).sort(function (a, b) { return b.goals - a.goals || a.name.localeCompare(b.name); });

    if (tally.length) {
      lines.push("");
      lines.push("Goals per player:");
      tally.forEach(function (r) {
        lines.push(r.name + ": " + r.goals +
          (r.assists ? " (" + r.assists + " assist" + (r.assists === 1 ? "" : "s") + ")" : ""));
      });
    }
    if (record.ownGoalsFor) lines.push("Own goals in our favour: " + record.ownGoalsFor);
    if (record.ownGoalsAgainst) lines.push("Own goals against us: " + record.ownGoalsAgainst);

    if (timeline.length) {
      lines.push("");
      lines.push("Goals:");
      timeline.forEach(function (t) {
        lines.push(t.minute + "' " + t.name +
          (t.ownGoal ? " (own goal)" : "") +
          (t.assistName ? " (assist: " + t.assistName + ")" : ""));
      });
    }
    return lines.join("\n");
  }

  async function copyShareText(text) {
    try {
      if (!navigator.clipboard || !navigator.clipboard.writeText) throw new Error("no clipboard api");
      await navigator.clipboard.writeText(text);
      showToast("Copied — paste it into your group chat.");
    } catch (e) {
      showCopyFallback(text);
    }
  }

  function showCopyFallback(text) {
    var old = document.getElementById("copyOverlay");
    if (old) old.remove();
    var overlay = document.createElement("div");
    overlay.className = "overlay";
    overlay.id = "copyOverlay";
    overlay.innerHTML =
      '<div class="sheet">' +
        '<div class="confirm-msg">Couldn\u2019t copy automatically. Tap the text below, select all, then copy.</div>' +
        '<textarea class="share-textarea" id="shareTextarea" readonly></textarea>' +
        '<div class="btn-row" style="margin-top:12px;">' +
          '<button class="btn btn-ghost" id="copyFallbackClose">Close</button>' +
          '<button class="btn btn-primary" id="copyFallbackTry">Try copy again</button>' +
        "</div>" +
      "</div>";
    document.body.appendChild(overlay);
    var ta = document.getElementById("shareTextarea");
    ta.value = text;
    ta.focus();
    ta.select();
    function cleanup() { overlay.remove(); }
    document.getElementById("copyFallbackClose").onclick = cleanup;
    overlay.onclick = function (e) { if (e.target === overlay) cleanup(); };
    document.getElementById("copyFallbackTry").onclick = function () {
      ta.focus();
      ta.select();
      var ok = false;
      try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
      if (ok) {
        showToast("Copied — paste it into your group chat.");
        cleanup();
      } else {
        showToast("Still couldn't copy automatically — select the text and copy manually.", "error");
      }
    };
  }

  function showToast(msg, type) {
    var existing = document.getElementById("toastEl");
    if (existing) existing.remove();
    var t = document.createElement("div");
    t.className = "toast toast-" + (type || "success");
    t.id = "toastEl";
    t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(function () { t.remove(); }, 3200);
  }

  function esc(str) {
    var d = document.createElement("div");
    d.textContent = str == null ? "" : String(str);
    return d.innerHTML;
  }

  function showConfirm(message, confirmLabel, onConfirm, danger) {
    var old = document.getElementById("confirmOverlay");
    if (old) old.remove();
    var overlay = document.createElement("div");
    overlay.className = "overlay";
    overlay.id = "confirmOverlay";
    overlay.innerHTML =
      '<div class="sheet">' +
        '<div class="confirm-msg">' + esc(message) + "</div>" +
        '<div class="btn-row" style="margin-top:16px;">' +
          '<button class="btn btn-ghost" id="confirmCancelBtn">Cancel</button>' +
          '<button class="btn ' + (danger ? "btn-danger" : "btn-primary") + '" id="confirmOkBtn">' + esc(confirmLabel || "Confirm") + "</button>" +
        "</div>" +
      "</div>";
    document.body.appendChild(overlay);
    function cleanup() { overlay.remove(); }
    document.getElementById("confirmCancelBtn").onclick = cleanup;
    document.getElementById("confirmOkBtn").onclick = function () { cleanup(); onConfirm(); };
    overlay.onclick = function (e) { if (e.target === overlay) cleanup(); };
  }

  // A confirm with more than two outcomes, stacked so long labels stay readable.
  function showChoice(message, options) {
    var old = document.getElementById("choiceOverlay");
    if (old) old.remove();
    var overlay = document.createElement("div");
    overlay.className = "overlay";
    overlay.id = "choiceOverlay";
    var buttons = options.map(function (o, i) {
      return '<button class="btn ' + (o.danger ? "btn-danger" : "btn-primary") +
        '" data-choice="' + i + '" style="margin-top:10px;">' + esc(o.label) + "</button>";
    }).join("");
    overlay.innerHTML =
      '<div class="sheet">' +
        '<div class="confirm-msg">' + esc(message) + "</div>" +
        buttons +
        '<button class="btn btn-ghost" id="choiceCancelBtn" style="margin-top:10px;">Cancel</button>' +
      "</div>";
    document.body.appendChild(overlay);
    function cleanup() { overlay.remove(); }
    overlay.onclick = function (e) { if (e.target === overlay) cleanup(); };
    document.getElementById("choiceCancelBtn").onclick = cleanup;
    overlay.querySelectorAll("[data-choice]").forEach(function (btn) {
      btn.onclick = function () {
        cleanup();
        options[parseInt(btn.getAttribute("data-choice"), 10)].onPick();
      };
    });
  }

  // ---------- teams ----------

  function teamSummaryLine(t) {
    var bits = [t.roster.length + (t.roster.length === 1 ? " player" : " players")];
    if (t.history.length) bits.push(t.history.length + (t.history.length === 1 ? " match" : " matches"));
    if (t.activeMatch) bits.push("match in progress");
    return bits.join(" · ");
  }

  function switchTeam(id) {
    if (!teamById(id) || id === state.activeTeamId) return;
    state.activeTeamId = id;
    pendingAssistEventId = null;
    lastEventTapAt = {};
    persist();
    view = T().roster.length === 0 ? "team" : "match";
    render();
    showToast("Switched to " + T().teamName + ".");
    // The 1s timer only watches the active team, so a clock left running on the
    // team we just came back to is checked right now.
    checkStaleClock();
  }

  function showTextPrompt(title, placeholder, initial, confirmLabel, onSubmit) {
    var old = document.getElementById("promptOverlay");
    if (old) old.remove();
    var overlay = document.createElement("div");
    overlay.className = "overlay";
    overlay.id = "promptOverlay";
    overlay.innerHTML =
      '<div class="sheet">' +
        '<div class="confirm-msg"><strong>' + esc(title) + "</strong></div>" +
        '<input class="text-input" id="promptInput" style="margin-top:12px;margin-bottom:0;" placeholder="' + esc(placeholder) + '">' +
        '<div class="btn-row" style="margin-top:16px;">' +
          '<button class="btn btn-ghost" id="promptCancelBtn">Cancel</button>' +
          '<button class="btn btn-primary" id="promptOkBtn">' + esc(confirmLabel) + "</button>" +
        "</div>" +
      "</div>";
    document.body.appendChild(overlay);
    var input = document.getElementById("promptInput");
    input.value = initial || "";
    input.focus();
    function cleanup() { overlay.remove(); }
    overlay.onclick = function (e) { if (e.target === overlay) cleanup(); };
    document.getElementById("promptCancelBtn").onclick = cleanup;
    function submit() {
      var v = input.value.trim();
      if (!v) { input.focus(); return; }
      cleanup();
      onSubmit(v);
    }
    document.getElementById("promptOkBtn").onclick = submit;
    input.onkeydown = function (e) { if (e.key === "Enter") submit(); };
  }

  function addTeam() {
    showTextPrompt("New team", "e.g. Excelsior Mariaburg - Blauw", "", "Create", function (name) {
      var t = newTeam(name);
      state.teams.push(t);
      state.activeTeamId = t.id;
      persist();
      view = "team";
      render();
      showToast("Created " + name + ".");
    });
  }

  function deleteTeam(id) {
    var t = teamById(id);
    if (!t) return;
    if (state.teams.length === 1) {
      showToast("This is your only team — clear its data instead.", "warning");
      return;
    }
    var detail = t.history.length
      ? " Its " + t.history.length + (t.history.length === 1 ? " match" : " matches") + " of history will be deleted too."
      : "";
    showConfirm('Delete "' + t.teamName + '"?' + detail + " This can't be undone.", "Delete", function () {
      state.teams = state.teams.filter(function (x) { return x.id !== id; });
      if (state.activeTeamId === id) state.activeTeamId = state.teams[0].id;
      persist();
      view = "team";
      render();
      showToast("Deleted " + t.teamName + ".", "warning");
    }, true);
  }

  function showTeamPicker() {
    var old = document.getElementById("teamOverlay");
    if (old) old.remove();
    var overlay = document.createElement("div");
    overlay.className = "overlay";
    overlay.id = "teamOverlay";
    var rows = state.teams.map(function (t) {
      var current = t.id === state.activeTeamId;
      return (
        '<div class="team-row' + (current ? " current" : "") + '">' +
          '<button class="team-pick" data-pick-team="' + t.id + '">' +
            '<span class="team-pick-name">' + esc(t.teamName) + (current ? " ✓" : "") + "</span>" +
            '<span class="team-pick-meta">' + esc(teamSummaryLine(t)) + "</span>" +
          "</button>" +
          '<button class="team-del" data-del-team="' + t.id + '" aria-label="Delete team">✕</button>' +
        "</div>"
      );
    }).join("");
    overlay.innerHTML =
      '<div class="sheet team-sheet">' +
        '<div class="help-header"><h2 class="section-title">Teams</h2><button class="icon-btn" id="teamCloseBtn" aria-label="Close">✕</button></div>' +
        '<div class="team-list">' + rows + "</div>" +
        '<div style="padding:0 8px;">' +
          '<button class="btn btn-primary" id="addTeamBtn" style="margin-top:12px;">Add a team</button>' +
        "</div>" +
      "</div>";
    document.body.appendChild(overlay);
    function cleanup() { overlay.remove(); }
    overlay.onclick = function (e) { if (e.target === overlay) cleanup(); };
    document.getElementById("teamCloseBtn").onclick = cleanup;
    document.getElementById("addTeamBtn").onclick = function () { cleanup(); addTeam(); };
    overlay.querySelectorAll("[data-pick-team]").forEach(function (btn) {
      btn.onclick = function () { cleanup(); switchTeam(btn.getAttribute("data-pick-team")); };
    });
    overlay.querySelectorAll("[data-del-team]").forEach(function (btn) {
      btn.onclick = function () { cleanup(); deleteTeam(btn.getAttribute("data-del-team")); };
    });
  }

  function showHelp() {
    var old = document.getElementById("helpOverlay");
    if (old) old.remove();
    var overlay = document.createElement("div");
    overlay.className = "overlay";
    overlay.id = "helpOverlay";
    var sections = [
      ["Set up your team", "Go to <strong>Team</strong> and add each player's name and shirt number. This only needs doing once — it's saved on this device for every future match."],
      ["Several teams", "Tap <strong>Switch</strong> at the top of the Team screen to keep more than one team on the same device. Each team has its own roster, settings, match history and even its own match in progress, so switching never mixes them up."],
      ["Match options", "Still on the Team screen: turn on Assists, Playing time, or Cards only if you want to track them. All three are off by default to keep things simple."],
      ["Start a match", "On the <strong>Match</strong> tab, enter the opponent (optional), pick Home or Away, then tap <strong>Kick off</strong>."],
      ["Start the clock", "Tap the timer at the top to start it. You can't log goals or cards until the clock is running — this keeps every event's minute accurate."],
      ["Score a goal", "Tap a player's tile. If Assists is on, you'll be asked who assisted right after. Use the dashed button below the grid for the opponent's goals."],
      ["Own goals", "Tap <strong>Own goal</strong> next to the opponent button, then pick which team put it in their own net. The point goes to the other team automatically, and an own goal is never counted as a goal for any player."],
      ["On pitch / Bench", "Each tile shows who's on the pitch. Tap the badge to bench or bring on a player — benched players can't be tapped to score by mistake."],
      ["Cards", "Tap the small yellow or red square on a tile. A second yellow automatically becomes a red. A red card automatically benches the player for the rest of the match, and they can't be brought back on."],
      ["Fix a mistake", "Every entry in the Match log has ✎ (edit) and ✕ (delete). Edit lets you change who scored, who assisted, or who received a card. ↺ Undo at the top removes the most recent entry."],
      ["End the match", "Tap <strong>End match</strong> at the bottom of the Match screen. You'll get a summary with a minute-by-minute report you can copy and share."],
      ["History", "The <strong>History</strong> tab keeps every past match, season top scorers, and a Copy button on each match to re-share its report."],
      ["Share your team", "In Team or History, use <strong>Export team data</strong> to save a file of the team you're currently on. Another parent or coach loads it with <strong>Import team data</strong> — no retyping the roster. Importing adds it as an extra team and never touches the teams already on the device, unless you choose to replace one with the same name."]
    ];
    var body = sections.map(function (s) {
      return '<div class="help-section"><h3>' + esc(s[0]) + "</h3><p>" + s[1] + "</p></div>";
    }).join("");
    overlay.innerHTML =
      '<div class="sheet help-sheet">' +
        '<div class="help-header"><h2 class="section-title">How to use this app</h2><button class="icon-btn" id="helpCloseBtn" aria-label="Close">✕</button></div>' +
        '<div class="help-body">' + body + "</div>" +
      "</div>";
    document.body.appendChild(overlay);
    function cleanup() { overlay.remove(); }
    document.getElementById("helpCloseBtn").onclick = cleanup;
    overlay.onclick = function (e) { if (e.target === overlay) cleanup(); };
  }

  function isOnField(match, playerId) {
    var pt = match.playingTime[playerId];
    return pt ? !!pt.onField : true;
  }

  function cardCounts(match, playerId) {
    var yellows = 0, reds = 0;
    match.events.forEach(function (e) {
      if (e.type === "card" && e.playerId === playerId) {
        if (e.cardType === "yellow") yellows++;
        else if (e.cardType === "red") reds++;
      }
    });
    return { yellows: yellows, reds: reds };
  }

  function hasRedCard(match, playerId) {
    return cardCounts(match, playerId).reds > 0;
  }

  function setOnField(match, playerId, onField) {
    if (!match.playingTime[playerId]) match.playingTime[playerId] = { onField: true, accumMs: 0, onSince: clockElapsedMs(match) };
    var pt = match.playingTime[playerId];
    if (pt.onField === onField) return;
    var nowMs = clockElapsedMs(match);
    if (pt.onField && !onField) {
      pt.accumMs += (nowMs - pt.onSince);
      pt.onField = false;
      pt.onSince = null;
    } else if (!pt.onField && onField) {
      pt.onField = true;
      pt.onSince = nowMs;
    }
  }

  // ---------- match lifecycle ----------

  function startNewMatch(opponentName, isHome) {
    var pt = {};
    T().roster.forEach(function (p) {
      pt[p.id] = { onField: true, accumMs: 0, onSince: 0 };
    });
    T().activeMatch = {
      id: uid(),
      opponentName: opponentName || "Opponent",
      isHome: isHome !== false,
      startedAt: new Date().toISOString(),
      clock: { elapsedMs: 0, running: false, runningSince: null },
      events: [],
      playingTime: pt
    };
    persist();
    render();
  }

  function endMatch() {
    var match = T().activeMatch;
    if (!match) return;
    var stats = computeStats(match);
    var minutes = playingTimeMinutes(match);
    var record = {
      id: match.id,
      date: match.startedAt,
      opponentName: match.opponentName,
      teamName: T().teamName,
      isHome: match.isHome !== false,
      rosterSnapshot: T().roster.map(function (p) {
        return { id: p.id, name: p.name, number: p.number };
      }),
      scoreUs: stats.scoreUs,
      scoreThem: stats.scoreThem,
      ownGoalsFor: stats.ownGoalsFor,
      ownGoalsAgainst: stats.ownGoalsAgainst,
      scorers: stats.scorers,
      assists: stats.assists,
      cards: stats.cards,
      playingTimeMinutes: minutes,
      durationMinutes: currentMinute(match),
      events: match.events
    };
    T().history.unshift(record);
    T().activeMatch = null;
    persist();
    view = "summary";
    render();
  }

  function toggleClock() {
    var match = T().activeMatch;
    if (!match) return;
    if (match.clock.running) {
      match.clock.elapsedMs = clockElapsedMs(match);
      match.clock.running = false;
      match.clock.runningSince = null;
    } else {
      match.clock.running = true;
      match.clock.runningSince = Date.now();
    }
    persist();
    render();
  }

  var lastEventTapAt = {};

  function guardDoubleTap(key) {
    var now = Date.now();
    if (lastEventTapAt[key] && (now - lastEventTapAt[key]) < 800) return false;
    lastEventTapAt[key] = now;
    return true;
  }

  function requireClockRunning(match) {
    if (!match.clock.running) {
      showToast("Start the clock first — tap the timer at the top.", "warning");
      return false;
    }
    return true;
  }

  function logGoal(playerId) {
    var match = T().activeMatch;
    if (!match) return;
    if (!isOnField(match, playerId)) {
      var benched = rosterById(playerId);
      showToast((benched ? benched.name : "This player") + " is on the bench — bring them on first.", "warning");
      return;
    }
    if (!requireClockRunning(match)) return;
    if (!guardDoubleTap("goal:" + playerId)) return;
    var ev = { id: uid(), type: "goal", playerId: playerId, assistId: null, minuteAtEvent: currentMinute(match), ts: Date.now() };
    match.events.push(ev);
    persist();
    if (T().settings.trackAssists) {
      pendingAssistEventId = ev.id;
      clearTimeout(assistBarTimer);
      assistBarTimer = setTimeout(function () { pendingAssistEventId = null; render(); }, 6000);
    }
    render();
    var tile = document.querySelector('[data-tile="' + playerId + '"]');
    if (tile) {
      tile.classList.add("just-scored");
      setTimeout(function () { tile.classList.remove("just-scored"); }, 500);
    }
  }

  function setAssist(assistPlayerId) {
    var match = T().activeMatch;
    if (!match || !pendingAssistEventId) return;
    var ev = null;
    for (var i = 0; i < match.events.length; i++) {
      if (match.events[i].id === pendingAssistEventId) { ev = match.events[i]; break; }
    }
    if (ev) ev.assistId = assistPlayerId;
    pendingAssistEventId = null;
    clearTimeout(assistBarTimer);
    persist();
    render();
  }

  function logOpponentGoal() {
    var match = T().activeMatch;
    if (!match) return;
    if (!requireClockRunning(match)) return;
    if (!guardDoubleTap("opponent-goal")) return;
    match.events.push({ id: uid(), type: "opponent_goal", playerId: null, minuteAtEvent: currentMinute(match), ts: Date.now() });
    persist();
    render();
  }

  // by: "us"   = our team put it in our own net  -> the point goes to the opponent
  // by: "them" = they put it in their own net    -> the point goes to us
  function logOwnGoal(by) {
    var match = T().activeMatch;
    if (!match) return;
    if (!requireClockRunning(match)) return;
    if (!guardDoubleTap("own-goal:" + by)) return;
    match.events.push({ id: uid(), type: "own_goal", by: by, playerId: null, minuteAtEvent: currentMinute(match), ts: Date.now() });
    persist();
    render();
    showToast(
      by === "us"
        ? "Own goal — point to " + match.opponentName + "."
        : "Own goal by " + match.opponentName + " — point to " + T().teamName + ".",
      "warning"
    );
  }

  function showOwnGoalPicker() {
    var match = T().activeMatch;
    if (!match) return;
    if (!requireClockRunning(match)) return;
    var old = document.getElementById("ownGoalOverlay");
    if (old) old.remove();
    var overlay = document.createElement("div");
    overlay.className = "overlay";
    overlay.id = "ownGoalOverlay";
    overlay.innerHTML =
      '<div class="sheet">' +
        '<div class="confirm-msg"><strong>Own goal</strong><br>Which team put it in their own net?</div>' +
        '<div class="btn-row" style="margin-top:16px;">' +
          '<button class="btn btn-primary" id="ogUsBtn">' + esc(T().teamName) + "</button>" +
          '<button class="btn btn-primary" id="ogThemBtn">' + esc(match.opponentName) + "</button>" +
        "</div>" +
        '<button class="btn btn-ghost" id="ogCancelBtn" style="margin-top:10px;">Cancel</button>' +
      "</div>";
    document.body.appendChild(overlay);
    function cleanup() { overlay.remove(); }
    overlay.onclick = function (e) { if (e.target === overlay) cleanup(); };
    document.getElementById("ogCancelBtn").onclick = cleanup;
    document.getElementById("ogUsBtn").onclick = function () { cleanup(); logOwnGoal("us"); };
    document.getElementById("ogThemBtn").onclick = function () { cleanup(); logOwnGoal("them"); };
  }

  function toggleCard(playerId, cardType) {
    var match = T().activeMatch;
    if (!match) return;
    var player = rosterById(playerId);
    if (hasRedCard(match, playerId)) {
      showToast((player ? player.name : "This player") + " is already sent off.", "warning");
      return;
    }
    if (!requireClockRunning(match)) return;
    if (!guardDoubleTap("card:" + playerId + ":" + cardType)) return;
    match.events.push({ id: uid(), type: "card", playerId: playerId, cardType: cardType, minuteAtEvent: currentMinute(match), ts: Date.now() });

    var counts = cardCounts(match, playerId);
    var sentOff = cardType === "red";
    if (cardType === "yellow" && counts.yellows >= 2) {
      match.events.push({ id: uid(), type: "card", playerId: playerId, cardType: "red", auto: true, minuteAtEvent: currentMinute(match), ts: Date.now() });
      sentOff = true;
    }
    if (sentOff) {
      setOnField(match, playerId, false);
      showToast((player ? player.name : "Player") + " is sent off" + (cardType === "yellow" ? " — second yellow" : "") + ".", "warning");
    }
    persist();
    render();
  }

  function toggleField(playerId) {
    var match = T().activeMatch;
    if (!match) return;
    if (hasRedCard(match, playerId)) {
      var player = rosterById(playerId);
      showToast((player ? player.name : "This player") + " is sent off and can't return to the pitch.", "warning");
      return;
    }
    setOnField(match, playerId, !isOnField(match, playerId));
    persist();
    render();
  }

  function describeEvent(ev) {
    if (ev.type === "goal") {
      var p = rosterById(ev.playerId);
      return "goal by " + (p ? p.name : "player");
    }
    if (ev.type === "opponent_goal") return "opponent goal";
    if (ev.type === "own_goal") {
      var match = T().activeMatch;
      var oppName = match ? match.opponentName : "the opponent";
      return "own goal by " + (ev.by === "us" ? T().teamName : oppName);
    }
    if (ev.type === "card") {
      var c = rosterById(ev.playerId);
      return (ev.cardType === "red" ? "red card" : "yellow card") + (c ? " — " + c.name : "");
    }
    return "last action";
  }

  function undoLast() {
    var match = T().activeMatch;
    if (!match || match.events.length === 0) return;
    var removed = match.events.pop();
    // An auto-red is a consequence, not an action: also remove the yellow that triggered it.
    if (removed.type === "card" && removed.cardType === "red" && removed.auto) {
      for (var i = match.events.length - 1; i >= 0; i--) {
        var e = match.events[i];
        if (e.type === "card" && e.playerId === removed.playerId && e.cardType === "yellow") {
          match.events.splice(i, 1);
          break;
        }
      }
    }
    pendingAssistEventId = null;
    lastEventTapAt = {};
    reconcileCardConsequences(match, [removed.playerId]);
    persist();
    render();
    showToast("Removed: " + describeEvent(removed));
  }

  function deleteEvent(eventId) {
    var match = T().activeMatch;
    if (!match) return;
    var idx = -1;
    for (var i = 0; i < match.events.length; i++) {
      if (match.events[i].id === eventId) { idx = i; break; }
    }
    if (idx === -1) return;
    var removed = match.events.splice(idx, 1)[0];
    if (pendingAssistEventId === eventId) pendingAssistEventId = null;
    lastEventTapAt = {};
    reconcileCardConsequences(match, [removed.playerId]);
    persist();
    render();
    showToast("Removed: " + describeEvent(removed));
  }

  function reconcileCardConsequences(match, playerIds) {
    var seen = {};
    playerIds.forEach(function (pid) {
      if (!pid || seen[pid]) return;
      seen[pid] = true;
      var counts = cardCounts(match, pid);
      if (counts.yellows >= 2 && counts.reds === 0) {
        match.events.push({ id: uid(), type: "card", playerId: pid, cardType: "red", auto: true, minuteAtEvent: currentMinute(match), ts: Date.now() });
        counts = cardCounts(match, pid);
      } else if (counts.yellows < 2 && counts.reds > 0) {
        // Drop auto-reds that no longer have two yellows behind them (manual reds are left alone).
        for (var i = match.events.length - 1; i >= 0; i--) {
          var e = match.events[i];
          if (e.type === "card" && e.playerId === pid && e.cardType === "red" && e.auto) {
            match.events.splice(i, 1);
          }
        }
        counts = cardCounts(match, pid);
      }
      if (counts.reds > 0) setOnField(match, pid, false);
    });
  }

  function findEvent(match, eventId) {
    for (var i = 0; i < match.events.length; i++) {
      if (match.events[i].id === eventId) return match.events[i];
    }
    return null;
  }

  function applyGoalEdit(eventId, newPlayerId, newAssistId) {
    var match = T().activeMatch;
    if (!match) return;
    var ev = findEvent(match, eventId);
    if (!ev) return;
    ev.playerId = newPlayerId;
    ev.assistId = newAssistId || null;
    persist();
    render();
    showToast("Updated: " + describeEvent(ev));
  }

  function applyCardEdit(eventId, newPlayerId, newCardType) {
    var match = T().activeMatch;
    if (!match) return;
    var ev = findEvent(match, eventId);
    if (!ev) return;
    var oldPlayerId = ev.playerId;
    ev.playerId = newPlayerId;
    ev.cardType = newCardType;
    reconcileCardConsequences(match, [oldPlayerId, newPlayerId]);
    persist();
    render();
    showToast("Updated: " + describeEvent(ev));
  }

  function applyOwnGoalEdit(eventId, newBy) {
    var match = T().activeMatch;
    if (!match) return;
    var ev = findEvent(match, eventId);
    if (!ev) return;
    ev.by = newBy;
    persist();
    render();
    showToast("Updated: " + describeEvent(ev));
  }

  function showEditEvent(eventId) {
    var match = T().activeMatch;
    if (!match) return;
    var ev = findEvent(match, eventId);
    if (!ev || (ev.type !== "goal" && ev.type !== "card" && ev.type !== "own_goal")) return;

    var old = document.getElementById("editOverlay");
    if (old) old.remove();
    var overlay = document.createElement("div");
    overlay.className = "overlay";
    overlay.id = "editOverlay";
    document.body.appendChild(overlay);
    function close() { overlay.remove(); }
    overlay.onclick = function (e) { if (e.target === overlay) close(); };

    if (ev.type === "own_goal") {
      var selBy = ev.by === "us" ? "us" : "them";
      var drawOwn = function () {
        overlay.innerHTML =
          '<div class="sheet">' +
            '<div class="confirm-msg"><strong>Edit own goal</strong><br>Which team put it in their own net?</div>' +
            '<div class="btn-row" style="margin-top:14px;">' +
              '<button class="btn toggle-seg' + (selBy === "us" ? " on" : "") + '" id="ogEditUsBtn">' + esc(T().teamName) + "</button>" +
              '<button class="btn toggle-seg' + (selBy === "them" ? " on" : "") + '" id="ogEditThemBtn">' + esc(match.opponentName) + "</button>" +
            "</div>" +
            '<div class="btn-row" style="margin-top:16px;">' +
              '<button class="btn btn-ghost" id="editCancelBtn">Cancel</button>' +
              '<button class="btn btn-primary" id="editSaveBtn">Save</button>' +
            "</div>" +
          "</div>";
        document.getElementById("ogEditUsBtn").onclick = function () { selBy = "us"; drawOwn(); };
        document.getElementById("ogEditThemBtn").onclick = function () { selBy = "them"; drawOwn(); };
        document.getElementById("editCancelBtn").onclick = close;
        document.getElementById("editSaveBtn").onclick = function () {
          close();
          applyOwnGoalEdit(eventId, selBy);
        };
      };
      drawOwn();
    } else if (ev.type === "goal") {
      var selScorer = ev.playerId;
      var selAssist = ev.assistId || null;
      var draw = function () {
        var scorerChips = T().roster.map(function (p) {
          return '<button class="assist-chip' + (p.id === selScorer ? " chip-selected" : "") + '" data-pick-scorer="' + p.id + '">' + esc(p.name) + "</button>";
        }).join("");
        var assistSection = "";
        if (T().settings.trackAssists) {
          var assistChips =
            T().roster.filter(function (p) { return p.id !== selScorer; }).map(function (p) {
              return '<button class="assist-chip' + (p.id === selAssist ? " chip-selected" : "") + '" data-pick-assist="' + p.id + '">' + esc(p.name) + "</button>";
            }).join("") +
            '<button class="assist-chip' + (!selAssist ? " chip-selected" : "") + '" data-pick-assist="none">No assist</button>';
          assistSection = '<label class="field-label" style="margin-top:14px;">Assist</label><div class="assist-chip-row">' + assistChips + "</div>";
        }
        overlay.innerHTML =
          '<div class="sheet">' +
            '<div class="confirm-msg"><strong>Edit goal</strong></div>' +
            '<label class="field-label" style="margin-top:10px;">Scorer</label>' +
            '<div class="assist-chip-row">' + scorerChips + "</div>" +
            assistSection +
            '<div class="btn-row" style="margin-top:16px;">' +
              '<button class="btn btn-ghost" id="editCancelBtn">Cancel</button>' +
              '<button class="btn btn-primary" id="editSaveBtn">Save</button>' +
            "</div>" +
          "</div>";
        overlay.querySelectorAll("[data-pick-scorer]").forEach(function (btn) {
          btn.onclick = function () {
            selScorer = btn.getAttribute("data-pick-scorer");
            if (selAssist === selScorer) selAssist = null;
            draw();
          };
        });
        overlay.querySelectorAll("[data-pick-assist]").forEach(function (btn) {
          btn.onclick = function () {
            var v = btn.getAttribute("data-pick-assist");
            selAssist = v === "none" ? null : v;
            draw();
          };
        });
        document.getElementById("editCancelBtn").onclick = close;
        document.getElementById("editSaveBtn").onclick = function () {
          close();
          applyGoalEdit(eventId, selScorer, selAssist);
        };
      };
      draw();
    } else {
      var selPlayer = ev.playerId;
      var selType = ev.cardType;
      var drawCard = function () {
        var playerChips = T().roster.map(function (p) {
          return '<button class="assist-chip' + (p.id === selPlayer ? " chip-selected" : "") + '" data-pick-player="' + p.id + '">' + esc(p.name) + "</button>";
        }).join("");
        overlay.innerHTML =
          '<div class="sheet">' +
            '<div class="confirm-msg"><strong>Edit card</strong></div>' +
            '<label class="field-label" style="margin-top:10px;">Player</label>' +
            '<div class="assist-chip-row">' + playerChips + "</div>" +
            '<label class="field-label" style="margin-top:14px;">Card</label>' +
            '<div class="btn-row" style="margin-bottom:4px;">' +
              '<button class="btn toggle-seg' + (selType === "yellow" ? " on" : "") + '" id="pickYellowBtn">Yellow</button>' +
              '<button class="btn toggle-seg' + (selType === "red" ? " on" : "") + '" id="pickRedBtn">Red</button>' +
            "</div>" +
            '<div class="btn-row" style="margin-top:16px;">' +
              '<button class="btn btn-ghost" id="editCancelBtn">Cancel</button>' +
              '<button class="btn btn-primary" id="editSaveBtn">Save</button>' +
            "</div>" +
          "</div>";
        overlay.querySelectorAll("[data-pick-player]").forEach(function (btn) {
          btn.onclick = function () { selPlayer = btn.getAttribute("data-pick-player"); drawCard(); };
        });
        document.getElementById("pickYellowBtn").onclick = function () { selType = "yellow"; drawCard(); };
        document.getElementById("pickRedBtn").onclick = function () { selType = "red"; drawCard(); };
        document.getElementById("editCancelBtn").onclick = close;
        document.getElementById("editSaveBtn").onclick = function () {
          close();
          applyCardEdit(eventId, selPlayer, selType);
        };
      };
      drawCard();
    }
  }

  // ---------- roster ----------

  function addPlayer(name, number) {
    name = (name || "").trim();
    if (!name) return;
    T().roster.push({ id: uid(), name: name, number: (number || "").trim() });
    persist();
    render();
  }

  function removePlayer(id) {
    T().roster = T().roster.filter(function (p) { return p.id !== id; });
    persist();
    render();
  }

  // ---------- export / import ----------

  function slug(str) {
    return (str || "team").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/(^-|-$)/g, "") || "team";
  }

  // Readable season totals bundled into the export. Derived from history, so it
  // is ignored on import — history stays the single source of truth.
  function buildSeasonStats() {
    var players = {};
    var order = [];
    var team = { matchesPlayed: 0, won: 0, drawn: 0, lost: 0, goalsFor: 0, goalsAgainst: 0, ownGoalsFor: 0, ownGoalsAgainst: 0 };

    function entry(pid, record) {
      if (!players[pid]) {
        players[pid] = {
          id: pid, name: nameInRecord(record, pid), number: "",
          matchesPlayed: 0, goals: 0, assists: 0, minutes: 0, yellowCards: 0, redCards: 0
        };
        order.push(pid);
      }
      return players[pid];
    }

    T().history.forEach(function (m) {
      team.matchesPlayed++;
      if (m.scoreUs > m.scoreThem) team.won++;
      else if (m.scoreUs < m.scoreThem) team.lost++;
      else team.drawn++;
      team.goalsFor += m.scoreUs || 0;
      team.goalsAgainst += m.scoreThem || 0;
      team.ownGoalsFor += m.ownGoalsFor || 0;
      team.ownGoalsAgainst += m.ownGoalsAgainst || 0;

      var appeared = {};
      function sawPlayer(pid) {
        if (appeared[pid]) return;
        appeared[pid] = true;
        entry(pid, m).matchesPlayed++;
      }
      (m.rosterSnapshot || []).forEach(function (p) { sawPlayer(p.id); });

      Object.keys(m.scorers || {}).forEach(function (pid) {
        sawPlayer(pid);
        entry(pid, m).goals += m.scorers[pid];
      });
      Object.keys(m.assists || {}).forEach(function (pid) {
        sawPlayer(pid);
        entry(pid, m).assists += m.assists[pid];
      });
      Object.keys(m.playingTimeMinutes || {}).forEach(function (pid) {
        sawPlayer(pid);
        entry(pid, m).minutes += m.playingTimeMinutes[pid];
      });
      Object.keys(m.cards || {}).forEach(function (pid) {
        sawPlayer(pid);
        var e = entry(pid, m);
        (m.cards[pid] || []).forEach(function (c) {
          if (c === "red") e.redCards++; else e.yellowCards++;
        });
      });
    });

    // Prefer current shirt numbers and names where the player is still on the roster.
    T().roster.forEach(function (p) {
      if (players[p.id]) {
        players[p.id].name = p.name;
        players[p.id].number = p.number || "";
      }
    });

    var rows = order.map(function (pid) { return players[pid]; })
      .sort(function (a, b) { return b.goals - a.goals || a.name.localeCompare(b.name); });

    return { note: "Derived from history for easy reading; ignored on import.", team: team, players: rows };
  }

  // Per-match breakdown with player names and goal counts, so each match in the
  // export is readable on its own instead of only as player IDs in history.
  function buildMatchStats() {
    function playerRows(scorers, assists, minutes, cards, nameOf) {
      var ids = {};
      [scorers, assists, minutes, cards].forEach(function (src) {
        Object.keys(src || {}).forEach(function (pid) { ids[pid] = true; });
      });
      return Object.keys(ids).map(function (pid) {
        var c = (cards || {})[pid] || [];
        return {
          id: pid,
          name: nameOf(pid),
          goals: (scorers || {})[pid] || 0,
          assists: (assists || {})[pid] || 0,
          minutes: (minutes || {})[pid] || 0,
          yellowCards: c.filter(function (x) { return x !== "red"; }).length,
          redCards: c.filter(function (x) { return x === "red"; }).length
        };
      }).filter(function (r) {
        return r.goals || r.assists || r.minutes || r.yellowCards || r.redCards;
      }).sort(function (a, b) { return b.goals - a.goals || a.name.localeCompare(b.name); });
    }

    var rows = T().history.map(function (m) {
      return {
        date: m.date,
        opponent: m.opponentName,
        homeOrAway: m.isHome !== false ? "Home" : "Away",
        scoreUs: m.scoreUs, scoreThem: m.scoreThem,
        ownGoalsFor: m.ownGoalsFor || 0,
        ownGoalsAgainst: m.ownGoalsAgainst || 0,
        players: playerRows(m.scorers, m.assists, m.playingTimeMinutes, m.cards,
          function (pid) { return nameInRecord(m, pid); })
      };
    });

    // A match still being played is included too, flagged, so you can export
    // mid-match without ending it first.
    var live = T().activeMatch;
    if (live) {
      var s = computeStats(live);
      rows.unshift({
        inProgress: true,
        date: live.startedAt,
        opponent: live.opponentName,
        homeOrAway: live.isHome !== false ? "Home" : "Away",
        scoreUs: s.scoreUs, scoreThem: s.scoreThem,
        ownGoalsFor: s.ownGoalsFor, ownGoalsAgainst: s.ownGoalsAgainst,
        players: playerRows(s.scorers, s.assists, playingTimeMinutes(live), s.cards,
          function (pid) { var p = rosterById(pid); return p ? p.name : "Unknown"; })
      });
    }
    return rows;
  }

  async function exportData() {
    var payload = {
      exportedFrom: "Matchday Tracker",
      exportedAt: new Date().toISOString(),
      teamName: T().teamName,
      roster: T().roster,
      settings: T().settings,
      seasonStats: buildSeasonStats(),
      matchStats: buildMatchStats(),
      history: T().history
    };
    var json = JSON.stringify(payload, null, 2);
    var filename = slug(T().teamName) + "-team-data.json";

    // Inside a published Claude artifact, use its native save prompt.
    if (window.claude && typeof window.claude.use === "function") {
      try {
        var downloads = await window.claude.use("downloads");
        if (downloads) {
          var result = await downloads.save({ filename: filename, data: json });
          showToast(result.status === "saved" ? "Saved " + filename : "Sent");
          return;
        }
      } catch (err) {
        if (err && err.code === "declined") return;
        // Fall through to a plain browser download below.
      }
    }

    // Standard browser download — works on any ordinary web server.
    try {
      var blob = new Blob([json], { type: "application/json" });
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
      showToast("Saved " + filename);
    } catch (err) {
      console.error(err);
      showToast("Couldn't export right now.", "error");
    }
  }

  function teamFromImport(data, id) {
    return {
      id: id || uid(),
      teamName: data.teamName || "My Team",
      roster: data.roster.map(function (p) {
        return { id: p.id || uid(), name: p.name || "", number: p.number || "" };
      }),
      settings: Object.assign(defaultSettings(), data.settings || {}),
      activeMatch: null,
      history: Array.isArray(data.history) ? data.history : []
    };
  }

  function finishImport(team, replacedId) {
    if (replacedId) {
      state.teams = state.teams.map(function (t) { return t.id === replacedId ? team : t; });
    } else {
      state.teams.push(team);
    }
    state.activeTeamId = team.id;
    pendingAssistEventId = null;
    lastEventTapAt = {};
    persist();
    view = "team";
    render();
    showToast("Imported " + team.teamName + " — " + team.roster.length + " players.");
  }

  function importDataFromFile(file) {
    var reader = new FileReader();
    reader.onload = function () {
      try {
        var data = JSON.parse(reader.result);
        if (!data || !Array.isArray(data.roster)) throw new Error("bad shape");
        var name = data.teamName || "My Team";

        // A team already on this device with the same name is the one the file
        // is probably an update of — but replacing it throws away its matches,
        // so that is never assumed.
        var existing = null;
        for (var i = 0; i < state.teams.length; i++) {
          if (state.teams[i].teamName === name) { existing = state.teams[i]; break; }
        }

        if (!existing) {
          finishImport(teamFromImport(data), null);
          return;
        }

        var lost = existing.history.length
          ? "Replacing it deletes its " + existing.history.length +
            (existing.history.length === 1 ? " recorded match." : " recorded matches.")
          : "It has no recorded matches yet.";
        showChoice(
          '"' + name + '" already exists on this device. ' + lost,
          [
            { label: "Replace it", danger: true, onPick: function () { finishImport(teamFromImport(data, existing.id), existing.id); } },
            { label: "Add as a second team", onPick: function () {
                var t = teamFromImport(data);
                t.teamName = name + " (imported)";
                finishImport(t, null);
              } }
          ]
        );
      } catch (e) {
        showToast("That file doesn't look like a Matchday Tracker export.", "error");
      }
    };
    reader.readAsText(file);
  }

  // ---------- rendering ----------

  function render() {
    document.getElementById("matchScreen").classList.toggle("hidden", view !== "match" && view !== "summary");
    document.getElementById("teamScreen").classList.toggle("hidden", view !== "team");
    document.getElementById("historyScreen").classList.toggle("hidden", view !== "history");

    var activeTab = view === "summary" ? "match" : view;
    document.getElementById("tabMatch").classList.toggle("active", activeTab === "match");
    document.getElementById("tabTeam").classList.toggle("active", activeTab === "team");
    document.getElementById("tabHistory").classList.toggle("active", activeTab === "history");

    var match = T().activeMatch;
    document.getElementById("scoreboardBar").classList.toggle("hidden", !match && view !== "summary");
    document.getElementById("undoBtn").disabled = !match || match.events.length === 0;
    document.getElementById("clockBtn").style.visibility = match ? "visible" : "hidden";

    if (match) {
      var stats = computeStats(match);
      document.getElementById("usScoreNum").textContent = stats.scoreUs;
      document.getElementById("themScoreNum").textContent = stats.scoreThem;
      document.getElementById("usScoreLabel").textContent = T().teamName + (match.isHome !== false ? " (H)" : " (A)");
      document.getElementById("themScoreLabel").textContent = match.opponentName + (match.isHome !== false ? " (A)" : " (H)");
      document.getElementById("clockTime").textContent = formatClock(clockElapsedMs(match));
      document.getElementById("clockState").textContent = match.clock.running ? "Running — tap to pause" : "Paused — tap to start";
      document.getElementById("clockState").classList.toggle("running", match.clock.running);
    } else {
      document.getElementById("clockTime").textContent = "00:00";
      document.getElementById("clockState").textContent = "No match yet";
      document.getElementById("clockState").classList.remove("running");
    }

    if (view === "match") renderMatchScreen();
    if (view === "summary") renderSummaryScreen();
    if (view === "team") renderTeamScreen();
    if (view === "history") renderHistoryScreen();
  }

  function renderMatchScreen() {
    var el = document.getElementById("matchScreen");
    var match = T().activeMatch;

    if (!match) {
      el.innerHTML =
        '<h1 class="screen-title">Start a match</h1>' +
        '<p class="playing-as">Playing as <strong>' + esc(T().teamName) + "</strong>" +
          (state.teams.length > 1 ? ' — <button class="link-btn" id="quickSwitchBtn">switch team</button>' : "") + "</p>" +
        (T().roster.length === 0
          ? '<p class="hint">Add your players first, from the Team &amp; settings menu.</p>' +
            '<button class="btn btn-primary" id="goToTeamBtn">Go to Team &amp; settings</button>'
          : '<div class="card">' +
              '<label class="field-label" for="opponentInput">Opponent (optional)</label>' +
              '<input class="text-input" id="opponentInput" placeholder="e.g. FC Riverside">' +
              '<label class="field-label">Home or away?</label>' +
              '<div class="btn-row" style="margin-bottom:14px;">' +
                '<button class="btn toggle-seg on" id="homeBtn">Home</button>' +
                '<button class="btn toggle-seg" id="awayBtn">Away</button>' +
              '</div>' +
              '<button class="btn btn-primary" id="kickoffBtn">Kick off</button>' +
            '</div>');
      var qs = document.getElementById("quickSwitchBtn");
      if (qs) qs.onclick = showTeamPicker;
      if (T().roster.length === 0) {
        document.getElementById("goToTeamBtn").onclick = function () { view = "team"; render(); };
      } else {
        var selectedIsHome = true;
        document.getElementById("homeBtn").onclick = function () {
          selectedIsHome = true;
          document.getElementById("homeBtn").classList.add("on");
          document.getElementById("awayBtn").classList.remove("on");
        };
        document.getElementById("awayBtn").onclick = function () {
          selectedIsHome = false;
          document.getElementById("awayBtn").classList.add("on");
          document.getElementById("homeBtn").classList.remove("on");
        };
        document.getElementById("kickoffBtn").onclick = function () {
          startNewMatch(document.getElementById("opponentInput").value, selectedIsHome);
        };
      }
      return;
    }

    var stats = computeStats(match);

    var assistBarHtml = "";
    if (pendingAssistEventId) {
      var scorerEv = match.events.filter(function (e) { return e.id === pendingAssistEventId; })[0];
      var scorer = scorerEv ? rosterById(scorerEv.playerId) : null;
      var chips = T().roster
        .filter(function (p) { return (!scorer || p.id !== scorer.id) && isOnField(match, p.id); })
