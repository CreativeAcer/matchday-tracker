<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Matchday Tracker</title>
<meta name="description" content="Simple sideline score tracking for youth soccer matches.">
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#16362A">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Matchday">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --pitch-dark: #16362A;
    --pitch: #1F5C40;
    --turf: #2E7D52;
    --chalk: #FAF8F2;
    --chalk-dim: #EFEBDF;
    --panel: #FFFFFF;
    --ink: #16211A;
    --ink-soft: #56645A;
    --gold: #E2A33D;
    --gold-deep: #B97F22;
    /* Foreground for the surfaces that stay dark green in BOTH themes (header,
       scoreboard, primary buttons). --chalk is the page background and flips to
       near-black in dark mode, so it must never be used as text on those. */
    --on-dark: #FAF8F2;
    /* Brand green / red used as TEXT on theme-adaptive panels. The solid
       --pitch and --red stay for fills; these lighten in dark mode so the text
       keeps its contrast. */
    --brand-text: #1F5C40;
    --red-text: #A8362C;
    --gold-text: #82570F;
    --red: #C1443B;
    --yellow-card: #E8C93D;
    --line: rgba(22,33,26,0.13);
    --font-display: 'Oswald', 'Arial Narrow', sans-serif;
    --font-body: 'Work Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    color-scheme: light;
    box-sizing: border-box;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --chalk: #10201A;
      --brand-text: #74D2A0;
      --red-text: #F0897C;
      --gold-text: #E8B85C;
      --chalk-dim: #0C1913;
      --panel: #17281F;
      --ink: #F1EEE3;
      --ink-soft: #AEBBAF;
      --line: rgba(241,238,227,0.14);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --chalk: #10201A;
    --brand-text: #74D2A0;
    --red-text: #F0897C;
    --gold-text: #E8B85C;
    --chalk-dim: #0C1913;
    --panel: #17281F;
    --ink: #F1EEE3;
    --ink-soft: #AEBBAF;
    --line: rgba(241,238,227,0.14);
  }
  html { scroll-padding-top: var(--head-h, calc(env(safe-area-inset-top, 0px) + 62px)); min-height: 100%; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    min-height: 100dvh;
    background: var(--chalk);
    color: var(--ink);
    font-family: var(--font-body);
    -webkit-tap-highlight-color: transparent;
  }
  button { font-family: inherit; }
  input, select { font-family: inherit; }

  #app { display: flex; flex-direction: column; min-height: 100%; }

  header.topbar {
    position: sticky;
    top: 0;
    z-index: 20;
    background: var(--pitch-dark);
    color: var(--on-dark);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: calc(10px + env(safe-area-inset-top, 0px))
             calc(14px + env(safe-area-inset-right, 0px)) 10px
             calc(14px + env(safe-area-inset-left, 0px));
    gap: 8px;
  }
  /* In a live match the top bar is the score and the clock and nothing else:
     Undo lives with the other match buttons, help lives on the Match and Team
     screens. Outside a match the round help button sits on the left, with an
     invisible twin on the right so the final score stays centred. */
  .top-spacer { width: 42px; height: 42px; flex-shrink: 0; visibility: hidden; }
  header.topbar.live .help-icon, header.topbar.live .top-spacer { display: none; }
  /* Both header icons read as buttons: a filled pill with a bright glyph, so
     they stay obvious against the dark green in either theme. */
  .icon-btn {
    background: rgba(255,255,255,0.14);
    border: 1px solid rgba(255,255,255,0.30);
    color: var(--on-dark);
    font-size: 1.1875rem;
    line-height: 1;
    width: 42px;
    height: 42px;
    flex-shrink: 0;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .icon-btn:active { background: rgba(255,255,255,0.30); }
  .icon-btn:disabled { opacity: 0.4; }
  .help-icon { font-weight: 700; }

  .clock-btn {
    flex: 1;
    background: rgba(255,255,255,0.07);
    border: 1px solid rgba(255,255,255,0.16);
    border-radius: 12px;
    color: var(--on-dark);
    padding: 6px 8px;
    min-width: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    line-height: 1.15;
  }
  .clock-btn:active { background: rgba(255,255,255,0.14); }
  .clock-time {
    font-family: var(--font-display);
    font-size: min(1.5rem, 10vw);
    white-space: nowrap;
    font-weight: 600;
    letter-spacing: 0.5px;
  }
  .clock-total { font-size: 0.625rem; color: rgba(250,248,242,0.55); letter-spacing: 0.3px; }
  .clock-time.over { color: var(--gold); }
  .clock-state { font-size: min(0.6875rem, 3vw); color: var(--gold); white-space: nowrap; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
  .clock-state.running { color: #8FD9AE; }

  /* The score sits either side of the clock in the top bar, the two numbers a
     coach reads together; the strip under it only names the teams, so it can be
     one thin line. The strip pins itself just below the top bar, wherever that
     ends (--topbar-h, measured by syncChrome). */
  .top-mid {
    flex: 1; min-width: 0;
    display: flex; align-items: center; justify-content: center; gap: 8px;
  }
  .top-score {
    font-family: var(--font-display);
    font-size: min(2.25rem, 11vw);
    font-weight: 700;
    line-height: 1;
    flex: 0 0 auto;
    min-width: 1ch;
    text-align: center;
    font-variant-numeric: tabular-nums;
  }
  .top-score.them { color: var(--gold); }
  .top-sep { display: none; font-family: var(--font-display); font-size: 1.5rem; opacity: 0.5; }
  /* After the match there is no clock, just the final score. */
  .top-mid.final .clock-btn { display: none; }
  .top-mid.final .top-sep { display: block; }
  .top-mid.final { gap: 14px; }

  .scoreboard {
    background: var(--pitch);
    color: var(--on-dark);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 4px calc(14px + env(safe-area-inset-right, 0px)) 5px
                 calc(14px + env(safe-area-inset-left, 0px));
    position: sticky;
    top: var(--topbar-h, calc(env(safe-area-inset-top, 0px) + 74px));
    z-index: 19;
  }
  .score-side { text-align: center; min-width: 0; flex: 0 1 auto; }
  .score-label {
    display: block;
    font-size: 0.8125rem;
    line-height: 1.25;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .score-label-btn {
    background: none; border: none; color: inherit; font-family: inherit; font-weight: inherit;
    padding: 1px 4px; width: 100%;
    display: flex; align-items: center; justify-content: center; gap: 5px;
  }
  #usScoreLabel { display: flex; align-items: center; justify-content: center; }
  /* A long team name gives way, the (H) or (A) after it never does. */
  .score-label .lbl { display: flex; min-width: 0; overflow: hidden; }
  .score-label .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .score-label .ha { flex: none; white-space: pre; }
  .score-label-btn .pen { flex-shrink: 0; font-size: 0.6875rem; opacity: 0.8; }
  .score-sep { font-family: var(--font-display); font-size: 1rem; opacity: 0.5; }

  main.screen { flex: 1;
    padding: 16px calc(14px + env(safe-area-inset-right, 0px))
             calc(100px + env(safe-area-inset-bottom, 0px))
             calc(14px + env(safe-area-inset-left, 0px)); max-width: 640px; width: 100%; margin: 0 auto; }
  .hidden { display: none !important; }

  h1.screen-title {
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 1.375rem;
    margin: 4px 0 14px;
  }
  h2.section-title {
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 1.0625rem;
    margin: 22px 0 10px;
    color: var(--ink);
  }
  p.hint { color: var(--ink-soft); font-size: 0.8438rem; line-height: 1.5; margin: 4px 0 14px; }

  .card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 16px;
    margin-bottom: 14px;
  }

  .btn {
    font-family: var(--font-body);
    font-weight: 600;
    font-size: 0.9375rem;
    border-radius: 12px;
    padding: 13px 16px;
    border: 1px solid var(--line);
    background: var(--panel);
    color: var(--ink);
    width: 100%;
    display: block;
    text-align: center;
  }
  .btn:active { transform: scale(0.98); }
  .btn-primary { background: var(--pitch); color: var(--on-dark); border-color: var(--pitch); }
  .btn-gold { background: var(--gold); color: var(--pitch-dark); border-color: var(--gold-deep); }
  .btn-danger { background: transparent; color: var(--red-text); border-color: var(--red-text); }
  .btn-ghost { background: transparent; }
  .btn-row { display: flex; gap: 10px; }
  .btn-row .btn { width: auto; flex: 1; }
  .toggle-seg { background: var(--chalk-dim); border-color: var(--line); color: var(--ink-soft); }
  .toggle-seg.on { background: var(--pitch); color: var(--on-dark); border-color: var(--pitch); }

  label.field-label { display: block; font-size: 0.7812rem; font-weight: 600; color: var(--ink-soft); margin-bottom: 5px; }
  input.text-input {
    width: 100%;
    padding: 11px 12px;
    border-radius: 10px;
    border: 1px solid var(--line);
    background: var(--chalk-dim);
    color: var(--ink);
    /* Never below 16px: iOS Safari zooms the page in on focus under that and
       never zooms back out. max() keeps the reader's larger setting while
       holding the floor if theirs is smaller. */
    font-size: max(1rem, 16px);
    margin-bottom: 12px;
  }
  input.text-input:focus, .btn:focus-visible, .icon-btn:focus-visible, .clock-btn:focus-visible, .tile:focus-visible {
    outline: 2px solid var(--gold-deep);
    outline-offset: 2px;
  }

  .toggle-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 2px;
    border-bottom: 1px solid var(--line);
    gap: 12px;
    width: 100%;
    background: none;
    border-left: none; border-right: none; border-top: none;
    text-align: left;
    color: inherit;
    font-family: inherit;
    min-height: 44px;
  }
  .toggle-row:last-of-type { border-bottom: none; }
  .toggle-row:active { background: var(--chalk-dim); }
  .toggle-row .toggle-copy { flex: 1; min-width: 0; display: block; }
  .toggle-row .toggle-copy .t-title { display: block; font-weight: 600; font-size: 0.9062rem; }
  .toggle-row .toggle-copy .t-desc { display: block; font-size: 0.7812rem; color: var(--ink-soft); margin-top: 2px; line-height: 1.4; }
  .switch {
    display: block;
    width: 46px; height: 27px; border-radius: 20px;
    background: var(--line); border: none; position: relative; flex-shrink: 0;
  }
  .switch::after {
    content: ''; position: absolute; top: 3px; left: 3px;
    width: 21px; height: 21px; border-radius: 50%;
    background: var(--panel); box-shadow: 0 1px 2px rgba(0,0,0,0.25);
    transition: left 0.15s ease;
  }
  .switch.on { background: var(--turf); }
  .switch.on::after { left: 22px; background: #fff; }

  /* The import sheet. A radio for the one either/or choice, switches for the
     parts, and a line that says in words what the chosen combination will do. */
  .radio {
    display: block; width: 24px; height: 24px; border-radius: 50%;
    border: 2px solid var(--line); background: var(--panel);
    position: relative; flex-shrink: 0;
  }
  .radio.on { border-color: var(--turf); }
  .radio.on::after {
    content: ''; position: absolute; inset: 4px; border-radius: 50%; background: var(--turf);
  }
  .mode-danger .t-title { color: var(--red-text); }
  .mode-danger .radio.on { border-color: var(--red-text); }
  .mode-danger .radio.on::after { background: var(--red-text); }
  .import-file {
    background: var(--chalk-dim); border: 1px solid var(--line); border-radius: 12px;
    padding: 12px 14px; font-size: 0.9062rem; line-height: 1.45;
  }
  .import-says {
    padding: 12px 14px; border-radius: 12px; flex-shrink: 0;
    background: rgba(31,92,64,0.10); border: 1px solid var(--turf);
    font-size: 0.9062rem; line-height: 1.5; color: var(--ink);
  }
  .import-says.warn { background: rgba(193,68,59,0.12); border-color: var(--red-text); }

  .roster-list { margin-top: 4px; }
  .roster-item {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 2px; border-bottom: 1px solid var(--line);
  }
  .roster-item:last-child { border-bottom: none; }
  .roster-num {
    font-family: var(--font-display); font-weight: 600; font-size: 1rem;
    background: var(--pitch); color: var(--on-dark);
    width: 34px; height: 34px; border-radius: 8px;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .roster-name { flex: 1; font-size: 0.9375rem; }
  .roster-remove { background: none; border: none; color: var(--red-text); font-size: 0.8125rem; padding: 8px 10px; min-height: 44px; }
  .roster-remove:disabled { color: var(--ink-soft); opacity: 0.55; }
  /* Club names are typed by hand and are sometimes one long unbroken word.
     Anywhere a name is shown, it breaks rather than widening the page. */
  .score-label, .tile-name, .roster-name, .playing-as, .tc-name, .screen-title,
  .opp-goal-btn, .btn, .notice, .log-line, .plan-summary {
    overflow-wrap: anywhere;
  }

  .add-player-row { display: flex; gap: 8px; align-items: flex-end; margin-top: 6px; }
  .add-player-row .num-input { width: 68px; }
  .add-player-row .name-input { flex: 1; }
  .add-player-row .text-input { margin-bottom: 0; }
  .add-player-row .btn { width: auto; padding: 11px 16px; flex-shrink: 0; }

  .player-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
    gap: 10px;
    margin-bottom: 16px;
  }
  /* Before the clock has ever run: who is on the pitch, and how to change it. */
  .pre-kick {
    margin: 0 0 12px; padding: 9px 12px;
    background: var(--panel); border: 1px dashed var(--line); border-radius: 12px;
    font-size: 0.8125rem; line-height: 1.4; color: var(--ink-soft);
  }
  .pre-kick strong { color: var(--ink); }
  .tile {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 10px 8px 8px;
    text-align: center;
    position: relative;
    overflow: hidden;
    -webkit-user-select: none;
    user-select: none;
  }
  .tile.benched { opacity: 0.5; }
  .tile.benched .tile-num, .tile.benched .tile-name { color: var(--ink-soft); }
  .field-badge {
    display: block;
    width: calc(100% + 16px);
    margin: -10px -8px 6px;
    padding: 13px 0;
    border: none;
    font-family: var(--font-body);
    font-size: 0.7188rem;
    font-weight: 700;
    background: var(--turf);
    color: #fff;
  }
  .field-badge.off { background: var(--chalk-dim); color: var(--ink-soft); }
  .field-badge.sent-off-badge { background: var(--red); color: #fff; }
  .field-badge:disabled { opacity: 0.85; }
  .tile:active { background: var(--chalk-dim); }
  .tile.just-scored { animation: pulse-gold 0.5s ease; }
  @media (prefers-reduced-motion: reduce) { .tile.just-scored { animation: none; } }
  @keyframes pulse-gold {
    0% { box-shadow: 0 0 0 0 rgba(226,163,61,0.55); }
    100% { box-shadow: 0 0 0 10px rgba(226,163,61,0); }
  }
  .tile-num {
    font-family: var(--font-display); font-weight: 700; font-size: 1.625rem;
    color: var(--brand-text); line-height: 1;
  }
  .tile-name {
    font-size: 0.7812rem; font-weight: 600; margin-top: 3px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .tile-goals { font-size: 0.6875rem; color: var(--ink-soft); margin-top: 1px; min-height: 14px; }
  .tile-mins { font-size: 0.6875rem; color: var(--ink-soft); margin-top: 1px; }
  .tile.least-played { box-shadow: inset 0 0 0 2px var(--gold-deep); }
  .tile.least-played .tile-mins { color: var(--gold-text); font-weight: 700; }
  .tile-controls { display: flex; justify-content: center; gap: 2px; margin-top: 2px; }
  /* The coloured rectangle stays small, but its button carries a 44px hit area
     so it can be tapped one-handed on a sideline. */
  .card-btn {
    background: none; border: none; padding: 0;
    width: 44px; height: 44px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
  }
  .card-btn:disabled { opacity: 0.4; }
  .mini-card { display: block; width: 20px; height: 26px; border-radius: 3px; border: 1px solid var(--line); }
  .mini-card.yellow-btn { background: rgba(232,201,61,0.4); border-color: rgba(185,127,34,0.55); }
  .mini-card.yellow-btn.card-yellow { background: var(--yellow-card); border-color: var(--gold-deep); }
  .mini-card.red-btn { background: rgba(193,68,59,0.4); border-color: rgba(122,38,32,0.55); }
  .mini-card.red-btn.card-red { background: var(--red); border-color: #7a2620; }
  .tile.sent-off { opacity: 0.6; }
  .tile.sent-off .tile-num, .tile.sent-off .tile-name { color: var(--red-text); }
  .confirm-msg { font-size: 0.9375rem; line-height: 1.5; padding: 8px 4px 0; }

  .goal-btn-row { display: flex; gap: 10px; margin-bottom: 18px; }
  .opp-goal-btn {
    flex: 1;
    min-width: 0;
    background: var(--chalk-dim);
    border: 1px dashed var(--ink-soft);
    border-radius: 14px;
    padding: 16px 12px;
    font-weight: 700;
    font-size: 0.9375rem;
    color: var(--ink);
  }
  .opp-goal-btn:active { background: var(--line); }
  .own-goal-btn { flex: 0 0 34%; }
  .match-actions .own-goal-btn { flex: 1 1 0; padding: 12px; }

  /* The two buttons a coach needs besides the tiles — the opponent's goal and
     the next period — stay in view above the tab bar however long the squad
     is. They used to sit under the last tile, which with eleven players is a
     scroll away on most phones, seven times in an eight-period match.
     --nav-h is measured from the real tab bar (see syncChrome), because its
     height depends on the phone's safe area and the text size setting. */
  .live-dock {
    position: sticky;
    bottom: calc(var(--nav-h, calc(56px + env(safe-area-inset-bottom, 0px))) + 6px);
    z-index: 15;
    display: flex; gap: 10px; align-items: stretch;
    margin: 14px -14px 4px; padding: 8px 14px;
    background: var(--chalk);
    box-shadow: 0 -8px 14px -10px rgba(0,0,0,0.28);
  }
  .live-dock .opp-goal-btn {
    flex: 1.5 1 0; min-width: 0; min-height: 52px; padding: 8px 10px;
    display: flex; align-items: center; justify-content: center;
    text-align: center; line-height: 1.2;
  }
  /* Undo is the one control you reach for in a hurry (the wrong child was
     tapped), so it sits in the pinned row, in thumb range. It is narrow and
     labelled, with the big opponent button beside it as the easy target. */
  .live-dock .dock-undo {
    flex: 0 0 60px; width: 60px; min-height: 52px; padding: 6px 4px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    line-height: 1.1;
  }
  .dock-undo-ico { font-size: 1.25rem; line-height: 1; }
  .dock-undo-txt { font-size: 0.6875rem; font-weight: 700; margin-top: 3px; }
  .live-dock .dock-undo:disabled { opacity: 0.4; }
  .live-dock .dock-period {
    flex: 1 1 0; min-width: 0; min-height: 52px; padding: 6px 8px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    line-height: 1.15;
  }
  .dock-period-sub { font-size: 0.6875rem; font-weight: 600; color: var(--ink-soft); margin-top: 2px; }
  /* Held sideways there is no room to pin anything: it scrolls with the page. */
  @media (max-height: 520px) {
    .live-dock { position: static; box-shadow: none; margin: 14px 0 4px; padding: 0; background: none; }
  }
  /* Messages that float above the tab bar move up to clear the pinned buttons. */
  body.has-dock .assist-bar { bottom: calc(var(--nav-h, 56px) + var(--dock-h, 0px) + 24px); }
  body.has-dock .toast { bottom: calc(var(--nav-h, 56px) + var(--dock-h, 0px) + 26px); }

  .assist-bar {
    /* Fixed, not sticky: when it appeared in the flow it pushed the whole
       player grid down by exactly one tile row, so a tap aimed at a player
       landed on the row above for the six seconds the bar was up. It now
       floats above the grid and moves nothing. */
    position: fixed;
    left: calc(14px + env(safe-area-inset-left, 0px));
    right: calc(14px + env(safe-area-inset-right, 0px));
    bottom: calc(84px + env(safe-area-inset-bottom, 0px));
    max-width: 420px;
